# =============================================================================
# Раздача игры со СВОЕГО сервера (VPS или хостинг, где доступен nginx).
#
# Зачем это здесь. Автор сообщил: без VPN «ни одна вкладка не открывается,
# даже твоя с тестом, вечная загрузка». Вечная загрузка (а не ошибка сети и не
# отказ сервера) — это почерк блокировки по самому имени хоста: пакеты не
# отвергаются, а молча выбрасываются. Раз не открывается netcheck.html —
# значит недоступен ХОСТИНГ, а не Supabase, и никакая правка внутри игры этого
# не лечит: страница до браузера просто не доезжает. Лечится сменой точки
# входа — свой домен на сервере, до которого игроки доходят.
#
# Этот конфиг делает ровно то же, что делал Render (см. render.yaml), плюс то,
# ради чего он и нужен: проксирует /sb/ на Supabase. Тогда игроку хватает
# доступа к ОДНОМУ домену — вашему; данные едут через него же и с чужим
# доменом браузер не разговаривает вовсе.
#
# Сборка тут не нужна: engine/dist лежит в репозитории готовым. Достаточно
# положить содержимое репозитория в /var/www/pravo и перезагрузить nginx.
#
#   sudo certbot --nginx -d ваш-домен.ru      # сертификат, до этого server ниже
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 443 ssl http2;
    server_name ВАШ-ДОМЕН;                 # <-- заменить

    ssl_certificate     /etc/letsencrypt/live/ВАШ-ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ВАШ-ДОМЕН/privkey.pem;

    root /var/www/pravo;
    index index.html;

    # Рельеф — 5.76 МБ на игрока, движок 118 КБ, index.html под мегабайт:
    # без сжатия первый заход по мобильной сети превращается в минуты.
    # .bin сюда НЕ включён намеренно: elevation-v6.bin это уже упакованные
    # uint16, gzip выигрывает на нём считанные проценты, а процессор ест.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- запасной путь до Supabase (то же, что routes в render.yaml) -------
    # Игра ходит сюда сама, когда прямой домен не отвечает (см. sbFetch в
    # index.html). Запросы идут на тот же origin, поэтому CORS не нужен вовсе.
    location /sb/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;   # <-- на российском VPS разумно заменить на DNS провайдера
        set $supabase https://xzuwqgpwzlmpglnuijio.supabase.co;
        proxy_pass $supabase/;

        # Без этих двух строк TLS-рукопожатие с Supabase идёт без имени хоста,
        # и он отвечает чужим сертификатом или 404.
        proxy_ssl_server_name on;
        proxy_ssl_name        xzuwqgpwzlmpglnuijio.supabase.co;
        proxy_set_header      Host xzuwqgpwzlmpglnuijio.supabase.co;

        # Заголовки авторизации должны дойти как есть — на них держится вход.
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Тик боя ждёт до 15 с (см. mpCall) — таймаут должен быть не меньше.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 2m;
    }

    # ---- кэш: те же сроки, что и в render.yaml ----------------------------
    # Библиотека Supabase лежит под версионированным именем, поэтому её можно
    # держать вечно: обновление приезжает под новым именем и мимо кэша.
    location /vendor/ { expires 365d; add_header Cache-Control "public, immutable"; }

    # Модели, картинки, текстуры, запечённый рельеф — меняются редко.
    # Перезальёте файл под ТЕМ ЖЕ именем — у заходивших на неделе долежит
    # старая версия; критичные обновления выкладывайте под новым именем.
    location ~ ^/(models|images|textures|heightmap)/ { expires 7d; add_header Cache-Control "public"; }
    location = /map.jpg      { expires 7d; add_header Cache-Control "public"; }
    location = /city-map.jpg { expires 7d; add_header Cache-Control "public"; }

    # HTML правится часто — пусть браузер каждый раз спрашивает сервер
    # (быстрый 304, если не менялось), чтобы новый выкат долетал без Ctrl+F5.
    location ~ \.html$ { add_header Cache-Control "no-cache"; }
}

# http -> https, иначе игроки по старой ссылке будут стучаться в 80 порт
server {
    listen 80;
    server_name ВАШ-ДОМЕН;                 # <-- заменить
    return 301 https://$host$request_uri;
}
