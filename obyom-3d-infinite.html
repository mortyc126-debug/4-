/* ---- ЗАМКИ: настоящие GLB-модели, свой мини-загрузчик glTF2 (JSON+BIN),
   без анимаций и расширений — как и в исходной демке, без единой библиотеки. */
const modelProg=mkProg(MVS,MFS);
const mU=n=>gl.getUniformLocation(modelProg,n);
const mUVP=mU("uVP"), mUModel=mU("uModel"), mULightVP=mU("uLightVP"),
      mUEye=mU("uEye"), mUSun=mU("uSun"), mUTime=mU("uTime"),
      mUShadow=mU("uShadow"), mUFog=mU("uFog"), mUNbias=mU("uNbias"), mUTex=mU("uTex");

async function loadGLB(url){
  const buf=await (await fetch(url)).arrayBuffer();
  const dv=new DataView(buf);
  if(dv.getUint32(0,true)!==0x46546C67) throw new Error("не glTF-контейнер: "+url);
  const length=dv.getUint32(8,true);
  let off=12, json=null, bin=null;
  while(off<length){
    const clen=dv.getUint32(off,true), ctype=dv.getUint32(off+4,true);
    const cdata=buf.slice(off+8,off+8+clen);
    if(ctype===0x4E4F534A) json=JSON.parse(new TextDecoder().decode(cdata));
    else if(ctype===0x004E4942) bin=cdata;
    off+=8+clen;
  }
  const CTYPE={5121:Uint8Array,5123:Uint16Array,5125:Uint32Array,5126:Float32Array};
  const NCOMP={SCALAR:1,VEC2:2,VEC3:3,VEC4:4};
  const acc=i=>json.accessors[i], bv=i=>json.bufferViews[i];
  function accArr(i){
    const a=acc(i), v=bv(a.bufferView), Ctor=CTYPE[a.componentType];
    const byteOff=(v.byteOffset||0)+(a.byteOffset||0);
    return new Ctor(bin, byteOff, a.count*NCOMP[a.type]);
  }
  const prim=json.meshes[0].primitives[0];
  const positions=accArr(prim.attributes.POSITION);
  const normals=accArr(prim.attributes.NORMAL);
  const uvs=accArr(prim.attributes.TEXCOORD_0);
  const indices=accArr(prim.indices);
  const mat=json.materials[prim.material];
  const bcIdx=mat.pbrMetallicRoughness.baseColorTexture.index;
  const img=json.images[json.textures[bcIdx].source];
  const iv=bv(img.bufferView);
  const bytes=bin.slice(iv.byteOffset||0, (iv.byteOffset||0)+iv.byteLength);
  const bitmap=await createImageBitmap(new Blob([bytes],{type:img.mimeType}));

  const mvao=gl.createVertexArray(); gl.bindVertexArray(mvao);
  const battach=(name,data,size)=>{
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
    const l=gl.getAttribLocation(modelProg,name);
    if(l>=0){gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,0,0)}
  };
  battach("aPos",positions,3); battach("aNrm",normals,3); battach("aUv",uvs,2);
  const ibo=gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bitmap);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  bitmap.close();
  return {vao:mvao, tex, indexType:indices.BYTES_PER_ELEMENT===2?gl.UNSIGNED_SHORT:gl.UNSIGNED_INT,
    indexCount:indices.length};
}
// Один кэш на все статические модели мира (замки/лагеря/ресурсные точки) —
// ключ - путь к файлу, значение - готовая модель или Promise, пока грузится.
// Модель, которая ещё в пути, просто пропускается до следующего кадра.
const modelCache={};
function loadModelCached(path){
  if(!modelCache[path]) modelCache[path]=loadGLB(path)
    .then(m=>{modelCache[path]=m; return m})
    .catch(e=>{console.warn("модель не загрузилась:",path,e); modelCache[path]=null; return null});
  const v=modelCache[path];
  return (v&&v.then)?null:v;
}
function castleModel(race,epoch){ return loadModelCached("models/castles/"+race+"-"+epoch+".glb"); }
function campModel(){ return loadModelCached("models/camps/barbarians.glb"); }
function resourceModel(type){ return loadModelCached("models/resources/"+type+".glb"); }

/* =======================================================================
   Чанк-стриминг. Раньше генерация чанка (шум по сотням клеток — земля,
   вода, лес, камни) шла прямо в главном потоке, разово по бюджету времени
   на кадр — но один чанк всё равно занимал ~30-50мс синхронно, и кадр на
   это время проседал: JS не умеет прервать функцию на середине. Настоящее
   решение — считать чанк НЕ в главном потоке вовсе.

   WORLD_SRC уже содержит genChunk и всё, что ему нужно, в виде текста —
   тот же текст становится телом фонового воркера (через Blob-URL, без
   единого файла на стороне и без библиотек). Несколько воркеров разбирают
   очередь параллельно, каждый шлёт назад уже готовые типизированные массивы
   вершин; главный поток только заливает их в GPU-буферы — это быстро и не
   вызывает пауз кадра, сколько бы чанков ни строилось одновременно позади
   сцены.
   ======================================================================= */
const NWORKERS=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||4)-1));
const CHUNK_WORKER_TAIL=`
self.onmessage=function(e){
  const {cx,cy,reqId,backdrop,removals,force,realEntities}=e.data;
  const data=backdrop ? genBackdrop(cx,cy) : genChunk(cx,cy,removals,realEntities);
  const pos=new Float32Array(data.pos), col=new Float32Array(data.col),
        knd=new Float32Array(data.knd), nrm=new Float32Array(data.nrm);
  postMessage({reqId,cx,cy,backdrop,force,pos,col,knd,nrm,
    cities:data.cities,camps:data.camps,resources:data.resources,stats:data.stats},
    [pos.buffer,col.buffer,knd.buffer,nrm.buffer]);
};`;
const chunkWorkerUrl=URL.createObjectURL(
  new Blob([WORLD_SRC+CHUNK_WORKER_TAIL],{type:"application/javascript"}));
const chunkWorkers=Array.from({length:NWORKERS},()=>new Worker(chunkWorkerUrl));

const chunks=new Map();
const chunkKey=(cx,cy)=>cx+","+cy;
const genQueue=[];           // [cx,cy] хотим, но ещё не отправили воркеру
const queuedSet=new Set();   // ключи того, что уже в очереди ИЛИ в работе у воркера
const inFlight=new Map();    // reqId -> {cx,cy}
let reqSeq=0, nextWorker=0;
const IN_FLIGHT_CAP=NWORKERS*2;   // не заваливаем воркеры дальше, чем реально нужно прямо сейчас
let lastCamChunkX=0, lastCamChunkY=0;

function createChunkGL(cx,cy,data){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const posBuf=attach(prog,data.pos,"aPos",3);
  const colBuf=attach(prog,data.col,"aCol",3);
  const kndBuf=attach(prog,data.knd,"aKind",1);
  const nrmBuf=attach(prog,data.nrm,"aNrm",3);
  const vertCount=data.pos.length/3;
  const depthVao=gl.createVertexArray(); gl.bindVertexArray(depthVao);
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  { const l=gl.getAttribLocation(depthProg,"aPos");
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,3,gl.FLOAT,false,0,0); }
  chunks.set(chunkKey(cx,cy),{
    cx,cy,vao,depthVao,bufs:[posBuf,colBuf,kndBuf,nrmBuf],vertCount,
    cities:data.cities, camps:data.camps, resources:data.resources, stats:data.stats,
  });
}
function disposeChunk(c){
  gl.deleteVertexArray(c.vao); gl.deleteVertexArray(c.depthVao);
  for(const b of c.bufs) gl.deleteBuffer(b);
}

/* ---- Дальний фон (см. genBackdrop в WORLD_SRC): одна редкая сетка вокруг
   игрока, без леса и построек, вместо резкого обрыва мира на границе
   прогрузки. Не участвует в чанк-стриминге (не в chunks, не в тенях) —
   отдельный объект, который целиком пересоздаётся раз в несколько секунд,
   когда камера отходит от центра, на котором он был построен. ---- */
let backdropMesh=null, backdropPendingReqId=null, backdropCenter=null;
function createBackdropGL(cx,cy,data){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const posBuf=attach(prog,data.pos,"aPos",3);
  const colBuf=attach(prog,data.col,"aCol",3);
  const kndBuf=attach(prog,data.knd,"aKind",1);
  const nrmBuf=attach(prog,data.nrm,"aNrm",3);
  const vertCount=data.pos.length/3;
  const old=backdropMesh;
  backdropMesh={vao,bufs:[posBuf,colBuf,kndBuf,nrmBuf],vertCount};
  backdropCenter={x:cx,y:cy};
  if(old){ gl.deleteVertexArray(old.vao); for(const b of old.bufs) gl.deleteBuffer(b); }
}
function maybeRequestBackdrop(camX,camY){
  if(backdropPendingReqId!==null) return;
  if(backdropCenter){
    const d=Math.hypot(camX-backdropCenter.x,camY-backdropCenter.y);
    if(d<BACKDROP_INNER*0.4) return;   // ещё не отошли настолько, чтобы кольцо съехало заметно
  }
  const reqId=reqSeq++;
  backdropPendingReqId=reqId;
  chunkWorkers[nextWorker].postMessage({cx:camX,cy:camY,reqId,backdrop:true});
  nextWorker=(nextWorker+1)%chunkWorkers.length;
}
chunkWorkers.forEach(w=>w.onmessage=(e)=>{
  const {reqId,cx,cy,backdrop,force,pos,col,knd,nrm,cities,camps,resources,stats}=e.data;
  if(backdrop){
    if(reqId!==backdropPendingReqId) return;   // устаревший ответ — новый уже запрошен позже
    backdropPendingReqId=null;
    createBackdropGL(cx,cy,{pos,col,knd,nrm});
    return;
  }
  inFlight.delete(reqId);
  const k=chunkKey(cx,cy);
  queuedSet.delete(k);
  // force — перегенерация УЖЕ загруженного чанка (снос/зарастание): старые
  // GL-буферы надо явно освободить перед заменой, иначе они просто утекут.
  if(chunks.has(k)){
    if(!force) return;   // обычный (нефорсированный) ответ на уже готовый чанк — не должно случаться, но не страшно
    disposeChunk(chunks.get(k));
  } else if(!force){
    // Пока чанк считался, камера могла улететь дальше — тогда результат уже
    // не нужен и не стоит тратить на него видеопамять; лишняя работа воркера
    // окупается тем, что она вообще не блокировала кадр, пока шла. Форсированный
    // запрос (регенерация из-за сноса) всегда бьёт по чанку, который точно
    // нужен прямо сейчас, — этой проверкой его не режем.
    const dx=cx-lastCamChunkX, dy=cy-lastCamChunkY;
    if(dx*dx+dy*dy>UNLOAD_RADIUS*UNLOAD_RADIUS) return;
  }
  createChunkGL(cx,cy,{pos,col,knd,nrm,cities,camps,resources,stats});
});
function updateStreaming(camChunkX,camChunkY){
  lastCamChunkX=camChunkX; lastCamChunkY=camChunkY;
  // Резкий скачок камеры (телепорт, рывок мышью) может за один кадр набить
  // очередь чанками у СТАРОЙ позиции, которые к моменту их обработки уже не
  // нужны. Выбрасываем из очереди всё, что вышло за радиус загрузки, и
  // сортируем оставшееся по расстоянию до камеры — ближние чанки прогружаются
  // первыми, дальний хвост не блокирует то, что игрок видит прямо перед собой.
  // Заявки, уже улетевшие воркеру (inFlight), не отменить — но их результат
  // проверяется на актуальность в onmessage выше.
  for(let i=genQueue.length-1;i>=0;i--){
    const [cx,cy]=genQueue[i], dx=cx-camChunkX, dy=cy-camChunkY;
    if(dx*dx+dy*dy>LOAD_RADIUS*LOAD_RADIUS+1){
      queuedSet.delete(chunkKey(cx,cy)); genQueue.splice(i,1);
    }
  }
  for(let dy=-LOAD_RADIUS; dy<=LOAD_RADIUS; dy++)
    for(let dx=-LOAD_RADIUS; dx<=LOAD_RADIUS; dx++){
      if(dx*dx+dy*dy>LOAD_RADIUS*LOAD_RADIUS+1) continue;
      const cx=camChunkX+dx, cy=camChunkY+dy, k=chunkKey(cx,cy);
      if(chunks.has(k)||queuedSet.has(k)) continue;
      genQueue.push([cx,cy]); queuedSet.add(k);
    }
  genQueue.sort((a,b)=>{
    const da=(a[0]-camChunkX)**2+(a[1]-camChunkY)**2;
    const db=(b[0]-camChunkX)**2+(b[1]-camChunkY)**2;
    return da-db;
  });
  for(const [k,c] of chunks){
    const dx=c.cx-camChunkX, dy=c.cy-camChunkY;
    if(dx*dx+dy*dy>UNLOAD_RADIUS*UNLOAD_RADIUS){ disposeChunk(c); chunks.delete(k); }
  }
}
/* ---- Реальные данные партии вместо процедурной лотереи. Открыт ли 3D сам
   по себе (тест/скриншот) или внутри игры — решаем по window.parent: то же
   происхождение (same-origin), поэтому проще читать W напрямую, чем городить
   postMessage-протокол между двумя и так жёстко связанными файлами. Воркер
   до window.parent не дотянется (у него вообще нет окна) — поэтому индекс
   строит и рассылает именно главный поток, а воркеру достаётся уже готовый,
   отфильтрованный по чанку+соседям срез (см. realEntitiesFor). ---- */
function realDataSource(){
  try{ if(window.parent && window.parent!==window && window.parent.W) return window.parent.W; }
  catch(_){ /* кросс-origin — считаем, что реальных данных нет */ }
  return null;
}
let realIndex=null, realKeyMap=new Map();
function rebuildRealIndex(){
  const W=realDataSource();
  if(!W){ realIndex=null; return; }
  const idx=new Map(), keyMap=new Map();
  for(const k in W.map){
    const o=W.map[k];
    let entry=o;
    if(o.t==="city"){
      const pl=W.players && W.players.find(p=>p.id===o.pid);
      // Раса/эпоха запись W.map сама не хранит (только pid) — прикладываем
      // здесь один раз на весь индекс, а не при каждой генерации чанка.
      // epochOf живёт в родительском окне (это его функция), не здесь.
      entry=Object.assign({},o,{race:pl?pl.race:"human", epoch:pl?window.parent.epochOf(pl.b.hall):1});
    }
    const cx=Math.floor(o.x/CHUNK), cy=Math.floor(o.y/CHUNK);
    const ck=chunkKey(cx,cy);
    let arr=idx.get(ck); if(!arr){ arr=[]; idx.set(ck,arr); }
    arr.push(entry);
    const kind=o.t==="city"?"city":(o.t==="camp"||o.t==="fort")?"camp":"resource";
    keyMap.set(kind+":"+(o.x+0.5)+":"+(o.y+0.5), entry);
  }
  // Диффим с прошлым срезом: то, что пропало из W.map (истощилось, разгромлено,
  // перенесено), регистрируем сносом тем же путём, что и тестовая кнопка —
  // расчистка вокруг него зарастёт травой/лесом, а не пропадёт мгновенно.
  let anyNew=false;
  for(const key of realKeyMap.keys()){
    if(keyMap.has(key)) continue;
    if(!removalRegistry.has(key)){ removalRegistry.set(key,performance.now()); anyNew=true; }
  }
  realIndex=idx; realKeyMap=keyMap;
  if(anyNew) regrowthTick();
}
// Записи для чанка (cx,cy) И восьми соседей — тот же приём, что и у
// resolveChunkPlacements/removalsSnapshot: воркер ничего не знает про
// глобальное состояние, только про то, что явно легло в его заявку.
function realEntitiesFor(cx,cy){
  if(!realIndex) return null;
  const out=[];
  for(const [di,dj] of MAIN_NEIGHBOR_OFFSETS){
    const arr=realIndex.get(chunkKey(cx+di,cy+dj));
    if(arr) for(const o of arr) out.push(o);
  }
  return out.length?out:null;
}
function dispatchToWorkers(){
  // Рассылка заявок ничего не считает сама — только раздаёт чанки по
  // воркерам, поэтому её не нужно ограничивать по времени, как раньше
  // ограничивалась синхронная генерация. Кап на inFlight не даёт очереди
  // одного воркера раздуться, если камера долго стоит на месте с пустым
  // диском вокруг — заявки идут по мере готовности предыдущих.
  const removals=removalsSnapshot();
  while(genQueue.length && inFlight.size<IN_FLIGHT_CAP){
    const [cx,cy]=genQueue.shift();
    const reqId=reqSeq++;
    inFlight.set(reqId,{cx,cy});
    chunkWorkers[nextWorker].postMessage({cx,cy,reqId,removals,realEntities:realEntitiesFor(cx,cy)});
    nextWorker=(nextWorker+1)%chunkWorkers.length;
  }
}

/* ---- Снос и зарастание: город телепортируется, точка истощается, лагерь
   разгоняют — все трое не вечны. WORLD_SRC (значит, и applyRegrowth внутри
   него) не может держать это состояние сам: у каждого воркера СВОЙ
   изолированный экземпляр этого текста, а вкладка может быть перезагружена
   без бэкенда позади — регистрация сноса тут заведомо временная, только на
   сессию. Регистр живёт в главном потоке (он один на все воркеры и на
   рендер), а воркерам на каждый запрос шлём готовый снимок долей 0..1,
   посчитанный от текущего времени — так воркеру не нужны часы вовсе. ---- */
// NEIGHBOR_OFFSETS уже есть внутри WORLD_SRC — но там он живёт в области
// видимости воркеров (Blob-скрипт), а regrowthTick ниже работает в главном
// потоке и того текста не видит; проще продублировать те же 9 смещений, чем
// тащить константу через сериализацию.
const MAIN_NEIGHBOR_OFFSETS=[[-1,-1],[-1,0],[-1,1],[0,-1],[0,0],[0,1],[1,-1],[1,0],[1,1]];
const removalRegistry=new Map();   // "вид:x:y" (мировые координаты объекта) -> performance.now() в момент сноса; запись НИКОГДА не удаляется
const REGROWTH_MS=20000;           // время полного зарастания, мс (тест-масштаб; для прод-баланса можно увеличить)
function removalsSnapshot(){
  if(removalRegistry.size===0) return null;
  const now=performance.now(), out={};
  for(const [key,t0] of removalRegistry) out[key]=Math.min(1,(now-t0)/REGROWTH_MS);
  return out;
}
function forceRegenChunk(cx,cy){
  const k=chunkKey(cx,cy);
  if(!chunks.has(k)) return;   // не загружен — обычный стриминг сам подхватит актуальное состояние
  const reqId=reqSeq++;
  inFlight.set(reqId,{cx,cy});
  chunkWorkers[nextWorker].postMessage({cx,cy,reqId,removals:removalsSnapshot(),
    realEntities:realEntitiesFor(cx,cy),force:true});
  nextWorker=(nextWorker+1)%chunkWorkers.length;
}
// Раз в несколько секунд перегенерируем окрестность каждого снесённого
// объекта (он сам мог сидеть на границе соседних чанков — см.
// resolveChunkPlacements), пока трава не дорастёт. Запись из removalRegistry
// при этом НЕ удаляется даже после полного зарастания — иначе на следующей
// перегенерации у кандидата не осталось бы и следа сноса, и снесённый объект
// просто появился бы заново сам по себе, как ни в чём не бывало. А вот от
// повторной перегенерации уже устоявшихся (полностью заросших) записей
// regrowthSettled избавляет — смысла дёргать воркеры без конца нет.
const regrowthSettled=new Set();
function regrowthTick(){
  const pending=[...removalRegistry.keys()].filter(k=>!regrowthSettled.has(k));
  if(pending.length===0) return;
  const now=performance.now(), seen=new Set();
  for(const key of pending){
    // Ключ — "вид:x:y" в мировых координатах объекта (см. applyRegrowth в
    // WORLD_SRC); чанк для force-регена получаем делением на CHUNK, а не
    // читаем напрямую — координаты объекта, а не чанка, теперь в ключе.
    const parts=key.split(":");
    const x=+parts[1], y=+parts[2];
    const cx=Math.floor(x/CHUNK), cy=Math.floor(y/CHUNK);
    for(const [di,dj] of MAIN_NEIGHBOR_OFFSETS){
      const k2=chunkKey(cx+di,cy+dj);
      if(seen.has(k2)) continue;
      seen.add(k2);
      forceRegenChunk(cx+di,cy+dj);
    }
    if((now-removalRegistry.get(key))/REGROWTH_MS>=1) regrowthSettled.add(key);
  }
}
setInterval(regrowthTick,4000);
// Индекс реальных данных партии — та же периодичность, что и у зарастания:
// не нужно чаще, W не меняется настолько быстро, а на ~1400 записей это и
// так дёшево. Первый вызов — сразу, а не только через 2.5с: иначе первые
// секунды после открытия вкладки чанки успели бы прогрузиться процедурно.
rebuildRealIndex();
setInterval(rebuildRealIndex,2500);
// Ближайший к точке (x,z) ещё не снесённый город/лагерь/точку среди
// ЗАГРУЖЕННЫХ чанков — сносить то, чего не видно на экране, тестово незачем.
function demolishNearest(x,z){
  let best=null,bestD=Infinity,bestKind=null;
  for(const c of chunks.values()){
    for(const [kind,arr] of [["city",c.cities],["camp",c.camps],["resource",c.resources]]){
      for(const obj of arr){
        if(obj.removed) continue;
        const d=Math.hypot(obj.x-x,obj.z-z);
        if(d<bestD){ bestD=d; best=obj; bestKind=kind; }
      }
    }
  }
  if(!best) return null;
  const key=bestKind+":"+best.x+":"+best.z;
  removalRegistry.set(key,performance.now());
  regrowthTick();
  return {kind:bestKind,x:best.x,z:best.z,dist:bestD};
}

/* ---- Точка старта: ищем поблизости от мирового начала координат сушу,
   чтобы не начинать полёт над голым океаном. ---- */
function findSpawn(){
  if(heightAt(0,0)>SEA+0.05) return {x:0,y:0};
  for(let r=4;r<200;r+=4){
    for(let a=0;a<10;a++){
      const ang=a/10*6.2832;
      const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
      if(heightAt(x,y)>SEA+0.05) return {x,y};
    }
  }
  return {x:0,y:0};
}
const SPAWN=findSpawn();

/* ---- Камера: орбита вокруг подвижной цели. Один палец двигает саму цель
   по земле — как обычная карта, к этому все привыкли; поворот, наклон и
   масштаб отданы двум пальцам разом (щипок — масштаб, разворот пальцев друг
   вокруг друга — поворот, совместное движение вверх/вниз — наклон), чтобы
   случайное лёгкое дрожание одного пальца при обычном перемещении не
   дёргало угол обзора. Цель по-прежнему не зажата границами карты — мир
   бесконечен, лететь можно куда угодно. ---- */
let cam={yaw:0.72,pitch:0.55,dist:74,tx:SPAWN.x,tz:SPAWN.y,ty:H(SPAWN.x,SPAWN.y)+3}, drag=null;
const pts=new Map();
let pinch=null;
const mid=()=>{const a=[...pts.values()];
  return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2,
          d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)}};
const twistAngle=()=>{const a=[...pts.values()]; return Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x)};
let tapCand=null;
const TAP_MOVE=10, TAP_TIME=380;
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ cv.setPointerCapture(e.pointerId) }catch(_){}
  if(pts.size===1){ drag={x:e.clientX,y:e.clientY,tx:cam.tx,tz:cam.tz};
    tapCand={x:e.clientX,y:e.clientY,t:performance.now()};
    cv.classList.add("drag") }
  else if(pts.size===2){ drag=null; tapCand=null;
    const m=mid();
    pinch={d:m.d, y:m.y, dist:cam.dist, yaw:cam.yaw, pitch:cam.pitch, angle:twistAngle()} }
});
cv.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return;
  e.preventDefault();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tapCand && Math.hypot(e.clientX-tapCand.x,e.clientY-tapCand.y)>TAP_MOVE) tapCand=null;
  if(pts.size>=2 && pinch){
    const m=mid();
    cam.dist=Math.max(9,Math.min(240, pinch.dist*(pinch.d/Math.max(12,m.d))));
    cam.yaw=pinch.yaw+(twistAngle()-pinch.angle);
    cam.pitch=Math.max(0.08,Math.min(1.42,pinch.pitch+(m.y-pinch.y)*0.005));
  } else if(drag){
    const k=cam.dist*0.0022;
    // dy — намеренно (drag.y - clientY), а не наоборот: у камеры, наклонённой
    // вниз, экранное "вверх" — это направление вглубь сцены (дальше от
    // игрока). Палец тянет землю на себя: движение пальца вниз должно
    // придвинуть БЛИЖНИЙ край карты, а не дальний.
    const dx=(e.clientX-drag.x)*k, dy=(drag.y-e.clientY)*k;
    const c=Math.cos(cam.yaw), s2=Math.sin(cam.yaw);
    cam.tx=drag.tx - (dx*c - dy*s2);
    cam.tz=drag.tz + (dx*s2 + dy*c);
    cam.ty=H(cam.tx,cam.tz)+1;
  }
});
function lift(e){
  if(tapCand && pts.size===1 && performance.now()-tapCand.t<TAP_TIME) tryTap(tapCand.x,tapCand.y);
  tapCand=null;
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(pts.size===0){ drag=null; cv.classList.remove("drag") }
  else if(pts.size===1){ const a=[...pts.values()][0];
    drag={x:a.x,y:a.y,tx:cam.tx,tz:cam.tz} }
}
cv.addEventListener("pointerup",lift);
cv.addEventListener("pointercancel",()=>{ tapCand=null; lift(...arguments) });
cv.addEventListener("wheel",e=>{e.preventDefault();
  cam.dist=Math.max(9,Math.min(240,cam.dist*(e.deltaY<0?0.9:1.11)))},{passive:false});

let lastVP=null;
function projectToScreen(x,y,z){
  const v=lastVP, w=v[3]*x+v[7]*y+v[11]*z+v[15];
  const cx=v[0]*x+v[4]*y+v[8]*z+v[12], cy=v[1]*x+v[5]*y+v[9]*z+v[13];
  if(w<=0.001) return null;
  const r=cv.getBoundingClientRect();
  return {x:(cx/w*0.5+0.5)*r.width, y:(1-(cy/w*0.5+0.5))*r.height};
}
function goToCity(inst){
  // inst.y — уже точная высота посадки самого объекта (для настоящих данных
  // партии это сглаженная/приподнятая над рельефом высота, см. buildRealCandidate
  // в WORLD_SRC) — пересчитывать через H(inst.x,inst.z) заново не нужно и
  // местами даже неверно (там нет сглаживания, которое видно на модели).
  cam.tx=inst.x; cam.tz=inst.z; cam.ty=inst.y+1.2;
  cam.dist=inst.epoch?20:12; cam.pitch=0.34;   // замки теперь всегда 5×5, точки/лагеря — 3×3
}
function tryTap(clientX,clientY){
  if(!lastVP) return;
  const r=cv.getBoundingClientRect();
  const lx=clientX-r.left, ly=clientY-r.top;
  let best=null, bestD=46;
  for(const c of chunks.values()){
    for(const arr of [c.cities,c.camps,c.resources]){
      for(const inst of arr){
        if(inst.removed) continue;
        const p=projectToScreen(inst.x, inst.y+1, inst.z); if(!p) continue;
        const d=Math.hypot(p.x-lx, p.y-ly);
        if(d<bestD){ bestD=d; best=inst }
      }
    }
  }
  if(!best) return;
  goToCity(best);
  // Реальные данные — значит есть настоящий "штабной стол" в родительском
  // окне (см. renderCartoucheFor в index.html): отдаём ему клетку, панель и
  // кнопки марша/атаки рисует и обрабатывает уже родитель, тут дублировать
  // нечего. Координаты объекта — центр клетки (см. buildRealCandidate,
  // x=o.x+0.5), Math.floor возвращает исходную целую клетку W.map.
  if(realIndex){
    try{ window.parent.renderCartoucheFor(Math.floor(best.x), Math.floor(best.z)); }
    catch(_){ /* родителя нет/не дотянуться — тап всё равно отработал полётом камеры */ }
  }
}
function goHome(){ cam.tx=SPAWN.x; cam.tz=SPAWN.y; cam.ty=H(SPAWN.x,SPAWN.y)+2;
  cam.dist=95; cam.pitch=0.45 }
addEventListener("keydown",e=>{ if(e.key==="Home") goHome(); });

function resize(){const d=Math.min(2,devicePixelRatio||1);
  cv.width=cv.clientWidth*d; cv.height=cv.clientHeight*d}
addEventListener("resize",resize); resize();

/* ---- Координатная строка: в мире без края и без списка городов это
   единственный способ и найти себя ("какие у меня координаты, чтобы
   позвать друга"), и попасть в произвольную точку по чужим координатам. ---- */
const coordX=document.getElementById("coordX"), coordY=document.getElementById("coordY");
// Пока значение в полях "живое" (показывает текущую позицию), его каждый
// кадр перезаписывает камера. Стоило набрать X и перейти табом в Y — поле X
// теряло фокус и на следующем же кадре откатывалось обратно на текущую
// позицию, ещё ДО того, как игрок успевал нажать "Перейти". coordDirty
// останавливает перезапись сразу, как только в поля начали печатать, и
// снимается только после успешного перехода — тогда поля снова живые.
let coordDirty=false;
[coordX,coordY].forEach(inp=>inp.addEventListener("input",()=>{coordDirty=true;}));
function goToCoords(){
  const x=parseFloat(coordX.value), y=parseFloat(coordY.value);
  if(!isFinite(x)||!isFinite(y)) return;
  cam.tx=x; cam.tz=y; cam.ty=H(x,y)+2;
  coordDirty=false;
}
document.getElementById("coordGo").addEventListener("click",goToCoords);
[coordX,coordY].forEach(inp=>inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ e.preventDefault(); goToCoords(); inp.blur(); }
}));
// Тестовая кнопка сноса: сносит ближайший к камере ЗАГРУЖЕННЫЙ город/лагерь/
// точку, чтобы наглядно проверить, что модель исчезает сразу, а расчистка
// вокруг неё зарастает травой/лесом со временем (см. demolishNearest выше).
const demolishBtn=document.getElementById("demolishBtn");
demolishBtn.addEventListener("click",()=>{
  const res=demolishNearest(cam.tx,cam.tz);
  demolishBtn.textContent=res ? "Снесено: "+res.kind : "Нечего сносить рядом";
  setTimeout(()=>{ demolishBtn.textContent="Снести (тест)"; },1500);
});

// Дальность видимости регулируется ТУМАНОМ (uFog), не радиусом прогрузки
// чанков — детальные чанки (лес/трава/постройки) по-прежнему грузятся только
// в LOAD_RADIUS, дальше их сменяет дешёвый BACKDROP-рельеф без деталей (см.
// комментарий у BACKDROP_OUTER выше). Раздвигаем именно fog: силуэт гор и
// воды на BACKDROP-кольце виден дальше, а не только "до какого чанка долетел
// воркер". Меньше uFog — туман начинается позже. BACKDROP_OUTER раздвинут
// вместе с ним, иначе кольцо кончилось бы раньше, чем спрятал бы туман, и
// вместо мягкого затухания в дымке был бы резкий обрыв мира в упор.
const DEFAULT_FOG=0.004;   // было 0.0095 — видимость эксперимента ради сдвинута на пару сотен клеток дальше
const hudStats=document.getElementById("hudStats");
let lastHud=0;

const t0=performance.now();
function frame(){
  const t=(performance.now()-t0)/1000;
  // В отличие от ограниченной демки, где медленное вращение камеры без
  // пальца читалось как показ карты, в бесконечном мире оно ощущалось как
  // дрейф без цели — отпустил палец, и камера должна просто остаться на
  // месте, а не продолжать крутиться.
  const ex=cam.tx+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
  const ez=cam.tz+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
  let ey=Math.sin(cam.pitch)*cam.dist+cam.ty+0.5;
  const groundAtEye=H(ex,ez);
  if(ey<groundAtEye+0.6) ey=groundAtEye+0.6;
  const eye=[ex,ey,ez], tgt=[cam.tx,cam.ty,cam.tz];

  const camChunkX=Math.floor(cam.tx/CHUNK), camChunkY=Math.floor(cam.tz/CHUNK);
  updateStreaming(camChunkX,camChunkY);
  dispatchToWorkers();
  maybeRequestBackdrop(cam.tx,cam.tz);

  const {lightVP,lightVPB}=computeLightVPB(cam.tx,cam.tz);

  // Проход 1: глубина со стороны солнца, по всем загруженным чанкам разом.
  gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFbo);
  gl.viewport(0,0,SM,SM);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.1,1.6);
  gl.useProgram(depthProg);
  gl.uniformMatrix4fv(uDepthVP,false,new Float32Array(lightVP));
  for(const c of chunks.values()){
    gl.bindVertexArray(c.depthVao);
    gl.drawArrays(gl.TRIANGLES,0,c.vertCount);
  }
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // Проход 2: небо и мир
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,cv.width,cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const fwd=norm(sub(tgt,eye)), right=norm(cross(fwd,[0,1,0])), up=cross(right,fwd);
  gl.useProgram(skyProg); gl.bindVertexArray(skyVao);
  gl.depthMask(false);
  gl.uniform3fv(SU("uR"),new Float32Array(right));
  gl.uniform3fv(SU("uU"),new Float32Array(up));
  gl.uniform3fv(SU("uF"),new Float32Array(fwd));
  gl.uniform3fv(SU("uSun"),new Float32Array(SUN));
  gl.uniform1f(SU("uTan"),Math.tan(0.82/2));
  gl.uniform1f(SU("uAsp"),cv.width/cv.height);
  gl.uniform1f(SU("uT"),t);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);

  gl.useProgram(prog);
  const VP=M4.mul(M4.persp(0.82,cv.width/cv.height,0.5,460),M4.look(eye,tgt,[0,1,0]));
  lastVP=VP;
  gl.uniformMatrix4fv(uVP,false,new Float32Array(VP));
  gl.uniformMatrix4fv(uLightVP,false,new Float32Array(window.__noShadow?FAR_VPB:lightVPB));
  gl.uniform3fv(uEye,new Float32Array(eye));
  gl.uniform3fv(uSun,new Float32Array(SUN));
  gl.uniform1f(uTime,t);
  gl.uniform1f(uFog,window.__fog!==undefined?window.__fog:DEFAULT_FOG);
  gl.uniform1f(uNbias,0.03);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.uniform1i(uShadow,0);
  let totalTris=0;
  for(const c of chunks.values()){
    gl.bindVertexArray(c.vao);
    gl.drawArrays(gl.TRIANGLES,0,c.vertCount);
    totalTris+=c.vertCount/3;
  }
  // Дальний фон рисуется тем же проходом, теми же юниформами (кольцо снаружи
  // детальных чанков, см. genBackdrop) — отдельных теней ему не нужно, на
  // таком расстоянии внутрь карты теней он всё равно не попадает.
  // Кольцо нарочно ЗАХОДИТ внутрь области детальных чанков (см. комментарий
  // у BACKDROP_INNER) — щедрый нахлёст вместо щели до неба. Чтобы нахлёст не
  // мигал z-fighting'ом там, где обе геометрии близко по высоте, отодвигаем
  // фон чуть дальше по глубине: настоящий чанк, если он там есть, всегда
  // выигрывает тест глубины.
  if(backdropMesh){
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.0,4.0);
    gl.bindVertexArray(backdropMesh.vao);
    gl.drawArrays(gl.TRIANGLES,0,backdropMesh.vertCount);
    totalTris+=backdropMesh.vertCount/3;
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  // Проход 3: замки, лагеря и ресурсные точки (GLB) — по одному-три на чанк,
  // у кого что есть. Все три ставятся одной и той же лотереей чанка (см.
  // chunkCityCandidate/chunkCampCandidate/chunkResourceCandidate в WORLD_SRC),
  // отличаются только частотой и тем, какую модель подставляют.
  gl.useProgram(modelProg);
  gl.uniformMatrix4fv(mUVP,false,new Float32Array(VP));
  gl.uniformMatrix4fv(mULightVP,false,new Float32Array(window.__noShadow?FAR_VPB:lightVPB));
  gl.uniform3fv(mUEye,new Float32Array(eye));
  gl.uniform3fv(mUSun,new Float32Array(SUN));
  gl.uniform1f(mUTime,t);
  gl.uniform1f(mUFog,window.__fog!==undefined?window.__fog:DEFAULT_FOG);
  gl.uniform1f(mUNbias,0.03);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,shadowTex);
  gl.uniform1i(mUShadow,0);
  gl.uniform1i(mUTex,1);
  const drawModel=(m,mat)=>{
    if(!m) return;
    gl.bindVertexArray(m.vao);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,m.tex);
    gl.uniformMatrix4fv(mUModel,false,new Float32Array(mat));
    gl.drawElements(gl.TRIANGLES,m.indexCount,m.indexType,0);
  };
  let citiesLoaded=0;
  for(const c of chunks.values()){
    // removed:true — снесено, но ещё не заросло полностью (r у объекта
    // сжимается со временем и продолжает теснить траву/лес, см. applyRegrowth
    // в WORLD_SRC); саму модель при этом рисовать уже не нужно. Массивы, а не
    // одно значение на чанк — у настоящих данных партии плотность настоящей
    // карты (объектов на чанк может быть много), не одна лотерейная запись.
    for(const city of c.cities){ citiesLoaded++; if(!city.removed) drawModel(castleModel(city.race,city.epoch),city.mat); }
    for(const camp of c.camps) if(!camp.removed) drawModel(campModel(),camp.mat);
    for(const res of c.resources) if(!res.removed) drawModel(resourceModel(res.type),res.mat);
  }

  if(t-lastHud>0.5 && !document.getElementById("hud").classList.contains("min")){
    lastHud=t;
    hudStats.textContent="Чанков в памяти: "+chunks.size+" · строится: "+inFlight.size+"/"+genQueue.length+
      " · городов рядом: "+citiesLoaded+" · треугольников: "+Math.round(totalTris/1000)+"к";
  }
  // Поля координат показывают, где игрок находится СЕЙЧАС — чтобы было что
  // продиктовать другу. Останавливаем обновление, как только начали
  // печатать (coordDirty), а не только пока поле в фокусе — иначе таб с X
  // на Y стирал бы только что введённый X ещё до нажатия "Перейти".
  if(!coordDirty){
    coordX.value=cam.tx.toFixed(1);
    coordY.value=cam.tz.toFixed(1);
  }

  requestAnimationFrame(frame);
}
frame();
window.__errs=()=>{const e=[];let g;while((g=gl.getError())!==gl.NO_ERROR)e.push(g);return e};
window.__chunkStats=()=>({loaded:chunks.size, queued:genQueue.length, inFlight:inFlight.size,
  workers:chunkWorkers.length,
  tris:[...chunks.values()].reduce((s,c)=>s+c.vertCount,0)/3,
  cities:[...chunks.values()].reduce((s,c)=>s+c.cities.length,0),
  camps:[...chunks.values()].reduce((s,c)=>s+c.camps.length,0),
  resources:[...chunks.values()].reduce((s,c)=>s+c.resources.length,0),
  realData: !!realIndex,
  backdrop: backdropMesh?{tris:backdropMesh.vertCount/3, center:backdropCenter}:null});
// Отладочные хуки для скриптовой проверки сноса/зарастания (Playwright и т.п.)
window.__demolish=demolishNearest;
window.__regrowthTick=regrowthTick;
window.__removalRegistry=removalRegistry;
window.__REGROWTH_MS=REGROWTH_MS;
window.__rebuildRealIndex=rebuildRealIndex;
window.__getChunk=(cx,cy)=>{
  const c=chunks.get(chunkKey(cx,cy));
  return c ? {cities:c.cities,camps:c.camps,resources:c.resources} : null;
};
</script>
</body>
</html>
