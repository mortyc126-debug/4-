<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Четыре Знамени — реактор (прототип)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a09;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #status{position:fixed;left:10px;top:10px;color:#e6c273;font:12px monospace;
    background:rgba(0,0,0,.5);padding:6px 10px;border-radius:4px;white-space:pre}
  /* top:100px — ниже плашки ресурсов родительской страницы (index.html
     #top: top:10px + аватар 78px + отступы карточки), а не поверх неё —
     этот документ открыт внутри iframe и ничего не знает о вёрстке
     родителя, кроме этого захардкоженного отступа. */
  #coordBar{position:fixed;left:50%;top:100px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;z-index:15;
    background:rgba(22,17,11,.84);border:1px solid #3d3121;border-radius:8px;
    padding:7px 10px;box-shadow:0 8px 30px rgba(0,0,0,.65);backdrop-filter:blur(3px)}
  #coordBar label{font-size:12px;color:#a2967b;display:flex;align-items:center;gap:4px}
  #coordBar input{width:64px;background:#1c160e;border:1px solid #4a3b26;border-radius:4px;
    color:#ece2ca;font:inherit;font-size:13px;padding:3px 5px}
  #coordBar button{background:#3d3121;border:1px solid #4a3b26;border-radius:4px;
    color:#e6c273;font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer}
  #coordBar button:active{background:#4a3b26}
  @media (max-width:760px){
    #coordBar{padding:6px 8px;gap:4px}
    #coordBar input{width:52px;font-size:12px}
  }
  #selected{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    color:#f2e4c4;font:14px/1.3 -apple-system,sans-serif;background:rgba(20,16,10,.82);
    border:1px solid rgba(230,194,115,.4);padding:8px 16px;border-radius:8px;
    display:none;white-space:pre;pointer-events:none}
  /* Подписи над замками/лагерями/точками — тот же приём и та же вёрстка,
     что и в старом рендере (obyom-3d-infinite.html): плавают в 3D вслед
     за камерой, позиция через transform каждый кадр, а не left/top. */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
  .wlabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.6)}
  .wlabel .nm{font-size:12.5px;color:#f0dfae;font-variant:small-caps;letter-spacing:.04em}
  .wlabel .nm.mine{color:#8fd0a0}
  .wlabel .lv{font-size:10px;color:#c9b98f;margin-top:1px}
  .wlabel .lv:empty{display:none} /* лагеря/точки больше не подписывают уровень (см. realData.ts) — пустая строка не должна оставлять зазор под ником */
  @media (max-width:760px){
    .wlabel .nm{font-size:11.5px}
    .wlabel .lv{font-size:9px}
  }
</style>
  <script type="module" crossorigin src="./assets/index-DGB1sRCH.js"></script>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="status">инициализация…</div>
<div id="coordBar">
  <label>X: <input id="coordX" type="number" step="any" inputmode="decimal"></label>
  <label>Y: <input id="coordY" type="number" step="any" inputmode="decimal"></label>
  <button id="coordGo">Перейти</button>
</div>
<div id="selected"></div>
<div id="labels"></div>
</body>
</html>
