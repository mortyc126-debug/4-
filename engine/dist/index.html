<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Право Правителя — реактор (прототип)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a09;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  /* Фаза 16 — отладочная сводка по умолчанию СКРЫТА (см. main.ts, DEBUG):
     раньше эта панель показывалась КАЖДОМУ игроку постоянно ("инициализация…",
     потом "модели: загружено X/Y", "рельеф: чанков N..." — и так и висела до
     конца сессии, никогда не пряталась). Автор сообщил "у тебя наложились две
     загрузки друг на друга" — это она и есть: полноценный текстовый лог в
     золотом моноширинном шрифте поверх игры, в том же углу, что и карточка
     игрока/аватарки родительской страницы, выглядит вторым, отдельным от
     видео-заставки индикатором загрузки. Полезна разработчику (см. main.ts) —
     показывается только по ?debug=1 в адресе родительской страницы. */
  #status{position:fixed;left:10px;top:10px;color:#e6c273;font:12px monospace;
    background:rgba(0,0,0,.5);padding:6px 10px;border-radius:4px;white-space:pre;
    display:none}
  /* top:100px — ниже плашки ресурсов родительской страницы (index.html
     #top: top:10px + аватар 78px + отступы карточки), а не поверх неё —
     этот документ открыт внутри iframe и ничего не знает о вёрстке
     родителя, кроме этого захардкоженного отступа. */
  }
  #selected{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    color:#f2e4c4;font:14px/1.3 -apple-system,sans-serif;background:rgba(20,16,10,.82);
    border:1px solid rgba(230,194,115,.4);padding:8px 16px;border-radius:8px;
    display:none;white-space:pre;pointer-events:none}
  /* Подписи над замками/лагерями/точками — тот же приём и та же вёрстка,
     что и в старом рендере (obyom-3d-infinite.html): плавают в 3D вслед
     за камерой, позиция через transform каждый кадр, а не left/top. */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
  .wlabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.6)}
  .wlabel .nm{font-size:12.5px;color:#f0dfae;font-variant:small-caps;letter-spacing:.04em}
  .wlabel .nm.mine{color:#8fd0a0}
  .wlabel .lv{font-size:10px;color:#c9b98f;margin-top:1px}
  .wlabel .lv:empty{display:none} /* лагеря/точки больше не подписывают уровень (см. realData.ts) — пустая строка не должна оставлять зазор под ником */
  @media (max-width:760px){
    .wlabel .nm{font-size:11.5px}
    .wlabel .lv{font-size:9px}
  }
  /* Фаза 27 — метка боя над маршем в state:"siege", видна ЛЮБОМУ игроку
     (не только сторонам), тот же приём проекции, что и у .wlabel выше
     (см. updateBattleLabels в main.ts) — просто свой пул/своя вёрстка:
     подпись фазы + две мини-полоски HP (атакующий/обороняющийся), а не
     ник+уровень. */
  .blabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.6)}
  .blabel .btitle{font-size:11px;color:#f0dfae;font-variant:small-caps;letter-spacing:.03em;white-space:nowrap}
  .blabel.retreat .btitle{color:#e2a1a1}
  .blabel.deploy .btitle{color:#cfead6}
  /* Фаза 29 — снос города: подпись золотом (не тревожно-красным, как
     отступление, — для нападающего это успех), а нижняя полоска в этот
     момент показывает прочность ломаемой постройки, а не оборону, поэтому
     красится в цвет камня, а не крови. */
  .blabel.demolish .btitle{color:#e6c273}
  .blabel.demolish .bbar.def i{background:#b08d5a}
  .blabel .bbar{width:52px;height:4px;border-radius:2px;background:rgba(0,0,0,.55);
    border:1px solid rgba(0,0,0,.6);overflow:hidden}
  .blabel .bbar i{display:block;height:100%;transition:width .4s ease}
  .blabel .bbar.atk i{background:#6fbf7a}
  .blabel .bbar.def i{background:#c25a5a}
  @media (max-width:760px){
    .blabel .btitle{font-size:10px}
    .blabel .bbar{width:42px}
  }
  /* Метка версии запечённого рельефа — ВСЕГДА видна (не под ?debug=1, как
     #status выше), потому что именно её отсутствие или расхождение и было
     нужно проверить: несколько раундов сессии игрок продолжал видеть
     старые (разорванные) реки уже ПОСЛЕ подтверждённого деплоя нужного
     коммита — не было способа со стороны экрана отличить "у меня и правда
     ещё старые данные" от "картинка новая, просто баг другой". Один
     маленький, малозаметный номер в углу закрывает вопрос одним
     скриншотом, без ?debug=1, консоли или доступа к телефону. */
  #hmVersion{position:fixed;right:6px;bottom:4px;color:rgba(230,194,115,.55);
    font:10px monospace;pointer-events:none;z-index:20;text-shadow:0 1px 2px rgba(0,0,0,.8)}
</style>
  <script type="module" crossorigin src="./assets/index-Di0Io9m5.js"></script>
</head>
<body>
<canvas id="gpu"></canvas>
<div id="status">инициализация…</div>
<div id="selected"></div>
<div id="labels"></div>
<div id="hmVersion"></div>
</body>
</html>
