services:
  - type: web
    name: pravo-pravitelya
    runtime: static
    # Раньше здесь стояла заглушка "true" — то есть на деплое НИЧЕГО не
    # собиралось, а отдавался закоммиченный engine/dist. Правки в engine/src/*.ts
    # при этом молча не доезжали до игроков, пока о них не вспомнишь и не
    # соберёшь руками. Теперь 3D-движок собирается на деплое из исходников.
    # engine/dist по-прежнему лежит в репозитории — на случай, если сборка
    # где-то недоступна; но если она сломается, деплой упадёт заметно, а не
    # выкатит устаревший мир втихую.
    buildCommand: "cd engine && npm ci && npm run build"
    staticPublishPath: .
    # Здесь было правило переписывания /sb/* на supabase.co — запасной путь
    # до данных для игроков с заблокированным чужим доменом. Убрано: на живом
    # сайте оно не применялось НИ РАЗУ. Проверка с телефона автора без VPN
    # показала /sb/auth/v1/health -> HTTP 404, то есть такого адреса на сайте
    # просто нет, а сам supabase.co при этом отвечал (401, 613 мс) — то есть
    # и блокировки никакой не было. Похоже, сервис на Render заведён руками,
    # а не из этого Blueprint, и routes отсюда не читаются вовсе.
    # Хуже того, обход успел сломать игру: клиент запоминал переход на /sb на
    # сутки, а 404 от хостинга — успешный ответ, откатиться назад он не мог.
    # Клиентская половина снята тем же коммитом (см. index.html, блок
    # "Обход через собственный домен: УБРАН").
    # Если возвращаться — сперва убедиться, что правило вообще применяется:
    # netcheck.html проверяет и живость /sb, и проход POST с заголовками.
    headers:
      # GLB-модели замков/лагерей/ресурсных точек и картинки — самое тяжёлое,
      # что грузит браузер, и меняются они редко. Даём браузеру кэшировать их
      # на неделю, чтобы при повторных заходах мир подтягивался из кэша, а не
      # качался заново с нуля. Если позже перезальёте файл с ТЕМ ЖЕ именем
      # (например, обновите модель замка), у игроков, заходивших на неделе,
      # старая версия долежит в кэше до истечения срока — храните версии под
      # новыми именами, если апдейт критичный и должен долететь сразу.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /map.jpg
        name: Cache-Control
        value: public, max-age=604800
      # Текстуры 3D-мира (земля/декор/небо/вода, engine/src/renderer.ts) и фон
      # карты города — их тут не было вовсе, и это единственные тяжёлые ассеты,
      # которые браузер переспрашивал у сервера при КАЖДОМ заходе, хотя меняются
      # они не чаще моделей. Тот же недельный кэш и та же оговорка про
      # перезалив под тем же именем, что и у /models/* выше.
      - path: /textures/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /city-map.jpg
        name: Cache-Control
        value: public, max-age=604800
      # Запечённые данные настоящего рельефа (terrain.ts, loadHeightmapData)
      # — те же ~8.6МБ на каждого игрока при первом заходе в Мир, меняются
      # только если сам регион/пайплайн перезапекается заново (редко) — тот
      # же резон кэша на неделю, что и у моделей/картинок выше.
      - path: /heightmap/*
        name: Cache-Control
        value: public, max-age=604800
      # Библиотека Supabase лежит теперь у нас, а не на cdn.jsdelivr.net (см.
      # комментарий у её <script> в index.html — лишний чужой домен на пути
      # загрузки это лишний способ не попасть в игру). Версия зашита в имя
      # файла, поэтому кэшируется навсегда: обновление приедет под новым
      # именем и мимо кэша.
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # HTML-страницы наоборот — правим их часто во время разработки, тут
      # кэш не нужен: пусть браузер всегда спрашивает сервер "не изменилось
      # ли что" (быстрый 304, если правда не изменилось), чтобы новый пуш
      # долетал до игроков без ручного Ctrl+F5.
      - path: /*.html
        name: Cache-Control
        value: no-cache
