<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Четыре Знамени</title>
<style>
:root{
  /* Стол: промасленный орех при свече, а не «тёмная тема» */
  --wood-deep:#100c08;  --wood:#1c1610;  --wood-lit:#292013;
  --leather:#241d16;    --leather-lit:#2f2619;
  --rule:#3d3121;       --rule-soft:#2c241a;
  /* Чернила и бумага */
  --vellum:#ece2ca;     --vellum-dim:#a2967b;  --vellum-faint:#6f6551;
  /* Металл и эмаль */
  --gilt:#c2993c;       --gilt-hi:#e6c273;     --gilt-dim:#8a6d2c;
  --garnet:#96323b;     --lapis:#3a5585;       --verdigris:#4d8168;
  /* Ресурсы */
  --r-food:#83a049; --r-wood:#9c6b3a; --r-stone:#8791a0; --r-gold:#d6ae40;
  /* Расовые тинктуры */
  --t-human:#d9b14b; --t-dwarf:#bb5730; --t-elf:#4c8d5e; --t-undead:#7d56a4;

  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","Hoefler Text",Georgia,serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wood-deep);color:var(--vellum);
  font-family:var(--serif);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gilt-hi);outline-offset:2px}
::selection{background:rgba(194,153,60,.3)}

/* Общая фактура дерева под всем интерфейсом */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(93deg,rgba(0,0,0,.16) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(88deg,rgba(255,236,190,.022) 0 1px,transparent 1px 13px),
    radial-gradient(120% 90% at 50% -10%,rgba(255,214,140,.09),transparent 62%);
  mix-blend-mode:overlay;opacity:.8}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* ─────────────── Верхний фриз ─────────────── */
#banners{flex:0 0 auto;display:flex;height:3px}
#banners i{flex:1;display:block}

#top{flex:0 0 auto;display:flex;align-items:center;gap:0;
  background:linear-gradient(180deg,var(--wood-lit),var(--wood) 70%,var(--wood-deep));
  border-bottom:1px solid var(--rule);
  box-shadow:0 2px 14px rgba(0,0,0,.55);padding:0 14px;min-height:56px}

#crest{display:flex;align-items:baseline;gap:9px;padding-right:16px;margin-right:4px;
  border-right:1px solid var(--rule-soft)}
#crest .mark{font-size:19px;color:var(--gilt);line-height:1}
#crest .ttl{font-size:15px;letter-spacing:.19em;text-transform:uppercase;color:var(--vellum);
  font-variant:small-caps}

#menu-btn{position:fixed;right:14px;bottom:14px;z-index:20;width:70px;height:70px;padding:0;
  background:transparent;border:none;border-radius:50%;color:var(--gilt-hi);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#menu-btn:hover{color:var(--gilt)}
#menu-btn img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#menu-btn span{display:none;font-size:19px} /* текстовый фолбэк, если картинки нет */

.purse{display:flex;align-items:center;gap:16px;padding:0 14px;flex:1;min-width:0}
.coin{display:flex;align-items:center;gap:7px}
.coin .disc{width:22px;height:22px;border-radius:50%;flex:0 0 auto;object-fit:contain}
.coin .amt{font-family:var(--data);font-size:14px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--vellum)}
.coin .rate{font-family:var(--data);font-size:10px;color:var(--vellum-faint);
  display:block;letter-spacing:.02em;text-decoration:none}
.coin .rate.neg{color:var(--garnet)}

#chron{margin-left:auto;display:flex;align-items:center;gap:14px;padding-left:14px}
#chron .stat{text-align:right;line-height:1.25}
#chron .stat b{display:block;font-family:var(--data);font-size:13px;color:var(--gilt-hi);
  font-variant-numeric:tabular-nums}
#chron .stat s{display:block;text-decoration:none;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--vellum-faint)}
#tempo{appearance:none;background:var(--wood-deep);border:1px solid var(--rule);
  color:var(--gilt);border-radius:2px;padding:5px 8px;font-family:var(--data);font-size:11px;
  cursor:pointer}

/* ─────────────── Основная область ─────────────── */
#main{flex:1;display:flex;min-height:0}

#chart{flex:1;position:relative;min-width:0;background:var(--wood-deep);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#map.grabbing{cursor:grabbing}
/* Виньетка свечи: край стола уходит в темноту */
#chart::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 45%,transparent 62%,rgba(8,5,2,.30) 100%);
  box-shadow:inset 0 0 46px rgba(0,0,0,.34)}

.plate{position:absolute;z-index:2;background:linear-gradient(180deg,rgba(38,30,21,.94),rgba(22,17,11,.95));
  border:1px solid var(--rule);border-radius:2px;
  box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(226,196,133,.09)}

#cartouche{left:14px;bottom:14px;max-width:270px;padding:11px 13px;font-size:13.5px}
#cartouche .hd{font-variant:small-caps;letter-spacing:.13em;font-size:14px;color:var(--gilt-hi);
  display:flex;align-items:center;gap:7px;margin-bottom:5px}
#cartouche .co{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;
  color:var(--vellum-dim);padding:1.5px 0}
#cartouche .co b{font-family:var(--data);color:var(--vellum);font-weight:400}
#cartouche .hint{margin-top:7px;padding-top:6px;border-top:1px solid var(--rule-soft);
  font-size:11.5px;color:var(--vellum-faint);font-style:italic}

#minimap{right:14px;top:14px;width:146px;height:146px;padding:5px;cursor:pointer}
#minimap canvas{display:block;width:100%;height:100%;image-rendering:auto;border-radius:1px}
#mini-label{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--vellum-faint)}

#tools{right:14px;bottom:14px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
#tools button{width:36px;height:34px;font-size:15px;color:var(--gilt);
  border-bottom:1px solid var(--rule-soft);transition:background .15s,color .15s}
#tools button:last-child{border-bottom:none}
#tools button:hover{background:rgba(194,153,60,.14);color:var(--gilt-hi)}

#key{left:14px;top:14px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;
  pointer-events:none;font-size:11.5px}
#key .kl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--vellum-faint);
  margin-bottom:1px}
#key .kr{display:flex;align-items:center;gap:7px;color:var(--vellum-dim)}
#key .sh{width:11px;height:13px;flex:0 0 auto}

/* ─────────────── Переключение Город/Мир ─────────────── */
#app.view-city #chart{display:none}
#app.view-city #ledger{width:100%;flex:1;border-left:none;box-shadow:none}
#app.view-city #ribbons{display:none}
#app.view-world #ledger{display:none}
#view-toggle{position:fixed;left:14px;bottom:14px;z-index:20;width:70px;height:70px;padding:0;
  background:transparent;border:none;border-radius:50%;color:var(--gilt-hi);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#view-toggle img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#view-toggle span{display:none} /* текстовый фолбэк, если картинки нет */

/* ─────────────── Выдвижное меню справа ─────────────── */
#side-menu{position:fixed;bottom:90px;right:14px;z-index:19;display:none;flex-direction:column;
  gap:2px;background:linear-gradient(180deg,var(--leather-lit),var(--leather) 30%,#1b1510);
  border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 26px rgba(0,0,0,.6);
  padding:6px;min-width:150px}
#side-menu.open{display:flex}
#side-menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;background:transparent;
  border:none;color:var(--vellum-dim);font-size:13px;font-variant:small-caps;letter-spacing:.06em;
  text-align:left;border-radius:3px}
#side-menu button:hover{background:rgba(194,153,60,.14);color:var(--gilt-hi)}
#side-menu button img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}

#menu-modal{position:fixed;inset:0;z-index:25;display:none;background:rgba(8,5,2,.72);
  overflow-y:auto}
#menu-modal.open{display:block}
#menu-modal-body{max-width:560px;margin:0 auto;padding:60px 16px 30px}
#menu-modal-close{position:fixed;top:14px;right:14px;z-index:26;width:38px;height:38px;
  border-radius:50%;background:rgba(22,17,11,.9);border:1px solid var(--gilt-dim);
  color:var(--gilt-hi);font-size:22px;line-height:1}
#menu-modal-close:hover{border-color:var(--gilt-hi)}

/* ─────────────── Модалка здания (пергамент) ─────────────── */
#building-modal{position:fixed;inset:0;z-index:27;display:none;background:rgba(8,5,2,.78);
  align-items:center;justify-content:center;padding:4px}
#building-modal.open{display:flex}
#bm-sheet{position:relative;width:100%;max-width:700px;max-height:96vh;overflow-y:auto;
  background-image:url(images/ui/parchment.jpg);background-size:100% 100%;
  padding:44px 52px 60px;color:#2c2114;box-shadow:0 20px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column}
#bm-close{position:absolute;top:12px;right:14px;width:30px;height:30px;background:transparent;
  border:none;color:#5a4530;font-size:22px;line-height:1}
#bm-title{font-size:22px;font-variant:small-caps;letter-spacing:.08em;text-align:center;
  margin-bottom:4px;color:#2c2114}
#bm-sub{text-align:center;font-size:13px;color:#5a4530;margin-bottom:16px}
#bm-art{display:block;max-width:64%;margin:0 auto 16px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#bm-desc{font-size:13px;line-height:1.5;color:#3a2c1c;text-align:center;margin-bottom:18px;
  font-style:italic}
#bm-stats{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px}
#bm-stats td{padding:5px 0;border-bottom:1px solid rgba(90,69,48,.25);color:#3a2c1c}
#bm-stats td:last-child{text-align:right;font-family:var(--data)}
#bm-reqs{margin-bottom:18px}
#bm-reqs .req-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
#bm-reqs .req-row img{width:20px;height:20px;object-fit:contain;flex:0 0 auto}
#bm-reqs .req-row .req-name{flex:1;color:#3a2c1c;min-width:0}
#bm-reqs .req-row .req-amt{font-family:var(--data);font-size:13px;white-space:nowrap;flex:0 0 auto}
#bm-reqs .req-row .req-amt.short{color:#8a2f22}
#bm-time{text-align:center;font-size:12.5px;color:#5a4530;margin-bottom:16px}
#bm-btn{display:block;width:100%;margin-top:auto;padding:11px;background:linear-gradient(180deg,#3a2c1c,#241a10);
  border:1px solid #6b5230;border-radius:3px;color:#e2c485;font-variant:small-caps;
  letter-spacing:.1em;font-size:14px}
#bm-btn:disabled{opacity:.5}

/* ─────────────── Правая колонна ─────────────── */
#ledger{width:400px;flex:0 0 400px;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--leather-lit),var(--leather) 22%,#1b1510);
  border-left:1px solid var(--rule);box-shadow:-8px 0 26px rgba(0,0,0,.55)}

#ribbons{flex:0 0 auto;display:flex;background:rgba(0,0,0,.28);
  border-bottom:1px solid var(--rule);padding:0 6px}
#ribbons button{flex:1;padding:11px 2px 9px;font-size:12px;letter-spacing:.11em;
  font-variant:small-caps;color:var(--vellum-faint);position:relative;transition:color .18s}
#ribbons button::after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:2px;
  background:var(--gilt);transform:scaleX(0);transition:transform .22s ease}
#ribbons button:hover{color:var(--vellum-dim)}
#ribbons button.on{color:var(--gilt-hi)}
#ribbons button.on::after{transform:scaleX(1)}

#folio{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 15px 26px}
#folio::-webkit-scrollbar{width:9px}
#folio::-webkit-scrollbar-track{background:rgba(0,0,0,.25)}
#folio::-webkit-scrollbar-thumb{background:var(--rule);border-radius:0}
#folio::-webkit-scrollbar-thumb:hover{background:var(--gilt-dim)}

/* Заголовок раздела — с виньеточной линейкой, как в старой книге */
.rubric{display:flex;align-items:center;gap:11px;margin:26px 0 11px;
  font-variant:small-caps;letter-spacing:.17em;font-size:13.5px;color:var(--gilt)}
.rubric:first-child{margin-top:0}
.rubric::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--gilt-dim),transparent)}
.rubric .n{font-family:var(--data);font-size:10px;color:var(--vellum-faint);letter-spacing:.05em}

/* Запись реестра */
.entry{background:linear-gradient(180deg,rgba(52,42,29,.5),rgba(30,24,16,.5));
  border:1px solid var(--rule-soft);border-left:2px solid var(--rule);
  padding:10px 12px;margin-bottom:7px;position:relative;transition:border-color .18s,background .18s}
.entry:hover{border-left-color:var(--gilt-dim);background:linear-gradient(180deg,rgba(60,49,33,.55),rgba(34,27,18,.55))}
.entry.hot{border-left-color:var(--gilt)}
.entry.war{border-left-color:var(--garnet)}
.entry.calm{border-left-color:var(--verdigris)}
.entry .line{display:flex;align-items:center;gap:11px}
.entry .fill{flex:1;min-width:0}
.entry .title{font-size:14.5px;color:var(--vellum);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.entry .note{font-size:12px;color:var(--vellum-dim);margin-top:2px;line-height:1.4}
.entry .note em{font-style:normal;color:var(--vellum)}

/* Карта города */
#citymap-wrap{position:relative;width:100%;margin-bottom:14px;border-radius:6px;overflow:hidden;
  box-shadow:0 8px 26px rgba(0,0,0,.6);border:1px solid var(--rule)}
#citymap-wrap img.base{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.cbuild{position:absolute;box-sizing:border-box;cursor:pointer;touch-action:none;
  -webkit-tap-highlight-color:transparent;user-select:none}
.cbuild .shape{position:absolute;inset:0;border:2px solid transparent;
  background:transparent;box-sizing:border-box;transition:background .15s,border-color .15s}
.cbuild:hover .shape{border-color:var(--gilt-hi);background:rgba(194,153,60,.18)}
.cbuild.built .shape{border-color:transparent;background:transparent}
.cbuild.built:hover .shape{border-color:var(--gilt-hi);background:rgba(194,153,60,.18)}
.cbuild.locked .shape{border-color:transparent;cursor:not-allowed}
.cbuild img.bimg{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;
  pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.cbuild .lvl{position:absolute;bottom:2px;right:4px;font-family:var(--data);font-size:10px;
  color:var(--gilt-hi);background:rgba(0,0,0,.55);padding:0 3px;line-height:1.4;z-index:2}
#citymap-toggle{display:flex;gap:8px;margin-bottom:10px}
#citymap-toggle button{flex:1;padding:7px;font-size:12px;font-variant:small-caps;letter-spacing:.08em;
  background:rgba(0,0,0,.25);border:1px solid var(--rule-soft);color:var(--vellum-dim)}
#citymap-toggle button.on{color:var(--gilt-hi);border-color:var(--gilt-dim)}

/* Кольцо уровня */
.ring{flex:0 0 auto;width:34px;height:34px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--data);font-size:12px;color:var(--gilt-hi);font-weight:400;
  position:relative;z-index:1}

.tag{font-family:var(--data);font-size:9.5px;letter-spacing:.09em;color:var(--vellum-faint);
  border:1px solid var(--rule);padding:1px 5px;white-space:nowrap;text-transform:uppercase}
.tag.gilt{color:var(--gilt);border-color:var(--gilt-dim)}
.tag.war{color:var(--garnet);border-color:#5c2027}

/* Цены — эмалевые точки и цифры моноширинно */
.price{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-family:var(--data);font-size:11.5px}
.price span{display:flex;align-items:center;gap:5px;color:var(--vellum-dim)}
.price span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.price span.short{color:var(--garnet)}

/* Кнопка-печать */
.seal{flex:0 0 auto;border:1px solid var(--gilt-dim);color:var(--gilt);padding:6px 13px;
  font-size:12.5px;font-variant:small-caps;letter-spacing:.09em;white-space:nowrap;
  background:linear-gradient(180deg,rgba(194,153,60,.11),rgba(194,153,60,.03));
  transition:background .18s,color .18s,border-color .18s;position:relative;overflow:hidden}
.seal:hover:not(:disabled){background:linear-gradient(180deg,rgba(194,153,60,.26),rgba(194,153,60,.1));
  color:var(--gilt-hi);border-color:var(--gilt)}
.seal:active:not(:disabled){transform:translateY(1px)}
.seal:disabled{border-color:var(--rule-soft);color:var(--vellum-faint);cursor:default;background:none}
.seal.blood{border-color:#5c2027;color:#c0525b;background:linear-gradient(180deg,rgba(150,50,59,.14),transparent)}
.seal.blood:hover{background:rgba(150,50,59,.26);color:#dd7079;border-color:var(--garnet)}
.seal.wide{width:100%;text-align:center;padding:9px}

/* Ход работ */
.progress{margin-top:8px;height:5px;background:rgba(0,0,0,.45);position:relative;
  border:1px solid var(--rule-soft)}
.progress i{position:absolute;inset:0 auto 0 0;
  background:linear-gradient(90deg,var(--gilt-dim),var(--gilt-hi));
  box-shadow:0 0 7px rgba(226,194,115,.4)}

/* Табличка-реестр */
.roll{width:100%;border-collapse:collapse;font-size:13px}
.roll td{padding:4px 0;border-bottom:1px dotted var(--rule-soft);color:var(--vellum-dim)}
.roll tr:last-child td{border-bottom:none}
.roll td:last-child{text-align:right;font-family:var(--data);font-size:12.5px;color:var(--vellum);
  font-variant-numeric:tabular-nums}
.roll td.good:last-child{color:var(--verdigris)}
.roll td.bad:last-child{color:var(--garnet)}

/* Хроника */
.chron-e{position:relative;padding:0 0 15px 20px;margin-left:4px;
  border-left:1px solid var(--rule-soft)}
.chron-e:last-child{border-left-color:transparent;padding-bottom:2px}
.chron-e::before{content:"";position:absolute;left:-4.5px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--wood);border:1.5px solid var(--rule)}
.chron-e.war::before{border-color:var(--garnet);background:#2a1315}
.chron-e.good::before{border-color:var(--verdigris);background:#152420}
.chron-e .when{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;
  color:var(--vellum-faint);text-transform:uppercase}
.chron-e .what{font-size:13px;color:var(--vellum-dim);margin-top:1px}

.hollow{text-align:center;padding:34px 18px;color:var(--vellum-faint);font-style:italic;font-size:13px}
.hollow .big{display:block;font-size:26px;color:var(--rule);margin-bottom:8px;font-style:normal}

/* Гербовый щит в списках */
.shield{width:13px;height:16px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}

/* ─────────────── Свиток (модальное окно) ─────────────── */
#veil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:18px;background:radial-gradient(70% 60% at 50% 40%,rgba(12,8,4,.72),rgba(6,4,2,.92))}
#veil.open{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#scroll{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--leather-lit),var(--leather) 30%,#1a140e);
  border:1px solid var(--rule);border-top:2px solid var(--gilt-dim);
  box-shadow:0 22px 70px rgba(0,0,0,.8);padding:20px 20px 18px;animation:rise .26s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#scroll h2{margin:0 0 4px;font-size:20px;font-variant:small-caps;letter-spacing:.1em;color:var(--gilt-hi)}
#scroll .lede{color:var(--vellum-dim);font-size:13px;margin-bottom:15px;
  padding-bottom:12px;border-bottom:1px solid var(--rule-soft)}
#scroll::-webkit-scrollbar{width:9px}
#scroll::-webkit-scrollbar-thumb{background:var(--rule)}

/* Ползунки набора войск */
.levy{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dotted var(--rule-soft)}
.levy .nm{flex:1;min-width:0}
.levy .nm .t{font-size:13.5px;display:flex;align-items:baseline;gap:7px}
.levy .nm .s{font-size:11px;color:var(--vellum-faint);font-family:var(--data)}
.levy input[type=range]{width:118px;flex:0 0 auto;accent-color:var(--gilt);height:18px}
.levy input[type=number]{width:74px;flex:0 0 auto;background:rgba(0,0,0,.4);color:var(--vellum);
  border:1px solid var(--rule);padding:4px 6px;font-family:var(--data);font-size:12.5px;text-align:right}
.chips{display:flex;gap:6px;margin:12px 0}
.chips .seal{flex:1;text-align:center;padding:5px 0;font-size:11.5px}

.verdict{margin-top:13px;padding:11px 13px;border:1px solid var(--rule);
  background:rgba(0,0,0,.28);display:flex;align-items:center;gap:11px}
.verdict .vi{font-size:20px;line-height:1}
.verdict .vt{font-size:14px;font-variant:small-caps;letter-spacing:.08em}
.verdict .vs{font-size:11.5px;color:var(--vellum-faint);font-family:var(--data)}

/* Оповещение */
#herald{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  background:linear-gradient(180deg,var(--leather-lit),var(--wood));
  border:1px solid var(--rule);border-left:3px solid var(--gilt);padding:11px 17px;
  font-size:13.5px;box-shadow:0 10px 34px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:min(440px,86vw)}
#herald.up{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:900px){
  #main{flex-direction:column}
  #ledger{width:auto;flex:1 1 54%;border-left:none;border-top:1px solid var(--rule);
    box-shadow:0 -8px 26px rgba(0,0,0,.55)}
  #chart{flex:1 1 46%}
  #key,#minimap{display:none}
  #crest .ttl{display:none}
  #top{min-height:50px;padding:0 9px}
  #crest{padding-right:9px;margin-right:0}
  .purse{gap:11px;padding:0 7px;flex:1}
  .coin .disc{width:15px;height:15px}
  .coin .amt{font-size:12.5px}
  .coin .rate{font-size:9px}
  #chron{gap:9px;padding-left:8px}
  #chron .stat s{display:none}
  #chron .stat b{font-size:12px}
  #cartouche{max-width:186px;padding:8px 10px;font-size:12.5px}
  #folio{padding:13px 12px 90px}
}

   Пятая — «венец» расы, обычно требует новую боевую логику отдельно

/* ---- Академия: дерево исследований, скопировано по духу с RoK, темп — свой.

   там нужна отдельная правка боевого расчёта (атака/защита по родам войск). */
const RESEARCH_GROWTH=1.35, RESEARCH_WAVE={1:1,2:5,3:20,4:60};
const ECO_TIME_BASE=381, MIL_TIME_BASE=320;
function researchTime(branch,wave,lv){
  const base = branch==="eco"?ECO_TIME_BASE:MIL_TIME_BASE;
  return Math.round(base*RESEARCH_WAVE[wave]*Math.pow(RESEARCH_GROWTH,lv-1));
}
function researchCost(branch,wave,lv){
  const t=researchTime(branch,wave,lv), base=t*4.44;   // та же пропорция цена/время, что у построек
  return {food:Math.round(base*.9),wood:Math.round(base),stone:Math.round(base*.75),gold:Math.round(base*.25)};
}

function gearItemStats(cat,order,r){     // r = редкость 1..5
  if(cat==="armor") return order==="bastion" ? {def:4*r,hp:6*r} : {def:2*r,hp:9*r};
  if(cat==="weapon") return order==="bastion" ? {atk:4*r,def:3*r} : {atk:8*r};
  return order==="bastion" ? {hp:4*r,def:2*r,atk:1*r} : {hp:2*r,atk:4*r,def:1*r};   // acc
}
function craftCost(mat,tier,r){          // r = редкость/тир материала 1..5 (индекс tier-1)
  const gold=200*r*r;
  const c={gold, food:Math.round(gold*0.3), wood:Math.round(gold*0.3)};
  c[mat]=null; // материал расходуется отдельно (см. startCraftItem), не через обычные ресурсы
  return c;
}
function findGearSlot(id){ return GEAR_SLOTS.find(s=>s.id===id) }
function gearBonus(p){       // суммарный бонус всего надетого снаряжения
  const out={atk:0,def:0,hp:0};
  GEAR_SLOTS.forEach(s=>{
    const it=p.gear&&p.gear[s.id]; if(!it) return;
    const st=gearItemStats(s.cat,it.order,it.rarity);
    out.atk+=st.atk||0; out.def+=st.def||0; out.hp+=st.hp||0;
  });
  return out;
}

/* =========================================================================
   ДВИЖОК. Никакого DOM ниже до раздела "ИНТЕРФЕЙС".
   Мир детерминирован: одно и то же зерно + одно и то же время = один мир.
   Ресурсы считаются лениво (по формуле от метки времени), события лежат
   в очереди и обрабатываются только когда до них дошло время. Тиков нет.
   ========================================================================= */

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = mulberry(1);
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const buildCost = (lv,p) => {
  const base = CFG.COST_BASE*Math.pow(CFG.COST_GROW,lv-1);
  const cut = p ? (1-(bonuses(p).buildCostCut||0)) : 1;
  return {food:Math.round(base*.9*cut),wood:Math.round(base*cut),stone:Math.round(base*.75*cut),gold:Math.round(base*.25*cut)};
};
const prodRate  = lv => lv<=0?0:CFG.PROD_BASE*Math.pow(CFG.PROD_GROW,lv-1);   // в час

};

const maxWallHp = lv => 3000+lv*2500;
function syncWall(p){
  const mx=maxWallHp(p.b.wall);
  if(p.wallHp==null) p.wallHp=mx;
  const dt=(W.t-(p.wallAt||0))/3600;
  if(dt>0 && W.t>(p.wallHitAt||-1e9)+2*3600) p.wallHp=Math.min(mx,p.wallHp+mx*0.03*dt);
  p.wallHp=Math.min(p.wallHp,mx);
  p.wallAt=W.t;
}

function genWorld(seed){
  RNG = mulberry(seed);
  W = { seed, t:0, born:Date.now(), map:{}, players:[], marches:[], events:[],
        log:[], nextId:1, savedAt:Date.now() };

  // Ресурсные точки: чем ближе к центру, тем богаче
  const nodeCount = 900;
  for(let i=0;i<nodeCount;i++){
    const x=ri(0,CFG.MAP-1), y=ri(0,CFG.MAP-1);
    if(W.map[key(x,y)]) continue;
    const d=centerDist({x,y});
    let lv = clamp(Math.round(5 - d*4 + (RNG()*1.6-0.8)),1,5);
    const type = pick(RES);
    W.map[key(x,y)] = {t:"node",x,y,res:type,lv,
      amount: Math.round(6000*Math.pow(2.6,lv-1)), max: Math.round(6000*Math.pow(2.6,lv-1)),
      busy:null};
  }
  // Разбойники: лагеря 1–15, форты 16–30
  for(let i=0;i<520;i++){
    const x=ri(0,CFG.MAP-1), y=ri(0,CFG.MAP-1);
    if(W.map[key(x,y)]) continue;
    const d=centerDist({x,y});
    const raw = clamp(Math.round(30 - d*26 + (RNG()*8-4)),1,30);
    const isFort = raw>15;
    W.map[key(x,y)] = {t:isFort?"fort":"camp",x,y,lv:raw,
      hp:1, power: banditPower(raw), busy:null};
  }
  // Города: игрок ближе к краю, боты рассыпаны
  const spots=[];
  const minGap=9;
  function findSpot(minD,maxD){
    for(let tries=0;tries<4000;tries++){
      const x=ri(3,CFG.MAP-4), y=ri(3,CFG.MAP-4);
      const d=centerDist({x,y});
      if(d<minD||d>maxD) continue;
      if(spots.some(s=>Math.hypot(s.x-x,s.y-y)<minGap)) continue;
      spots.push({x,y}); return {x,y};
    }
    const x=ri(3,CFG.MAP-4),y=ri(3,CFG.MAP-4); spots.push({x,y}); return {x,y};
  }
  const ps = findSpot(.62,.9);
  const me = newPlayer(W.nextId++, "human", ps.x, ps.y, false);
  me.name="Ваш город";
  me.shieldUntil = 3*86400;      // три дня защиты новичка
  Object.assign(me.b,{hall:3,store:3,barracks:2,range:2,stable:1,hospital:3,academy:2,wall:2});
  me.b.farm[0]=3; me.b.lumber[0]=3; me.b.quarry[0]=2; me.b.mine[0]=2;
  W.players.push(me);
  clearArea(ps.x,ps.y,1); W.map[key(ps.x,ps.y)]={t:"city",x:ps.x,y:ps.y,pid:me.id};

  const used={};
  for(let i=0;i<CFG.BOTS;i++){
    const race = RACE_KEYS[i%4];
    const s = findSpot(.15+RNG()*.15, .55+RNG()*.4);
    const b = newPlayer(W.nextId++, race, s.x, s.y, true);
    const pool = BOT_NAMES[race];
    used[race]=(used[race]||0);
    b.name = pool[used[race]%pool.length] + (used[race]>=pool.length?" II":"");
    used[race]++;
    // боты стартуют не с нуля, иначе мир мёртвый
    const head = ri(2,5);
    for(const k of ["hall","store","barracks","range","stable","hospital","academy","wall"])
      b.b[k]=clamp(head+ri(-2,1),1,CFG.MAX_LEVEL);
    for(const k of ["farm","lumber","quarry","mine"])
      b.b[k][0]=clamp(head+ri(-2,1),1,CFG.MAX_LEVEL);   // на старте эпоха 1 — доступен только участок №1
    b.b.hall = head;
    TKEYS.forEach(t=>{b.troops[t][1]=ri(200,900)});
    b.gen.lv = ri(3,10); b.gen.pts = b.gen.lv-1;
    autoTalents(b);
    b.res={food:20000,wood:20000,stone:9000,gold:4000}; 
    W.players.push(b);
    clearArea(s.x,s.y,1); W.map[key(s.x,s.y)]={t:"city",x:s.x,y:s.y,pid:b.id};
    schedule(ri(0,CFG.BOT_THINK), "think", {pid:b.id});
  }
  logg("Мир создан. Зерно "+seed+". Городов: "+W.players.length+".", "good");
  return W;
}
function clearArea(x,y,r){for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++)delete W.map[key(x+i,y+j)]}
function banditPower(lv){
  // Та же мерка, что и armyPower: иначе сравнение "потяну ли я этот лагерь"
  // бессмысленно и для ботов, и для подсказок игроку.
  return armyPower(banditArmy(lv), null);
}

/* ---- Очередь событий ------------------------------------------------- */
function schedule(dt,type,data){
  const ev={t:W.t+Math.max(0,dt),type,data,id:W.nextId++};
  let i=W.events.length; while(i>0 && W.events[i-1].t>ev.t) i--;
  W.events.splice(i,0,ev); return ev;
}
function unschedule(fn){ W.events=W.events.filter(e=>!fn(e)) }
function logg(text,kind){ W.log.unshift({t:W.t,text,kind:kind||""}); if(W.log.length>300)W.log.pop() }

/* ---- Ленивая экономика ------------------------------------------------ */
function bonuses(p, defending){
  const b={build:1, march:1, heal:1, healSpeed:1,
    atk:0, def:0, hp:0, archer:0, raise:0, gather:0, load:0, hosp:0, cap:0,
    prodFW:0, prodSG:0, bandit:0, mercy:0,
    prodAll:0, prodFood:0, prodWood:0, prodStone:0, prodGold:0,
    trainSpeed:0, buildCostCut:0, wallBonus:0, counter:0, firstStrike:0,
    researchSpeed:0, scoutBonus:0,
    atkInf:0, atkArc:0, atkCav:0, atkSie:0, defInf:0, defArc:0, defCav:0, defSie:0,
    genAtkMod:0, genDefMod:0, genHpMod:0};
  const race=RACES[p.race], mn=race.minus;
  if(mn.kind==="mult") b[mn.field]*=mn.value; else b[mn.field]=(b[mn.field]||0)+mn.value;
  const epoch=epochOf(p.b.hall), track=RACE_EPOCHS[p.race];
  for(let i=0;i<epoch;i++){
    (track[i].mods||[]).forEach(m=>{
      if(m.kind==="mult") b[m.field]*=m.value; else b[m.field]=m.value;
    });
  }
  if(defending && epoch>=5 && track[4].defMods){
    track[4].defMods.forEach(m=>{
      if(m.kind==="abs") b[m.field]=m.value; else b[m.field]=(b[m.field]||0)+m.value;
    });
  }
  genOf(p).apply(b);
  const T=p.gen.tal||{};
  const g=id=>T[id]||0;
  b.atk+=g("w1")*.02; b.def+=g("w2")*.02; b.hp+=g("w3")*.02;
  b.bandit+=g("w4")*.05; b.mercy+=g("w5")*.03;
  b.build*=1+g("d1")*.03; b.prodFW+=g("d2")*.04; b.prodSG+=g("d3")*.04;
  b.hosp+=g("d4")*.05; b.cap+=g("d5")*.04;
  b.load+=g("g1")*.04; b.gather+=g("g2")*.04; b.march*=1+g("g3")*.03;
  b.gatherFW=g("g4")*.05; b.gatherSG=g("g5")*.05;
  const tech=p.tech||{};
  const multAcc={};
  [ACADEMY_TREE.eco,ACADEMY_TREE.mil].forEach(arr=>arr.forEach(n=>{
    const lv=tech[n.id]||0; if(!lv||n.unlock) return;
    const list=n.effects||[{field:n.field,total:n.total,kind:n.kind}];
    list.forEach(e=>{
      const inc=e.total*(lv/n.max);
      if(e.kind==="mult") multAcc[e.field]=(multAcc[e.field]||0)+inc;
      else b[e.field]=(b[e.field]||0)+inc;
    });
  }));
  Object.keys(multAcc).forEach(f=>b[f]*=(1+multAcc[f]));
  const multAcc2={};
  [GENERAL_TREE.city.nodes,GENERAL_TREE.army.nodes].forEach(arr=>arr.forEach(n=>{
    const lv=T[n.id]||0; if(!lv) return;
    const inc=n.per*lv;
    if(n.kind==="mult") multAcc2[n.field]=(multAcc2[n.field]||0)+inc;
    else b[n.field]=(b[n.field]||0)+inc;
  }));
  Object.keys(multAcc2).forEach(f=>b[f]*=(1+multAcc2[f]));
  return b;
}
function production(p){ // единиц в час
  const B=bonuses(p), out={};
  const map={food:"farm",wood:"lumber",stone:"quarry",gold:"mine"};
  const handicap = p.isBot ? CFG.BOT_HANDICAP : 1;
  for(const r of RES){
    let base=0; p.b[map[r]].forEach(lv=>{ if(lv>0) base+=prodRate(lv)*(1+lateSpeed(lv)); });
    let v=base * ({food:1.25,wood:1.25,stone:0.90,gold:0.50}[r]) * handicap;
    v*=1+B.prodAll;
    v*=1+(r==="food"?B.prodFood:r==="wood"?B.prodWood:r==="stone"?B.prodStone:B.prodGold);
    v*=1+((r==="food"||r==="wood")?B.prodFW:B.prodSG);
    out[r]=v;
  }
  return out;   // Содержания армии нет: войска едят только при обучении и лечении.
}
function garrison(p){   // войск в городе — без потолка, просто для сводки
  return countUnits(p.troops);
}
function capacity(p){    // теперь своя вместимость на каждый ресурс — склад + защита самих участков
  const B=bonuses(p), base=Math.round(storeCap(p.b.store)*(1+B.cap));
  const map={food:"farm",wood:"lumber",stone:"quarry",gold:"mine"};
  const out={};
  RES.forEach(r=>{ let extra=0; p.b[map[r]].forEach(lv=>extra+=plotCap(lv)); out[r]=base+extra; });
  return out;
}
function syncRes(p){
  const dt=(W.t-p.resAt)/3600; if(dt<=0){p.resAt=W.t;return}
  const pr=production(p), cap=capacity(p);
  for(const r of RES) p.res[r]=clamp(p.res[r]+pr[r]*dt, 0, r==="gold"?cap[r]*2:cap[r]);
  p.resAt=W.t;
}
function canPay(p,c){ syncRes(p); return RES.every(r=>!c[r]||p.res[r]>=c[r]) }
function pay(p,c){ syncRes(p); RES.forEach(r=>{if(c[r])p.res[r]-=c[r]}) }
function gain(p,c){ syncRes(p); const cap=capacity(p);
  RES.forEach(r=>{if(c[r])p.res[r]=Math.min(p.res[r]+c[r], r==="gold"?cap[r]*2:cap[r])}) }

function power(p){
  let v=0; BKEYS.forEach(k=>{
    const lv=p.b[k];
    if(Array.isArray(lv)) lv.forEach(l=>v+=Math.pow(l,2.1)*12); else v+=Math.pow(lv,2.1)*12;
  });
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) v+=p.troops[t][i]*TIER_MULT[i-1]*4});
  W.marches.forEach(m=>{if(m.pid===p.id)TKEYS.forEach(t=>{for(let i=1;i<=5;i++)v+=(m.units[t][i]||0)*TIER_MULT[i-1]*4})});
  v+=p.gen.lv*80;
  return Math.round(v);
}
function armyPower(units,B,race){
  const TYPE_ATK={inf:"atkInf",arc:"atkArc",cav:"atkCav",sie:"atkSie"};
  const TYPE_DEF={inf:"defInf",arc:"defArc",cav:"defCav",sie:"defSie"};
  let v=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++){
    const n=units[t]&&units[t][i]||0; if(!n)continue;
    let a=troopStat(t,i,"atk")*troopMod(race,t,"atk")*(1+(B&&B[TYPE_ATK[t]]||0));
    if(t==="arc") a*=1+(B&&B.archer||0);
    const d=troopStat(t,i,"def")*troopMod(race,t,"def")*(1+(B&&B[TYPE_DEF[t]]||0));
    const hp=troopStat(t,i,"hp")*troopMod(race,t,"hp");
    v+=n*(a*(1+(B?B.atk:0))+d*(1+(B?B.def:0))+hp*(1+(B?B.hp:0)));
  }});
  return Math.round(v/3);
}
function countUnits(u){let n=0;TKEYS.forEach(t=>{for(let i=1;i<=5;i++)n+=(u[t]&&u[t][i])||0});return n}
function emptyUnits(){const u={};TKEYS.forEach(t=>{u[t]={};for(let i=1;i<=5;i++)u[t][i]=0});return u}
function marchCapacity(p){
  const B=bonuses(p);
  return Math.round((3000+p.b.hall*1400+p.gen.lv*260)*(1+B.load*0));
}

/* =========================================================================
   БОЙ. Автобой раундами, как в RoK: считаем, показываем лог.
   Треугольник: пехота бьёт лучников, лучники — конницу, конница — пехоту.
   Осадные слабы в поле, но везут груз и ломают стены.
   ========================================================================= */
function makeForce(units,p,opts){
  const defending=!!(opts&&opts.defending);
  const B=p?bonuses(p,defending):{atk:0,def:0,hp:0,archer:0,raise:0,bandit:0,mercy:0,counter:0,firstStrike:0};
  const f={units:JSON.parse(JSON.stringify(units)),B,p,risen:emptyUnits(),
           start:JSON.parse(JSON.stringify(units)), broken:emptyUnits(),
           gen: (p&&p.gen&&p.gen.id!=null) ? genStats(p) : null,
           wallDef:(opts&&opts.wall)||0, bandit:(opts&&opts.bandit)||false,
           name:(opts&&opts.name)||(p?p.name:"Разбойники")};
  return f;
}
function sideStats(f){
  const s={};
  const race=f.p&&f.p.race, B=f.B;
  const TYPE_ATK={inf:"atkInf",arc:"atkArc",cav:"atkCav",sie:"atkSie"};
  const TYPE_DEF={inf:"defInf",arc:"defArc",cav:"defCav",sie:"defSie"};
  TKEYS.forEach(t=>{
    let atk=0,def=0,hp=0,n=0;
    const atkMod=1+(B[TYPE_ATK[t]]||0), defMod=1+(B[TYPE_DEF[t]]||0);
    for(let i=1;i<=5;i++){
      const c=f.units[t][i]||0;
      const brk=f.broken&&f.broken[t][i]?0.70:1;
      if(c){
        let a=troopStat(t,i,"atk")*troopMod(race,t,"atk")*atkMod;
        if(t==="arc") a*=1+(f.B.archer||0);
        let d=troopStat(t,i,"def")*troopMod(race,t,"def")*defMod;
        atk+=c*a*brk*(1+f.B.atk); def+=c*d*brk*(1+f.B.def);
        hp +=c*troopStat(t,i,"hp")*troopMod(race,t,"hp")*(1+f.B.hp); n+=c;
      }
      // мертвецы нежити: половина характеристик того тира и рода войск, что погиб
      const rc=f.risen&&f.risen[t][i]||0;
      if(rc){
        let ra=troopStat(t,i,"atk")*troopMod(race,t,"atk")*atkMod*0.5;
        if(t==="arc") ra*=1+(f.B.archer||0);
        atk+=rc*ra*(1+f.B.atk); def+=rc*troopStat(t,i,"def")*troopMod(race,t,"def")*defMod*0.5*(1+f.B.def);
        hp +=rc*troopStat(t,i,"hp")*troopMod(race,t,"hp")*0.5*(1+f.B.hp); n+=rc;
      }
    }
    s[t]={atk,def,hp,n};
  });
  s.totalHp=TKEYS.reduce((a,t)=>a+s[t].hp,0);
  s.totalN =TKEYS.reduce((a,t)=>a+s[t].n,0);
  return s;
}
function counterMult(from,to){
  const T=TROOP_TYPES[from];
  if(T.beats===to) return COUNTER_UP;
  if(T.losesTo===to) return COUNTER_DOWN;
  return 1;
}
function volleyDamage(att,defS,defWall){
  // венец эльфов: один досрочный залп лучников до начала общей схватки, без ответа
  if(!att.B.firstStrike) return null;
  const c=att.units.arc; let atk=0,n=0;
  for(let i=1;i<=5;i++){ const cnt=c[i]||0; if(!cnt)continue;
    atk+=cnt*troopStat("arc",i,"atk")*(1+(att.B.archer||0))*(1+att.B.atk); n+=cnt; }
  if(n<=0) return null;
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(defS[dt].n<=0) return;
    const d=atk*counterMult("arc",dt)*(defS[dt].hp/Math.max(1,defS.totalHp));
    const mitig=1+(defS[dt].def/Math.max(1,defS[dt].n))/70*defWall;
    out[dt]=d*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function garrisonVolley(D,attS){
  // гарнизон — не разведка, а сторожевая башня: сама бьёт атакующих до общей схватки
  const lv = D.p && D.p.b.garrison || 0; if(lv<=0) return null;
  const dmg = lv*900;
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(attS[dt].n<=0) return;
    const share = dmg*(attS[dt].hp/Math.max(1,attS.totalHp));
    const mitig = 1+(attS[dt].def/Math.max(1,attS[dt].n))/70;
    out[dt]=share*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function generalDamage(f,defS){
  // полководец — отдельный боец вне треугольника контр: бьёт по всем родам сразу
  if(!f.gen||f.gen.hp<=0) return null;
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(defS[dt].n<=0) return;
    const share=f.gen.atk*(defS[dt].hp/Math.max(1,defS.totalHp));
    const mitig=1+(defS[dt].def/Math.max(1,defS[dt].n))/70;
    out[dt]=share*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function damageToGeneral(f,enemyS){
  // получает от всех родов войск противника, но как один боец под сильным прикрытием — не тонет в общем уроне армии
  if(!f.gen||f.gen.hp<=0||enemyS.totalN<=0) return 0;
  const avgAtk=TKEYS.reduce((s,t)=>s+enemyS[t].atk,0)/enemyS.totalN;
  const mitig=1+f.gen.def/70;
  return avgAtk*CFG.BATTLE_PACE*0.4/mitig;
}
function resolveBattle(A,D,ctx){
  ctx=ctx||{};
  const lossA=emptyUnits(), lossD=emptyUnits();
  const lines=[];
  let round=0;
  const wallMul = 1 + (D.wallDef||0)*0.03*(1+(D.B.wallBonus||0));   // стена уровня 20 → +60% защиты обороне, у гномов ещё крепче

  // Первый залп лучников (венец эльфов): без ответа, до первого раунда боя
  const openA=volleyDamage(A,sideStats(D),wallMul); if(openA){ applyDamage(D,openA,lossD); raiseSkeletons(D,lossD); }
  const openD=volleyDamage(D,sideStats(A),1);        if(openD){ applyDamage(A,openD,lossA); raiseSkeletons(A,lossA); }
  // Залп гарнизона защитника — тоже до общей схватки
  const openG=garrisonVolley(D,sideStats(A));        if(openG){ applyDamage(A,openG,lossA); raiseSkeletons(A,lossA); }
  checkDiscipline(A,lossA); checkDiscipline(D,lossD);

  while(round<60){
    const sa=sideStats(A), sd=sideStats(D);
    if(sa.totalN<=0||sd.totalN<=0) break;
    round++;
    const dmgTo=(att,attS,defS,defWall)=>{
      const out={inf:0,arc:0,cav:0,sie:0};
      TKEYS.forEach(dt=>{
        if(defS[dt].n<=0) return;
        let d=0;
        TKEYS.forEach(at=>{ if(attS[at].n<=0)return;
          d += attS[at].atk * counterMult(at,dt) * (defS[dt].hp/Math.max(1,defS.totalHp));
        });
        const mitig = 1 + (defS[dt].def/Math.max(1,defS[dt].n))/70 * defWall;
        out[dt]=d*CFG.BATTLE_PACE/mitig;
      });
      return out;
    };
    const dA = dmgTo(A,sa,sd,wallMul);          // урон, наносимый атакующим
    const dD = dmgTo(D,sd,sa,1);
    applyDamage(D,dA,lossD);
    applyDamage(A,dD,lossA);
    // Полководцы — отдельные бойцы вне треугольника: бьют всех, получают ото всех, но смягчённо
    const genDmgA=generalDamage(A,sd); if(genDmgA) applyDamage(D,genDmgA,lossD);
    const genDmgD=generalDamage(D,sa); if(genDmgD) applyDamage(A,genDmgD,lossA);
    if(A.gen) A.gen.hp=Math.max(0,A.gen.hp-damageToGeneral(A,sd));
    if(D.gen) D.gen.hp=Math.max(0,D.gen.hp-damageToGeneral(D,sa));
    // Венец гномов: часть урона атакующего отражается контрударом гарнизона
    if(D.B.counter){
      const totalDA=TKEYS.reduce((s2,t)=>s2+dA[t],0), extra=totalDA*D.B.counter;
      if(extra>0){
        const reflect={inf:0,arc:0,cav:0,sie:0};
        TKEYS.forEach(t=>{ if(sa[t].n>0) reflect[t]=extra*(sa[t].hp/Math.max(1,sa.totalHp)); });
        applyDamage(A,reflect,lossA);
      }
    }
    const brokeA=checkDiscipline(A,lossA), brokeD=checkDiscipline(D,lossD);
    if(brokeA.length) lines.push(A.name+": "+brokeA.join(", ")+" дрогнули — атака и защита −30% до конца боя.");
    if(brokeD.length) lines.push(D.name+": "+brokeD.join(", ")+" дрогнули — атака и защита −30% до конца боя.");
    if(round<=3||round%8===0){
      lines.push("Раунд "+round+": "+A.name+" — "+countUnits(A.units).toLocaleString("ru")+
                 ", "+D.name+" — "+countUnits(D.units).toLocaleString("ru"));
    }
    // Нежить поднимает павших прямо в бою
    raiseSkeletons(A,lossA); raiseSkeletons(D,lossD);
    if(countUnits(A.units)<=0||countUnits(D.units)<=0) break;
    const ra=countUnits(A.units)/Math.max(1,ctx.startA||1);
    if(ra<0.28 && !ctx.toDeath) break;          // атакующий отступает, потеряв 72%
  }
  const aliveA=countUnits(A.units), aliveD=countUnits(D.units);
  const win = aliveA>0 && aliveD<=0 ? "A" : aliveD>0&&aliveA<=0 ? "D" : (aliveA>aliveD?"A":"D");
  return {win, rounds:round, lossA, lossD, lines, aliveA, aliveD};
}
function applyDamage(f,dmg,loss){
  const race=f.p&&f.p.race;
  TKEYS.forEach(t=>{
    let d=dmg[t]; if(d<=0)return;
    // сначала гибнут живые бойцы, младшие тиры первыми
    for(let i=1;i<=5&&d>0;i++){
      const c=f.units[t][i]||0; if(!c)continue;
      const ehp=troopStat(t,i,"hp")*troopMod(race,t,"hp")*(1+f.B.hp);
      let kill=Math.min(c, Math.floor(d/ehp));
      if(kill<=0 && d>ehp*0.5 && c>0) kill=1;
      if(kill<=0) break;
      f.units[t][i]-=kill; loss[t][i]+=kill; d-=kill*ehp;
    }
    // затем — поднятые мертвецы этого рода войск (хрупче: половина хп своего тира)
    for(let i=1;i<=5&&d>0;i++){
      const rc=f.risen&&f.risen[t][i]||0; if(!rc)continue;
      const ehp=troopStat(t,i,"hp")*troopMod(race,t,"hp")*0.5*(1+f.B.hp);
      let kill=Math.min(rc, Math.floor(d/ehp));
      if(kill<=0 && d>ehp*0.5 && rc>0) kill=1;
      if(kill<=0) break;
      f.risen[t][i]-=kill; d-=kill*ehp;
    }
  });
}
function checkDiscipline(f,loss){
  const race=f.p&&f.p.race, broke=[];
  TKEYS.forEach(t=>{
    for(let i=1;i<=5;i++){
      if(f.broken[t][i]) continue;
      const start=f.start&&f.start[t][i]||0; if(!start) continue;
      const thr=disciplineThreshold(t,i,race); if(thr===Infinity) continue;
      if((loss[t][i]||0)/start>thr){ f.broken[t][i]=1; broke.push(unitName(t,i,race)); }
    }
  });
  return broke;
}
function raiseSkeletons(f,loss){
  const rate=f.B.raise||0; if(rate<=0) return;
  if(!f._raisedCum) f._raisedCum=emptyUnits();
  TKEYS.forEach(t=>{
    for(let i=1;i<=5;i++){
      const dead=loss[t][i]||0; if(!dead)continue;
      const should=Math.floor(dead*rate), already=f._raisedCum[t][i]||0;
      if(should>already){ f.risen[t][i]=(f.risen[t][i]||0)+(should-already); f._raisedCum[t][i]=should; }
    }
  });
}
/* Раненые вместо убитых: часть потерь уходит в госпиталь */
function splitLosses(p,loss,defending){
  const B=bonuses(p);
  const cap=Math.round(hospitalCap(p.b.hospital)*(1+B.hosp));
  let inHosp=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) inHosp+=p.wounded[t][i]});
  let base = defending?0.60:0.35;
  base = Math.min(0.9, base + B.mercy);
  let dead=0, hurt=0;
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++){
    const n=loss[t][i]; if(!n)continue;
    let w=Math.round(n*base);
    const room=Math.max(0,cap-inHosp);
    w=Math.min(w,room); inHosp+=w;
    p.wounded[t][i]+=w; hurt+=w; dead+=n-w;
  }});
  return {dead,hurt};
}

   МАРШИ

function marchSpeed(p,units){
  let s=99; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) if(units[t][i]>0) s=Math.min(s,TROOP_TYPES[t].speed*troopMod(p.race,t,"speed"))});
  if(s>90) s=1;
  return s*bonuses(p).march;      // клеток в минуту
}
function sendMarch(p,tx,ty,units,mode){
  const n=countUnits(units); if(n<=0) return {err:"Нет войск"};
  const busy=W.marches.filter(m=>m.pid===p.id).length;
  if(busy>=marchSlots(p.b.hall)) return {err:"Все отряды заняты"};
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++){
    if(units[t][i]>p.troops[t][i]) units[t][i]=p.troops[t][i];
    p.troops[t][i]-=units[t][i];
  }});
  const d=Math.hypot(tx-p.x,ty-p.y);
  const spd=marchSpeed(p,units);
  const travel=Math.max(20, d/spd*60);
  const m={id:W.nextId++,pid:p.id,mode,x0:p.x,y0:p.y,tx,ty,units,
    t0:W.t,t1:W.t+travel,state:"go",carry:null,gatherEnd:0};
  W.marches.push(m);
  schedule(travel,"arrive",{mid:m.id});
  // Оборонявшийся узнаёт о марше немедленно — боты «сидят в игре» 24/7
  const tgt=W.map[key(tx,ty)];
  if(tgt&&tgt.t==="city"){
    const def=W.players.find(q=>q.id===tgt.pid);
    if(def&&def.isBot) botAlarm(def,m);
    else if(def&&!def.isBot&&def.b.garrison>0&&p.id!==def.id){
      const lead=Math.min(travel*0.9, def.b.garrison*60);
      schedule(Math.max(0,travel-lead),"warn",{pid:def.id,x:tx,y:ty,eta:Math.round(lead)});
    }
  }
  return {ok:m};
}
function recallMarch(m){
  if(m.state==="back") return;
  const p=W.players.find(q=>q.id===m.pid);
  const back=Math.max(15,Math.hypot(m.tx-p.x,m.ty-p.y)/marchSpeed(p,m.units)*60);
  m.state="back"; m.t0=W.t; m.t1=W.t+back;
  unschedule(e=>e.data&&e.data.mid===m.id);
  schedule(back,"home",{mid:m.id});
}
function marchPos(m){
  const f=clamp((W.t-m.t0)/Math.max(1,m.t1-m.t0),0,1);
  const p=W.players.find(q=>q.id===m.pid);
  if(m.state==="back") return {x:m.tx+(p.x-m.tx)*f, y:m.ty+(p.y-m.ty)*f};
  if(m.state==="gather"||m.state==="siege") return {x:m.tx,y:m.ty};
  return {x:m.x0+(m.tx-m.x0)*f, y:m.y0+(m.ty-m.y0)*f};
}

  },

  gathered(d){ const m=W.marches.find(m=>m.id===d.mid); if(m) recallMarch(m) },
  home(d){
    const m=W.marches.find(m=>m.id===d.mid); if(!m)return;
    const p=W.players.find(q=>q.id===m.pid);

    const p=W.players.find(q=>q.id===d.pid); if(p&&p.isBot) botThink(p);
