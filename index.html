<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Право Правителя</title>
<style>
:root{
  /* Стол: промасленный орех при свече, а не «тёмная тема» */
  --wood-deep:#100c08;  --wood:#1c1610;  --wood-lit:#292013;
  --leather:#241d16;    --leather-lit:#2f2619;
  --rule:#3d3121;       --rule-soft:#2c241a;
  /* Чернила и бумага */
  --vellum:#ece2ca;     --vellum-dim:#a2967b;  --vellum-faint:#6f6551;
  /* Металл и эмаль */
  --gilt:#c2993c;       --gilt-hi:#e6c273;     --gilt-dim:#8a6d2c;
  --garnet:#96323b;     --lapis:#3a5585;       --verdigris:#4d8168;
  /* Ресурсы */
  --r-food:#83a049; --r-wood:#9c6b3a; --r-stone:#8791a0; --r-gold:#d6ae40;
  /* Расовые тинктуры */
  --t-human:#d9b14b; --t-dwarf:#bb5730; --t-elf:#4c8d5e; --t-undead:#7d56a4;

  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","Hoefler Text",Georgia,serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wood-deep);color:var(--vellum);
  font-family:var(--serif);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gilt-hi);outline-offset:2px}
::selection{background:rgba(194,153,60,.3)}

/* Общая фактура дерева под всем интерфейсом */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(93deg,rgba(0,0,0,.16) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(88deg,rgba(255,236,190,.022) 0 1px,transparent 1px 13px),
    radial-gradient(120% 90% at 50% -10%,rgba(255,214,140,.09),transparent 62%);
  mix-blend-mode:overlay;opacity:.8}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* top:18px, а не 10px — плашка Янтаря прижата вплотную к правому верхнему
   углу (#amber-badge, top:0), и кошелёк с ресурсами вплотную к ней подходил.
   Небольшой сдвиг вниз разводит их по вертикали, не трогая саму шапку. */
#top{position:fixed;top:18px;left:0;z-index:15;display:flex;flex-direction:row;
  align-items:center;gap:8px;max-width:calc(100vw - 6px)}

#crest{display:flex;align-items:center;cursor:pointer;flex:0 0 auto}
#crest:hover .mark{color:var(--gilt-hi)}
#crest .mark{font-size:17px;color:var(--gilt);line-height:1;transition:color .15s;
  width:50px;text-align:center;flex:0 0 auto}
#crest .avatar{width:78px;height:78px;object-fit:contain;display:block;flex:0 0 auto;
  position:relative;z-index:2;margin-right:-16px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
#crest .crest-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  min-width:0;background:rgba(0,0,0,.32);border:1px solid var(--rule-soft);
  border-radius:6px;padding:4px 8px 4px 20px}
#crest .crest-card b{font-size:11.5px;font-weight:normal;color:var(--vellum);max-width:84px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crest-power{display:flex;align-items:center;gap:4px;font-family:var(--data);font-size:11px;
  color:var(--gilt-hi);font-weight:bold;background:rgba(0,0,0,.35);
  border:1px solid var(--gilt-dim);border-radius:4px;padding:1px 6px}
#crest-power .ico{width:12px;height:12px;object-fit:contain}

/* RoK-стиль карточки профиля (пользователь прислал референс — круглый
   аватар в золотом кольце, ник по центру под ним, снизу простая таблица
   мощи) — раньше был левоприжатый маленький портрет + текст сбоку. */
.profile-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 10px}
.profile-avatar-wrap{position:relative;flex:0 0 auto}
.profile-avatar{width:96px;height:96px;object-fit:cover;display:block;border-radius:50%}
/* Золотое кольцо — раньше был плоский CSS-border, теперь отдельная
   декоративная картинка ПОВЕРХ аватара (тот же приём, что и уголки/печать
   у почты и модалки здания): кольцо крупнее аватара и центрировано над
   ним, никогда не искажается, потому что не привязано растяжением к чужому
   боксу. pointer-events:none — клики по аватару (если когда-то понадобятся)
   не должны перехватываться декором. */
.profile-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:132px;height:auto;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
/* Герб расы — маленький значок поверх аватара (правый нижний угол, тот же
   приём, что и бейдж класса/яруса у портретов юнитов), теперь в гербовом
   картуше вместо голого SVG-щита: тот же geraldic-shield ассет, что и у
   кольца, с процедурным щитом расы (shieldSvg) внутри его прозрачного окна. */
/* Порядок в разметке ниже (см. foProfile): сначала .fill (герб расы),
   ПОТОМ картинка рамки — рамка красится последней и оказывается визуально
   СВЕРХУ герба (репорт пользователя: было наоборот, герб лежал поверх
   рамки, из-за чего его края перекрывали/перебивали тонкую золотую
   окантовку рамки вместо того, чтобы рамка аккуратно охватывала герб).
   Раз рамка теперь сверху — она же маскирует любое небольшое несовпадение
   между прямоугольным object-fit:fill гербом и фигурным (не прямоугольным)
   прозрачным окном рамки по самому краю. */
.profile-shield-badge{position:absolute;right:-10px;bottom:-8px;width:46px;height:46px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.profile-shield-badge>img{width:100%;height:100%;object-fit:contain;display:block}
/* Первая правка (19px -> 22px) не помогла — не в размере было дело.
   RACE_CREST-картинки (Human.png и т.д.) не голый щит, а целая композиция
   "корона + скрещенные мечи + щит" — сам щит внутри неё занимает только
   среднюю часть кадра, поэтому даже увеличенная иконка внутри своей же
   рамки выглядела мельче рамки (репорт: "не обхватывает реальное
   изображение иконки"). Обрезали 4 картинки под именно щит (без короны/
   рукоятей мечей, см. images/ui/{Race}-badge.png) — новые файлы используют
   ТОЛЬКО в этом маленьком гербе-картуше, оригиналы не трогали (они уже
   верно смотрятся полной композицией в других местах игры при большем
   размере). object-fit:contain — у 4 рас разное соотношение сторон после
   обрезки (не выравнивали искусственно), не искажает форму. */
.profile-shield-badge .fill{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%)}
/* object-fit:fill (не contain) по прямой просьбе пользователя — обрезка
   уже впритык к контенту (проверено по альфа-каналу: нулевой прозрачный
   отступ у всех 4 файлов), но соотношения сторон у рас РАЗНЫЕ (0.65-0.82),
   а окно рамки — одно (0.88), так что contain оставлял пустые поля по
   бокам у более узких гербов (Дворф/Нежить). fill растягивает каждый
   ПОД СВОЁ окошко без остатка — небольшое искажение по ширине у пары рас
   менее заметно на 46px значке, чем гарантированный зазор до рамки. */
/* Крупнее самого окна рамки НАРОЧНО (репорт: "у людей чуть расшир,
   есть зазоры") — герб-силуэт (даже обрезанный) не прямоугольный,
   у прямоугольного object-fit:fill бокса остаются пустые уголки на
   стыке с фигурным окном рамки. Теперь рамка красится ПОСЛЕ герба
   (см. .profile-shield-badge выше) — переполнение герба за пределы
   окна просто прячется под рамкой сверху, ничем не грозит. */
.profile-shield-badge .fill img{width:27px;height:30px;object-fit:fill;display:block}
/* Пока полководец не выбран (playerAvatarSrc()===null) — герб один и
   должен заполнить собой место аватара целиком, а не жаться в угол. */
.profile-avatar-fallback{width:96px;height:96px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--wood)}
.profile-name-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}
.profile-name-row input{text-align:center;font-size:15px}
/* Венок — фон ЗА чипом мощи, тот же приём: собственное соотношение сторон,
   чип остаётся обычным текстовым блоком поверх него по центру. */
/* Венок раньше был 190px при 15px-цифрах — сам венок доминировал над
   содержимым (репорт пользователя: "венок слишком огромен, а цифры
   малы"). Первая правка (118px + крупнее цифры) сама сломалась иначе:
   свободное место ВНУТРИ венка — не полукруг, а узкий проём между двумя
   ветками (промерено по альфа-каналу: на высоте венка чистый зазор ~45%
   от общей ширины, а не половина) — при 118px эта щель у́же, чем "19 933"
   с иконкой мощи рядом, отсюда наезд цифр на левую ветку. Решение: венок
   покрупнее (150px — компромисс, не крайность в 190px), а иконку внутри
   убрали вовсе (сам венок уже читается как символ "мощь", дублировать
   его отдельной иконкой было избыточно и съедало ширину, которой и так
   не хватало) — оставшегося места ровно под цифру.
   top:37% (не 50%) — то же промерение: лента внизу венка занимает
   заметную долю его высоты, реальный визуальный центр СВОБОДНОЙ прогалины
   выше геометрического центра картинки. */
.profile-power-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;
  margin-top:2px}
.profile-power-wrap .wreath{width:166px;height:auto;pointer-events:none}
/* font-size задаётся ИНЛАЙНОМ через profilePowerFontSize() в JS, не тут —
   мощь растёт без потолка (поздняя игра легко уходит в миллионы), поэтому
   фиксированный размер, подобранный под "19 933", рано или поздно снова
   пробил бы границы венка тем же способом, что и раньше. Сокращение через
   fmt() (millions -> "1.23 млн") решает проблему только частично: даже
   сокращённая запись растёт в символах медленнее, чем сам венок остаётся
   тем же (152px не резиновые) — так что дополнительно ужимаем шрифт по
   длине результата, а не только сокращаем разряды. */
.profile-power-chip{position:absolute;top:37%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--data);color:var(--gilt-hi);font-weight:bold;white-space:nowrap}

.gen-portrait-wrap{position:relative}
.gen-portrait{width:44px;height:44px;object-fit:contain;display:block}

.gen-figure-wrap{width:100%;max-height:400px;display:flex;justify-content:center;
  overflow:hidden;margin-bottom:6px}
.gen-figure{max-width:100%;max-height:400px;object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}

.stars{color:var(--gilt);font-size:13px;letter-spacing:1px;margin:2px 0}
.gen-skills{display:flex;gap:8px;margin-top:9px}
.gear-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:6px}
.gear-slot{position:relative;background:radial-gradient(120% 120% at 50% 30%,rgba(52,42,29,.6),rgba(20,16,10,.7));
  border:1px solid var(--gilt-dim);border-radius:4px;padding:10px 6px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.gear-slot::before{content:"";position:absolute;inset:3px;border:1px solid rgba(194,153,60,.35);
  border-radius:2px;pointer-events:none}
.gear-slot.filled{border-color:var(--gilt-hi)}
.gear-slot.crown{padding-top:16px}
.gear-slot-icon{width:42px;height:42px;border-radius:3px;background:rgba(0,0,0,.35);
  border:1px solid rgba(194,153,60,.3);flex:0 0 auto}
.gear-slot-icon img{width:100%;height:100%;object-fit:contain;border-radius:3px}
.gear-slot.filled .gear-slot-icon{border-color:var(--pc,rgba(194,153,60,.3));box-shadow:inset 0 0 8px var(--pc,transparent)}
.gear-slot-name{font-size:9.5px;color:var(--vellum-faint);letter-spacing:.07em;text-transform:uppercase}
.gear-slot-item{font-size:10.5px;color:var(--vellum-dim);min-height:13px}
.gear-slot-item .tag{margin-left:3px}
.gear-slot .seal{margin-top:2px;font-size:10px;padding:4px 7px}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.gear-cell{aspect-ratio:1;border:2px solid var(--pc,var(--rule-soft));border-radius:5px;
  background:rgba(20,15,8,.6);box-shadow:inset 0 0 10px var(--pc,transparent);position:relative}
.gear-cell img{width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box}
.gear-cell.equipped{background:rgba(194,153,60,.18);box-shadow:inset 0 0 10px var(--pc,transparent),0 0 6px var(--pc,transparent)}
.gear-cell .cnt{position:absolute;bottom:2px;right:3px;font-family:var(--data);font-size:10px;
  color:var(--gilt-hi);text-shadow:0 1px 2px #000}
.gear-cell .eq{position:absolute;top:2px;left:3px;font-size:9px;color:var(--verdigris);
  text-shadow:0 1px 2px #000}
.gen-skill{position:relative;width:34px;height:34px;border-radius:50%;background:var(--wood-deep);
  border:1px solid var(--rule);overflow:hidden}
.gen-skill img{width:100%;height:100%;object-fit:cover;transform:scale(1.18)}
.gen-skill s{position:absolute;bottom:-2px;right:-2px;text-decoration:none;font-family:var(--data);
  font-size:8.5px;background:rgba(0,0,0,.65);color:#e6c273;padding:0 3px;border-radius:3px;line-height:1.4}

#menu-btn{position:fixed;right:14px;bottom:14px;z-index:20;width:70px;height:70px;padding:0;
  background-image:url(images/ui/icon-menu.png);background-size:175.82% 117.17%;
  background-position:47.64% 61.2%;background-repeat:no-repeat;
  border:none;border-radius:50%;color:var(--gilt-hi);overflow:hidden}
#menu-btn span{display:none;font-size:19px} /* текстовый фолбэк, если картинки нет */
/* Красная метка "тут появилось новое" — см. menuBadges/renderBadges.
   Пустая по умолчанию: показывается классом .on, число рисуется через
   data-n (без числа — просто точка, как у непросмотренного инвентаря).
   Кнопки-носители получают position:relative ниже. */
.nbadge{display:none;position:absolute;top:-1px;right:-1px;min-width:16px;height:16px;
  box-sizing:border-box;padding:0 4px;border-radius:8px;background:#b62a22;
  border:1.5px solid #1a1208;box-shadow:0 1px 4px rgba(0,0,0,.6);
  font-family:var(--data);font-size:10px;font-style:normal;line-height:13px;
  color:#ffe9c9;text-align:center;pointer-events:none;z-index:2}
.nbadge.on{display:block}
.nbadge.on::after{content:attr(data-n)}
/* На гамбургере метка крупнее и отодвинута внутрь — кнопка круглая, в самом
   углу квадрата точка висела бы в воздухе за пределами круга. */
#menu-btn{position:fixed}
#menu-btn .nbadge{top:4px;right:4px;min-width:18px;height:18px;line-height:15px;font-size:11px}

.purse{display:grid;grid-template-columns:repeat(2,auto);grid-auto-rows:auto;
  gap:3px 12px;flex:0 0 auto}
.coin{display:flex;align-items:center;gap:5px}
.coin .disc{width:16px;height:16px;border-radius:50%;flex:0 0 auto;object-fit:contain}
.coin .amt{font-family:var(--data);font-size:12px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--vellum);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7)}
.coin .rate{font-family:var(--data);font-size:9px;color:var(--vellum-faint);
  display:block;letter-spacing:.02em;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.coin .rate.neg{color:var(--garnet)}
.coin .disc{filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
/* Янтарь — донатный ресурс, нарочно НЕ в сетке .purse с остальными четырьмя:
   отдельная светящаяся плашка, как в мобильных играх выделяют премиум-валюту
   среди обычных. Сама сумма пока просто p.amber (см. renderTop) — экономика
   (добыча/склад/разграбление) ещё не подключена, это только место в шапке.
   Была ВНУТРИ #top последним элементом flex-строки без переноса (nowrap) —
   на телефоне крест+кошелёк сами по себе забивают всю ширину экрана, и
   плашка утекала за правый край, невидимая (не баг вёрстки конкретно этого
   элемента, а следствие общей нерастягиваемой шапки). Вынесена в свой
   собственный fixed-угол справа сверху — гарантированно на экране всегда,
   независимо от того, насколько разрастётся #top слева. */
/* Полоса догона мира после долгого отсутствия — см. catchUpProgress/
   advanceToAnimated. Поверх всего (z-index выше модалок), потому что пока
   она висит, играть ещё не во что: мир досчитывается. */
#catchup{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,5,.82);backdrop-filter:blur(2px)}
#catchup .cu-card{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:20px 26px;border-radius:8px;background:rgba(20,15,8,.92);
  border:1px solid var(--gilt-dim);box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:min(88vw,340px)}
#catchup b{color:var(--gilt-hi);font-size:15px;font-weight:normal}
#catchup .cu-sub{color:var(--vellum-faint);font-size:12px;text-align:center}
#catchup .cu-bar{width:100%;height:6px;border-radius:3px;overflow:hidden;
  background:rgba(0,0,0,.5);border:1px solid var(--rule-soft)}
#catchup .cu-bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--gilt-dim),var(--gilt-hi));transition:width .12s linear}
#amber-badge{position:fixed;top:0;right:0;z-index:15;
  display:flex;align-items:center;gap:6px;
  padding:3px 10px 3px 3px;border-radius:20px;
  background:radial-gradient(circle at 30% 25%,rgba(230,152,42,.28),rgba(20,15,8,.82) 72%);
  border:1px solid rgba(230,152,42,.6);
  box-shadow:0 0 9px rgba(230,152,42,.4),inset 0 0 6px rgba(255,204,130,.16)}
#amber-badge .disc{width:22px;height:22px;border-radius:50%;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.85))}
#amber-badge .amt{font-family:var(--data);font-size:13px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--gilt-hi);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.stat-ico{width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:5px}

#chron{margin-left:auto;display:flex;align-items:center;gap:14px;padding-left:14px}
#chron .stat{text-align:right;line-height:1.25}
#chron .stat b{display:block;font-family:var(--data);font-size:13px;color:var(--gilt-hi);
  font-variant-numeric:tabular-nums}
#chron .stat s{display:block;text-decoration:none;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--vellum-faint)}
#tempo{appearance:none;background:var(--wood-deep);border:1px solid var(--rule);
  color:var(--gilt);border-radius:2px;padding:5px 8px;font-family:var(--data);font-size:11px;
  cursor:pointer}

/* ─────────────── Основная область ─────────────── */
#main{flex:1;display:flex;min-height:0}

#chart{flex:1;position:relative;min-width:0;background:var(--wood-deep);overflow:hidden}
/* Виньетка свечи: край стола уходит в темноту */
#chart::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 45%,transparent 62%,rgba(8,5,2,.30) 100%);
  box-shadow:inset 0 0 46px rgba(0,0,0,.34)}

/* z-index:4, не 2: #world3d (3D-вкладка "Мир") лежит поверх с z-index:3 —
   при z-index:2 эти панели (cartouche/minimap/tools/key) были бы не просто
   некликабельны, а полностью НЕВИДИМЫ под iframe'ом, хотя #cartouche при
   этом исправно наполнялся бы содержимым изнутри 3D (см. renderCartoucheFor)
   — просто увидеть и нажать на него было бы нечем. */
.plate{position:absolute;z-index:4;background:linear-gradient(180deg,rgba(38,30,21,.94),rgba(22,17,11,.95));
  border:1px solid var(--rule);border-radius:2px;
  box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(226,196,133,.09)}

/* Раньше висела в левом нижнем углу поверх инструментов/миникарты —
   неудобно дотягиваться и легко перекрывалась. Центр экрана (относительно
   #chart — общего position:relative-предка всех .plate, см. коммент выше) —
   там же, где по тому же тапу появляется цель, так что взгляд не должен
   прыгать через весь экран, чтобы прочитать панель. */
/* Тот же пергамент, что и у почты/модалки здания (пользователь явно
   попросил: "тот фон, что используется у нас в письмах, страничках
   зданий") — переопределяем ТОЛЬКО #cartouche, не сам .plate целиком:
   .plate также рисует #key (легенда карты) и #tools (кнопки зума), их
   светлый пергамент не просили и не нужно — это разные по духу элементы
   (лёгкие оверлей-кнопки поверх карты, не "документ"). Раз фон стал
   светлым — все внутренние цвета текста (были подобраны под тёмный
   .plate) переопределены здесь же на тёмные чернила, тот же приём и те же
   цвета, что и у #bm-sheet/.mail-detail. */
#cartouche{left:50%;top:50%;transform:translate(-50%,-50%);max-width:270px;
  padding:11px 13px;font-size:13.5px;
  background:none;background-image:url(images/ui/mail-parchment.jpg);background-size:cover;
  background-position:center;border-color:rgba(90,69,48,.4);
  box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
#cartouche .hd{font-variant:small-caps;letter-spacing:.13em;font-size:14px;color:#2c2114;
  display:flex;align-items:center;gap:7px;margin-bottom:5px;padding-right:16px;font-weight:bold}
#cartouche .co{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;
  color:#5a4530;padding:1.5px 0}
#cartouche .co b{font-family:var(--data);color:#2c2114;font-weight:400}
#cartouche .hint{margin-top:7px;padding-top:6px;border-top:1px solid rgba(90,69,48,.3);
  font-size:11.5px;color:#5a4530;font-style:italic}
#cartouche .n{color:#8a6d2c !important}
#cartouche .cart-close{position:absolute;top:7px;right:8px;width:20px;height:20px;
  line-height:18px;text-align:center;font-size:16px;color:#5a4530;
  border-radius:50%;transition:color .15s,background .15s}
#cartouche .cart-close:hover{color:#2c2114;background:rgba(90,69,48,.15)}
/* .seal подобран под тёмный .plate (светлое золото на почти-прозрачном) —
   на светлом пергаменте контраст слабый, та же коррекция, что уже
   применена к похожим кнопкам в #bm-tree (тёмные чернила вместо золота). */
#cartouche .seal{border-color:#8a6d2c;color:#5a4530;background:rgba(90,69,48,.1)}
#cartouche .seal:hover:not(:disabled){background:rgba(90,69,48,.22);color:#2c2114;border-color:#6b5230}
#cartouche .seal.blood{border-color:#8a2f22;color:#8a2f22;background:rgba(138,47,34,.08)}
#cartouche .seal.blood:hover{background:rgba(138,47,34,.18);color:#6b1f16;border-color:#6b1f16}

/* bottom:92px, не 14px — #menu-btn (70×70, z-index:20) сидит в том же углу
   (right:14px;bottom:14px) и перекрывал нижние две кнопки (t-out/t-home),
   те были некликабельны ещё до 3D — этого никто не замечал, пока сама
   панель #tools была не видна из-за z-index ниже iframe'а (см. .plate). */
#tools{right:14px;bottom:92px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
#tools button{width:36px;height:34px;font-size:15px;color:var(--gilt);
  border-bottom:1px solid var(--rule-soft);transition:background .15s,color .15s}
#tools button:last-child{border-bottom:none}
#tools button:hover{background:rgba(194,153,60,.14);color:var(--gilt-hi)}

/* Отряды в поле поверх 3D-мира — раньше видны были только на вкладке
   "Город" (renderFieldArmy внутри #folio), приходилось переключаться туда
   и обратно, чтобы просто посмотреть на свой марш (репорт пользователя).
   Голые .slotcell без общей панели — тот же приём, что и у #fieldarmy в
   самом городе (см. ниже): у .slotcell уже есть свой drop-shadow под
   иконку, обёртка-плашка не нужна (пользователь явно попросил убрать фон,
   оставить только иконку). z-index:4 — тот же, что у .plate (см. коммент
   там), иначе просто не будет видно/некликабельно поверх iframe (z-index:3).
   top:190px — ниже и плашки ресурсов родителя, и плавающей coordBar
   ДВИЖКА (та сама рассчитана на top:100px + своя высота, обе панели в
   одной системе координат — #chart, где и коордBar через iframe:inset:0,
   и это меню начинаются от истинного верха экрана, см. #top:position:fixed).
   Раньше стояла заметно выше и заходила на coordBar (репорт пользователя:
   "опусти её, она заходит за другую часть интерфейса"). Высота — по
   содержимому (без bottom), max-height + скролл только на случай марш-
   слотов больше, чем разумно влезает (marchSlots до 5). */
#fieldarmy-world{position:absolute;z-index:4;right:14px;top:190px;max-height:40vh;
  display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;
  align-items:center}
#fieldarmy-world::-webkit-scrollbar{display:none}

#key{left:14px;top:66px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;
  pointer-events:none;font-size:11.5px}
#key .kl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--vellum-faint);
  margin-bottom:1px}
#key .kr{display:flex;align-items:center;gap:7px;color:var(--vellum-dim)}
#key .sh{width:11px;height:13px;flex:0 0 auto}

/* Новый 3D-мир (obyom-3d-infinite.html) — поверх старой 2D-карты внутри
   того же #chart. z-index выше .plate (2), поэтому полностью закрывает
   и канвас, и старые плашки собой; сама 2D-карта остаётся под ней
   нетронутой — так можно откатиться на неё одной строкой, если что. */
#world3d{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3;background:#0b0a09}

/* ─────────────── Переключение Город/Мир ─────────────── */
#app.view-city #chart{display:none}
#app.view-city #ledger{width:100%;flex:1;border-left:none;box-shadow:none}
/* Снова скрыты — дублировали гамбургер-меню (пользователь явно попросил
   убрать именно эту панель целиком, не подписи внутри неё). Единственный
   путь, который раньше уводил tab с "city" без клика по самим ribbons
   (openLevy "go", после отправки похода — см. script ниже), убран вместе
   с этим, так что застрять вне "Город" теперь неоткуда даже без ribbons. */
#app.view-city #ribbons{display:none}
#app.view-world #ledger{display:none}
#view-toggle{position:fixed;left:14px;bottom:14px;z-index:20;width:70px;height:70px;padding:0;
  background:transparent;border:none;border-radius:50%;color:var(--gilt-hi);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#view-toggle img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#view-toggle span{display:none} /* текстовый фолбэк, если картинки нет */

/* ─────────────── Выдвижное меню справа ─────────────── */
/* Раньше — тёмная кожаная плашка вокруг кнопок; пользователь попросил
   убрать фон целиком (только сами кнопки) и увеличить их втрое. Без
   плашки кнопки повисают прямо над картой/3D-миром — drop-shadow/
   text-shadow на иконке и подписи (та же идея, что у .slotcell) держат
   их читаемыми на любом фоне вместо самой плашки. */
#side-menu{position:fixed;bottom:90px;right:14px;z-index:19;display:none;flex-direction:column;
  align-items:flex-end;gap:0}
#side-menu.open{display:flex}
/* Видимое расстояние между иконками — это gap (выше) ПЛЮС вертикальный
   padding каждой кнопки сверху и снизу (кнопки прозрачные, своей рамки не
   видно, так что глаз читает именно суммарный зазор). Раньше уменьшали
   только gap (14px->4px) и не учли, что padding:6px даёт ещё +12px —
   реальное сокращение получалось ~38%, а не запрошенные 70%. Целевой
   зазор: (14+6+6)*0.3 ≈ 8px = 4px сверху + 4px снизу при gap:0 (выше). */
#side-menu button{position:relative;display:flex;align-items:center;gap:14px;padding:4px 6px;background:transparent;
  border:none;color:var(--vellum);font-size:33px;font-variant:small-caps;letter-spacing:.06em;
  text-align:left;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.85);border-radius:6px}
#side-menu button:hover{background:rgba(0,0,0,.35);color:var(--gilt-hi)}
#side-menu button img{width:66px;height:66px;object-fit:contain;flex:0 0 auto;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.9))}
/* Только иконки, без подписи (пользователь явно попросил) — текст
   остаётся в разметке как aria-label на самой кнопке, а не потерян для
   скринридеров, просто визуально скрыт. */
#side-menu button span{display:none}

#menu-modal{position:fixed;inset:0;z-index:25;display:none;background:rgba(8,5,2,.72);
  overflow-y:auto}
#menu-modal.open{display:block}
/* Золотые уголки поверх тёмной подложки #menu-modal — тот же ассет, что и
   в почте (.mail-corner), не нужно менять тёмную цветовую схему Войска/
   Генерала/Инвентаря/Профиля целиком ради декора: золото на тёмном фоне
   само по себе смотрится нарядно. position:fixed (не absolute), потому что
   #menu-modal сам по себе fixed и скроллится своим overflow-y — уголки
   должны оставаться приклеенными к углам ЭКРАНА, а не уезжать со скроллом
   контента. Лежат в статичной разметке #menu-modal (см. index.html), а не
   генерируются в каждой foArmy/foGen/foInv/foMail — иначе живое обновление
   #menu-modal-body раз в секунду пересоздавало бы и их без всякой пользы. */
.menu-corner{position:fixed;width:110px;height:auto;pointer-events:none;
  opacity:.8;z-index:24}
.menu-corner.tl{top:0;left:0}
.menu-corner.tr{top:0;right:0;transform:scaleX(-1)}
.menu-corner.bl{bottom:0;left:0;transform:scaleY(-1)}
.menu-corner.br{bottom:0;right:0;transform:scale(-1,-1)}
#menu-modal-body{max-width:560px;margin:0 auto;padding:60px 16px 30px}
#menu-modal-close{position:fixed;top:14px;right:14px;z-index:26;width:38px;height:38px;
  border-radius:50%;background:rgba(22,17,11,.9);border:1px solid var(--gilt-dim);
  color:var(--gilt-hi);font-size:22px;line-height:1}
/* Фаза 13 — .mp-gated (см. SP_UNLOCKED в самом начале скрипта): прячет
   ОДИНОЧНЫЙ РЕНДЕР (сама партия по-прежнему грузится и существует в
   памяти, см. комментарий у SP_UNLOCKED — просто невидима, не запускает
   рендер-цикл), но #app теперь НЕ спрятан целиком (Фаза 14, кусочек 1) —
   при .view-world (класс проставляется в start()) #app показывает ровно
   #chart: объёмная карта (#world3d) + инструменты (#tools) + подпись
   тапа (#cartouche) — та же самая связка, что уже была подключена к
   общему миру в Фазе 12, просто до сих пор не видна была за #app{display:
   none}. #ledger (одиночные вкладки Город/Войско/Генерал/Инвентарь) при
   .view-world и так спрятан своим собственным правилом (#app.view-world
   #ledger{display:none}), трогать его отдельно не пришлось. #view-toggle —
   Фаза 14, кусочек 1 всё ещё прятала его (переключать было не на что);
   кусочек 2 его открывает, см. правило ниже. #onboard — переиспользован
   под регистрацию (runMpOnboarding()).
   Одиночный claimChronicle() в этом режиме НЕ зовётся вовсе (см.
   start()) — тот же #onboard/#ob-body не должен достаться двум разным
   сценариям одновременно. #menu-btn/#menu-modal-close снова видны —
   модалку общего мира (foMultiplayer) теперь можно закрыть, под ней
   видна объёмная карта, а не пустота, как было до этого кусочка. */
/* Фаза 14, кусочек 2 — #view-toggle больше не в списке: теперь есть на что
   переключать (#folio показывает mpRenderCityMap(), см. ниже), 2D-город
   общего мира больше не "нечего показать". #side-menu по-прежнему спрятан —
   единственный вход в меню общего мира — прямой #menu-btn (toggleMenu()). */
.mp-gated #side-menu{display:none}
/* #amber-badge — янтарь как ресурс у общего мира ещё не заведён (см.
   комментарий у mpRenderTop()), показывать там нечего — остаётся спрятан.
   #top — Фаза 14, кусочек 1 прятала его тем же общим правилом, что и
   #amber-badge (renderTop() одиночки никогда не зовётся при .mp-gated,
   без этого правила там навсегда висело бы "Безымянный лорд"/0/0 — не
   пустой экран, а НЕВЕРНЫЙ). Кусочек 3 завёл mpRenderTop() — те же самые
   DOM-узлы (#purse/#crest-*), просто из mpState.player, — так что #top
   снова можно показывать. */
.mp-gated #amber-badge{display:none}
#menu-modal-close:hover{border-color:var(--gilt-hi)}

/* ─────────────── Модалка здания (пергамент) ─────────────── */
#building-modal{position:fixed;inset:0;z-index:27;display:none;background:rgba(8,5,2,.78);
  align-items:center;justify-content:center;padding:0}
#building-modal.open{display:flex}
/* Раньше фон #bm-sheet тянулся ОДНОЙ картинкой parchment.jpg с двумя
   РАЗНЫМИ процентами по осям (139.13% ширина / 107.84% высота) — грубый
   ручной подбор, чтобы декор (уголки, круглая печать), запечённый ПРЯМО В
   ТЕКСТУРУ, хоть как-то совпадал с краями карточки на одном конкретном
   экране. При любом другом соотношении сторон печать neизбежно превращалась
   в овал (репорт пользователя: "печать там как бы непропорционально").
   Теперь фон — просто ровная бесшовная текстура пергамента без декора,
   растягивать нечего (background-size:cover одинаково по обеим осям —
   искажать нечего, там нет направленных деталей). Уголки и печать — ниже,
   ОТДЕЛЬНЫЕ <img> у #building-modal (см. .bm-corner/.bm-seal), каждый в
   своём естественном соотношении сторон, никогда не деформируется. */
#bm-sheet{position:relative;width:100%;max-width:700px;max-height:100vh;overflow-y:auto;
  background-image:url(images/ui/mail-parchment.jpg);background-size:cover;background-position:center;
  padding:44px 52px 90px;color:#2c2114;box-shadow:0 20px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column}
/* Фиксированы к #building-modal (сам он position:fixed;inset:0, не
   скроллится — скроллится только #bm-sheet внутри), поэтому уголки/печать
   не уезжают вместе с длинным текстом здания, остаются на месте кадра —
   тот же приём, что и у .menu-corner для #menu-modal. */
.bm-corner{position:fixed;width:110px;height:auto;pointer-events:none;opacity:.85;z-index:28}
.bm-corner.tl{top:0;left:0}
.bm-corner.tr{top:0;right:0;transform:scaleX(-1)}
.bm-corner.bl{bottom:0;left:0;transform:scaleY(-1)}
.bm-corner.br{bottom:0;right:0;transform:scale(-1,-1)}
.bm-seal{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:64px;height:auto;
  pointer-events:none;opacity:.75;z-index:28;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#bm-close{position:absolute;top:12px;right:14px;width:30px;height:30px;
  background:transparent url(images/ui/icon-close.png) center/contain no-repeat;
  border:none;color:#5a4530;font-size:22px;line-height:1}
#bm-close span{display:none}
#bm-title{font-size:clamp(17px,5.6vw,22px);line-height:1.25;font-variant:small-caps;letter-spacing:.08em;text-align:center;
  margin-bottom:4px;color:#2c2114}
#bm-sub{text-align:center;font-size:13px;color:#5a4530;margin-bottom:16px}
#bm-art{display:block;max-width:64%;margin:0 auto 16px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#bm-desc{font-size:13px;line-height:1.5;color:#3a2c1c;text-align:center;margin-bottom:18px;
  font-style:italic}
#bm-stats{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px}
#bm-stats td{padding:5px 0;border-bottom:1px solid rgba(90,69,48,.25);color:#3a2c1c}
#bm-stats td:last-child{text-align:right;font-family:var(--data)}
#bm-opens{font-size:12.5px;text-align:center;color:#8a6d2c;margin-bottom:14px;font-weight:bold}
#ac-tabs{display:flex;gap:6px;margin-bottom:10px}
#ac-tabs button{flex:1;padding:7px 4px;font-size:12px;text-align:center;
  background:rgba(90,69,48,.12);border:1px solid rgba(90,69,48,.3);border-radius:4px;
  color:#5a4530}
#ac-tabs button.on{background:rgba(138,109,44,.28);border-color:#8a6d2c;color:#2c2114;font-weight:bold}
#bm-reqs{margin-bottom:18px}
#bm-reqs .req-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
#bm-reqs .req-row img{width:20px;height:20px;object-fit:contain;flex:0 0 auto}
#bm-reqs .req-row .req-name{flex:1;color:#3a2c1c;min-width:0}
#bm-reqs .req-row .req-amt{font-family:var(--data);font-size:13px;white-space:nowrap;flex:0 0 auto}
#bm-reqs .req-row .req-amt.short{color:#8a2f22}
#bm-qty{margin-bottom:16px}
#bm-qty .cap{display:flex;justify-content:space-between;font-size:12px;color:#5a4530;margin-bottom:6px}
#bm-qty .cap b{font-family:var(--data);color:#3a2c1c;font-weight:400}
#bm-qty .row{display:flex;align-items:center;gap:10px}
#bm-qty input[type=range]{flex:1;accent-color:#6b5230;height:20px}
#bm-qty input[type=number]{width:78px;flex:0 0 auto;background:rgba(44,33,20,.08);
  border:1px solid #8a6d2c;border-radius:3px;padding:7px 6px;font-family:var(--data);
  font-size:14px;text-align:right;color:#2c2114}
#bm-time{text-align:center;font-size:12.5px;color:#5a4530;margin-bottom:16px}
#uc-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;
  scrollbar-width:none}
#uc-track::-webkit-scrollbar{display:none}
.uc-card{flex:0 0 100%;scroll-snap-align:start;padding:0 4px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;overflow:hidden}
.uc-card.locked{opacity:.55}
.uc-img{max-width:85%;max-height:280px;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));margin-bottom:8px}
.uc-name{font-size:16px;color:#2c2114;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.uc-name .tag{font-size:11px;background:rgba(90,69,48,.15);border-radius:3px;padding:2px 6px;
  color:#5a4530}
.uc-lock{font-size:12px;color:#8a2f22;text-align:center;margin-bottom:8px}
.uc-have{font-size:12.5px;color:#3a2c1c;margin:6px 0}
.uc-go{margin-top:10px;width:100%;padding:12px 7px;background:linear-gradient(180deg,#c2993c,#8a6d2c);
  border:1px solid #6b5220;border-radius:5px;color:#2c2114;font-weight:bold;font-size:14.5px;
  letter-spacing:.03em;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.uc-go:disabled{opacity:.5;background:rgba(90,69,48,.3);color:#5a4530;box-shadow:none}
#uc-nav{display:flex;justify-content:space-between;gap:8px;margin:10px 0 16px}
#uc-nav button{flex:1;padding:8px 4px;font-size:12.5px;text-align:center;
  background:rgba(90,69,48,.12);border:1px solid rgba(90,69,48,.3);border-radius:4px;
  color:#5a4530}
.rtree{margin-bottom:6px}
.rtree-row{position:relative;display:flex;flex-direction:column;align-items:center}
.rtree-link{width:2px;height:16px;background:rgba(138,109,44,.5)}
.rtree-nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:6px}
.rtree-node{position:relative;width:46px;height:46px;border-radius:50%;cursor:pointer;
  background:rgba(90,69,48,.12);border:2px solid rgba(90,69,48,.35);
  display:flex;align-items:center;justify-content:center}
/* Круглая обрезка — на самой картинке, а не на .rtree-node: бейдж уровня
   ниже (.rtree-node-lv) нарочно вылезает за край кружка своим нижним правым
   углом (bottom:-2px;right:-2px — тот же "чип, торчащий из-под иконки" приём,
   что и у amber-badge), а overflow:hidden на общем родителе резал бы и его
   тоже — с реального скрина ("2/" без второй цифры) видно было именно так. */
.rtree-node img{width:100%;height:100%;object-fit:cover;transform:scale(1.22);border-radius:50%}
.rtree-node.open{border-color:#8a6d2c}
.rtree-node.started{border-color:#3f6b3f;box-shadow:0 0 6px rgba(63,107,63,.5)}
.rtree-node.maxed{border-color:#2c2114;background:rgba(138,109,44,.35)}
.rtree-node.locked{opacity:.4;filter:grayscale(1)}
.rtree-node-lv{position:absolute;bottom:-2px;right:-2px;font-family:var(--data);font-size:8.5px;
  background:rgba(0,0,0,.65);color:#e6c273;padding:0 3px;border-radius:3px;line-height:1.4}
#bm-tree{margin-bottom:16px}
#bm-tree .rgroup{font-variant:small-caps;letter-spacing:.12em;font-size:12.5px;color:#6b5230;
  margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid rgba(90,69,48,.35)}
#bm-tree .rgroup:first-child{margin-top:0}
#bm-tree .rnode{padding:8px 0;border-bottom:1px solid rgba(90,69,48,.18)}
#bm-tree .rnode:last-child{border-bottom:none}
#bm-tree .rnode-hd img.unit-thumb{width:26px;height:26px;border-radius:50%;object-fit:cover;
  flex:0 0 auto;border:1px solid rgba(90,69,48,.4)}
#bm-tree .rnode-hd{display:flex;justify-content:space-between;gap:8px;align-items:center;
  font-size:13px;color:#2c2114}
#bm-tree .rnode-lv{font-family:var(--data);font-size:11px;color:#5a4530;white-space:nowrap}
#bm-tree .rnode-lv.maxed{color:#3f6b3f}
#bm-tree .rnode-eff{font-size:11.5px;color:#5a4530;margin-top:2px}
#bm-tree .rnode-eff em{font-style:normal;color:#2c2114}
#bm-tree .rnode-cost{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;
  font-family:var(--data);font-size:11px;color:#5a4530}
#bm-tree .rnode-cost .short{color:#8a2f22}
#bm-tree .rnode-go{margin-top:6px;width:100%;padding:7px;background:rgba(58,44,28,.5);
  border:1px solid rgba(107,82,48,.7);border-radius:3px;color:#2c2114;font-variant:small-caps;
  letter-spacing:.08em;font-size:12.5px}
#bm-tree .rnode-go:disabled{opacity:.5}
.mat-card{display:flex;align-items:center;gap:10px;padding:8px 0 6px;
  border-bottom:1px solid rgba(90,69,48,.18)}
.mat-icon-wrap{width:40px;height:40px;border-radius:5px;background:rgba(90,69,48,.1);
  border:1px solid rgba(90,69,48,.3);flex:0 0 auto;overflow:hidden}
.mat-icon{width:100%;height:100%;object-fit:cover}
.mat-info{flex:1;min-width:0}
.mat-name{font-size:13.5px;color:#2c2114;margin-bottom:4px}
.mat-pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 3px;border-radius:9px;background:var(--pc);color:#fff;font-size:10px;
  font-family:var(--data);box-shadow:0 0 5px var(--pc)}
.pip.mini{width:9px;height:9px;min-width:9px;padding:0;border-radius:50%;box-shadow:0 0 3px var(--pc)}
.pip[data-act]{cursor:pointer;min-width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:bold;
  border:2px solid transparent}
.pip[data-act].on{border-color:#2c2114;box-shadow:0 0 9px var(--pc)}
#bm-tree .mat-go{width:auto;flex:0 0 auto;padding:8px 14px;margin-top:0}
.mat-upgrades{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#bm-tree .mat-upgrades button{flex:1;min-width:66px;padding:6px 4px;margin-top:0;
  display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px}
#bm-btn{display:block;width:100%;margin-top:auto;padding:11px;
  background:linear-gradient(180deg,rgba(58,44,28,.55),rgba(36,26,16,.68));
  border:1px solid rgba(107,82,48,.85);border-radius:3px;color:#e2c485;font-variant:small-caps;
  letter-spacing:.1em;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#bm-btn:disabled{opacity:.5}

/* ─────────────── Почта ─────────────── */
/* .mail-wrap отменяет отступы/ширину #menu-modal-body (60px 16px 30px,
   max-width:560px) — почта, в отличие от вертикальных списков foArmy/
   foGen/foInv, сама себе "лист пергамента" во весь экран с собственной
   рамкой, ей мешает чужой отступ модалки. Светлый пергамент + тёмные
   чернила — та же пара цветов, что и у #bm-sheet (карточка здания) выше,
   а не тёмный vellum-на-дереве, как у остального #menu-modal: письмо
   читают на бумаге, не на грифельной доске. */
.mail-wrap{margin:-60px -16px -30px;height:100dvh;display:flex;flex-direction:column}
.mail-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
  background-image:url(images/ui/mail-parchment.jpg);background-size:cover;background-position:center;
  color:#2c2114;box-shadow:inset 0 0 60px rgba(58,44,28,.25)}
.mail-corner{position:absolute;width:72px;height:auto;pointer-events:none;opacity:.85;z-index:1}
.mail-corner.tl{top:6px;left:6px}
.mail-corner.tr{top:6px;right:6px;transform:scaleX(-1)}
.mail-corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}
.mail-corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
.mail-tabs{flex:0 0 auto;display:flex;gap:2px;padding:52px 10px 0;position:relative;z-index:2}
.mail-tabs button{flex:1;padding:8px 2px;font-size:11.5px;font-variant:small-caps;letter-spacing:.06em;
  color:#5a4530;background:rgba(90,69,48,.1);border:1px solid rgba(90,69,48,.3);border-radius:5px 5px 0 0;
  border-bottom:none;position:relative}
.mail-tabs button.on{background:rgba(236,226,202,.9);color:#2c2114;font-weight:bold}
.mail-tabs button .n{position:absolute;top:-6px;right:2px;min-width:15px;height:15px;padding:0 3px;
  border-radius:8px;background:#8a2f22;color:#fce9c9;font-size:9.5px;line-height:15px;font-family:var(--data)}
.mail-divider{display:block;width:100%;height:auto;position:relative;z-index:2;opacity:.85}
.mail-list{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:2;
  background:rgba(236,226,202,.55)}
.mail-row{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid rgba(90,69,48,.22)}
.mail-row .ico{width:30px;height:30px;border-radius:50%;flex:0 0 auto;object-fit:contain;
  background:rgba(90,69,48,.12);border:1px solid rgba(90,69,48,.35);padding:5px}
.mail-row .ico.win{filter:sepia(1) saturate(2) hue-rotate(60deg) brightness(.9)}
.mail-row .ico.lose{filter:sepia(1) saturate(3) hue-rotate(-40deg) brightness(.85)}
.mail-row .tx{flex:1;min-width:0}
.mail-row .tt{font-size:13.5px;color:#2c2114;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-row:not(.read) .tt{font-weight:bold}
.mail-row .sb{font-size:11.5px;color:#5a4530;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-row .tm{font-size:10.5px;color:#8a6d2c;flex:0 0 auto;white-space:nowrap}
.mail-row:not(.read)::before{content:"";width:7px;height:7px;border-radius:50%;background:#8a2f22;flex:0 0 auto}
.mail-row.read::before{content:"";width:7px;flex:0 0 auto}
.mail-empty{padding:40px 20px;text-align:center;color:#5a4530;font-size:13px;font-style:italic;
  position:relative;z-index:2}
.mail-detail{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:2;padding:16px 16px 8px;
  background:rgba(236,226,202,.55)}
.mail-back{display:flex;align-items:center;gap:6px;color:#5a4530;font-size:12.5px;
  font-variant:small-caps;letter-spacing:.08em;margin-bottom:12px}
.mail-note{font-size:13.5px;line-height:1.6;color:#2c2114;padding:6px 2px}
.mail-vs{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.mail-side{flex:1;min-width:0;text-align:center}
/* object-fit:cover+border-radius:50%+CSS-border тут раньше кроило и
   обрамляло портрет заново — а файлы avatar-*.png УЖЕ сами по себе круглые
   медальоны с собственным золотым ободом, отрисованным художником прямо в
   PNG (проверено — открыл файлы; так же их показывают #crest .avatar и
   .gen-portrait, оба object-fit:contain, без CSS-ободка). cover впихивал
   квадрат 52×52 в изображение, обрезая где попало относительно уже готового
   обода — с реального скрина ("аватарка съезжает") видно было именно двойное
   кольцо и смещённый портрет. contain показывает картинку целиком, как и
   везде в игре — тень через drop-shadow (следует силуэту), а не box-shadow
   (тот был бы прямоугольным вокруг круглой картинки). */
.mail-side img.av{width:52px;height:52px;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.mail-side .nm{font-size:13px;color:#2c2114;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-side .co{font-size:10.5px;color:#8a6d2c;font-family:var(--data)}
.mail-side .pw{font-size:11px;color:#5a4530;margin-top:2px}
.mail-side .gen{font-size:11px;color:#5a4530;margin-top:3px}
.mail-side .gen-tal{font-size:9.5px;color:#8a6d2c;margin-top:1px;line-height:1.4}
.mail-vmid{flex:0 0 auto;font-size:20px;color:#8a2f22;margin-top:14px}
.mail-stamp{text-align:center;font-variant:small-caps;letter-spacing:.15em;font-size:22px;font-weight:bold;
  margin:2px 0 16px;padding:4px;border:3px solid;border-radius:4px;transform:rotate(-3deg)}
.mail-stamp.win{color:#3f6b3f;border-color:#3f6b3f}
.mail-stamp.lose{color:#8a2f22;border-color:#8a2f22}
/* ---- Заведение летописи (первый запуск): раса -> полководец -> имя ----
   Раньше карточка была маленьким плавающим прямоугольником по центру
   тёмного радиального фона — на телефоне это оставляло чёрные поля сверху
   и снизу со сквозящей сквозь них игрой (репорт: "пергамент не на весь
   экран"). Теперь ровно тот же приём, что и у #building-modal: тёмная
   подложка на весь вьюпорт, а сама карточка растягивается на всю высоту
   (align-items:stretch) и всю ширину до разумного предела для читаемости —
   пергамент всегда покрывает экран целиком, а не плавает островком.
   Печать (.ob-seal) и уголки — ОТДЕЛЬНЫЕ картинки, зафиксированные к
   вьюпорту, а не запечённые в текстуру пергамента: та же история, что и в
   комментарии у #bm-sheet — единая картинка с печатью внутри при cover
   на разных пропорциях либо обрезает печать текстом сверху, либо
   растягивает её в овал. Отдельная печать всегда остаётся на своём месте
   и никогда не перекрывает контент, потому что зона под ней (padding-bottom
   у #ob-body) заведомо выше её нижнего края. */
#onboard{position:fixed;inset:0;z-index:70;display:none;align-items:stretch;justify-content:center;
  padding:0;background:rgba(8,5,2,.86)}
#onboard.open{display:flex}
#onboard .ob-card{position:relative;width:100%;max-width:720px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background-image:url(images/ui/mail-parchment.jpg);background-size:cover;background-position:center;
  box-shadow:0 0 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column}
.ob-seal{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:52px;height:auto;
  pointer-events:none;opacity:.8;z-index:71;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#ob-body{width:100%;max-width:480px;box-sizing:border-box;margin:auto auto;
  padding:40px 22px 74px;align-self:center}
#ob-hd{text-align:center;margin-bottom:6px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:#8a6d2c}
#ob-title{text-align:center;font-size:22px;line-height:1.25;color:#2c2114;margin-bottom:8px}
#ob-lede{text-align:center;font-size:13px;line-height:1.6;color:#5a4530;margin-bottom:22px}
/* Гербы рас — сами по себе кнопки: никакой плашки-подложки под ними,
   выбор читается по свечению герба в цвете расы и подписи под ним.
   У исходных файлов гербов РАЗНАЯ ширина холста при одинаковой высоте
   (Human.png шире Dwarf.png и т.д.) — при height:auto это давало гербам
   разную итоговую высоту в сетке, и ряд выглядел "не ровно" (репорт
   пользователя). aspect-ratio задаёт ОДИНАКОВУЮ рамку для всех гербов —
   object-fit:contain вписывает герб внутрь неё, какими бы ни были родные
   пропорции картинки, поэтому подписи под гербами всегда на одной линии. */
.ob-races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
@media (max-width:420px){ .ob-races{grid-template-columns:repeat(2,1fr);gap:10px 6px} }
.ob-race{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;
  border:none;background:none;cursor:pointer}
.ob-race img{width:100%;max-width:88px;aspect-ratio:2/3;height:auto;object-fit:contain;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.45));transition:filter .15s,transform .15s}
.ob-race b{font-weight:normal;font-size:12.5px;color:#5a4530;letter-spacing:.02em;transition:color .15s}
/* Выбранный герб подсвечивается ЦВЕТОМ СВОЕЙ РАСЫ — он уже задан в RACES[x].color
   и приходит сюда как --rc, отдельную палитру заводить не пришлось. */
.ob-race.on img{transform:translateY(-3px);
  filter:drop-shadow(0 0 12px var(--rc)) drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.ob-race.on b{color:var(--rc);font-weight:bold}
/* Раскрытая карточка выбранного: сильная сторона и честный минус. */
.ob-detail{border-left:3px solid var(--rc,#8a6d2c);background:rgba(138,109,44,.10);
  border-radius:0 4px 4px 0;padding:11px 13px;margin-bottom:18px}
.ob-detail .nm{font-size:14.5px;color:#2c2114;margin-bottom:4px}
.ob-detail .ds{font-size:12.5px;line-height:1.55;color:#3a2c1c;margin-bottom:6px}
.ob-detail .mn{font-size:11.5px;line-height:1.55;color:#8a3c2c}
.ob-detail .mn b{font-weight:normal;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
/* Полководцы — крупный портрет и текст в строку, разделены тонкой линией
   пергамента, а не отдельными плашками: выбранный просто теплеет фоном. */
.ob-gens{display:flex;flex-direction:column;margin-bottom:18px}
.ob-gen{display:flex;gap:14px;align-items:center;padding:12px 8px;cursor:pointer;
  border-bottom:1px solid rgba(90,69,48,.22);border-radius:3px;background:none;
  transition:background .15s}
.ob-gen:last-child{border-bottom:none}
.ob-gen.on{background:rgba(138,109,44,.14)}
.ob-gen img{width:78px;height:78px;object-fit:contain;flex:0 0 auto;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));transition:filter .15s}
.ob-gen.on img{filter:drop-shadow(0 0 10px var(--rc)) drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.ob-gen .nm{font-size:14.5px;color:#2c2114}
.ob-gen .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--rc,#8a6d2c);
  font-weight:bold;margin:2px 0 5px}
.ob-gen .bn{font-size:12px;line-height:1.55;color:#3a2c1c;font-style:italic}
/* .gen-stat — сухая справка отдельной строкой под живым описанием
   генерала (.bn в летописи, .note в профиле), не слитая с ним в одно
   предложение: моноширинный "приборный" шрифт (тот же приём, что и у
   .gear-cell .cnt/#crest-power) читается глазом как факт, а не как
   проза, и не спорит с флейвором за один и тот же тон. Общий класс —
   используется и на экране летописи (светлый пергамент), и в профиле
   (тёмная деревянная тема): в профиле .gen-stat вложен ВНУТРЬ .note и
   честно наследует её цвет (var(--vellum-dim), светлый — верно для
   тёмной темы). В летописи же .gen-stat — СОСЕДНИЙ div с .bn, а не
   вложенный в него, поэтому наследования от .bn не происходит вовсе:
   он падал до цвета body (--vellum, светлый крем) — на светлом пергаменте
   это читалось почти как невидимый текст (репорт: "уходят в фон"). Ниже —
   явный тёмный цвет именно для контекста .ob-gen. */
.gen-stat{display:block;font-family:var(--data);font-size:10.5px;line-height:1.5;
  opacity:.72;margin-top:4px}
.ob-gen .gen-stat{color:#6b5230;opacity:.85}
/* Полоска предпросмотра (только из профиля, см. runOnboarding(demo)). Нарочно
   не в стиле пергамента: она НЕ часть экрана, а рамка вокруг него, и путать
   её с содержимым не надо. */
.ob-demo{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;
  margin:0 0 20px;padding:7px 34px 7px 12px;border-radius:4px;
  background:rgba(90,69,48,.16);border:1px dashed rgba(90,69,48,.45);
  font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#6b5230;text-align:center}
.ob-x{position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:24px;height:24px;padding:0;line-height:1;cursor:pointer;
  background:none;border:none;font-size:20px;color:#6b5230}
.ob-x:active{color:#2c2114}
/* Итог выбора на последнем шаге — герб и портрет рядом, без обрамляющей
   плашки: просто тонкие линии сверху и снизу, как разделитель в летописи. */
.ob-sum{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 auto 20px;
  padding:16px 4px;width:100%;
  border-top:1px solid rgba(90,69,48,.28);border-bottom:1px solid rgba(90,69,48,.28)}
.ob-sum img:first-child{width:64px;height:auto;object-fit:contain;flex:0 0 auto;
  filter:drop-shadow(0 0 10px var(--rc)) drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.ob-sum img:nth-of-type(2){width:82px;height:82px;object-fit:contain;flex:0 0 auto;
  filter:drop-shadow(0 0 10px var(--rc)) drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.ob-sum .nm{font-size:14.5px;color:#2c2114}
.ob-sum .gn{font-size:12px;color:#6b5230;margin-top:2px}
#ob-name{width:100%;box-sizing:border-box;padding:12px 12px;margin-bottom:8px;
  font-family:inherit;font-size:15px;color:#2c2114;text-align:center;
  background:rgba(255,250,236,.75);border:1px solid rgba(90,69,48,.4);border-radius:4px}
#ob-name:focus{outline:none;border-color:#8a6d2c;box-shadow:0 0 0 2px rgba(138,109,44,.2)}
.ob-note{font-size:11px;line-height:1.5;color:#6b5230;text-align:center;margin-bottom:18px}
.ob-go{display:block;width:100%;padding:14px;border:none;border-radius:5px;cursor:pointer;
  font-family:inherit;font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#f2e2bd;background:linear-gradient(180deg,#7a5e26,#4e3b16);
  box-shadow:0 3px 0 #35270f,0 6px 14px rgba(0,0,0,.4)}
.ob-go:disabled{opacity:.4;cursor:default;box-shadow:0 3px 0 #35270f}
.ob-go:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #35270f}
.ob-back{display:block;margin:10px auto 0;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:12px;color:#6b5230;text-decoration:underline}
/* Донесение разведки — разделами по ступеням (см. scoutReportHtml).
   Недоступное показано тем же рядом, но приглушённым: видно, что сведения
   существуют и до какого уровня растить Разведку, чтобы их достать. */
.sc-block{margin:10px 0;border-top:1px solid rgba(90,69,48,.28);padding-top:8px}
.sc-hd{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a6d2c;margin-bottom:6px}
.sc-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:3px 0;border-bottom:1px solid rgba(90,69,48,.14);font-size:12.5px;color:#3a2c1c}
.sc-row:last-child{border-bottom:none}
.sc-row>b{font-weight:normal;font-family:var(--data);text-align:right;color:#2c2114}
.sc-row.locked{opacity:.5}
.sc-row.locked>b{font-style:italic;font-family:inherit;font-size:11.5px;color:#6b5230}
.sc-tiers{display:block;font-style:normal;font-size:10.5px;color:#6b5230;margin-top:1px}
.sc-note{font-size:11px;line-height:1.5;color:#6b5230;margin-top:8px}
/* Хроника боя — лента переломов под таблицей потерь (см. battleLogHtml).
   Своё и чужое различаются цветом полоски слева, а не текстом: читается
   с одного взгляда, кто на каком шаге получил своё. */
.mail-chron{margin-top:14px;border-top:1px solid rgba(90,69,48,.28);padding-top:10px}
.mail-chron-hd{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:#8a6d2c;margin-bottom:7px}
.chron-row{display:flex;align-items:flex-start;gap:7px;padding:4px 8px;margin-bottom:3px;
  border-left:3px solid rgba(90,69,48,.3);background:rgba(138,109,44,.06);border-radius:0 3px 3px 0}
.chron-row.good{border-left-color:#4a7c3f;background:rgba(74,124,63,.10)}
.chron-row.bad{border-left-color:#a33c2c;background:rgba(163,60,44,.09)}
.chron-ico{flex:0 0 auto;font-style:normal;font-size:12px;line-height:1.5;color:#8a6d2c;width:14px;text-align:center}
.chron-tx{font-size:12px;line-height:1.5;color:#3a2c1c}
/* Итог и бегство — крупнее и заметнее: это финал рассказа, а не рядовой шаг. */
.chron-row.end{margin-top:6px;padding:6px 8px}
.chron-row.end .chron-tx,.chron-row.rout .chron-tx{font-size:12.5px;color:#2c2114}
.chron-row.round{background:transparent;border-left-color:rgba(90,69,48,.18)}
.chron-row.round .chron-tx{color:#5a4530}
/* Погода над таблицей потерь. Письмо лежит на пергаменте — палитра тут
   тёмным по светлому, а не как в остальном интерфейсе. */
.mail-weather{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding:7px 10px;
  border-left:3px solid #8a6d2c;background:rgba(138,109,44,.10);border-radius:0 4px 4px 0}
.mail-weather b{font-size:12.5px;font-weight:normal;color:#6b5320;letter-spacing:.02em}
.mail-weather span{font-size:11.5px;line-height:1.45;color:#5a4530}
.mail-stats{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
.mail-stats th{text-align:left;font-weight:normal;color:#8a6d2c;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;padding-bottom:5px}
.mail-stats th:last-child{text-align:right}
.mail-stats td{padding:4px 0;border-top:1px solid rgba(90,69,48,.18);color:#3a2c1c}
.mail-stats td:last-child{text-align:right;font-family:var(--data)}
.mail-bar{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;position:relative;z-index:2;
  background:rgba(58,44,28,.12);border-top:1px solid rgba(90,69,48,.35)}
.mail-bar button{flex:1;padding:8px 4px;font-size:11px;font-variant:small-caps;letter-spacing:.05em;
  color:#5a4530;background:rgba(90,69,48,.1);border:1px solid rgba(90,69,48,.3);border-radius:4px}
.mail-bar button:disabled{opacity:.4}
.mail-bar button.danger{color:#8a2f22}

/* ─────────────── Правая колонна ─────────────── */
#ledger{width:400px;flex:0 0 400px;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--leather-lit),var(--leather) 22%,#1b1510);
  border-left:1px solid var(--rule);box-shadow:-8px 0 26px rgba(0,0,0,.55)}

#ribbons{flex:0 0 auto;display:flex;background:rgba(0,0,0,.28);
  border-bottom:1px solid var(--rule);padding:0 6px}
#ribbons button{flex:1;padding:11px 2px 9px;font-size:12px;letter-spacing:.11em;
  font-variant:small-caps;color:var(--vellum-faint);position:relative;transition:color .18s}
#ribbons button::after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:2px;
  background:var(--gilt);transform:scaleX(0);transition:transform .22s ease}
#ribbons button:hover{color:var(--vellum-dim)}
#ribbons button.on{color:var(--gilt-hi)}
#ribbons button.on::after{transform:scaleX(1)}

/* Раньше был display:flex;align-items:center;justify-content:center — это
   годится только для одного центрированного элемента (карта города), но
   ломает списки (армия/генерал/инвентарь): несколько rubric/entry-блоков
   выстраивались в ОДНУ горизонтальную строку по центру и вылезали за края
   экрана вместо обычного вертикального списка со скроллом (репорт
   пользователя — сплошная "каша" на весь экран после отправки войск).
   flex-direction:column — блоки снова идут друг под другом, растянутые на
   всю ширину (align-items по умолчанию stretch), с прокруткой вместо
   overflow:hidden. Карта города (foCity) остаётся единственным ребёнком в
   этом случае — её собственные width/height:100% работают точно так же. */
#folio{flex:1;overflow-y:auto;padding:0;position:relative;
  display:flex;flex-direction:column}
.folio-pad{padding:14px 16px}

/* Заголовок раздела — с виньеточной линейкой, как в старой книге */
.rubric{display:flex;align-items:center;gap:11px;margin:26px 0 11px;
  font-variant:small-caps;letter-spacing:.17em;font-size:13.5px;color:var(--gilt)}
.rubric:first-child{margin-top:0}
.rubric::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--gilt-dim),transparent)}
.rubric .n{font-family:var(--data);font-size:10px;color:var(--vellum-faint);letter-spacing:.05em}

#inv-tabs{display:flex;gap:6px;margin-bottom:4px}
#inv-tabs button{flex:1;padding:8px 3px;font-size:11.5px;text-align:center;
  background:rgba(0,0,0,.25);border:1px solid var(--rule-soft);border-radius:4px;
  color:var(--vellum-dim)}
#inv-tabs button.on{background:rgba(194,153,60,.18);border-color:var(--gilt-dim);
  color:var(--gilt-hi);font-weight:bold}

/* Запись реестра */
.entry{background:linear-gradient(180deg,rgba(52,42,29,.5),rgba(30,24,16,.5));
  border:1px solid var(--rule-soft);border-left:2px solid var(--rule);
  padding:10px 12px;margin-bottom:7px;position:relative;transition:border-color .18s,background .18s}
.entry:hover{border-left-color:var(--gilt-dim);background:linear-gradient(180deg,rgba(60,49,33,.55),rgba(34,27,18,.55))}
.entry.hot{border-left-color:var(--gilt)}
.entry.war{border-left-color:var(--garnet)}
.entry.calm{border-left-color:var(--verdigris)}
.entry .line{display:flex;align-items:center;gap:11px}
.entry .fill{flex:1;min-width:0}
.entry .title{font-size:14.5px;color:var(--vellum);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.entry .note{font-size:12px;color:var(--vellum-dim);margin-top:2px;line-height:1.4}
.entry .note em{font-style:normal;color:var(--vellum)}

/* Карта города — неподвижный фон на весь экран, без полей: картинка тянется
   не по пропорции, зато координаты построек (в %) остаются точно на месте,
   потому что и картинка, и метки построек масштабируются одинаково */
#citymap-wrap{position:relative;flex:0 0 auto;width:100%;height:100%;
  overflow:hidden;touch-action:none}
#citymap-wrap img.base{display:block;width:100%;height:100%;
  pointer-events:none;-webkit-user-drag:none}
.cbuild{position:absolute;box-sizing:border-box;cursor:pointer;touch-action:none;
  -webkit-tap-highlight-color:transparent;user-select:none}
.cbuild .shape{position:absolute;inset:0;border:2px solid transparent;
  background:transparent;box-sizing:border-box;transition:background .15s,border-color .15s}
.cbuild:hover .shape{border-color:var(--gilt-hi);background:rgba(194,153,60,.18)}
.cbuild.built .shape{border-color:transparent;background:transparent}
.cbuild.built:hover .shape{border-color:var(--gilt-hi);background:rgba(194,153,60,.18)}
.cbuild.locked .shape{border-color:transparent;cursor:not-allowed}
.cbuild img.bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  object-position:center;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.cbuild .lvl{position:absolute;bottom:2px;right:4px;font-family:var(--data);font-size:10px;
  color:var(--gilt-hi);background:rgba(0,0,0,.55);padding:0 3px;line-height:1.4;z-index:2}

/* Фаза 14, кусочек 4 — выделенная ячейка города общего мира (mpCitySel) и
   всплывающая снизу карты панель действия (mpCellPanelHtml). Тот же
   .entry, что и в списках foMultiplayer/#folio (см. выше) — просто
   поверх картинки карты нужен свой тёмный фон-подложка под текст
   (у самой карты фона нет, снизу лежит просто фотография города). */
.cbuild.sel .shape{border-color:var(--gilt-hi);background:rgba(194,153,60,.28)}
.mp-cell-panel{position:absolute;left:0;right:0;bottom:0;z-index:3;
  max-height:60%;overflow-y:auto;margin:0;border-left:none;border-right:none;border-bottom:none;
  background:linear-gradient(180deg,rgba(15,11,7,0),rgba(15,11,7,.94) 30%,rgba(15,11,7,.96))}
.mp-cell-panel .line{align-items:flex-start;flex-wrap:wrap}
.mp-cell-panel .seal{margin-top:8px}

/* Бригады (слева) и отряды в поле (справа) — плавающие столбцы поверх фона города */
#brigades,#fieldarmy{position:absolute;top:108px;bottom:14px;display:flex;flex-direction:column;
  gap:8px;z-index:5;overflow-y:auto;scrollbar-width:none}
#brigades::-webkit-scrollbar,#fieldarmy::-webkit-scrollbar{display:none}
#brigades{left:14px}
#fieldarmy{right:14px}
.slotcell{flex:0 0 auto;width:56px;height:56px;position:relative;cursor:pointer}
.slotcell.empty{opacity:.75;cursor:default}
.slotcell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.85))}
.slotcell .timer{position:absolute;top:-3px;left:0;right:0;text-align:center;font-family:var(--data);
  font-size:8.5px;color:var(--gilt-hi);text-shadow:0 1px 3px rgba(0,0,0,1),0 0 4px rgba(0,0,0,1)}
.slotcell .progress{position:absolute;left:8%;right:8%;bottom:0;margin:0;height:3px;
  background:rgba(0,0,0,.5);border:none;border-radius:2px}
/* Общий .progress i целится в высокую (22px) полоску (top/bottom:2px внутрь
   рамки) — в этой 3px-плашке от такого отступа заливка схлопывалась в
   нулевую/отрицательную высоту и не была видна вовсе, сколько ни ставь
   width. Тут отступов внутрь не нужно — полоска и так тонкая. */
.slotcell .progress i{top:0;bottom:0;left:0;border-radius:2px}
#citymap-toggle{display:flex;gap:8px;margin-bottom:10px}
#citymap-toggle button{flex:1;padding:7px;font-size:12px;font-variant:small-caps;letter-spacing:.08em;
  background:rgba(0,0,0,.25);border:1px solid var(--rule-soft);color:var(--vellum-dim)}
#citymap-toggle button.on{color:var(--gilt-hi);border-color:var(--gilt-dim)}

/* Кольцо уровня */
.ring{flex:0 0 auto;width:34px;height:34px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--data);font-size:12px;color:var(--gilt-hi);font-weight:400;
  position:relative;z-index:1}

.tag{font-family:var(--data);font-size:9.5px;letter-spacing:.09em;color:var(--vellum-faint);
  border:1px solid var(--rule);padding:1px 5px;white-space:nowrap;text-transform:uppercase}
.tag.gilt{color:var(--gilt);border-color:var(--gilt-dim)}
.tag.war{color:var(--garnet);border-color:#5c2027}

/* Цены — эмалевые точки и цифры моноширинно */
.price{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-family:var(--data);font-size:11.5px}
.price span{display:flex;align-items:center;gap:5px;color:var(--vellum-dim)}
.price span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.price span.short{color:var(--garnet)}

/* Кнопка-печать */
.seal{flex:0 0 auto;border:1px solid var(--gilt-dim);color:var(--gilt);padding:6px 13px;
  font-size:12.5px;font-variant:small-caps;letter-spacing:.09em;white-space:nowrap;
  background:linear-gradient(180deg,rgba(194,153,60,.11),rgba(194,153,60,.03));
  transition:background .18s,color .18s,border-color .18s;position:relative;overflow:hidden}
.seal:hover:not(:disabled){background:linear-gradient(180deg,rgba(194,153,60,.26),rgba(194,153,60,.1));
  color:var(--gilt-hi);border-color:var(--gilt)}
.seal:active:not(:disabled){transform:translateY(1px)}
.seal:disabled{border-color:var(--rule-soft);color:var(--vellum-faint);cursor:default;background:none}
.seal.blood{border-color:#5c2027;color:#c0525b;background:linear-gradient(180deg,rgba(150,50,59,.14),transparent)}
.seal.blood:hover{background:rgba(150,50,59,.26);color:#dd7079;border-color:var(--garnet)}
.seal.wide{width:100%;text-align:center;padding:9px}

/* Ход работ */
/* Раньше — плоский тёмный прямоугольник с золотым градиентом внутри.
   Теперь рамка — border-image по одному ассету (симметричные заострённые
   концы, средняя часть растягивается/повторяется на любую ширину без
   искажений формы уголков — то, ради чего и просили именно симметричный
   исходник, не с разными концами). border-image-slice взят из реальных
   пикселей источника (900×114, уголок кончается на x≈83, верх/низ рамки
   ≈8px) — fill заодно красит и середину исходником (тёмный желобок),
   отдельный background под ним больше не нужен. */
/* box-sizing:border-box действует глобально (см. сброс в начале файла) —
   height здесь означает ПОЛНУЮ высоту коробки, включая border, а не высоту
   "начинки" за вычетом рамки (проверил через getComputedStyle: при
   height:4px и border-width 8px сверху/снизу контент схлопывался в 0).
   border-image-slice тоже был неверный при первой попытке: 8px — это
   расстояние всего лишь до начала фигуры (сглаженный край), а не граница
   золото/жёлобок — картинка получалась сплюснутой, вся резьба уезжала в
   растянутую середину. Промерил по цвету вдоль вертикали в прямом участке
   исходника (не по силуэту): жёлобок (тёмные RGB) начинается на y≈49,
   заканчивается на y≈142 из 192px общей высоты обрезанного оригинала —
   рамка сверху/снизу занимает ~26% высоты каждая, не 4%. */
.progress{margin-top:8px;height:22px;position:relative;
  border-style:solid;border-width:6px 16px;
  border-image-source:url(images/ui/progress-frame.png);
  border-image-slice:29 83 fill;
  border-image-repeat:stretch}
.progress i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gilt-dim),var(--gilt-hi));
  box-shadow:0 0 7px rgba(226,194,115,.4)}

/* Табличка-реестр */
.roll{width:100%;border-collapse:collapse;font-size:13px}
.roll td{padding:4px 0;border-bottom:1px dotted var(--rule-soft);color:var(--vellum-dim)}
.roll tr:last-child td{border-bottom:none}
.roll td:last-child{text-align:right;font-family:var(--data);font-size:12.5px;color:var(--vellum);
  font-variant-numeric:tabular-nums}
.roll td.good:last-child{color:var(--verdigris)}
.roll td.bad:last-child{color:var(--garnet)}

/* Строки войск — аватар с бейджами тира/класса вместо текстового дублирования */
.troop-row{display:flex;align-items:center;gap:11px;padding:6px 0;border-bottom:1px dotted var(--rule-soft)}
.troop-row:last-child{border-bottom:none}
.troop-avatar{position:relative;width:48px;height:48px;flex:0 0 auto;margin-bottom:9px}
.troop-avatar .portrait{width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:1px solid var(--rule);background:var(--wood-deep)}
.troop-avatar .tier-badge{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:24px;height:24px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
.troop-avatar .class-badge{position:absolute;top:-4px;left:-4px;width:20px;height:20px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.85));pointer-events:none}
.troop-name{flex:1;font-size:13.5px;color:var(--vellum);min-width:0}
.troop-count{font-family:var(--data);font-size:13px;color:var(--vellum-dim);font-variant-numeric:tabular-nums}

/* Хроника */
.chron-e{position:relative;padding:0 0 15px 20px;margin-left:4px;
  border-left:1px solid var(--rule-soft)}
.chron-e:last-child{border-left-color:transparent;padding-bottom:2px}
.chron-e::before{content:"";position:absolute;left:-4.5px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--wood);border:1.5px solid var(--rule)}
.chron-e.war::before{border-color:var(--garnet);background:#2a1315}
.chron-e.good::before{border-color:var(--verdigris);background:#152420}
.chron-e .when{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;
  color:var(--vellum-faint);text-transform:uppercase}
.chron-e .what{font-size:13px;color:var(--vellum-dim);margin-top:1px}

.hollow{text-align:center;padding:34px 18px;color:var(--vellum-faint);font-style:italic;font-size:13px}
.hollow .big{display:block;font-size:26px;color:var(--rule);margin-bottom:8px;font-style:normal}

/* Свиток отправки войск (openLevy) — "взять полководца в этот поход":
   отдельная строка-чекбокс, не влита в .levy (та — только про юниты). */
.gen-take{display:flex;align-items:center;gap:8px;padding:8px 0 10px;
  border-bottom:1px dotted var(--rule-soft);margin-bottom:4px;
  font-size:13px;color:var(--vellum-dim);cursor:pointer}
.gen-take.disabled{opacity:.5;cursor:not-allowed}
.gen-take input{flex:0 0 auto;width:15px;height:15px}
.gen-take em{font-style:normal;font-size:11px;color:var(--vellum-faint);margin-left:auto;text-align:right}

/* Гербовый щит в списках */
.shield{width:13px;height:16px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}

/* ─────────────── Свиток (модальное окно) ─────────────── */
#veil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:18px;background:radial-gradient(70% 60% at 50% 40%,rgba(12,8,4,.72),rgba(6,4,2,.92))}
#veil.open{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#scroll{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--leather-lit),var(--leather) 30%,#1a140e);
  border:1px solid var(--rule);border-top:2px solid var(--gilt-dim);
  box-shadow:0 22px 70px rgba(0,0,0,.8);padding:20px 20px 18px;animation:rise .26s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#scroll h2{margin:0 0 4px;font-size:20px;font-variant:small-caps;letter-spacing:.1em;color:var(--gilt-hi)}
#scroll .lede{color:var(--vellum-dim);font-size:13px;margin-bottom:15px;
  padding-bottom:12px;border-bottom:1px solid var(--rule-soft)}
#scroll::-webkit-scrollbar{width:9px}
#scroll::-webkit-scrollbar-thumb{background:var(--rule)}

/* Ползунки набора войск */
.levy{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dotted var(--rule-soft)}
.levy .nm{flex:1;min-width:0}
.levy .nm .t{font-size:13.5px;display:flex;align-items:baseline;gap:7px}
.levy .nm .s{font-size:11px;color:var(--vellum-faint);font-family:var(--data)}
.levy input[type=range]{width:118px;flex:0 0 auto;accent-color:var(--gilt);height:18px}
.levy input[type=number]{width:74px;flex:0 0 auto;background:rgba(0,0,0,.4);color:var(--vellum);
  border:1px solid var(--rule);padding:4px 6px;font-family:var(--data);font-size:12.5px;text-align:right}
#nick-input,#mp-nick{background:rgba(0,0,0,.4);color:var(--vellum);border:1px solid var(--rule);
  padding:7px 9px;font-family:var(--serif);font-size:13.5px;border-radius:3px}
#mp-nick{display:block;width:100%;margin:10px 0;box-sizing:border-box}
.chips{display:flex;gap:6px;margin:12px 0}
.chips .seal{flex:1;text-align:center;padding:5px 0;font-size:11.5px}
/* Общий мир (бета) — панель во вкладке "mp", тёмный фон menu-modal, поэтому
   НЕ переиспользует .ob-race/.ob-races из экрана летописи (та палитра
   рассчитана на светлый пергамент #onboard и была бы нечитаемой тут). */
.mp-races{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.mp-race{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--rule);
  border-radius:20px;background:rgba(0,0,0,.3);color:var(--vellum-dim);cursor:pointer;
  font-size:12.5px;font-family:var(--serif)}
.mp-race img{filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.mp-race.on{border-color:var(--rc,var(--gilt));color:var(--vellum);background:rgba(0,0,0,.5)}
#menu-modal-body input[type=number]{width:74px;flex:0 0 auto;background:rgba(0,0,0,.4);color:var(--vellum);
  border:1px solid var(--rule);padding:4px 6px;font-family:var(--data);font-size:12.5px;text-align:right}

.verdict{margin-top:13px;padding:11px 13px;border:1px solid var(--rule);
  background:rgba(0,0,0,.28);display:flex;align-items:center;gap:11px}
.verdict .vi{font-size:20px;line-height:1}
.verdict .vt{font-size:14px;font-variant:small-caps;letter-spacing:.08em}
.verdict .vs{font-size:11.5px;color:var(--vellum-faint);font-family:var(--data)}

/* Оповещение */
#herald{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  background:linear-gradient(180deg,var(--leather-lit),var(--wood));
  border:1px solid var(--rule);border-left:3px solid var(--gilt);padding:11px 17px;
  font-size:13.5px;box-shadow:0 10px 34px rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:min(440px,86vw)}
#herald.up{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:900px){
  #main{flex-direction:column}
  #ledger{width:auto;flex:1 1 54%;border-left:none;border-top:1px solid var(--rule);
    box-shadow:0 -8px 26px rgba(0,0,0,.55)}
  #chart{flex:1 1 46%}
  #key{display:none}
  #top{top:14px;left:0}
  #amber-badge{top:0;right:0}
  .coin .rate{display:none}
  #chron{gap:9px;padding-left:8px}
  #chron .stat s{display:none}
  #chron .stat b{font-size:12px}
  #cartouche{max-width:186px;padding:8px 10px;font-size:12.5px}
  #bm-reqs .req-row{display:grid;grid-template-columns:20px 1fr;
    grid-template-areas:"icon name" "icon amt";column-gap:8px;row-gap:1px;font-size:13px}
  #bm-reqs .req-row img{grid-area:icon}
  #bm-reqs .req-row .req-name{grid-area:name}
  #bm-reqs .req-row .req-amt{grid-area:amt;text-align:right;font-size:12px;
    white-space:normal;overflow-wrap:break-word}
}
</style>
</head>
