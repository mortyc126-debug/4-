const EV = {
  build(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p)return;
    const q=p.queues[d.slot]; if(!q)return;
    if(q.plot!=null) p.b[q.b][q.plot]=q.lv; else p.b[q.b]=q.lv;
    p.queues[d.slot]=null;
    if(!p.isBot) logg(buildingName(q.b,p)+(q.plot!=null?" (участок "+(q.plot+1)+")":"")+" достроена до "+q.lv+" уровня.","good");
  },
  train(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p)return;
    const T=p.train[d.type]; if(!T)return;
    p.troops[T.type][T.tier]+=T.n; p.train[d.type]=null;
    if(!p.isBot) logg((T.retrain?"Переобучено: ":"Обучено: ")+unitName(T.type,T.tier,p.race)+" ×"+T.n.toLocaleString("ru"),"good");
  },
  research(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p||!p.rsch)return;
    const R=p.rsch, n=findNode(R.id); p.tech[R.id]=R.lv; p.rsch=null;
    if(n && !p.isBot) logg("Исследовано: "+n.name+" ур. "+R.lv+" из "+n.max+".","good");
  },
  craft(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p||!p.craft)return;
    const c=p.craft;
    if(c.kind==="material"){
      p.materials[c.mat][0]=(p.materials[c.mat][0]||0)+c.n;
      markInvNew(p);
      if(!p.isBot) logg("Добыто: "+MATERIALS[c.mat].name+" ×"+c.n+" ("+RARITY_NAMES[0].toLowerCase()+" качества).","good");
    } else {
      const name=GEAR_NAMES[c.slot][c.order][c.rarity-1];
      if(RNG()<CRAFT_CHANCE[c.rarity-1]){
        p.inventory[c.slot][c.order][c.rarity-1]=(p.inventory[c.slot][c.order][c.rarity-1]||0)+1;
        markInvNew(p);
        if(!p.isBot) logg("Скован: "+name+" (на складе).","good");
      } else if(!p.isBot) logg("Ковка не удалась: "+name+" испорчена в горне, материал и время утрачены.","war");
    }
    p.craft=null;
  },
  warn(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p)return;
    logg(buildingName("garrison",p)+" заметил вражеский марш — подход через "+fmtDur(d.eta)+".","war");
    herald("Тревога! Враг замечен на подходе к вашим землям.");
  },
  heal(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p||!p.heal)return;
    const H=p.heal, n=Math.min(H.n, p.wounded[H.type][H.tier]||0);
    p.wounded[H.type][H.tier]-=n; p.troops[H.type][H.tier]+=n;
    p.heal=null;
    if(!p.isBot) logg(unitName(H.type,H.tier,p.race)+" вылечено: ×"+n.toLocaleString("ru")+".","good");
  },
  arrive(d){ arriveMarch(W.marches.find(m=>m.id===d.mid)) },
  // Лазутчик дошёл: снимаем показания и сразу уводим его — обратной дороги ему
  // не рисуем, он один и налегке, возвращать домой нечего.
  scouted(d){
    const m=W.marches.find(x=>x.id===d.mid); if(!m) return;
    W.marches=W.marches.filter(x=>x.id!==m.id);
    const p=W.players.find(q=>q.id===m.pid); if(!p) return;
    const cell=W.map[key(m.tx,m.ty)];
    const q=cell&&cell.t==="city" ? W.players.find(z=>z.id===cell.pid) : null;
    if(!q){ if(!p.isBot) logg("Лазутчик не нашёл города на месте — возвращается ни с чем.","war"); return }
    syncRes(q); syncWall(q);
    if(p.isBot) return;
    pushMail({cat:"report",kind:"scout",
      oppNick:q.nick||"Безымянный лорд", oppRace:q.race,
      oppCoords:{x:q.x,y:q.y}, oppAvatar:playerAvatarSrc(q),
      hall:q.b.hall, oppPower:power(q),
      shielded: W.t<q.shieldUntil,
      intel:scoutSnapshot(p,q)});
    logg("Лазутчик вернулся с донесением о городе "+(q.nick||q.name)+".","good");
  },
  // Разведка отряда в поле (см. sendScoutMarch) — застать можно только пока
  // тот стоит на месте (gather/siege): за время дороги лазутчика цель вполне
  // могла закончить сбор и уйти, или её отозвал хозяин. Ничего не поделать —
  // марш куда подвижнее города, эта неопределённость даже больше, чем у
  // городской разведки, и это честно (RoK такой же).
  scoutedMarch(d){
    const m=W.marches.find(x=>x.id===d.mid); if(!m) return;
    W.marches=W.marches.filter(x=>x.id!==m.id);
    const p=W.players.find(q=>q.id===m.pid); if(!p) return;
    const target=W.marches.find(x=>x.id===m.targetMarchId);
    if(!target || (target.state!=="gather"&&target.state!=="siege")){
      if(!p.isBot) logg("Лазутчик не застал отряд на месте — тот уже снялся.","war");
      return;
    }
    const owner=W.players.find(q=>q.id===target.pid);
    if(!owner) return;
    if(p.isBot) return;
    const cell=W.map[key(m.tx,m.ty)];
    pushMail({cat:"report",kind:"scoutmarch",
      oppNick:owner.nick||"Безымянный лорд", oppRace:owner.race,
      oppAvatar:playerAvatarSrc(owner),
      coords:{x:m.tx,y:m.ty},
      marchState:target.state,
      res: (target.state==="gather"&&cell&&cell.t==="node") ? cell.res : null,
      intel:scoutMarchSnapshot(p,target)});
    logg("Лазутчик вернулся с донесением об отряде "+(owner.nick||owner.name)+".","good");
  },
  // Снос узла (если он опустел) — теперь тут, а не в момент прибытия
  // отряда (см. комментарий у arriveMarch), плюс перестраховка на случай,
  // если cell вдруг уже пропал по другой причине к этому моменту.
  gathered(d){
    const m=W.marches.find(m=>m.id===d.mid); if(!m) return;
    const cell=W.map[key(m.tx,m.ty)];
    const p=W.players.find(q=>q.id===m.pid);
    if(p && !p.isBot){
      // Янтарь везётся отдельным полем (см. EV.home) — отчёт о сборе у него
      // такой же, просто источник числа другой.
      if(m.carryAmber>0)
        pushMail({cat:"report",kind:"gather",res:"amber",amount:m.carryAmber,coords:{x:m.tx,y:m.ty}});
      else if(m.carry){
        const rr=Object.keys(m.carry).find(k=>m.carry[k]>0);
        if(rr) pushMail({cat:"report",kind:"gather",res:rr,amount:m.carry[rr],coords:{x:m.tx,y:m.ty}});
      }
    }
    if(cell && cell.t==="node" && cell.amount<=0){
      // Не сносим сразу — см. CFG.NODE_GONE_GRACE: пусть повисит пустым ещё
      // немного, а физическое удаление и отсчёт до нового появления — уже в
      // EV.nodegone ниже.
      cell.busy=null;
      schedule(CFG.NODE_GONE_GRACE,"nodegone",{x:m.tx,y:m.ty});
    }
    recallMarch(m);
  },
  home(d){
    const m=W.marches.find(m=>m.id===d.mid); if(!m)return;
    const p=W.players.find(q=>q.id===m.pid);
    // Генерал возвращается вместе с отрядом — независимо от того, как поход
    // закончился (дошёл и вернулся сам, был отозван, или это выжившие/пустое
    // войско после проигранного боя: EV.home — ЕДИНСТВЕННОЕ событие, которым
    // рано или поздно заканчивается ЛЮБОЙ march, см. recallMarch). Проверка
    // на p.gen.away===m.id, а не просто m.hasGen — если игрок каким-то
    // образом успел заново отправить генерала (гонка/старый сейв), не отбирать
    // его у НОВОГО похода из-за возврата старого.
    if(m.hasGen && p && p.gen && p.gen.away===m.id) p.gen.away=null;
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++)p.troops[t][i]+=m.units[t][i]});
    if(m.carry){ gain(p,m.carry);
      if(!p.isBot){
        const s=RES.filter(r=>m.carry[r]>0).map(r=>RES_NAME[r]+" "+Math.round(m.carry[r]).toLocaleString("ru")).join(", ");
        if(s) logg("Отряд вернулся с добычей: "+s,"good");
      }
    }
    // Янтарь везётся отдельным полем, а не внутри m.carry: он не входит в RES
    // и потому не проходит ни через gain(), ни через склад, ни через защиту
    // при набеге. Тащить его в общую четвёрку значило бы протянуть новый
    // ресурс через всю экономику — цены построек, вместимость, разграбление —
    // ради того, что пока нигде, кроме счётчика в шапке, не участвует.
    if(m.carryAmber>0){
      p.amber=(p.amber||0)+m.carryAmber;
      if(!p.isBot) logg("Отряд вернулся с янтарём: "+Math.round(m.carryAmber).toLocaleString("ru")+".","good");
    }
    W.marches=W.marches.filter(x=>x.id!==m.id);
  },
  respawn(d){
    if(W.map[key(d.x,d.y)]) return;
    // новый лагерь появляется рядом с прежней позицией разгромленного (в
    // её чанке/соседях) — той же findFreeCellInChunk, что и при генерации
    // мира и разведке новых чанков: без неё респаун за час-другой игры
    // тихо свёл бы на нет и зазор, и запрет на воду, и пропуски по чанкам.
    const cx=Math.floor(d.x/STRUCT_CHUNK), cy=Math.floor(d.y/STRUCT_CHUNK);
    const spot=findFreeCellInChunk(cx,cy,STRUCT_SALT_CAMP); if(!spot) return;
    const {x,y}=spot;
    const lv=campRawAt(x,y);
    mapSet(x,y,{t:lv>15?"fort":"camp",x,y,lv,power:banditPower(lv),busy:null});
  },
  // Физический снос опустевшей жилы — отложен от момента опустошения на
  // CFG.NODE_GONE_GRACE (см. EV.gathered). Перепроверяем cell на месте: за
  // эти пару минут туда мог, например, прилететь новый узел другой природы
  // (крайне маловероятно, но мир общий и детерминированность не гарантирует
  // отсутствие гонок) — сносим только если это всё ещё та самая пустая жила.
  nodegone(d){
    const cell=W.map[key(d.x,d.y)];
    if(!cell || cell.t!=="node" || cell.amount>0) return;
    mapDelete(d.x,d.y);
    schedule(CFG.NODE_RESPAWN,"nodeback",{x:d.x,y:d.y});
  },
  nodeback(d){
    if(W.map[key(d.x,d.y)]) return;
    const cx=Math.floor(d.x/STRUCT_CHUNK), cy=Math.floor(d.y/STRUCT_CHUNK);
    const spot=findFreeCellInChunk(cx,cy,STRUCT_SALT_NODE); if(!spot) return;
    const {x,y}=spot;
    const lv=nodeLevelAt(x,y);
    const amt=Math.round(6000*Math.pow(2.6,lv-1));
    mapSet(x,y,{t:"node",x,y,res:pick(RES),lv,amount:amt,max:amt,busy:null});
  },
  think(d){
    const p=W.players.find(q=>q.id===d.pid); if(!p||!p.isBot)return;
    botThink(p);
    schedule(CFG.BOT_THINK*(0.7+RNG()*0.6),"think",{pid:p.id});
  },
  alarm(d){   // разовая реакция на замеченный марш, без создания новой цепочки
    const p=W.players.find(q=>q.id===d.pid); if(p&&p.isBot) botThink(p);
  },
};

function arriveMarch(m){
  if(!m) return;
  const p=W.players.find(q=>q.id===m.pid);
  const cell=W.map[key(m.tx,m.ty)];

  if(!cell){ recallMarch(m); return; }

  if(cell.t==="node" && m.mode==="gather"){
    const B=bonuses(p);
    // GATHER_BASE_RATE — настоящие цифры RoK на 1 ур. ратуши (пользователь
    // прислал точные значения). Масштабирование с уровнем ратуши — та же
    // кривая (60+hall*22), что и раньше, только теперь нормированная на
    // hall=1 (60+22=82), чтобы на самом старте партии совпасть с реальными
    // числами ровно, а не расти от произвольной базы.
    const isAmber = cell.res==="amber";
    let rate=GATHER_BASE_RATE[cell.res]*(60+p.b.hall*22)/82*(1+B.gather);
    // Янтарь не еда и не камень — общие бонусы на пары ресурсов его не
    // касаются, у него своя ветка академии (eco_amber0/1 -> B.gatherAmber),
    // которая до сих пор считалась, но применять её было не к чему.
    rate*= isAmber ? 1+(B.gatherAmber||0)
         : (cell.res==="food"||cell.res==="wood") ? 1+(B.gatherFW||0) : 1+(B.gatherSG||0);
    let load=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) load+=m.units[t][i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(p.race,t,"load")});
    load=Math.round(load*(1+B.load));
    const take=Math.min(load, cell.amount);
    const secs=take/rate*3600;
    m.state="gather"; m.t0=W.t; m.t1=W.t+secs;
    cell.amount-=take; cell.busy=p.id;
    if(isAmber){ m.carry=null; m.carryAmber=take; }
    else { m.carry={}; m.carry[cell.res]=take; m.carryAmber=0; }
    // Опустошение (mapDelete) откладываем до события "gathered" (см. EV.gathered
    // ниже) — раньше точка пропадала с карты/из 3D СРАЗУ по прибытии отряда,
    // хотя тот только начал собирать (репорт пользователя: "точки исчезают,
    // как только армия туда заходит", хотя должны быть видны до самого конца
    // сбора). cell.amount уменьшаем уже сейчас (бронируем добычу за этим
    // марш-отрядом, как и раньше — чтобы второй марш на ту же точку не мог
    // рассчитывать на уже занятые ресурсы), просто СНОС узла с карты теперь
    // происходит не раньше, чем отряд реально закончит собирать.
    schedule(secs,"gathered",{mid:m.id});
    return;
  }

  if(cell.t==="camp"||cell.t==="fort"){
    const B=bonuses(p);
    const A=makeForce(m.units,p,{name:atkName(p),mode:"hospital",withGen:!!m.hasGen});
    const bandUnits=banditArmy(cell.lv);
    const D=makeForce(bandUnits,null,{bandit:true,name:"Разбойники ур. "+cell.lv});
    D.B={atk:0,def:0,hp:0,matk:0,mdef:0,archer:0,raise:0};
    A.B.atk += B.bandit;
    const r=resolveBattle(A,D,{startA:countUnits(m.units)});
    const sp=splitLosses(p,r.lossA,"hospital");   // полевая стычка — потери идут в госпиталь, не насмерть
    // Легкораненые возвращаются в САМ ПОХОД (A.units), а не сразу в p.troops —
    // отряд ещё физически в поле и топает домой (см. m.units=A.units ниже).
    addUnitsInto(A.units, sp.slightUnits);
    if(r.win==="A"){
      const i=clamp(cell.lv,1,CFG.MAX_LEVEL), xp=BANDIT_XP[i-1];
      addXp(p,xp);
      const drops=bookDrop(cell.lv*100);
      let bookTxt="";
      for(const v in drops){ p.tomes[v]=(p.tomes[v]||0)+drops[v]; bookTxt+=", "+TOME_NAME[v]+" ×"+drops[v]; }
      if(Object.keys(drops).length) markInvNew(p);   // книги опыта — тоже пополнение инвентаря
      const loot={}; const lootBase=Math.round(1800*Math.pow(1.28,cell.lv-1));
      RES.forEach(rr=>loot[rr]=Math.round(lootBase*(rr==="gold"?.25:rr==="stone"?.6:1)));
      m.carry=loot;
      mapDelete(m.tx,m.ty);
      schedule(CFG.RESPAWN_CAMP,"respawn",{x:m.tx,y:m.ty});
      if(!p.isBot){
        const wx=(r.weather&&r.weather.id!=="clear")?" ("+r.weather.name.toLowerCase()+")":"";
        logg("Разбитый лагерь ур. "+cell.lv+wx+". Опыт +"+xp+bookTxt+", убито "+sp.dead+
          ", ранено "+sp.hurt+".","war");
        // "О варварах" — только обычные лагеря; форты идут под штурмы/осады,
        // которые в этом раунде правок отложены пользователем на потом.
        if(cell.t==="camp") pushMail({cat:"report",kind:"barbarian",lv:cell.lv,coords:{x:m.tx,y:m.ty},
          xp, dead:sp.dead, hurt:sp.hurt, loot, tomesTxt:bookTxt.replace(/^, /,""),
          weather:(r.weather&&r.weather.id!=="clear")?{name:r.weather.name,desc:r.weather.desc}:null,
          log:(r.log||[]).filter(e=>e.kind!=="weather"), attacker:true});
      }
    } else {
      if(!p.isBot) logg("Отряд разбит лагерем ур. "+cell.lv+". Убито "+sp.dead+", ранено "+sp.hurt+".","war");
    }
    m.units=A.units; recallMarch(m); return;
  }

  if(cell.t==="city"){
    const def=W.players.find(q=>q.id===cell.pid);
    if(!def || def.id===p.id){ recallMarch(m); return }
    if(W.t < def.shieldUntil){
      if(!p.isBot) logg("Город под щитом мира — атака невозможна.","war");
      recallMarch(m); return;
    }
    battleCity(p,def,m);
    return;
  }
  recallMarch(m);
}

// Книги опыта: выпадают с разбойников (сверх опыта за уровень) и тратятся на ручную прокачку
// генерала. Суммарная ценность книг с одной победы = уровень_лагеря*100 (проверено на примерах
// игрока: 17 ур. -> 1700 = 1x1000+1x500+2x100; 25 ур. -> 2500 = 2x1000+1x500), разбивается жадно
// от крупного номинала к мелкому.
const TOME_VALUES=[20000,10000,5000,1000,500,100];
const TOME_NAME={100:"Простая книга",500:"Хорошая книга",1000:"Отличная книга",5000:"Золотая книга",10000:"Редкая книга",20000:"Древняя книга"};
const TOME_ICON={100:"tome_green_100",500:"tome_blue_500",1000:"tome_purple_1000",5000:"tome_gold_5000",10000:"tome_orange_10000",20000:"tome_ancient_20000"};
function bookDrop(total){
  const drops={};
  TOME_VALUES.forEach(v=>{ while(total>=v){ drops[v]=(drops[v]||0)+1; total-=v; } });
  return drops;
}
// Точная табличка разбойников (ур.1-25): численность отряда и базовый опыт за победу.
const BANDIT_TROOPS=[20000,23000,26000,29000,32000,35000,38000,42000,46000,50000,55000,60000,66000,73000,80000,88000,96000,105000,115000,125000,135000,145000,157000,170000,185000];
const BANDIT_XP=[100,120,140,160,180,200,220,240,260,300,330,360,390,420,450,480,510,540,570,600,640,680,720,760,800];
const banditTier = lv => lv<=5?1 : lv<=12?2 : lv<=20?3 : 4;
function banditArmy(lv){
  const u=emptyUnits(), i=clamp(lv,1,CFG.MAX_LEVEL);
  const tier=banditTier(i), n=BANDIT_TROOPS[i-1];
  u.inf[tier]=Math.round(n*.45); u.arc[tier]=Math.round(n*.3);
  u.cav[tier]=Math.round(n*.25);
  return u;
}
function addXp(p,xp){
  p.gen.xp+=xp;
  while(p.gen.xp>=genXpNeed(p.gen.lv) && p.gen.lv<Math.min(60,epochOf(p.b.hall)*12)){
    p.gen.xp-=genXpNeed(p.gen.lv); p.gen.lv++; p.gen.pts++;
    if(!p.isBot){
      logg("Генерал достиг "+p.gen.lv+" уровня. Очко таланта доступно.","good");
      pushMail({cat:"personal",kind:"note",title:"Генерал повышен",
        body:"Ваш генерал достиг "+p.gen.lv+" уровня. Доступно новое очко таланта."});
    }
  }
  if(p.isBot) autoTalents(p);
}
function autoTalents(p){
  const aggr=(p.ai&&p.ai.aggr)||0.5;
  const weight=id=>{
    if(id==="gt_a1"||id==="gt_a2"||id==="gt_a3") return 10;              // личные статы — генерал теперь боец, это всегда ценно
    if(["w1","w2","w3","gt_a4","gt_a5","gt_a6"].includes(id)) return 6+8*aggr;      // статы войск
    if(["gt_c1","gt_c2","gt_c3","gt_c4","gt_c5","d1","d2","d3","d4","d5"].includes(id)) return 6+8*(1-aggr); // город/хозяйство
    return 4;                                                            // марш/груз/мародёрство/милосердие
  };
  while(p.gen.pts>0){
    const cands=[];
    for(const bk in TALENTS) for(const n of TALENTS[bk].nodes) if((p.gen.tal[n.id]||0)<(n.max||5)) cands.push(n.id);
    for(const bk in GENERAL_TREE) for(const n of GENERAL_TREE[bk].nodes) if((p.gen.tal[n.id]||0)<n.max) cands.push(n.id);
    if(!cands.length) break;
    cands.sort((a,b)=>weight(b)-weight(a));
    const id=cands[0];
    p.gen.tal[id]=(p.gen.tal[id]||0)+1; p.gen.pts--;
  }
}

/* ---- Почта: боевые отчёты ---- */
function pushMail(entry){
  entry.id=W.mailNextId++;
  entry.t=Date.now();
  entry.read=false;
  entry.fav=false;
  W.mail.unshift(entry);
  if(W.mail.length>300) W.mail.length=300;   // не даём расти бесконечно
}
/* ---- Красные метки "тут появилось новое" ---------------------------------
   Одна и та же метка висит и на самом разделе (почта/генерал/инвентарь), и на
   гамбургере — так игрок видит, что где-то есть непросмотренное, даже когда
   меню закрыто. Считается из состояния игрока, а не хранится флагом: сколько
   непрочитанных писем, есть ли нераспределённые очки таланта. Единственное
   исключение — инвентарь: "предмет добавился" из самих данных не выводится
   (материалы и снаряжение просто числа), поэтому там честный флаг invNew,
   который ставится в момент пополнения и гаснет при открытии раздела. */
function markInvNew(p){ if(p && !p.isBot) p.invNew=true; }
function menuBadges(){
  // Фаза 13 — при .mp-gated (см. SP_UNLOCKED) openMenuModal("mp") зовётся
  // ДО того, как одиночная W вообще успевает создаться (нарочно — иначе
  // регистрация в общем мире ждала бы одиночную загрузку) — честный ноль
  // вместо падения на W.mail: одиночных уведомлений действительно нет,
  // пока самой одиночной партии в этот момент ещё не существует.
  if(!W) return { mail:0, gen:0, inv:0, army:0 };
  const p=me();
  return {
    mail: W.mail.filter(m=>!m.read).length,
    gen:  (p.gen&&p.gen.pts)||0,
    inv:  p.invNew?1:0,
    army: 0,
  };
}
function genInfo(p,present){
  // present — реально ли полководец участвовал в ЭТОЙ силе (см. makeForce.
  // withGen/f.gen). Раньше проверялось только "выбран ли генерал вообще" —
  // отчёт о бое показывал бы его даже когда он остался дома или уехал с
  // ДРУГИМ походом, из-за чего и была жалоба пользователя (генерал как бы
  // участвовал сразу везде).
  if(!present || !(p.gen&&p.gen.id!=null)) return null;
  // stars — та же формула, что и в foGen() (1 звезда ~10 уровней, всего 6).
  // talents — ветка, что реально была активна В МОМЕНТ боя (тот же разбор,
  // что и в разведке, см. talentBranchSpent) — RoK показывает в отчёте
  // именно билд командира на секунду столкновения, не текущий "как сейчас".
  return {name:GENERALS[p.race][p.gen.id].name, lv:p.gen.lv,
    stars:Math.min(6,1+Math.floor(p.gen.lv/10)),
    talents:talentBranchSpent(p)};
}
// Слепок разведданных на момент разведки (та же градация по эпохе разведки,
// что и в живой панели cartouche) — снимок, а не ссылка на живые войска q,
// потому что у противника они продолжат меняться уже после того, как отчёт
// лёг в почту.
// Ступень разведки — уровень технологии "Маскировка" (mil_scout2), а НЕ
// уровень здания Разведки (p.b.scout). Раньше было наоборот (se=epochOf
// уровня здания) — но по пользовательской подсказке о реальном RoK, за
// подробность донесений отвечает именно академическая технология
// Camouflage, а здание Скаутстанции влияет на скорость/число/радиус
// разведчиков — на СОДЕРЖАНИЕ отчёта оно не влияет вовсе. У "Маскировки"
// в реальной игре 10 уровней; наш узел mil_scout2 (max:5) — половина
// сетки, поэтому каждая наша ступень открывает СРАЗУ ДВЕ настоящих
// ступени Camouflage подряд, не теряя ни одного пункта настоящей лестницы,
// просто с более крупным шагом:
//   0        — ничего сверх шапки письма (имя/ратуша/мощь и так видны
//              всегда — см. scouted()/renderCartouche, они открыты в RoK
//              любому правителю без разведки, это тир 1 реальной лестницы)
//   1 (2-3)  — прикидка числа войск (диапазоном) + точные запасы склада
//   2 (4-5)  — стена: уровень и текущая прочность + уровень полководца
//              (сам ЛИЧНОСТЬ генерала не тайна — портрет уже в шапке
//              письма при любой ступени, см. комментарий ниже)
//   3 (6-7)  — точный уровень Академии + точная раскладка по родам войск
//   4 (8-9)  — уровень гарнизонной башни (в реальном RoK тут второй,
//              заместительский, командир — но у нас на генерала ровно
//              один слот, второго попросту нет, заменить нечем) + точная
//              раскладка по тирам
//   5 (10)   — полный шпионаж: куда вложены очки таланта (по веткам) и
//              снаряжение полководца, раненые в лазарете
function scoutSnapshot(p,q){
  const se=p.tech.mil_scout2||0, total=countUnits(q.troops);
  const snap={se,total};
  if(se>=1){
    snap.res={}; RES.forEach(rr=>snap.res[rr]=q.res[rr]);
  }
  if(se>=2){
    snap.wall=q.b.wall; snap.wallHp=Math.round(q.wallHp||0); snap.wallMax=maxWallHp(q.b.wall);
    snap.genLv=(q.gen&&q.gen.id!=null)?q.gen.lv:null;
  }
  if(se>=3){
    snap.academy=q.b.academy;
    snap.byType=TKEYS.map(t=>({t,n:Object.values(q.troops[t]).reduce((a,b)=>a+b,0)})).filter(x=>x.n>0);
  }
  if(se>=4){
    snap.garrison=q.b.garrison;
    snap.byTier=TKEYS.map(t=>{
      const parts=[]; for(let i=1;i<=5;i++) if(q.troops[t][i]) parts.push({i,n:q.troops[t][i]});
      return {t,parts};
    }).filter(x=>x.parts.length);
  }
  // ИМЯ полководца сюда специально не идёт — портрет соперника и так виден
  // в шапке того же письма (m.oppAvatar, см. scouted() и scoutReportHtml),
  // при ЛЮБОЙ ступени разведки: гадать, какой это генерал, лазутчику
  // незачем, его уже видно глазами. То, что реально не видно снаружи —
  // сила вложения: КУДА вложены очки таланта (не только сколько —
  // пользователь отметил, что просто число ни для какой тактики не
  // годится, а разбивка по веткам уже говорит: вложился в Армию — жди
  // сильную защиту войск) и надетое снаряжение — тоже часть боевой мощи
  // генерала, скрывать его отдельно от таланта было бы непоследовательно.
  if(se>=5){
    snap.genTal=(q.gen&&q.gen.id!=null)?talentBranchSpent(q):null;
    snap.gearPower=gearPowerOf(q);
    // stats — то, что ПРЕДМЕТ РЕАЛЬНО ДАЁТ (см. gearItemStats), не только
    // редкость: пользователь отметил, что мало знать, что надето, нужно
    // понимать, что именно оно прибавляет, иначе пункт бесполезен для
    // тактики так же, как раньше было бесполезно просто число очков.
    snap.gear=GEAR_SLOTS.map(s=>{
      const it=q.gear&&q.gear[s.id]; if(!it) return null;
      return {name:s.name, rarity:it.rarity, stats:gearItemStats(s.cat,it.order,it.rarity)};
    }).filter(Boolean);
    let wounded=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) wounded+=q.wounded[t][i]||0});
    snap.wounded=wounded;
  }
  return snap;
}
// Разведка отряда в поле (см. sendScoutMarch) — та же ступень "se" (тот же
// вклад в "Маскировку", один навык на оба вида разведки), но объект куда
// проще города: нет запасов/стены/академии, только состав самого отряда и
// взял ли он с собой полководца (см. m.hasGen). Ступени по смыслу совпадают
// с scoutSnapshot() выше (родá войск с se3, тиры с se4), кроме "Запасы" (тут
// им взяться неоткуда — походный отряд не хранит ресурсы, только везёт то,
// что уже собрал, — это отдельно видно в самом донесении, не тут).
function scoutMarchSnapshot(p,target){
  const se=p.tech.mil_scout2||0, total=countUnits(target.units);
  const snap={se,total};
  if(se>=2){
    const owner=W.players.find(q=>q.id===target.pid);
    snap.genLv=(target.hasGen&&owner&&owner.gen&&owner.gen.id!=null)?owner.gen.lv:null;
  }
  if(se>=3){
    snap.byType=TKEYS.map(t=>({t,n:Object.values(target.units[t]).reduce((a,b)=>a+b,0)})).filter(x=>x.n>0);
  }
  if(se>=4){
    snap.byTier=TKEYS.map(t=>{
      const parts=[]; for(let i=1;i<=5;i++) if(target.units[t][i]) parts.push({i,n:target.units[t][i]});
      return {t,parts};
    }).filter(x=>x.parts.length);
  }
  return snap;
}
// Отчёт о штурме города — отдельная запись для КАЖДОЙ человеческой стороны
// (боты почту не читают, см. !att.isBot/!def.isBot ниже — тот же принцип,
// что и у существующего logMsg): у атакующего и защитника разные потери и
// разный исход одного и того же боя, поэтому это не одна запись с двумя
// углами обзора, а две независимые.
// A/D — те же боевые силы (см. makeForce), что resolveBattle уже отыграл:
// A.B/D.B несут ИМЕННО тот профиль бонусов, что участвовал в бою (гарнизон
// защитника — с учётом defending:true и стены, см. battleCity), пересчитывать
// bonuses(att)/bonuses(def) заново здесь было бы неверно — вышел бы другой
// (атакующий по умолчанию) профиль для защитника.
function pushBattleReport(att,def,startA,startD,powA,powD,la,ld,win,coords,weather,log,A,D){
  // Погода одна на бой и одинаково касается обеих сторон, поэтому в оба отчёта
  // уходит одна и та же строка (см. BATTLE_WEATHER). Ясную не пишем вовсе —
  // "погода не мешала" не новость, строка бы просто зашумляла каждый отчёт.
  const wx = (weather && weather.id!=="clear") ? {name:weather.name, desc:weather.desc} : null;
  // Хроника — одна и та же для обеих сторон (бой-то один), но side в каждой
  // записи помечает, чья это была удача, а отчёт у каждого свой: поэтому при
  // отрисовке "A"/"D" переводится в "моё/чужое" по флагу attacker (см.
  // battleLogHtml). Погодную строку из хроники убираем — она уже отдельной
  // плашкой над таблицей, дублировать незачем.
  const chron = (log||[]).filter(e=>e.kind!=="weather");
  const buffsA=battleBuffSnapshot(A), buffsD=battleBuffSnapshot(D);
  if(!att.isBot) pushMail({
    cat:"report", kind:"battle", win: win==="A", weather:wx, log:chron,
    selfNick:att.nick||"Безымянный лорд", oppNick:def.nick||"Безымянный лорд",
    selfRace:att.race, oppRace:def.race,
    selfCoords:{x:att.x,y:att.y}, oppCoords:{x:def.x,y:def.y}, fightCoords:coords,
    selfPower:powA, oppPower:powD,
    selfGen:genInfo(att,!!A.gen), oppGen:genInfo(def,!!D.gen),
    selfBuffs:buffsA, oppBuffs:buffsD,
    selfAvatar:playerAvatarSrc(att), oppAvatar:playerAvatarSrc(def),
    selfStart:startA, oppStart:startD,
    selfDead:la.dead, selfHurt:la.hurt, selfSlight:la.slight,
    selfRemain:Math.max(0,startA-la.dead-la.hurt-la.slight),
    oppDead:ld.dead, oppHurt:ld.hurt, oppSlight:ld.slight,
    oppRemain:Math.max(0,startD-ld.dead-ld.hurt-ld.slight),
    attacker:true,
  });
  if(!def.isBot) pushMail({
    cat:"report", kind:"battle", win: win==="D", weather:wx, log:chron,
    selfNick:def.nick||"Безымянный лорд", oppNick:att.nick||"Безымянный лорд",
    selfRace:def.race, oppRace:att.race,
    selfCoords:{x:def.x,y:def.y}, oppCoords:{x:att.x,y:att.y}, fightCoords:coords,
    selfPower:powD, oppPower:powA,
    selfGen:genInfo(def,!!D.gen), oppGen:genInfo(att,!!A.gen),
    selfBuffs:buffsD, oppBuffs:buffsA,
    selfAvatar:playerAvatarSrc(def), oppAvatar:playerAvatarSrc(att),
    selfStart:startD, oppStart:startA,
    selfDead:ld.dead, selfHurt:ld.hurt, selfSlight:ld.slight,
    selfRemain:Math.max(0,startD-ld.dead-ld.hurt-ld.slight),
    oppDead:la.dead, oppHurt:la.hurt, oppSlight:la.slight,
    oppRemain:Math.max(0,startA-la.dead-la.hurt-la.slight),
    attacker:false,
  });
}
function battleCity(att,def,m){
  // Мощь и число войск ДО боя — то же самое "сколько было на входе", что
  // показывает отчёт (см. pushBattleReport ниже); после боя и splitLosses
  // оба числа уже не те, что были в момент столкновения.
  const powA=power(att), powD=power(def);
  const startA=countUnits(m.units), startD=countUnits(def.troops);
  const garrison=emptyUnits();
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++)garrison[t][i]=def.troops[t][i]});
  const A=makeForce(m.units,att,{name:atkName(att),mode:"siege-attack",withGen:!!m.hasGen});
  const D=makeForce(garrison,def,{wall:def.b.wall+def.b.garrison*0.5,defending:true,name:def.name,mode:"hospital",
    withGen:!!(def.gen&&def.gen.away==null)});
  const r=resolveBattle(A,D,{startA:countUnits(m.units),toDeath:false});
  // в хронику погода идёт короткой пометкой, подробности — в почтовом отчёте
  const wx=(r.weather&&r.weather.id!=="clear")?" ("+r.weather.name.toLowerCase()+")":"";
  const la=splitLosses(att,r.lossA,"siege-attack");   // штурмующий теряет войска насмерть, без госпиталя
  const ld=splitLosses(def,r.lossD,"hospital");
  // Легкораненые защитники — назад в D.units ДО перезаписи def.troops ниже,
  // иначе перезапись их просто стёрла бы (см. addUnitsInto/splitLosses).
  addUnitsInto(D.units, ld.slightUnits);
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++)def.troops[t][i]=D.units[t][i]});
  m.units=A.units;

  if(r.win==="A"){
    syncRes(def);
    const loot={}; let sum=0;
    let carryCap=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)carryCap+=m.units[t][i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(att.race,t,"load")});
    const prot=capacity(def);
    RES.forEach(rr=>{ const take=Math.min(Math.max(0,def.res[rr]-prot[rr]), carryCap/4); loot[rr]=Math.round(take); def.res[rr]-=take; sum+=take });
    m.carry=loot;
    addXp(att, Math.round(200+def.b.hall*60));
    // Полный разгром бьёт по прочности стены; при обнулении — город переносится
    if(countUnits(def.troops)<=0 && r.aliveA>0){
      syncWall(def);
      def.wallHp -= maxWallHp(def.b.wall)*0.34;
      def.wallHitAt=W.t;
      if(def.wallHp<=0){
        relocate(def);
        def.wallHp=maxWallHp(def.b.wall)*0.5;
        if(!def.isBot) def.shieldUntil=Math.max(def.shieldUntil, W.t+8*3600);
      }
    }
    logMsg(att,def,"Победа при "+def.name+wx+". Захвачено "+Math.round(sum).toLocaleString("ru")+" ресурсов.",
                   "Город атакован ("+att.name+")"+wx+". Потери: "+ld.dead+" убито, "+ld.hurt+" ранено.");
  } else {
    logMsg(att,def,"Штурм "+def.name+wx+" провалился. Убито "+la.dead+", ранено "+la.hurt+".",
                   "Отражена атака "+att.name+wx+". Убито "+ld.dead+", ранено "+ld.hurt+".");
  }
  pushBattleReport(att,def,startA,startD,powA,powD,la,ld,r.win,{x:m.tx,y:m.ty},r.weather,r.log,A,D);
  recallMarch(m);
}
function logMsg(att,def,forAtt,forDef){
  if(!att.isBot) logg(forAtt,"war");
  if(!def.isBot) logg(forDef,"war");
}
function relocate(p,msg){
  // после разгрома город переносится туда, где меньше всего соседей — раньше
  // искали по всей карте 0..100 (ri(4,CFG.MAP-5), тот же порядок радиуса, что
  // и сама стартовая карта); мир теперь не имеет границ, так что ищем в
  // такой же по размеру окрестности вокруг ТЕКУЩЕГО города, а не по всей
  // бескрайней карте — тот же практический эффект ("прочь от людной точки"),
  // но за конечное время.
  const RELOCATE_RADIUS=45;
  const ox=Math.round(p.x), oy=Math.round(p.y);
  let best=null,bestScore=-1;
  for(let i=0;i<400;i++){
    const x=ox+ri(-RELOCATE_RADIUS,RELOCATE_RADIUS), y=oy+ri(-RELOCATE_RADIUS,RELOCATE_RADIUS);
    if(W.map[key(x,y)]) continue;
    if(isRealWater(x,y)) continue;   // город на воде — нельзя, даже при переносе
    let near=1e9;
    W.players.forEach(q=>{ if(q.id!==p.id) near=Math.min(near,Math.hypot(q.x-x,q.y-y)) });
    if(near>bestScore){ bestScore=near; best={x,y} }
  }
  if(!best) return;
  mapDelete(p.x,p.y);
  p.x=best.x; p.y=best.y;
  clearArea(p.x,p.y,1);
  mapSet(p.x,p.y,{t:"city",x:p.x,y:p.y,pid:p.id});
  if(!p.isBot) logg(msg||"Город разрушен и перенесён в более спокойное место.","war");
}

/* =========================================================================
   ИИ БОТОВ — utility AI.
   Каждое возможное действие получает оценку по формулам. Бот делает то,
   что набрало больше всего. Ни деревьев поведения, ни нейросетей: так
   поведение остаётся объяснимым и правится одной цифрой.
   Личность бота задают три числа: агрессия, жадность, осторожность.
   ========================================================================= */
function relation(a,b){
  if(a.race===b.race) return 0.35;      // свои — мирно
  return -0.35;                         // чужие расы одинаково враждебны, без случайного перекоса
}
function botAlarm(bot,incoming){
  // Марш замечен в момент вылета. Бот реагирует как живой игрок: с паузой.
  const react = 30+RNG()*240;
  schedule(react,"alarm",{pid:bot.id});
  bot.ai.threat = W.t + (incoming.t1-W.t);
}
function botThink(p){
  syncRes(p);
  // Бот сам засевает свою округу — иначе она так и останется пустой (см.
  // ensureChunksAround). Радиус чуть шире того, в котором он ищет цели ниже,
  // чтобы находки не обрывались ровно по краю засеянного пятна.
  ensureChunksAround(p.x,p.y,36);
  const B=bonuses(p), acts=[];
  const cap=capacity(p);
  const pr=production(p);
  const busyQ=p.queues.filter(Boolean).length;
  const freeSlots=marchSlots(p.b.hall)-W.marches.filter(m=>m.pid===p.id&&!isScoutMarch(m)).length;

  /* --- стройка --- */
  if(busyQ<2){
    for(const bk of BKEYS){
      const plots = isMulti(bk) ? p.b[bk].length : 1;
      for(let pi=0; pi<plots; pi++){
        if(isMulti(bk) && !plotUnlocked(bk,pi,p.b.hall)) continue;
        const cur = isMulti(bk) ? p.b[bk][pi] : p.b[bk];
        const lv=cur+1;
        if(lv>buildingMax(bk)) continue;
        if(bk!=="hall" && lv>p.b.hall) continue;
        if(bk==="hall" && lv>1){
          if(HALL_REQ.some(k=>hallGateLevel(p,k)<p.b.hall)) continue;   // ратуша ждёт ключевые здания
        }
        const c=buildCost(bk,lv,p);
        if(!RES.every(r=>p.res[r]>=(c[r]||0))) continue;
        let sc=20;
        if(bk==="hall") sc+=45;
        if(BUILDINGS[bk].prod){ const r=BUILDINGS[bk].prod;
          sc += 30*p.ai.greed + (p.res[r]<cap[r]*0.15?25:0);
          if(isMulti(bk) && cur===0) sc+=15;    // новый участок выгоднее докачки старого
        }
        if(bk==="store" && RES.some(r=>p.res[r]>cap[r]*0.85)) sc+=40;
        if(["barracks","range","stable"].includes(bk)) sc += 25*p.ai.aggr;
        if(bk==="wall")     sc += 30*p.ai.caution;
        if(bk==="garrison") sc += 26*p.ai.caution;
        if(bk==="scout")    sc += 16;
        if(bk==="hospital") sc += 22*p.ai.caution;
        if(bk==="academy")  sc += 34;
        sc -= cur*0.8;
        // УЗКОЕ МЕСТО: здание из HALL_REQ, отставшее от ратуши, держит развитие
        // всего города. Пока оно не догонит, ратуша не растёт — а с ратушей
        // заперты и все прочие постройки (их нельзя поднять выше неё), и слоты
        // марша, и тиры войск.
        // Без этой надбавки бот вставал намертво: госпиталь набирал ~30 очков и
        // всегда проигрывал обучению войск (~45), так что 12 ботов за 30 дней
        // поднимали среднюю ратушу с 3.4 до 3.7 и не делали больше ничего —
        // ни строек, ни исследований, ни походов, только копили войска.
        if(HALL_REQ.includes(bk) && hallGateLevel(p,bk) < p.b.hall) sc += 70;
        acts.push({sc,run:()=>startBuild(p,bk,isMulti(bk)?pi:undefined)});
      }
    }
  }
  /* --- обучение --- */
  {
    const types=["inf","arc","cav","sie"].filter(t=>p.b[TRAIN_BLD[t]]>0 && !p.train[t]);
    if(types.length){
      const t=types[Math.floor(RNG()*types.length)];
      const tier=tierUnlockedFor(p,t);
      const c=troopCost(t,tier);
      // Бот копит на следующую ступень ратуши и тратит на войска только излишек.
      // Раньше эту роль случайно играла проверка на еду.
      const reserve=buildCost("hall",p.b.hall+1,p);
      // Если армия просела ниже критической, город бросает стройку и вооружается.
      // Минимальный гарнизон, ниже которого город бросает стройку и вооружается.
      // Было ратуша*80 — на 10 ур. это смешные 800 бойцов, порог не срабатывал
      // никогда, и при полном резерве (см. keep ниже) бот вообще переставал
      // тренироваться: за 90 дней армия так и оставалась стартовой.
      const desperate = countUnits(p.troops) < p.b.hall*900;
      // Резерв на следующую ратушу — ПОЛНЫЙ, а не 60%. При 0.6 бот вставал в
      // равновесие ровно на этой отметке: доход шёл, излишек над 60% тут же
      // уходил в войска, и до 100% он не доходил никогда. Итог — за 90 дней
      // средняя ратуша ботов не двигалась с 5.3, зато войск набиралось под 90
      // тысяч: города-пустышки с огромной армией. Полный резерв копит до
      // конца, а не даёт себя объесть; на войска идёт настоящий излишек.
      const keep = desperate ? 0 : 1;
      const spare={}; RES.forEach(r=>spare[r]=Math.max(0,p.res[r]-reserve[r]*keep));
      const affordable=Math.min(trainCap(p.b[TRAIN_BLD[t]]), Math.floor(Math.min(...RES.map(r=>c[r]?spare[r]/c[r]:1e9))*0.5));
      if(affordable>=30){
        let sc=25+40*p.ai.aggr;
        if(countUnits(p.troops)<p.b.hall*180) sc+=35;
        if(desperate) sc+=60;
        acts.push({sc,run:()=>startTrain(p,t,tier,affordable)});
      }
    }
  }
  /* --- исследования --- */
  if(!p.rsch && p.b.academy>0){
    const pool=[...ACADEMY_TREE.eco,...ACADEMY_TREE.mil].filter(n=>{
      if(!nodeVisibleFor(n,p)) return false;
      const cur=p.tech[n.id]||0; if(cur>=n.max) return false;
      if(n.unlock){ if(n.unlock.tier>2 && !(p.tech["mil_tier_"+n.unlock.type+(n.unlock.tier-1)]>=1)) return false; }
      const c=researchCost(n,cur+1);
      return RES.every(r=>p.res[r]>=(c[r]||0));
    });
    if(pool.length){
      const scored=pool.map(n=>{
        let s=18+(n.unlock?40:0)+(n.race?15:0);
        s+= n.branch==="mil" ? 8*p.ai.aggr : 8*(1-p.ai.aggr);
        return {n,s};
      }).sort((a,b)=>b.s-a.s);
      acts.push({sc:scored[0].s, run:()=>startResearch(p,scored[0].n.id)});
    }
  }
  /* --- снаряжение --- */
  if(!p.craft && p.b.forge>0){
    const curR=Math.min(5,epochOf(p.b.hall));
    const order=p.ai.aggr>0.5?"storm":"bastion";
    GEAR_SLOTS.forEach(s=>{
      const stock=p.materials[s.mat];
      let handled=false;
      for(let t=curR-2;t>=0;t--){
        if((stock[t]||0)>=4){ acts.push({sc:26,run:()=>upgradeMaterial(p,s.mat,t)}); handled=true; break; }
      }
      const haveEnough=(stock[curR-1]||0)>=1;
      const cur=p.gear[s.id];
      if(!haveEnough && !handled) acts.push({sc:14+8*p.ai.greed,run:()=>produceMaterial(p,s.mat)});
      else if(haveEnough && (!cur||cur.rarity<curR)) acts.push({sc:22,run:()=>startCraftItem(p,s.id,order,curR)});
    });
    // надеть лучшее с собственного склада, если оно лучше того, что уже надето
    GEAR_SLOTS.forEach(s=>{
      const cur=p.gear[s.id];
      let bestOrder=null,bestR=cur?cur.rarity:0;
      ["bastion","storm"].forEach(o=>{
        for(let r=5;r>=1;r--){ if((p.inventory[s.id][o][r-1]||0)>0 && r>bestR){ bestOrder=o; bestR=r; break } }
      });
      if(bestOrder) acts.push({sc:28,run:()=>equipItem(p,s.id,bestOrder,bestR)});
    });
  }
  /* --- лечение --- */
  if(!p.heal){
    let best=null, bestN=0;
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++){ const n=p.wounded[t][i]||0; if(n>bestN){bestN=n;best={type:t,tier:i}} }});
    if(best){
      const n=healMaxN(p,best.type,best.tier);
      if(n>0) acts.push({sc:40+bestN/50,run:()=>startHeal(p,best.type,best.tier,n)});
    }
  }
  /* --- сбор ресурсов --- */
  if(freeSlots>0){
    const scarce=RES.slice().sort((a,b)=>(p.res[a]/cap[a])-(p.res[b]/cap[b]))[0];
    const node=findNear(p,c=>c.t==="node"&&!c.busy, 30, c=>
      (c.res===scarce?18:0)+c.lv*7-dist(p,c)*0.55);
    if(node){
      let sc=30+35*p.ai.greed+(p.res[scarce]<cap[scarce]*0.2?30:0);
      acts.push({sc,run:()=>{ const u=pickArmy(p,0.45); if(countUnits(u)>0) sendMarch(p,node.x,node.y,u,"gather") }});
    }
  }
  /* --- разбойники (прокачка генерала) --- */
  if(freeSlots>0 && p.gen.lv<40){
    // Сравниваем силу лагеря с тем отрядом, который реально уйдёт в бой,
    // а не со всей армией — иначе ИИ переоценивает себя и теряет войска.
    const sendable=armyPower(pickArmy(p,0.55),B,p.race);
    const camp=findNear(p,c=>(c.t==="camp"||c.t==="fort")&&banditPower(c.lv)<sendable*0.55, 26,
      c=>c.lv*4-dist(p,c)*0.7);
    if(camp) acts.push({sc:44+22*(1-p.ai.greed)+(p.gen.lv<12?18:0),
      run:()=>{ const u=pickArmy(p,0.55); if(countUnits(u)>0) sendMarch(p,camp.x,camp.y,u,"attack",true) }});
  }
  /* --- нападение на город --- */
  if(freeSlots>0){
    const my=armyPower(p.troops,B,p.race);
    let best=null,bs=0;
    W.players.forEach(q=>{
      if(q.id===p.id) return;
      if(W.t<q.shieldUntil) return;
      const d=dist(p,q); if(d>34) return;
      const their=armyPower(q.troops,bonuses(q),q.race)*(1+wallDefBonus(q.b.wall));
      const ratio=my/Math.max(1,their);
      if(ratio<1.35+p.ai.caution*0.9) return;
      const rel=relation(p,q);
      let sc = 26 + 46*p.ai.aggr + (ratio-1)*18 - d*0.55 - rel*55;
      if(sc>bs){bs=sc;best=q}
    });
    if(best) acts.push({sc:bs,run:()=>{
      const u=pickArmy(p,0.8); if(countUnits(u)>0) sendMarch(p,best.x,best.y,u,"attack",true) }});
  }
  /* --- страх: отозвать войска домой --- */
  if(p.ai.threat && W.t<p.ai.threat){
    const away=W.marches.filter(m=>m.pid===p.id&&m.state!=="back");
    if(away.length) acts.push({sc:55*p.ai.caution+30,run:()=>away.forEach(recallMarch)});
  }
  /* --- щит, если страшно и есть золото --- */
  if(p.ai.threat && W.t<p.ai.threat && W.t>p.shieldUntil && p.res.gold>3000){
    acts.push({sc:48*p.ai.caution,run:()=>{ p.res.gold-=3000; p.shieldUntil=W.t+24*3600 }});
  }

  if(!acts.length) return;
  acts.sort((a,b)=>b.sc-a.sc);
  acts[0].run();
  if(acts[1]&&acts[1].sc>acts[0].sc*0.85) acts[1].run();   // бот успевает делать два дела
}
// Наводка ботов на цель — раньше сканировала ВЕСЬ W.map на каждую мысль
// каждого бота; в бесконечном мире W.map растёт без верхней границы по мере
// исследования. radius у ботов и так всегда небольшой фиксированный (см.
// вызовы ниже) — переберём только чанки, пересекающие круг радиуса radius
// вокруг p, через W.mapChunks, а не всю карту целиком.
function findNear(p,filter,radius,score){
  let best=null,bs=-1e9;
  const c0x=Math.floor((p.x-radius)/STRUCT_CHUNK), c1x=Math.floor((p.x+radius)/STRUCT_CHUNK);
  const c0y=Math.floor((p.y-radius)/STRUCT_CHUNK), c1y=Math.floor((p.y+radius)/STRUCT_CHUNK);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){
    const arr=W.mapChunks[cx+","+cy]; if(!arr) continue;
    for(const k of arr){
      const c=W.map[k]; if(!c) continue;
      if(dist(p,c)>radius) continue;
      if(!filter(c)) continue;
      const s=score(c);
      if(s>bs){bs=s;best=c}
    }
  }
  return best;
}
function pickArmy(p,frac){
  const cap=marchCapacity(p), u=emptyUnits();
  let room=cap;
  for(let i=5;i>=1;i--) for(const t of TKEYS){
    const have=Math.floor(p.troops[t][i]*frac); if(have<=0) continue;
    const weight=TIER_MULT[i-1];
    const n=Math.min(have, Math.floor(room/weight));
    if(n>0){ u[t][i]=n; room-=n*weight }
  }
  return u;
}
// Автоподбор отряда под СБОР: в RoK клик "собрать" сам набирает осадные —
// у них грузоподъёмность на бойца (TROOP_TYPES.sie.load=30) на порядок выше
// пехоты/лучников/конницы (6/8/5), они и задуманы как "обоз" — незачем
// тащить половину армии, если десяток осадных увезёт всё не хуже. Берём
// столько, сколько реально нужно донести (amount на жиле), беря типы по
// убыванию их грузоподъёмности (осадные первыми), и только если своих
// осадных не хватает — добираем следующим по грузоподъёмности типом, а не
// первым попавшимся (как делал общий pickArmy, который шёл по TKEYS-порядку
// пехота→лучники→конница→осадные, то есть ровно НАОБОРОТ нужному).
function pickGatherArmy(p,amount){
  const B=bonuses(p), cap=marchCapacity(p), u=emptyUnits();
  let room=cap, need=amount;
  const order=[...TKEYS].sort((a,b)=>TROOP_TYPES[b].load-TROOP_TYPES[a].load);
  order.forEach(t=>{
    for(let i=5;i>=1;i--){
      if(need<=0||room<=0) return;
      const have=p.troops[t][i]; if(!have) continue;
      const w=TIER_MULT[i-1];
      const unitLoad=TROOP_TYPES[t].load*w*troopMod(p.race,t,"load")*(1+B.load);
      if(unitLoad<=0) continue;
      const n=Math.min(have, Math.ceil(need/unitLoad), Math.floor(room/w));
      if(n>0){ u[t][i]=n; room-=n*w; need-=n*unitLoad; }
    }
  });
  return u;
}

/* --- действия, общие для игрока и ботов --- */
function startBuild(p,bk,plot){
  const multi=isMulti(bk);
  if(multi && !plotUnlocked(bk,plot,p.b.hall)) return {err:"Участок откроется позже"};
  const plotKey = multi ? plot : null;
  if(p.queues.some(q=>q && q.b===bk && q.plot===plotKey))
    return {err:"Эта постройка уже в работе у одной из бригад"};
  // Казармы/Стрельбище/Конюшня/Мастерская — пока в них идёт набор/переобучение
  // (p.train[type]), улучшать само здание нельзя: набор либо шёл бы в старом
  // здании, либо непонятно, по каким характеристикам считать уже оплаченный
  // заказ. Симметричный запрет — в startTrain/startRetrain ниже.
  const trainType=BLD_TRAIN[bk];
  if(trainType && p.train[trainType]) return {err:"Здание занято набором войск — дождитесь окончания"};
  const cur = multi ? p.b[bk][plot] : p.b[bk];
  const lv=cur+1;
  if(lv>buildingMax(bk)) return {err:"Максимальный уровень"};
  if(bk!=="hall"&&lv>p.b.hall) return {err:"Требуется ратуша "+lv+" уровня"};
  if(bk==="hall"){ const need=HALL_REQ.filter(k=>hallGateLevel(p,k)<p.b.hall);
    if(need.length) return {err:"Сначала до "+p.b.hall+" ур.: "+need.map(k=>buildingName(k,p)).join(", ")} }
  const slot=p.queues.findIndex(q=>!q);
  if(slot<0) return {err:"Обе бригады заняты"};
  const c=buildCost(bk,lv,p);
  if(!canPay(p,c)) return {err:"Не хватает ресурсов"};
  pay(p,c);
  const t=buildTime(bk,lv)/bonuses(p).build;
  p.queues[slot]={b:bk,lv,plot:multi?plot:null,t0:W.t,t1:W.t+t};
  schedule(t,"build",{pid:p.id,slot});
  return {ok:1};
}
function trainDuration(p,type,tier,n){
  return trainTime(type,tier)*n/((1+p.b.hall*0.06)*(1+bonuses(p).trainSpeed));
}
function trainMax(p,type,tier){
  const c=troopCost(type,tier), cap=trainCap(p.b[TRAIN_BLD[type]]);
  const afford=Math.floor(Math.min.apply(null,RES.map(r=>c[r]?p.res[r]/c[r]:1e9)));
  return Math.max(0,Math.min(cap,afford));
}
function startTrain(p,type,tier,n){
  if(p.train[type]) return {err:"Здание уже занято набором"};
  // Симметрично startBuild выше: пока здание само улучшается (в очереди
  // строительства), запускать в нём набор нельзя.
  if(p.queues.some(q=>q && q.b===TRAIN_BLD[type])) return {err:"Здание сейчас улучшается — дождитесь окончания"};
  const cap=trainCap(p.b[TRAIN_BLD[type]]);

  if(n>cap) return {err:"За раз можно набрать не больше "+cap};
  const c=troopCost(type,tier), tot={};
  RES.forEach(r=>tot[r]=Math.round((c[r]||0)*n));
  if(!canPay(p,tot)) return {err:"Не хватает ресурсов"};
  pay(p,tot);
  const t=trainDuration(p,type,tier,n);
  p.train[type]={type,tier,n,t0:W.t,t1:W.t+t};

/* ---- Лазарет: лечение раненых по типу/тиру, отдельная очередь ---- */
function woundedList(p){
  const list=[];
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) if(p.wounded[t][i]>0) list.push({type:t,tier:i})});
  return list;
}
function healMaxN(p,type,tier){
  const have=p.wounded[type][tier]||0;
  const c=healUnitCost(p,type,tier), cap=trainCap(Math.max(0,...p.b.hospital));
  const afford=Math.floor(Math.min.apply(null,RES.map(r=>c[r]?p.res[r]/c[r]:1e9)));
  return Math.max(0,Math.min(have,cap,afford));
}
function healDuration(p,type,tier,n){
  // healSpeed — той же конвенции, что и heal (стоимость, см. healUnitCost
  // выше): готовый МАСШТАБ времени, дефолт 1 = "как обычно", МЕНЬШЕ = быстрее
  // (не конвенция trainSpeed/build, где поле — бонус сверху 1 в знаменателе).
  // Поэтому — множитель в ЧИСЛИТЕЛЕ, а не добавка в знаменатель.
  // Раньше стояло (1+bonuses(p).healSpeed) в знаменателе — при дефолте 1 это
  // ВСЕГДА давало ×2 скорость лечения ВСЕМ расам без единого бонуса, а
  // расовая способность нежити (healSpeed:0.5, заявлено "вдвое быстрее")
  // с той же формулой давала (1+0.5)=1.5 в знаменателе — то есть МЕДЛЕННЕЕ
  // бездефолтного случая у остальных рас, ровно наоборот заявленному.
  // (Первая попытка чинить это здесь тоже была неверной — просто убрала "1+",
  // оставив healSpeed в знаменателе: там меньшее значение делает время БОЛЬШЕ,
  // то есть медленнее — снова не то направление. Числитель — правильное место.)
  // По механике RoK лазарет стоит и лечит вдвое дешевле/быстрее полного
  // набора, без скрытого допмножителя сверху (см. healUnitCost/healUnitTime).
  return healUnitTime(type,tier)*n*bonuses(p).healSpeed/(1+p.b.hall*0.06);
}
function startHeal(p,type,tier,n){
  if(p.heal) return {err:"Лазарет уже занят лечением"};
  n=Math.round(n);
  if(n<1) return {err:"Выберите хотя бы одного раненого"};
  if(n>(p.wounded[type][tier]||0)) return {err:"Столько раненых нет"};
  const cap=trainCap(Math.max(0,...p.b.hospital));
  if(n>cap) return {err:"За раз можно лечить не больше "+cap};
  const c=healUnitCost(p,type,tier), tot={};
  RES.forEach(r=>tot[r]=Math.round((c[r]||0)*n));
  if(!canPay(p,tot)) return {err:"Не хватает ресурсов"};
  pay(p,tot);
  const t=healDuration(p,type,tier,n);
  p.heal={type,tier,n,t0:W.t,t1:W.t+t};

/* Переобучение: старые воины идут в зачёт следующего тира — платим и ждём
   только разницу между тирами, а не полную стоимость набора с нуля. */
function retrainCost(type,fromTier,n){
  const from=troopCost(type,fromTier), to=troopCost(type,fromTier+1), tot={};
  RES.forEach(r=>tot[r]=Math.max(0,Math.round((to[r]-from[r])*n)));
  return tot;
}
function retrainDuration(p,type,fromTier,n){
  const delta=Math.max(1,trainTime(type,fromTier+1)-trainTime(type,fromTier));
  return delta*n/((1+p.b.hall*0.06)*(1+bonuses(p).trainSpeed));
}
function retrainMax(p,type,fromTier){
  const have=p.troops[type][fromTier]||0;
  const c=retrainCost(type,fromTier,1), cap=trainCap(p.b[TRAIN_BLD[type]]);
  const afford=Math.floor(Math.min.apply(null,RES.map(r=>c[r]?p.res[r]/c[r]:1e9)));
  return Math.max(0,Math.min(have,cap,afford));
}
function startRetrain(p,type,fromTier,n){
  if(p.train[type]) return {err:"Здание уже занято набором"};
  if(p.queues.some(q=>q && q.b===TRAIN_BLD[type])) return {err:"Здание сейчас улучшается — дождитесь окончания"};
  const maxT=tierUnlockedFor(p,type);
  if(fromTier<1||fromTier+1>maxT) return {err:"Следующий тир ещё не открыт"};
  n=Math.round(n);
  if(n<1) return {err:"Выберите хотя бы одного воина"};
  const have=p.troops[type][fromTier]||0;
  if(n>have) return {err:"Недостаточно воинов этого тира"};
  const cap=trainCap(p.b[TRAIN_BLD[type]]);
  if(n>cap) return {err:"За раз можно переобучить не больше "+cap};
  const c=retrainCost(type,fromTier,n);
  if(!canPay(p,c)) return {err:"Не хватает ресурсов"};
  pay(p,c);
  p.troops[type][fromTier]-=n;
  const t=retrainDuration(p,type,fromTier,n);
  p.train[type]={type,tier:fromTier+1,n,t0:W.t,t1:W.t+t,retrain:true};
  schedule(t,"train",{pid:p.id,type});
  return {ok:1};
}
function startResearch(p,id){

/* =========================================================================
   ХОД ВРЕМЕНИ. Догоняющая симуляция: сколько бы вас не было, движок
   прокручивает очередь событий до текущего момента.
   ========================================================================= */
// Прокручивает очередь, но не дольше budgetMs подряд (0 — без ограничения).
// Возвращает true, если дошли до target, и false, если бюджет кончился раньше.
// ВАЖНО: W.t двигаем на время последнего обработанного события, а не на target,
// когда вышли по бюджету. Раньше здесь стоял аварийный guard>200000 с break, но
// W.t=target выполнялось В ЛЮБОМ случае — недокрученные события оставались в
// очереди с t в прошлом, и следующий вызов ставил W.t=ev.t, то есть уводил
// мировые часы НАЗАД (syncRes при dt<0 просто переставляет метку, и добыча за
// этот отрезок молча терялась). Теперь незавершённый догон — штатное состояние:
// часы стоят там, докуда реально досчитали, и следующий заход продолжает с него.
function advanceChunk(target, budgetMs){
  const until = budgetMs ? performance.now()+budgetMs : Infinity;
  let n=0;
  while(W.events.length && W.events[0].t<=target){
    const ev=W.events.shift();
    W.t=ev.t;
    // Одно сбойное событие не должно убивать весь мир. Раньше исключение
    // отсюда пробивало advanceTo и вылетало из frame() ДО вызова
    // requestAnimationFrame — главный цикл умирал насовсем, а событие уже было
    // снято с очереди, так что и перезагрузка не помогала (ровно так вешался
    // штурм города при нечётном уровне гарнизона, см. tableAt). Теперь сбой
    // локализован: остальные события доигрываются, игрок видит запись в
    // хронике, а разработчик — стек в консоли.
    const fn=EV[ev.type];
    if(fn){
      try{ fn(ev.data) }
      catch(err){
        console.error("Событие "+ev.type+" упало:",err,ev.data);
        try{ logg("Сбой при обработке события ("+ev.type+"). Мир продолжает идти.","war") }catch(e){}
      }
    }
    // время сверяем не каждое событие — performance.now() сам по себе не бесплатен
    if((++n & 63)===0 && performance.now()>=until) return false;
  }
  W.t=target;
  W.players.forEach(p=>syncRes(p,true));   // lazy: не чаще раза на секунду мира, см. syncRes
  return true;
}
function advanceTo(target){ return advanceChunk(target, 0) }
// Догон за долгое отсутствие одним куском намертво вешал вкладку: замеры на
// свежем мире дали 0.38с за сутки, 0.96с за неделю, 2.7с за месяц и 15с за
// полгода — и это на десктопе, телефон в 5-10 раз медленнее. Крутим очередь
// порциями по кадру, отдавая браузеру управление между ними, и показываем
// прогресс. Отсчёт ведём по МОДЕЛЬНОМУ времени (сколько секунд мира осталось
// прокрутить), а не по числу событий: сколько их будет всего, заранее неизвестно.
// catchingUp — замок на время покадрового догона. Главный цикл frame() крутит
// время сам, и если бы он продолжал работать параллельно, оба двигали бы W.t и
// разбирали одну очередь навстречу друг другу. На загрузке гонки нет (frame()
// стартует только после await load()), а вот возврат на вкладку идёт поверх уже
// работающего цикла — вот ради этого случая замок и нужен.
let catchingUp=false;
function advanceToAnimated(target, onProgress){
  return new Promise(resolve=>{
    const t0=W.t, span=Math.max(1,target-t0);
    catchingUp=true;
    (function step(){
      if(advanceChunk(target, 40)){
        catchingUp=false;
        if(onProgress) onProgress(1);
        resolve(); return;
      }
      if(onProgress) onProgress(Math.min(0.999,(W.t-t0)/span));
      requestAnimationFrame(step);
    })();
  });
}

    migrateStructLevels();
    // Старые походы в старом сохранении не несут m.path (маршрут в обход
    // воды появился позже) — без него marchPos() не может интерполировать
    // позицию и упал бы на (0,0). Достраиваем маршрут задним числом по тем
    // же концам, что использовали бы sendMarch/recallMarch в своё время.
    W.marches.forEach(m=>{
      if(m.path) return;
      const p=W.players.find(q=>q.id===m.pid);
      if(m.state==="back"&&p) setMarchPath(m,waterPath(m.tx,m.ty,p.x,p.y));
      else setMarchPath(m,waterPath(m.x0,m.y0,m.tx,m.ty));
    });
    // Пользователь заметил армии, "застрявшие" на пустой клетке без всякой
    // цели под ней — та же проблема, что чинит блок выше, но для походов,
    // у которых m.path технически ЕСТЬ (проверка выше его пропускает), но
    // испорчен (пустой массив/одна точка/NaN-длина) — pathPointAt() тогда
    // молча проваливается в аварийный фолбэк {x:0,y:0}, буквально исток
    // координат, и поход навсегда рисуется там. Восстанавливать исходный
    // маршрут не пытаемся — цель могла уже не существовать (лагерь
    // разбит, точка истощилась и уже респаунилась в другом месте) —
    // войска просто принудительно возвращаются в казарму, тем же кодом,
    // что и обычное штатное прибытие домой (см. QUEUE.home выше).
    if(!W.marchRescueMigrated){
      const lost=W.marches.filter(m=>!(m.path && m.path.length>=2 && isFinite(m.pathLen) && m.pathLen>=0));
      lost.forEach(m=>{
        const p=W.players.find(q=>q.id===m.pid);
        if(p){
          TKEYS.forEach(t=>{for(let i=1;i<=5;i++) p.troops[t][i]+=(m.units[t]&&m.units[t][i])||0});
          if(m.carry) gain(p,m.carry);
        }
        unschedule(e=>e.data&&e.data.mid===m.id);
      });
      if(lost.length){
        W.marches=W.marches.filter(m=>!lost.includes(m));
        logg("Потерянные в пути отряды ("+lost.length+") принудительно возвращены домой.","good");
      }
      W.marchRescueMigrated=true;
    }
    migrateMarchSpeed();
    // Вытаскиваем отряды, потерявшие своё событие, — ДО догона времени, чтобы
    // возвращение домой началось с этого момента, а не откладывалось на потом.
    // Именно сюда попадают походы, застрявшие из-за прежнего падения на дробном
    // уровне стены: их событие прибытия было съедено исключением ещё в той
    // партии, и сами по себе они бы так и стояли у чужого замка вечно.
    const freedOnLoad=rescueStuckMarches();
    if(freedOnLoad) logg("Отряды, потерявшие приказ ("+freedOnLoad+"), возвращаются в город.","war");
    // догоняем реальное время, прошедшее с последнего захода
    const away=Math.max(0,(Date.now()-W.savedAt)/1000);
    if(away>60){
      // Как в RoK: пока игрока нет, добыча копится на участке только до его
      // "Ёмкости" (см. syncRes/plotFillCap) — дальше просто пропадает, пока
      // не забрали. Проверяем ДО advanceTo/syncRes, пока p.resAt ещё не
      // сдвинут — иначе избыток уже молча срежется и предупреждать будет не о чем.
      const p=me(), pr=production(p), cap=plotFillCap(p), dtH=away/3600;
      const overflowed=RES.filter(r=>pr[r]*dtH>cap[r]).map(r=>RES_NAME[r]);
      // порциями по кадру, с полосой прогресса — иначе за месяц отсутствия
      // вкладка молча висит несколько секунд (на телефоне — десятки)
      await advanceToAnimated(W.t+away, f=>catchUpProgress(f, away));
      catchUpProgress(null);
      const capNote=overflowed.length
        ?" Участки ("+overflowed.join(", ")+") успели заполниться до предела — часть добычи за это время пропала, дальше не копилась."
        :"";
      // Только в хронику. Письма "прошло столько-то, но ничего не случилось"
      // тут больше нет: почта — для событий, а не для отметок о времени, и
      // такое письмо приходило КАЖДЫЙ заход, забивая ящик и обесценивая
      // красную метку непрочитанного. Если за отсутствие правда что-то
      // произошло, об этом придёт настоящий отчёт — о бое, сборе, разведке.
      logg("Пока вас не было, прошло "+fmtDur(away)+". Мир жил своей жизнью."+capNote,"good");
    }
    return true;
  }catch(e){ return false }
}

   ИНТЕРФЕЙС. Карта — не сетка клеток, а чертёж кампании на штабном столе.
   Рельеф рисуется один раз в буфер и растягивается со сглаживанием: получается
   мягкая размывка вместо пиксельных квадратов, и это дёшево.
   ========================================================================= */
const $=s=>document.querySelector(s);

const RU=n=>Math.round(n).toLocaleString("ru-RU");
// Полоса догона мира после долгого отсутствия (см. advanceToAnimated).
// Плашку строим на лету: она нужна раз за загрузку и только если игрока
// не было достаточно долго, держать её в разметке впустую незачем.
// f===null — убрать плашку.
function catchUpProgress(f, awaySec){
  let el=document.getElementById("catchup");
  if(f===null){ if(el) el.remove(); return }
  if(!el){
    el=document.createElement("div"); el.id="catchup";
    el.innerHTML="<div class='cu-card'><b>Мир жил своей жизнью</b>"+
      "<span class='cu-sub'>Вас не было "+fmtDur(awaySec||0)+" — досчитываем события</span>"+
      "<div class='cu-bar'><i></i></div></div>";
    document.body.appendChild(el);
  }
  const bar=el.querySelector(".cu-bar i");
  if(bar) bar.style.width=Math.round(f*100)+"%";
}
function fmt(n){ n=Math.round(n);
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+" млрд";
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+" млн";
  if(Math.abs(n)>=1e4) return (n/1e3).toFixed(1)+" тыс";
  return RU(n) }
function fmt0(n){ n=Math.round(n);              // без дробной части — для вместимости марша и т.п.
  if(Math.abs(n)>=1e9) return Math.round(n/1e9)+" млрд";
  if(Math.abs(n)>=1e6) return Math.round(n/1e6)+" млн";
  if(Math.abs(n)>=1e4) return Math.round(n/1e3)+" тыс";
  return RU(n) }
function fmtDur(s){ s=Math.max(0,Math.round(s));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d) return d+" д "+h+" ч";
  if(h) return h+" ч "+m+" мин";
  if(m) return m+" мин "+x+" с";
  return x+" с" }

   ПАНЕЛИ. Правая колонна — канцелярская книга похода: рубрики, записи,
   цены эмалевыми точками, цифры моноширинно.
   ========================================================================= */
// Настоящие гербы рас (загружены пользователем в images/ui/) вместо
// цветных SVG-щитков — картинки портретные (выше, чем шире, у каждой
// расы свои пропорции), object-fit:contain в фиксированном боксе не
// искажает исходник ни на одной из четырёх. Имя функции не поменяли —
// звать её продолжают из тех же мест теми же аргументами (race, ширина в
// px), поменялась только реализация внутри.
const RACE_CREST={human:"Human",dwarf:"Dwarf",elf:"Elf",undead:"Undead"};
function shieldSvg(race,w){
  // w опущен — без инлайновых width/height: размер отдаётся целиком CSS
  // класса-обёртки (нужно там, где герб должен тянуться отзывчиво, например
  // в сетке рас на экране летописи — фиксированный px там инлайн-стилем
  // перебил бы любое адаптивное правило).
  if(w==null) return "<img class='shield' src='images/ui/"+RACE_CREST[race]+".png' alt='"+RACES[race].name+"'>";
  const width=w||13, height=Math.round(width*1.5);
  return "<img class='shield' src='images/ui/"+RACE_CREST[race]+".png' alt='"+RACES[race].name+"' "+
    "style='width:"+width+"px;height:"+height+"px;object-fit:contain'>";
}
function ring(lv,max){
  const f=Math.min(1,lv/(max||25)), C=2*Math.PI*14;
  return "<div class='ring'><svg viewBox='0 0 34 34'>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#3d3121' stroke-width='2.5'/>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#c2993c' stroke-width='2.5'"+
    " stroke-dasharray='"+(C*f).toFixed(1)+" "+C.toFixed(1)+"' stroke-linecap='butt'/>"+
    "</svg><b>"+lv+"</b></div>";
}
function priceRow(p,c){
  const out=RES.filter(r=>c[r]).map(r=>{
    const short=p.res[r]<c[r];
    return "<span class='"+(short?"short":"")+"' style='--c:"+RSHADE[r]+
      "' title='"+RES_NAME[r]+"'>"+fmt(c[r])+"</span>";
  }).join("");
  return out?"<div class='price'>"+out+"</div>":"";
}
function rubric(text,note){
  return "<div class='rubric'>"+text+(note?"<span class='n'>"+note+"</span>":"")+"</div>";
}
function hollow(mark,text){
  return "<div class='hollow'><span class='big'>"+mark+"</span>"+text+"</div>";
}

/* ---- Картуш: что выбрано на карте. Ник/уровень ратуши у каждого замка
   теперь висят прямо в 3D над моделью (см. updateLabels в obyom-3d-infinite.
   html) — панели тут остаются только там, где нужно ДЕЙСТВИЕ (собрать,
   атаковать, разведать), а не просто повторить то, что уже подписано в
   мире. Пустошь и своя столица не открывают панель вовсе. ---- */
let lastCart="";
// Выбранный поход (march.id, см. renderMarchCartoucheFor ниже — зовётся
// из 3D при тапе по маркеру похода, engine/src/main.ts notifyParentMarchCartouche)
// — отдельное состояние от sel (клетка карты): поход не привязан к
// клетке, он движется. Взаимно исключают друг друга — выбор одного
// сбрасывает другое (см. renderMarchCartoucheFor и обработчик
// closecartouche в handleAct).
let selMarch=null;
function renderMarchCartoucheFor(marchId){ selMarch=marchId; sel=null; renderCartouche(); }
const MARCH_STATE_RU={go:"в пути",gather:"собирает",back:"возвращается",siege:"осаждает"};
function renderCartouche(){
  // Фаза 12, кусочек 4 — тап по объёмной карте общего мира. Once
  // mpState.joined, 3D показывает mpWorldSnapshot() (кусочки 1-3), а не
  // W с ботами одиночки — тап по любой клетке/маршу теперь тоже должен
  // читать mpState, а не W, иначе панель либо ничего не найдёт, либо (реже)
  // случайно совпадёт с чужой клеткой одиночной партии на тех же
  // координатах. Отдельная функция, не веточка внутри этой же — слишком
  // разные источники данных и набор кнопок (mpDoAttack/mpDoScout/
  // mpDoGather/mpDoRaid/mpDoRecall вместо startBuild/sendScout/recall).
  if(mpState.joined){ renderCartoucheMp(); return; }
  const el=$("#cartouche");
  // Крестик добавляется тут ОДИН раз, а не в каждой из веток ниже
  // (node/camp-fort/city/march) — put() оборачивает готовое тело панели,
  // ветки ничего не знают про кнопку закрытия.
  const put=h=>{
    const full=h?"<button class='cart-close' data-act='closecartouche' title='Закрыть' aria-label='Закрыть'>&times;</button>"+h:h;
    if(full!==lastCart){ lastCart=full; el.innerHTML=full } el.style.display=full?"":"none";
  };
  if(selMarch!=null){
    const m=W.marches.find(x=>x.id===selMarch);
    if(!m){ selMarch=null; } // прибыл или был отозван, пока панель была открыта
    else {
      const owner=W.players.find(q=>q.id===m.pid);
      const p=me();
      const mine=owner&&owner.id===p.id;
      const mcoord="<span class='n' style='font-family:var(--data);font-size:10px;color:var(--vellum-faint)'>"+
        m.tx+" · "+m.ty+"</span>";
      let body="<div class='hd'>"+(owner?shieldSvg(owner.race,14):"")+(owner?owner.nick:"?")+" — отряд "+mcoord+"</div>"+
        "<div class='co'><span>Состояние</span><b>"+(MARCH_STATE_RU[m.state]||m.state)+"</b></div>"+
        "<div class='co'><span>Воинов</span><b>"+RU(countUnits(m.units))+"</b></div>"+
        "<div class='co'><span>Цель</span><b>"+m.tx+" · "+m.ty+"</b></div>"+
        (m.state!=="gather"&&m.state!=="siege"?"<div class='co'><span>Прибытие через</span><b>"+fmtDur(Math.max(0,m.t1-W.t))+"</b></div>":"")+
        // Своему отряду видно всегда (это твоё же решение при отправке, см.
        // openLevy) — чужому только через scoutMarchSnapshot (se>=2), не тут.
        (mine&&m.hasGen?"<div class='co'><span>Полководец</span><b>с отрядом</b></div>":"");
      if(mine){
        body+="<button class='seal wide' style='margin-top:9px' data-act='recall' data-m='"+m.id+"'>Отозвать</button>";
      } else if(m.state==="gather"||m.state==="siege"){
        // Разведать чужой отряд можно, только пока он стоит на месте (см.
        // sendScoutMarch) — движущийся марш лазутчик уже не догонит.
        const hasScout=(p.b.scout||0)>0;
        const already=W.marches.some(x=>x.pid===p.id&&x.mode==="scoutmarch"&&x.targetMarchId===m.id);
        const maxScouts=hasScout?tblRow(SCOUT_TABLE,p.b.scout).scouts:0;
        const scoutsOut=W.marches.filter(x=>x.pid===p.id&&isScoutMarch(x)).length;
        const allBusy=hasScout&&scoutsOut>=maxScouts;
        body += already?"<div class='hint'>Лазутчик уже в пути — донесение придёт письмом.</div>"
          : !hasScout?"<div class='hint'>Постройте "+buildingName("scout",p).toLowerCase()+", чтобы засылать лазутчиков.</div>"
          : allBusy?"<div class='hint'>Все лазутчики в пути ("+scoutsOut+"/"+maxScouts+") — дождитесь возвращения.</div>"
          : "<button class='seal wide' style='margin-top:9px' data-act='sendscoutmarch' data-m='"+m.id+"'>Разведать</button>";
      } else {
        body+="<div class='hint'>Атака отряда в пути не поддерживается — только цели на карте (город/лагерь/точка).</div>";
      }
      put(body);
      return;
    }
  }
  if(!sel){ put(""); return }
  const o=W.map[key(sel.x,sel.y)], p=me();
  const coord="<span class='n' style='font-family:var(--data);font-size:10px;color:var(--vellum-faint)'>"+
    sel.x+" · "+sel.y+"</span>";
  if(!o){
    // Свободный тап по пустой местности — пользователь просил видеть
    // координаты клетки и иметь возможность послать туда отряд ("Пустошь").
    // Цели там нет: снаряжённый марш просто дойдёт и сам развернётся домой
    // (см. arriveMarch — !cell на месте прибытия сразу зовёт recallMarch).
    const water=isRealWater(sel.x,sel.y);
    put("<div class='hd'>Пустошь "+coord+"</div>"+
      (water?"<div class='hint'>Здесь вода — отряд не высадить.</div>":
        "<button class='seal wide' style='margin-top:9px' data-act='march' data-x='"+sel.x+"' data-y='"+sel.y+"'>Отправить отряд</button>"));
    return;
  }

  if(o.t==="node"){
    // "Сборщик" — кто сейчас черпает эту жилу (o.busy хранит id игрока,
    // ставится в arriveMarch при входе в режим gather); своя добыча
    // показывает прогресс и позволяет отозвать обоз вместо повторной
    // отправки — как отозвать в списке маршей, но прямо с карты.
    const g=W.marches.find(m=>m.tx===o.x&&m.ty===o.y&&m.state==="gather");
    const gp=o.busy!=null?W.players.find(q=>q.id===o.busy):null;
    const mine=g&&g.pid===p.id;
    let body="<div class='hd'>"+RES_SITE_NAME[o.res]+" "+coord+"</div>"+
      "<div class='co'><span>Резервы</span><b>"+fmt(o.amount)+"</b></div>"+
      "<div class='co'><span>Сборщик</span><b>"+(gp?gp.nick:"Никто")+"</b></div>";
    if(mine){
      const f=clamp((W.t-g.t0)/Math.max(1,g.t1-g.t0),0,1);
      const target=(g.carry&&g.carry[o.res])||0, got=Math.round(target*f);
      body+="<div class='co'><span>Собрано</span><b>"+fmt(got)+" / "+fmt(target)+"</b></div>"+
        "<button class='seal wide' style='margin-top:9px' data-act='recall' data-m='"+g.id+"'>Отозвать</button>";
    } else {
      body+="<button class='seal wide' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Собрать</button>";
    }
    put(body);
    return;
  }
  if(o.t==="camp"||o.t==="fort"){
    const fp=banditPower(o.lv), my=armyPower(p.troops,bonuses(p),p.race);
    const ok = my>fp*1.8?["Разгром без потерь","var(--verdigris)"]
             : my>fp*1.1?["Победа с потерями","var(--gilt)"]
             : my>fp*0.8?["Исход не ясен","var(--gilt)"]
             : ["Отряд поляжет","var(--garnet)"];
    put("<div class='hd'>"+(o.t==="fort"?"Форт":"Лагерь")+" разбойников "+coord+"</div>"+
      "<div class='co'><span>Сила заставы</span><b>"+fmt(fp)+"</b></div>"+
      "<div class='co'><span>Ваше войско</span><b>"+fmt(my)+"</b></div>"+
      "<div class='co'><span>Прогноз</span><b style='color:"+ok[1]+"'>"+ok[0]+"</b></div>"+
      "<button class='seal wide blood' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Атаковать</button>");
    return;
  }
  if(o.t==="city"){
    const q=W.players.find(z=>z.id===o.pid);
    if(!q){ put(""); return }
    if(q.id===p.id){ put(""); return }   // своя столица — подпись в 3D, панель тут ни к чему
    // СОСТАВ ВОЙСК ЗДЕСЬ НЕ ПОКАЗЫВАЕТСЯ. Раньше кнопка "Разведка" раскрывала
    // живую роспись чужой армии прямо в панели — мгновенно, бесплатно и с
    // обновлением в реальном времени. Это был чит: знать точный состав
    // обороны в момент удара нельзя. Теперь кнопка отправляет настоящего
    // лазутчика (sendScout), а донесение приходит письмом — снимком на момент
    // прибытия, а не живой сводкой. У разбойников прогноз остаётся: там он
    // уместен и так же устроен в RoK.
    // Ратуша и мощь — открытые сведения (в RoK они видны у любого правителя),
    // по ним нельзя восстановить ни состав, ни тиры войск.
    const scouting=W.marches.some(m=>m.pid===p.id&&m.mode==="scout"&&m.tx===o.x&&m.ty===o.y);
    const hasScout=(p.b.scout||0)>0;
    // Сколько лазутчиков можно держать в пути разом — та же настоящая
    // цифра RoK, что теперь и правда проверяет sendScout (см. там).
    const maxScouts=hasScout?tblRow(SCOUT_TABLE,p.b.scout).scouts:0;
    const scoutsOut=W.marches.filter(m=>m.pid===p.id&&isScoutMarch(m)).length;
    const allBusy=hasScout&&scoutsOut>=maxScouts;
    const shielded=W.t<q.shieldUntil;
    put("<div class='hd'>"+shieldSvg(q.race,14)+q.nick+" "+coord+"</div>"+
      "<div class='co'><span>Город</span><b>"+q.name+"</b></div>"+
      "<div class='co'><span>Ратуша</span><b>"+q.b.hall+"</b></div>"+
      "<div class='co'><span>Сила</span><b>"+fmt(power(q))+"</b></div>"+
      (shielded?"<div class='co'><span>Статус</span><b style='color:#7ab2e0'>Под щитом мира</b></div>":"")+
      (scouting?"<div class='hint'>Лазутчик в пути — донесение придёт письмом.</div>"
       :!hasScout?"<div class='hint'>Постройте "+buildingName("scout",p).toLowerCase()+", чтобы засылать лазутчиков.</div>"
       :allBusy?"<div class='hint'>Все лазутчики в пути ("+scoutsOut+"/"+maxScouts+") — дождитесь возвращения.</div>":"")+
      "<div class='chips' style='margin-top:9px'>"+
        (hasScout&&!scouting&&!allBusy?"<button class='seal' data-act='sendscout' data-x='"+o.x+"' data-y='"+o.y+"'>Разведать</button>":"")+
        (shielded?"":"<button class='seal blood' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Атака</button>")+
      "</div>");
  }
}
// Обёртка для 3D-вкладки: тап по замку/лагерю/точке там вызывает её через

function renderCartoucheFor(x,y){ sel={x,y}; renderCartouche(); }

// Фаза 12, кусочек 4 — та же панель cartouche, но по данным общего мира
// (mpWorldSnapshot(), кусочек 2) вместо W. Переиспользует те же глобальные
// хелперы, что и одиночная ветка выше (shieldSvg/countUnits/fmt/RU/fmtDur/
// key/MARCH_STATE_RU/RES_SITE_NAME) — тот же файл, дублировать нечего.
// Кнопки атаки/сбора/рейда НЕ шлют поход прямо отсюда (нужен выбор состава
// войск, форма для этого уже есть в панели «Общий мир» — city/node/camp
// список там же, свои же mpDoAttack/mpDoGather/mpDoRaid) — вместо
// дублирования формы кнопка выставляет тот же mpState.xTarget, что и
// "...pick" в folio, и открывает folio на вкладке "mp": тот же экран,
// который игрок уже умеет читать, просто с курсором сразу на нужной
// строке. Разведка/отзыв похода — уже однокнопочные действия (без формы),
// оборачиваются в mpCartScout/mpCartRecall ниже, чтобы ошибка сервера не
// потерялась молча (у cartouche нет своего mpState.err-вывода — при сбое
// открываем ту же folio, там он уже показывается).
function renderCartoucheMp(){
  const el=$("#cartouche");
  const put=h=>{
    const full=h?"<button class='cart-close' data-act='closecartouche' title='Закрыть' aria-label='Закрыть'>&times;</button>"+h:h;
    if(full!==lastCart){ lastCart=full; el.innerHTML=full } el.style.display=full?"":"none";
  };
  const snap=mpWorldSnapshot();
  if(!snap){ put(""); return; } // гонка: joined уже true, но mpState.player ещё не подгружен
  const me=snap.players[0], st=(mpState.player&&mpState.player.state)||{};
  if(selMarch!=null){
    const m=snap.marches.find(x=>x.id===selMarch);
    if(!m){ selMarch=null; } // отряд уже прибыл/пропал из mpState, пока панель была открыта
    else {
      const owner=snap.players.find(q=>q.id===m.pid);
      const mine=m.pid===me.id;
      const mcoord="<span class='n' style='font-family:var(--data);font-size:10px;color:var(--vellum-faint)'>"+
        m.tx+" · "+m.ty+"</span>";
      let body="<div class='hd'>"+(owner?shieldSvg(owner.race,14):"")+(owner?owner.nick:"?")+" — отряд "+mcoord+"</div>"+
        "<div class='co'><span>Состояние</span><b>"+(MARCH_STATE_RU[m.state]||m.state)+"</b></div>"+
        "<div class='co'><span>Воинов</span><b>"+RU(countUnits(m.units))+"</b></div>"+
        "<div class='co'><span>Цель</span><b>"+m.tx+" · "+m.ty+"</b></div>"+
        // t0/t1 общего мира — реальное unix-время (Date.now()/1000), НЕ W.t
        // одиночки (см. mpWorldSnapshot()) — иначе "прибытие через" считало
        // бы от чужих часов и показывало бы бессмыслицу.
        (m.state!=="gather"?"<div class='co'><span>Прибытие через</span><b>"+fmtDur(Math.max(0,m.t1-Date.now()/1000))+"</b></div>":"");
      if(mine){
        body+="<button class='seal wide' style='margin-top:9px' data-mp='cartrecall' data-id='"+m.id+"'>Отозвать</button>";
      } else {
        body+="<div class='hint'>Разведка чужих отрядов в пути в общем мире пока не поддержана.</div>";
      }
      put(body);
      return;
    }
  }
  if(!sel){ put(""); return; }
  const o=snap.map[key(sel.x,sel.y)];
  const coord="<span class='n' style='font-family:var(--data);font-size:10px;color:var(--vellum-faint)'>"+
    sel.x+" · "+sel.y+"</span>";
  // Пустошь в общем мире отрядом не засеять — march-по-клетке (в одиночке
  // ведущий домой марш просто разворачивается сам, arriveMarch) для
  // общего мира не перенесён: у mp-attack/mp-gather/mp-raid всегда есть
  // конкретная цель (город/точка/лагерь), похода "в пустоту" тут нет.
  if(!o){ put(""); return; }
  if(o.t==="node"){
    const amount=o.amount||0;
    let body="<div class='hd'>"+(RES_SITE_NAME[o.res]||o.res)+" "+coord+"</div>"+
      "<div class='co'><span>Уровень</span><b>"+(o.lv||1)+"</b></div>"+
      "<div class='co'><span>Резервы</span><b>"+fmt(amount)+"</b></div>";
    body += amount>0
      ? "<button class='seal wide' style='margin-top:9px' data-mp='cartgatherpick' data-k='"+o.x+","+o.y+"'>Собрать</button>"
      : "<div class='hint'>Точка истощена.</div>";
    put(body);
    return;
  }
  if(o.t==="camp"||o.t==="fort"){
    put("<div class='hd'>"+(o.t==="fort"?"Форт":"Лагерь")+" варваров "+coord+"</div>"+
      "<div class='co'><span>Уровень</span><b>"+(o.lv||1)+"</b></div>"+
      "<button class='seal wide blood' style='margin-top:9px' data-mp='cartraidpick' data-k='"+o.x+","+o.y+"'>Атаковать</button>");
    return;
  }
  if(o.t==="city"){
    const q=snap.players.find(z=>z.id===o.pid);
    if(!q || q.id===me.id){ put(""); return; } // своя столица — панель тут ни к чему, свободная клетка выше уже отсеяна
    const hasScout=(st.b&&st.b.scout)>0;
    put("<div class='hd'>"+shieldSvg(q.race,14)+q.nick+" "+coord+"</div>"+
      "<div class='co'><span>Ратуша</span><b>"+q.b.hall+"</b></div>"+
      "<div class='chips' style='margin-top:9px'>"+
        (hasScout?"<button class='seal' data-mp='cartscout' data-id='"+q.id+"'>Разведать</button>":"")+
        "<button class='seal blood' data-mp='cartattackpick' data-id='"+q.id+"'>Атака</button>"+
      "</div>");
    return;
  }
  put("");
}
// Разведка одним тапом (без формы) — оборачивает mpDoScout, чтобы ошибку
// сервера (нет здания/лазутчики заняты) не потерять молча: у cartouche
// своего вывода mpState.err нет, при сбое открываем folio, где он уже
// показывается; при успехе — просто herald прямо на карте, без смены экрана.
async function mpCartScout(id){
  await mpDoScout(id);
  if(mpState.err) openMenuModal("mp"); else herald("Лазутчик отправлен.");
}
async function mpCartRecall(id){
  await mpDoRecall(id);
