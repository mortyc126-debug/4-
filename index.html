}

/* ---- Город ---- */
function cityCellLevel(p,c){
  if(!c.bk) return -1; // задел на будущее, не активна
  return c.pl!=null ? p.b[c.bk][c.pl] : p.b[c.bk];
}
function cityCellImg(c){
  return c.bk ? "images/buildings/"+c.bk+(c.pl!=null?(c.pl+1):"")+".png" : "";
}
function renderCityMap(){
  const p=me();
  let h="<div id='citymap-wrap'><img class='base' src='map.jpg'>";
  CITY_CELLS.forEach(c=>{
    const lv=cityCellLevel(p,c);
    if(c.bk===null){ // Портал — задел на будущее
      h+="<div class='cbuild locked' style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
         "<div class='shape' style='"+cityShapeCss(c)+"'></div></div>";
      return;
    }
    const built=lv>0, locked=c.bk!=="hall" && !built && (c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall));
    h+="<div class='cbuild"+(built?" built":"")+(locked?" locked":"")+"' data-cell='"+CITY_CELLS.indexOf(c)+"' "+
       "style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
       "<div class='shape' style='"+cityShapeCss(c)+"'></div>"+
       (built?(c.bk!=="wall"?"<img class='bimg' src='"+cityCellImg(c)+"'>":"")+"<span class='lvl'>"+lv+"</span>":"")+
       "</div>";
  });
  h+="</div>";
  return h;
}
// Фаза 14, кусочек 2 — визуальная 2D-карта города для общего мира: дословно
// та же разметка/CSS, что и у renderCityMap() выше (#citymap-wrap/.cbuild/
// .shape/.bimg/.lvl — ни одного нового правила не понадобилось), просто p
// строится из mpState.player, а не me(). cityCellLevel/cityShapeCss/
// cityCellImg/plotUnlocked — чистые функции от p.b/p.race, реальной разницы
// для общего мира нет (тот же pShim-приём, что уже был в foMultiplayer).
// Клик по ячейке (data-mpcell, не data-cell — не сталкивается с одиночным
// openBuildingModal/handleAct) выделяет её (mpCitySel) и разворачивает
// mpCellPanelHtml() ниже картой — уже настоящее действие "Улучшить"/
// "Построить" (data-mp='build', та же кнопка, что и в списке "Постройки"
// foMultiplayer), не просто herald с именем — см. Фазу 14, кусочек 4.
function mpCityShim(){ return {race:mpState.player.race, b:mpState.player.state.b}; }
let mpCitySel=-1;
function mpRenderCityMap(){
  const p=mpCityShim();
  let h="<div id='citymap-wrap'><img class='base' src='map.jpg'>";
  CITY_CELLS.forEach(c=>{
    const lv=cityCellLevel(p,c);
    if(c.bk===null){
      h+="<div class='cbuild locked' style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
         "<div class='shape' style='"+cityShapeCss(c)+"'></div></div>";
      return;
    }
    const idx=CITY_CELLS.indexOf(c);
    const built=lv>0, locked=c.bk!=="hall" && !built && (c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall));
    h+="<div class='cbuild"+(built?" built":"")+(locked?" locked":"")+(mpCitySel===idx?" sel":"")+"' data-mpcell='"+idx+"' "+
       "style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
       "<div class='shape' style='"+cityShapeCss(c)+"'></div>"+
       (built?(c.bk!=="wall"?"<img class='bimg' src='"+cityCellImg(c)+"'>":"")+"<span class='lvl'>"+lv+"</span>":"")+
       "</div>";
  });
  if(mpCitySel>=0) h+=mpCellPanelHtml(mpCitySel);
  h+="</div>";
  return h;
}
// Та же ветвящаяся логика (участок ещё не открыт / в очереди / макс.
// уровень / нужна ратуша / ратуше не хватает построек-требований HALL_REQ /
// обычная стоимость), что и у renderPlotRow() внутри foMultiplayer() —
// намеренно НЕ рефакторено в общую функцию: тот список уже отгружен и
// протестирован, трогать его ради этой панели — лишний риск регресса без
// пользы. cost/time — та же формула (buildCost/buildTime, чистые функции),
// просто для ОДНОЙ выбранной ячейки, а не всего списка построек разом.
function mpCellPanelHtml(idx){
  const c=CITY_CELLS[idx]; if(!c || !c.bk) return "";
  const st=mpState.player.state, pShim=mpCityShim();
  const bld=c.bk, isMultiBld=BUILD_MP_MULTI.has(bld), plot=isMultiBld?c.pl:null;
  const lv=cityCellLevel(pShim,c), nextLv=lv+1, hallLv=st.b.hall||0;
  const queued=st.queues.find(q=>q&&q.b===bld&&q.plot===plot);
  let body="<div class='title'>"+buildingName(bld,pShim)+(isMultiBld?" — участок "+(plot+1):"")+" — уровень "+lv+"</div>";
  if(isMultiBld && !plotUnlocked(bld,plot,hallLv)){
    body+="<div class='note'>Участок откроется позже (нужна ратуша "+([0,7,13,19][plot])+" ур.).</div>";
  } else if(queued){
    const left=Math.max(0,queued.t1-Date.now()/1000);
    body+="<div class='note'>Строится до "+nextLv+" ур., осталось "+fmtDur(left)+"</div>";
  } else if(nextLv>buildingMax(bld)){
    body+="<div class='note'>Максимальный уровень.</div>";
  } else if(bld==="hall"){
    const need=HALL_REQ.filter(k=>{
      const raw=st.b[k]; return (BUILD_MP_MULTI.has(k)?((Array.isArray(raw)?raw[0]:raw)||0):(raw||0))<hallLv;
    });
    if(need.length){
      body+="<div class='note'>Сначала до "+hallLv+" ур.: "+need.map(k=>buildingName(k,pShim)).join(", ")+"</div>";
    } else {
      const cst=buildCost(bld,nextLv), t=buildTime(bld,nextLv);
      body+="<div class='note'>До "+nextLv+" ур.: "+
        (RES.some(r=>cst[r])?RES.filter(r=>cst[r]).map(r=>RES_NAME[r]+" "+RU(cst[r])).join(", "):"бесплатно")+
        " · "+fmtDur(t)+"</div>"+
        "<button class='seal' data-mp='build' data-bk='"+bld+"'"+(mpState.loading?" disabled":"")+">Улучшить</button>";
    }
  } else if(nextLv>hallLv){
    body+="<div class='note'>Требуется ратуша "+nextLv+" уровня (сейчас "+hallLv+").</div>";
  } else {
    const cst=buildCost(bld,nextLv), t=buildTime(bld,nextLv);
    body+="<div class='note'>До "+nextLv+" ур.: "+
      (RES.some(r=>cst[r])?RES.filter(r=>cst[r]).map(r=>RES_NAME[r]+" "+RU(cst[r])).join(", "):"бесплатно")+
      " · "+fmtDur(t)+"</div>"+
      "<button class='seal' data-mp='build' data-bk='"+bld+"'"+(plot!=null?" data-plot='"+plot+"'":"")+(mpState.loading?" disabled":"")+">"+(lv?"Улучшить":"Построить")+"</button>";
  }
  body+=" <button class='seal' data-mp='citycellclose'>Закрыть</button>";
  return "<div class='mp-cell-panel entry'><div class='line'><div class='fill'>"+body+"</div></div></div>";
}
// Тот же приём диффа/сохранения scrollTop, что и у renderFolio() —
// #folio делит DOM-узел с одиночкой (той же разметкой), но текст сюда
// пишет отдельная функция, потому что источник данных другой (mpState, не
// W/me()) и рендер-цикл одиночки (frame()) при .mp-gated не запускается —
// renderFolio() эту ветку никогда бы не вызвала сама.
let lastMpFolio="";
function mpRenderFolio(){
  if(!mpState.player) return;
  const h=mpRenderCityMap();
  if(h===lastMpFolio) return;
  lastMpFolio=h;
  const el=$("#folio"); if(!el) return;
  const st=el.scrollTop;
  el.innerHTML=h; el.scrollTop=st;
}
// Фаза 14, кусочек 3 — своя мощь для шапки общего мира: дословно та же
// сумма, что и у одиночного power() (buildingPower по всем BKEYS + войска
// дома по unitPower + войска в походах + исследования (researchPower) +
// генерал (genPowerOf) + снаряжение (gearPowerOf)) — отличие ровно одно:
// войска "в походах" берутся из mpState.marches (свои реальные марши с
// сервера), а не из глобального W.marches (столицы НЕВИДИМОЙ одиночки).
function mpPower(p){
  let v=0; BKEYS.forEach(k=>{
    const lv=p.b[k];
    if(Array.isArray(lv)) lv.forEach(l=>v+=buildingPower(k,l)); else v+=buildingPower(k,lv);
  });
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) v+=((p.troops[t]&&p.troops[t][i])||0)*unitPower(i)});
  mpState.marches.forEach(m=>TKEYS.forEach(t=>{for(let i=1;i<=5;i++)v+=((m.units&&m.units[t]&&m.units[t][i])||0)*unitPower(i)}));
  [...ACADEMY_TREE.eco,...ACADEMY_TREE.mil].forEach(n=>{
    const lv=(p.tech&&p.tech[n.id])||0; if(lv) v+=researchPower(n,lv);
  });
  v+=genPowerOf(p);
  v+=gearPowerOf(p);
  return Math.round(v);
}

function jumpToMarchFor(marchId){
  const app=$("#app");
  if(app.classList.contains("view-city")) toggleView();
  const frame=$("#world3d");
  if(frame && !frame.src) frame.src="engine/dist/index.html";
  const tryStart=()=>{
    try{
      const cw=frame.contentWindow;
      if(cw && typeof cw.startFollowMarch==="function"){ cw.startFollowMarch(marchId); return true; }
    }catch(e){}
    return false;
  };
  if(!tryStart()){
    let tries=0;
    const iv=setInterval(()=>{ tries++; if(tryStart()||tries>50) clearInterval(iv); },100);
  }
}

function nodeEffectRows(n,lv,nx){
  if(n.unlock) return [{label:"Открывает бойца",icon:"class-"+n.unlock.type,now:lv>=1?"открыто":"заперто",next:null}];
  // Маскировка не даёт числовой процент — уровень технологии напрямую
  // определяет ступень подробности донесений разведки (см. scoutSnapshot):
  // выдумывать здесь "+N% точность разведки" значило бы врать о механике,
  // которой не существует — узел исторически делил поле "scoutBonus" с
  // mil_scout1, но реального числового бонуса ни один из них не даёт.
  if(n.id==="mil_scout2") return [{label:"Подробность донесений",icon:RESEARCH_FIELD_ICON.scoutBonus,
    now:"ступень "+lv+"/"+n.max, next:lv>=n.max?null:"ступень "+nx+"/"+n.max}];
  const list=n.effects||[{field:n.field,total:n.total}];
  const fname=f=>RESEARCH_FIELD_NAME[f]||f;
  const maxed=lv>=n.max;
  return list.map(e=>({
    label:fname(e.field),
    icon:RESEARCH_FIELD_ICON[e.field],
    now:"+"+Math.round(e.total*(lv/n.max)*100)+"%",
    next:maxed?null:"+"+Math.round(e.total*(nx/n.max)*100)+"%"
  }));
}

       "<div class='rnode'><div class='rnode-hd'>"+unitThumb(p,T.type,T.tier)+"<b>"+unitName(T.type,T.tier,p.race)+"</b>"+
       "<span class='rnode-lv'>&times;"+RU(T.n)+"</span></div>"+
       "<div class='rnode-eff'>Готовы через <em>"+fmtDur(T.t1-W.t)+"</em></div></div></div>";
  }
  return "<div id='bm-tree'><button class='rnode-go' data-act='browsetrain' data-t='"+type+"'>Тренировать</button></div>";
}

function buildingStatDeltaHtml(bk,lv,nx){
  const B=BUILDINGS[bk];
  if(B.prod){
    const mult={food:1,wood:1,stone:0.75,gold:0.5}[B.prod];   // см. те же числа в production()
    const cur=Math.round(prodRate(lv)*mult), next=Math.round(prodRate(nx)*mult);
    return "<table id='bm-stats'><tr><td>Добыча "+RES_NAME[B.prod].toLowerCase()+"/ч</td><td>"+fmt(cur)+" &rarr; "+fmt(next)+"</td></tr></table>";
  }
  if(bk==="store"){
    return "<table id='bm-stats'><tr><td>Базовая защита склада</td><td>"+fmt(storeCap(lv))+" &rarr; "+fmt(storeCap(nx))+"</td></tr></table>";
  }
  if(bk==="hospital"){
    return "<table id='bm-stats'><tr><td>Мест в лазарете</td><td>"+fmt(hospitalCap(lv))+" &rarr; "+fmt(hospitalCap(nx))+"</td></tr></table>";
  }
  if(bk==="wall"){
    return "<table id='bm-stats'>"+
      "<tr><td>Прочность стены</td><td>"+fmt(maxWallHp(lv))+" &rarr; "+fmt(maxWallHp(nx))+"</td></tr>"+
      "<tr><td>Защита при обороне</td><td>+"+(wallDefBonus(lv)*100).toFixed(1)+"% &rarr; +"+(wallDefBonus(nx)*100).toFixed(1)+"%</td></tr></table>";
  }
  if(bk==="portal"){
    const p=me(), gated=epochOf(p.b.hall)<3;
    const sc=l=>Math.max(0,Math.min(0.5,(l-PORTAL_GATE_LV)/(CFG.MAX_LEVEL-PORTAL_GATE_LV)*0.5));
    return "<table id='bm-stats'>"+
      "<tr><td>Скорость марша</td><td>+"+(portalMarchBonus(lv)*100).toFixed(1)+"% &rarr; +"+(portalMarchBonus(nx)*100).toFixed(1)+"%</td></tr>"+
      "<tr><td>Сокращение пути отряда</td><td>"+(gated?"откроется на 3 эпохе":"&minus;"+(sc(lv)*100).toFixed(0)+"% &rarr; &minus;"+(sc(nx)*100).toFixed(0)+"%")+"</td></tr></table>";
  }
  if(bk==="garrison"){
    return "<table id='bm-stats'><tr><td>Урон залпа гарнизона</td><td>"+fmt(WATCH_TABLE[lv-1].atk)+" &rarr; "+fmt(WATCH_TABLE[nx-1].atk)+"</td></tr></table>";
  }
  if(bk==="scout"){
    // bonus/scouts — настоящие цифры RoK по уровням здания, и оба теперь
    // реально работают (см. sendScout): scouts — сколько лазутчиков можно
    // держать в пути одновременно, bonus — надбавка к их скорости. Радиус
    // обзора (третья колонка у RoK) убран целиком — в этой игре нет тумана
    // войны на карте, чтобы он что-то значил.
    const c=SCOUT_TABLE[lv-1], n=SCOUT_TABLE[nx-1];
    return "<table id='bm-stats'>"+
      "<tr><td>Бонус скорости разведки</td><td>+"+c.bonus+"% &rarr; +"+n.bonus+"%</td></tr>"+
      "<tr><td>Разведчиков одновременно</td><td>"+c.scouts+" &rarr; "+n.scouts+"</td></tr></table>";
  }
  if(BLD_TRAIN[bk]){
    return "<table id='bm-stats'><tr><td>Воинов за один заказ</td><td>"+fmt(trainCap(lv))+" &rarr; "+fmt(trainCap(nx))+"</td></tr></table>";
  }
  return "";
}
function buildingModalHtml(ci){
  const p=me(), c=CITY_CELLS[ci];
  if(!c||!c.bk) return "";
  const lv=cityCellLevel(p,c), nx=lv+1, maxed=lv>=buildingMax(c.bk);
  let gated=c.bk!=="hall"&&nx>p.b.hall, gateTxt=gated?"нужна ратуша "+nx:"";
  if(c.bk==="hall"){ const need=HALL_REQ.filter(k=>hallGateLevel(p,k)<p.b.hall);
    if(need.length){ gated=true; gateTxt="сначала "+need.map(k=>buildingName(k,p).toLowerCase()+" до "+p.b.hall+" ур.").join(", "); } }
  const locked=c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall);
  if(locked){ gated=true; gateTxt="откроется на эпохе "+(c.pl+1); }
  const plotKey = c.pl!=null ? c.pl : null;
  const queued = p.queues.find(q=>q && q.b===c.bk && q.plot===plotKey);
  const cst=buildCost(c.bk,nx,p), canGo=!maxed&&!gated&&!queued;
  const img=cityCellImg(c);
  const desc=(BUILDINGS[c.bk]&&BUILDINGS[c.bk].desc)||"";
  let h="<img id=\'bm-art\' src=\'"+img+"\'>";
  h+="<div id=\'bm-title\'>"+buildingName(c.bk,p)+(c.pl!=null?" · участок&nbsp;"+(c.pl+1):"")+"</div>";
  h+="<div id=\'bm-sub\'>уровень "+lv+(maxed?" (максимум)":" &rarr; "+nx)+"</div>";
  if(desc) h+="<div id=\'bm-desc\'>"+desc+"</div>";
  if(!maxed && lv>0){
    h+="<table id=\'bm-stats\'><tr><td>Мощь здания</td><td>"+fmt(buildingPower(c.bk,lv))+" &rarr; "+fmt(buildingPower(c.bk,nx))+"</td></tr></table>";
    h+=buildingStatDeltaHtml(c.bk,lv,nx);
  }
  if(c.bk==="hall"){
    if(epochOf(nx)>epochOf(lv)) h+="<div id=\'bm-opens\'>Открывает: "+RACE_EPOCHS[p.race][epochOf(nx)-1].title+"</div>";
    h+=hallInfoHtml(p);
  }
  else if(c.bk==="store") h+=storeInfoHtml(p);
  else if(c.bk==="academy") h+=academyTreeHtml(p);
  else if(c.bk==="forge" && lv>0) h+=forgeInfoHtml(p);
  else if(BLD_TRAIN[c.bk] && lv>0) h+=trainInfoHtml(p,BLD_TRAIN[c.bk]);
  else if(c.bk==="hospital" && lv>0) h+=hospitalInfoHtml(p);
  if(canGo){
    h+="<div id=\'bm-reqs\'>"+RES.map(r=>{
      const need=cst[r]||0; if(!need) return "";
      const short=p.res[r]<need;
      return "<div class=\'req-row\'><img src=\'images/ui/res-"+r+".png\'>"+
        "<span class=\'req-name\'>"+RES_NAME[r]+"</span>"+
        "<span class=\'req-amt"+(short?" short":"")+"\'>"+fmt(need)+" / "+fmt(p.res[r])+"</span></div>";
    }).join("")+"</div>";
    h+="<div id=\'bm-time\'>Время строительства: "+fmtDur(buildTime(c.bk,nx)/bonuses(p).build)+"</div>";
  } else if(queued){
    h+="<div id=\'bm-time\'>Уже строится — готово через "+fmtDur(queued.t1-W.t)+"</div>";
  } else if(gated){
    h+="<div id=\'bm-time\'>"+gateTxt+"</div>";
  }
  const actionLabel = lv<=0?"Построить":"Улучшить";
  h+="<button id=\'bm-btn\' data-act=\'build\' data-b=\'"+c.bk+"\' "+(c.pl!=null?"data-plot=\'"+c.pl+"\' ":"")+
     (canGo?"":"disabled")+">"+(maxed?"Предел уровня":queued?"Уже строится":canGo?actionLabel:"Недоступно")+"</button>";
  return h;
}

// Венок под мощью — фиксированного размера (152px), а сама мощь без
// потолка растёт всю партию. Сокращаем разряды через fmt() ("1.23 млн"),
// но даже сокращённая строка не гарантированно влезает в тот же зазор при
// любой длине — поэтому шрифт ещё и подстраивается под длину результата:
// 6 символов ("19 933") — те самые 20px, на которых венок подгонялся, а
// на каждый лишний символ чуть сжимаем, до жёсткого пола в 12px (дальше
// нечитаемо мелко, лучше слегка вылезти за край, чем свести число к пыли).
function profilePowerFontSize(str){
  return Math.max(12, 20-Math.max(0,str.length-6)*1.4);
}
/* ---- Профиль игрока — заглушка, полноценный экран доделаем позже.
   Сюда со временем переедут: сводка по войскам, снаряжение генерала,
   достижения и т.п. Пока только то, что раньше висело в карточке города. ---- */

  h+="<div class='entry hot profile-card'>"+

       ? "<img class='profile-avatar' src='"+avSrc+"' alt=''>"

     "<img class='profile-ring' src='images/ui/profile-ring.png' alt=''>"+
     (avSrc
       ? "<span class='profile-shield-badge'>"+
         "<span class='fill'><img src='images/ui/"+RACE_CREST[p.race]+"-badge.png' alt='"+RACES[p.race].name+"'></span>"+
         "<img src='images/ui/profile-shield-frame.png' alt=''></span>"

     "</div>"+
     "<div class='profile-name-row'>"+
     "<input id='nick-input' type='text' maxlength='24' value='"+(p.nick||"").replace(/'/g,"&#39;")+"' "+
     "placeholder='Ваш ник'>"+
     "<button class='seal' data-act='savenick'>Сохранить</button></div>"+
     "<div class='note'>"+RACES[p.race].name+"</div>"+
     "<div class='profile-power-wrap'><img class='wreath' src='images/ui/profile-wreath.png' alt=''>"+

  // Предпросмотр экрана летописи. Тот же самый экран, что видит новый игрок,

  h+=rubric("Оформление","предпросмотр");

}

/* ---- Почта ---- */
// Только категории, у которых реально есть источник данных в этой игре:
// "Отчёты" (бои за город, см. pushBattleReport), "Личное" (события уровня
// игрока — пока только повышение генерала), "Система" (например, сводка
// "пока вас не было"), "Избранное" (не своя категория, а фильтр fav===true
// по всем остальным). "Альянс"/"Отправленные" из референса — НЕ добавлены:
// в этой игре нет ни альянсов, ни переписки между игроками (single-player
// против ботов), вкладка без единого способа когда-либо получить в неё
// хоть одну запись — мёртвый UI, а не функциональность про запас.
let mailCat="report", mailOpenId=null;
const MAIL_TABS=[["report","Отчёты"],["personal","Личное"],["system","Система"],["fav","Избранное"]];
function mailInCat(cat){
  return cat==="fav" ? W.mail.filter(m=>m.fav) : W.mail.filter(m=>m.cat===cat);
}
function mailAgo(t){
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<60) return "только что";
  if(s<3600) return Math.floor(s/60)+" мин назад";
  if(s<86400) return Math.floor(s/3600)+" ч назад";
  return Math.floor(s/86400)+" дн назад";
}
function mailAvatarHtml(avatar,race,w){
  return avatar ? "<img class='av' style='width:"+w+"px;height:"+w+"px' src='"+avatar+"' alt=''>"
                : "<span class='av' style='width:"+w+"px;height:"+w+"px;display:inline-flex;align-items:center;justify-content:center'>"+shieldSvg(race,w*0.55)+"</span>";
}
function mailRowHtml(m){
  const isBattle=m.kind==="battle";
  const icon = isBattle||m.kind==="barbarian" ? "images/ui/mail-seal.png"
             : m.kind==="scout"||m.kind==="scoutmarch" ? "images/ui/icon-world.png"
             : m.kind==="gather" ? "images/ui/icon-march.png"
             : m.cat==="personal" ? "images/ui/icon-gen.png" : "images/ui/icon-world.png";
  const cls = isBattle ? (m.win?"win":"lose") : m.kind==="barbarian" ? "win" : "";
  const title = isBattle ? (m.win?"Победа":"Поражение")
              : m.kind==="barbarian" ? "Лагерь разбит"
              : m.kind==="scout" ? "Разведка"
              : m.kind==="scoutmarch" ? "Разведка отряда"
              : m.kind==="gather" ? "Сбор ресурсов"
              : m.title;
  const sub = isBattle ? (m.attacker?"Вы атаковали "+m.oppNick:"Вас атаковал "+m.oppNick)
            : m.kind==="barbarian" ? "Лагерь "+m.lv+" ур. · X:"+m.coords.x+" Y:"+m.coords.y
            : m.kind==="scout" ? m.oppNick+" · X:"+m.oppCoords.x+" Y:"+m.oppCoords.y
            : m.kind==="scoutmarch" ? m.oppNick+" · X:"+m.coords.x+" Y:"+m.coords.y
            : m.kind==="gather" ? resName(m.res)+" "+fmt(m.amount)+" · X:"+m.coords.x+" Y:"+m.coords.y

    "<div class='tx'><div class='tt'>"+title+"</div><div class='sb'>"+sub+"</div></div>"+
    "<div class='tm'>"+mailAgo(m.t)+"</div></div>";

/* Хроника боя в письме. Записи приходят из движка помеченными "A"/"D" —
   чья это была удача. Читателю же надо видеть "моя/чужая", а отчёт у каждой
   стороны свой, поэтому переводим по флагу attacker: для атакующего "A" —
   своё, для защитника — наоборот. Записи без стороны (сводка по схватке)
   остаются нейтральными. */
const BATTLE_LOG_ICON={weather:"&#9730;",volley:"&#10148;",tower:"&#9819;",panic:"&#9888;",
  counter:"&#8634;",raise:"&#9760;",general:"&#9876;",mark:"&#9873;",round:"&#8226;",
  rout:"&#8617;",end:"&#9873;"};
// Проценты бонуса — со знаком (+12.3% / −4.0%), тем же округлением, что и
// остальные проценты в игре (одна десятая, как у snap talents/statTxt).
function pctTxt(v){ return (v>=0?"+":"")+(v*100).toFixed(1)+"%"; }
// Строки "Статистика войск" отчёта — по родам войск атака/защита у обеих
// сторон рядом (та же таблица .mail-stats, что и у потерь выше), плюс
// общее здоровье последней строкой (см. комментарий у battleBuffSnapshot —
// в нашей модели оно не зависит от рода войск).
function battleStatsRows(sb,ob){
  let h="";
  TKEYS.forEach(t=>{
    h+="<tr><td>"+TROOP_TYPES[t].name+" · атака</td><td>"+pctTxt(sb[t].atk)+"</td><td>"+pctTxt(ob[t].atk)+"</td></tr>";
    h+="<tr><td>"+TROOP_TYPES[t].name+" · защита</td><td>"+pctTxt(sb[t].def)+"</td><td>"+pctTxt(ob[t].def)+"</td></tr>";
  });
  h+="<tr><td>Здоровье</td><td>"+pctTxt(sb.hp)+"</td><td>"+pctTxt(ob.hp)+"</td></tr>";
  return h;
}
// Полководец в шапке отчёта — имя/уровень уже были, добавились звёзды (та
// же формула, что и в foGen()) и ветка талантов, что реально была активна
// в момент боя (не "как сейчас" — билд после боя мог уже смениться).
function battleGenHtml(g){
  if(!g) return "";
  const stars="&#9733;".repeat(g.stars)+"&#9734;".repeat(6-g.stars);
  const tal=g.talents?TALENT_BRANCHES.map(([key,br])=>br.name+" "+(g.talents[key]||0)).join(" · "):"";
  return "<div class='gen'>"+g.name+" (ур. "+g.lv+") "+stars+"</div>"+
    (tal?"<div class='gen-tal'>"+tal+"</div>":"");
}
function battleLogHtml(m){
  const log=m.log||[];
  if(!log.length) return "";
  const mine = m.attacker===false ? "D" : "A";
  let h="<div class='mail-chron'><div class='mail-chron-hd'>Как шёл бой</div>";
  log.forEach(e=>{
    const tone = !e.side ? "" : (e.side===mine ? " good" : " bad");
    h+="<div class='chron-row "+e.kind+tone+"'>"+
       "<i class='chron-ico'>"+(BATTLE_LOG_ICON[e.kind]||"&#8226;")+"</i>"+
       "<span class='chron-tx'>"+e.text+"</span></div>";
  });
  return h+"</div>";
}
/* Донесение лазутчика. Раньше это был один абзац сплошным текстом; теперь
   отчёт устроен по ступеням разведки, как в RoK, и каждая следующая ступень
   ДОБАВЛЯЕТ раздел, а не подменяет предыдущий:
     1 — только грубая численность ("около стольки-то");
     2 — точная численность и запасы в городе;
     3 — разбивка по родам войск (уже видно, чем обороняются);
     4 — разбивка по тирам внутри рода (видно, насколько войска сильны);
     5 — полководец, стена и гарнизон.
   Чего лазутчик не достал, то честно помечено как недоступное с подсказкой,
   до какого уровня растить Разведку — иначе непонятно, это у противника пусто
   или это ты не дотянулся. */
const SCOUT_TIER_LABEL=["Т1","Т2","Т3","Т4","Т5"];
function scoutRow(label,value){
  return "<div class='sc-row'><span>"+label+"</span><b>"+value+"</b></div>";
}
function scoutLocked(label,need){
  // "Маскировка" (mil_scout2) — та самая академическая технология, что в
  // реальном RoK отвечает за подробность донесений (Camouflage), не
  // уровень здания Разведки (см. scoutSnapshot выше).
  return "<div class='sc-row locked'><span>"+label+"</span><b>Маскировка "+need+" ур.</b></div>";
}
function scoutReportHtml(m){
  const iv=m.intel||{}, se=iv.se||0;
  // Ступени привязаны к уровню "Маскировки" (mil_scout2), см. scoutSnapshot —
  // 1..5, каждая закрывает пару ступеней настоящей 10-уровневой Camouflage.
  const NEED=[1,2,3,4,5];
  let h="<div class='mail-vs'><div class='mail-side'>"+mailAvatarHtml(m.oppAvatar,m.oppRace,52)+
    "<div class='nm'>"+m.oppNick+"</div><div class='co'>X:"+m.oppCoords.x+" Y:"+m.oppCoords.y+"</div>"+
    "<div class='pw'>Ратуша "+m.hall+" · мощь "+RU(m.oppPower)+"</div></div></div>";
  if(m.shielded) h+="<div class='mail-weather'><b>Город под щитом мира</b>"+
    "<span>Пока щит держится, напасть нельзя.</span></div>";

  // Запасы — самая ранняя ступень (наравне с прикидкой числа войск), не
  // требует вообще ничего сверх самой "Маскировки" 1 ур.
  h+="<div class='sc-block'><div class='sc-hd'>Запасы</div>";
  if(iv.res){
    RES.forEach(rr=>h+=scoutRow(RES_NAME[rr], fmt(iv.res[rr])));
    h+="<div class='sc-note'>Часть запасов защищена складом и при набеге не достанется.</div>";
  } else h+=scoutLocked("Запасы города", NEED[0]);
  h+="</div>";

  h+="<div class='sc-block'><div class='sc-hd'>Гарнизон</div>";
  if(se>=1){
    h+= se>=3 ? scoutRow("Войск всего", RU(iv.total))
              : scoutRow("Войск (на глаз)", "около "+fmt(Math.round(iv.total/100)*100));
  } else {
    h+=scoutLocked("Численность войск", NEED[0]);
  }
  if(se>=3 && iv.byType && iv.byType.length){
    iv.byType.forEach(x=>{
      // на 4-й ступени рядом с родом войск показываем и раскладку по тирам
      const tiers = se>=4 && iv.byTier ? (iv.byTier.find(y=>y.t===x.t)||{}).parts : null;
      h+=scoutRow(TROOP_TYPES[x.t].name, RU(x.n)+
        (tiers&&tiers.length?"<em class='sc-tiers'>"+tiers.map(pp=>SCOUT_TIER_LABEL[pp.i-1]+" "+RU(pp.n)).join(" · ")+"</em>":""));
    });
  } else if(se>=1){
    h+=scoutLocked("По родам войск", NEED[2]);
  }
  if(se>=1 && se<4) h+=scoutLocked("По тирам", NEED[3]);
  h+="</div>";

  // Город: стена (со ступени 2, вместе с уровнем полководца — см. ниже),
  // академия (со ступени 3, вместе с раскладкой по родам войск выше),
  // гарнизонная башня (со ступени 4, вместе с раскладкой по тирам выше) —
  // порядок ступеней в точности как в настоящем RoK, просто по два пункта
  // реальной лестницы за один наш узел "Маскировки".
  h+="<div class='sc-block'><div class='sc-hd'>Город</div>";
  h+= se>=2 ? scoutRow("Стена", iv.wall+" ур. · прочность "+RU(iv.wallHp)+" / "+RU(iv.wallMax))
            : scoutLocked("Стена", NEED[1]);
  h+= se>=3 ? scoutRow("Академия", iv.academy+" ур.") : scoutLocked("Академия", NEED[2]);
  h+= se>=4 ? scoutRow("Гарнизон (башня)", iv.garrison+" ур.") : scoutLocked("Гарнизон (башня)", NEED[3]);
  h+= se>=5 ? scoutRow("Лазарет", RU(iv.wounded)+" раненых") : scoutLocked("Лазарет", NEED[4]);
  h+="</div>";

  // Полководец: кто именно — не тайна, портрет уже в шапке письма (см.
  // scoutSnapshot выше), гадать незачем. Уровень открывается той же
  // ступенью, что и стена (настоящий RoK тоже даёт их рядом — 4 и 5), а
  // полный расклад — куда вложены очки таланта и что надето — только на
  // максимуме, как и подробный билд командира в настоящей игре.
  h+="<div class='sc-block'><div class='sc-hd'>Полководец</div>";
  if(se>=2){
    h+= iv.genLv!=null ? scoutRow("Уровень", "ур. "+iv.genLv) : scoutRow("Полководец", "не выбран");
  } else {
    h+=scoutLocked("Уровень", NEED[1]);
  }
  if(se>=5 && iv.genLv!=null){
    // Не просто число очков, а КУДА они вложены: разбивка по веткам — уже
    // тактическая информация (пусто в "Армия" — слабая защита войск),
    // просто сумма для этого не годится.
    h+=scoutRow("Таланты", TALENT_BRANCHES.map(([key,br])=>br.name+" "+(iv.genTal[key]||0)).join(" · "));
    // Снаряжение — тоже часть боевой мощи генерала. Мало знать, ЧТО
    // надето — нужно понимать, ЧТО ИМЕННО оно даёт, поэтому рядом с
    // редкостью — те же характеристики предмета, что показывает и
    // genGearHtml у себя в профиле (см. gearItemStats/statTxt).
    h+=scoutRow("Снаряжение", "мощь "+RU(iv.gearPower)+
      (iv.gear&&iv.gear.length?"<em class='sc-tiers'>"+iv.gear.map(g=>
        g.name+" <span style='color:"+RARITY_COLOR[g.rarity-1]+"'>"+RARITY_NAMES[g.rarity-1]+"</span>"+
        " ("+statTxt(g.stats)+")").join(" · ")+"</em>"
       :""));
  } else if(se>=2){
    h+=scoutLocked("Таланты, снаряжение", NEED[4]);
  }
  h+="</div>";

  h+="<div class='sc-note'>Донесение — снимок на момент, когда лазутчик добрался до города. "+
     "К вашему подходу состав обороны может измениться.</div>";
  return h;
}
// Разведка отряда в поле — та же лестница ступеней (см. scoutMarchSnapshot),
// но объект проще: нет запасов/стены/академии, только сам отряд и то, взял
// ли хозяин с собой полководца. Шапка письма — не портрет города (тут нет
// города), а сам отряд: чем занят (собирает/осаждает) и что именно, если
// известно (m.res — только при mode="gather", осада ничего не собирает).
function scoutMarchReportHtml(m){
  const iv=m.intel||{}, se=iv.se||0;
  const NEED=[1,2,3,4,5];
  const doing = m.marchState==="siege" ? "Осаждает"
              : m.res ? "Собирает "+resName(m.res).toLowerCase() : "Собирает ресурсы";
  let h="<div class='mail-vs'><div class='mail-side'>"+mailAvatarHtml(m.oppAvatar,m.oppRace,52)+
    "<div class='nm'>"+m.oppNick+"</div><div class='co'>X:"+m.coords.x+" Y:"+m.coords.y+"</div>"+
    "<div class='pw'>"+doing+"</div></div></div>";

  h+="<div class='sc-block'><div class='sc-hd'>Отряд</div>";
  h+= se>=1 ? scoutRow("Войск всего", RU(iv.total)) : scoutLocked("Численность войск", NEED[0]);
  if(se>=3 && iv.byType && iv.byType.length){
    iv.byType.forEach(x=>{
      const tiers = se>=4 && iv.byTier ? (iv.byTier.find(y=>y.t===x.t)||{}).parts : null;
      h+=scoutRow(TROOP_TYPES[x.t].name, RU(x.n)+
        (tiers&&tiers.length?"<em class='sc-tiers'>"+tiers.map(pp=>SCOUT_TIER_LABEL[pp.i-1]+" "+RU(pp.n)).join(" · ")+"</em>":""));
    });
  } else if(se>=1){
    h+=scoutLocked("По родам войск", NEED[2]);
  }
  if(se>=1 && se<4) h+=scoutLocked("По тирам", NEED[3]);
  h+="</div>";

  h+="<div class='sc-block'><div class='sc-hd'>Полководец</div>";
  h+= se>=2 ? scoutRow("С отрядом", iv.genLv!=null?"да, ур. "+iv.genLv:"нет") : scoutLocked("Полководец", NEED[1]);
  h+="</div>";

  h+="<div class='sc-note'>Донесение — снимок на момент, когда лазутчик застал отряд на месте. "+
     "Отряд подвижен: пока вы решаете, что делать, он может уже сняться.</div>";
  return h;
}
function mailDetailHtml(m){
  let h="<div class='mail-back' data-act='mailback'>&#8592; Назад к списку</div>";
  if(m.kind==="battle"){
    h+="<div class='mail-vs'>"+
       "<div class='mail-side'>"+mailAvatarHtml(m.selfAvatar,m.selfRace,52)+
         "<div class='nm'>"+m.selfNick+"</div><div class='co'>X:"+m.selfCoords.x+" Y:"+m.selfCoords.y+"</div>"+
         "<div class='pw'>Мощь "+RU(m.selfPower)+"</div>"+
         battleGenHtml(m.selfGen)+
       "</div>"+
       "<div class='mail-vmid'>&#9876;</div>"+
       "<div class='mail-side'>"+mailAvatarHtml(m.oppAvatar,m.oppRace,52)+
         "<div class='nm'>"+m.oppNick+"</div><div class='co'>X:"+m.oppCoords.x+" Y:"+m.oppCoords.y+"</div>"+
         "<div class='pw'>Мощь "+RU(m.oppPower)+"</div>"+
         battleGenHtml(m.oppGen)+
       "</div></div>"+
       "<div class='mail-stamp "+(m.win?"win":"lose")+"'>"+(m.win?"Победа":"Поражение")+"</div>"+
       // Погода была общей для обеих сторон — в отчёте она стоит НАД таблицей
       // потерь, потому что объясняет её цифры (см. BATTLE_WEATHER). В ясную
       // погоду поля weather нет вовсе, и строка не рисуется.
       (m.weather?"<div class='mail-weather'><b>"+m.weather.name+"</b><span>"+m.weather.desc+"</span></div>":"")+
       // Порядок строк — от лучшего исхода к худшему (как в самом RoK):
       // осталось нетронутыми -> легкораненые (сами вылечились) ->
       // тяжелораненые (заняли лазарет) -> убитые (безвозвратно).
       "<table class='mail-stats'><tr><th></th><th>"+m.selfNick+"</th><th>"+m.oppNick+"</th></tr>"+
       "<tr><td>Войск</td><td>"+RU(m.selfStart)+"</td><td>"+RU(m.oppStart)+"</td></tr>"+
       "<tr><td>Осталось</td><td>"+RU(m.selfRemain)+"</td><td>"+RU(m.oppRemain)+"</td></tr>"+
       "<tr><td>Легкораненые</td><td>"+RU(m.selfSlight||0)+"</td><td>"+RU(m.oppSlight||0)+"</td></tr>"+
       "<tr><td>Тяжелораненые</td><td>"+RU(m.selfHurt)+"</td><td>"+RU(m.oppHurt)+"</td></tr>"+
       "<tr><td>Убито</td><td>"+RU(m.selfDead)+"</td><td>"+RU(m.oppDead)+"</td></tr>"+
       "</table>"+
       // Статистика войск — итоговые проценты бонусов на секунду боя (см.
       // battleBuffSnapshot): не просто "кто победил", а почему — та же
       // логика, что и в настоящем RoK ("Здоровье — самый ценный стат").
       (m.selfBuffs&&m.oppBuffs?"<div class='mail-chron'><div class='mail-chron-hd'>Статистика войск</div>"+
         "<table class='mail-stats'><tr><th></th><th>"+m.selfNick+"</th><th>"+m.oppNick+"</th></tr>"+
         battleStatsRows(m.selfBuffs,m.oppBuffs)+"</table></div>":"")+
       "<div class='mail-note'>Место боя: X:"+m.fightCoords.x+" Y:"+m.fightCoords.y+"</div>"+
       battleLogHtml(m);
  } else if(m.kind==="barbarian"){
    h+="<div class='mail-stamp win'>Победа</div>"+
       (m.weather?"<div class='mail-weather'><b>"+m.weather.name+"</b><span>"+m.weather.desc+"</span></div>":"")+
       "<div class='mail-note'>Разбит лагерь разбойников "+m.lv+" уровня у X:"+m.coords.x+" Y:"+m.coords.y+".<br>"+
       "Опыт генерала: +"+RU(m.xp)+"<br>"+
       "Потери отряда: убито "+RU(m.dead)+", ранено "+RU(m.hurt)+
       (m.tomesTxt?"<br>Найдены книги опыта: "+m.tomesTxt:"")+
       "<br>Захвачено: "+RES.filter(rr=>m.loot[rr]>0).map(rr=>RES_NAME[rr]+" "+fmt(m.loot[rr])).join(", ")+"</div>"+
       battleLogHtml(m);
  } else if(m.kind==="scout"){
    h+=scoutReportHtml(m);
  } else if(m.kind==="scoutmarch"){
    h+=scoutMarchReportHtml(m);
  } else if(m.kind==="gather"){
    h+="<div class='mail-note'>Обоз собрал "+resName(m.res)+": "+fmt(m.amount)+".<br>"+
       "Точка сбора: X:"+m.coords.x+" Y:"+m.coords.y+"</div>";
  } else {
    h+="<div class='mail-note'><b>"+m.title+"</b><br>"+m.body+"</div>";
  }
  return h;
}
function foMail(){
  const openEntry = mailOpenId!=null ? W.mail.find(x=>x.id===mailOpenId) : null;
  let h="<div class='mail-wrap'><div class='mail-card'>"+
    "<img class='mail-corner tl' src='images/ui/mail-corner.png' alt=''>"+
    "<img class='mail-corner tr' src='images/ui/mail-corner.png' alt=''>"+
    "<img class='mail-corner bl' src='images/ui/mail-corner.png' alt=''>"+
    "<img class='mail-corner br' src='images/ui/mail-corner.png' alt=''>";
  h+="<div class='mail-tabs'>"+MAIL_TABS.map(([cat,label])=>{
    const n=mailInCat(cat).filter(m=>!m.read).length;
    return "<button data-act='mailtab' data-cat='"+cat+"' class='"+(mailCat===cat&&!openEntry?"on":"")+"'>"+
      label+(n?"<span class='n'>"+n+"</span>":"")+"</button>";
  }).join("")+"</div>";
  h+="<img class='mail-divider' src='images/ui/mail-divider.png' alt=''>";
  if(openEntry){
    h+="<div class='mail-detail'>"+mailDetailHtml(openEntry)+"</div>";
    h+="<div class='mail-bar'>"+
       "<button data-act='mailfav' data-id='"+openEntry.id+"'>"+(openEntry.fav?"Убрать из избранного":"В избранное")+"</button>"+
       "<button class='danger' data-act='maildel' data-id='"+openEntry.id+"'>Удалить</button></div>";
  } else {
    const list=mailInCat(mailCat).sort((a,b)=>b.t-a.t);
    h+="<div class='mail-list'>"+
       (list.length ? list.map(mailRowHtml).join("") : "<div class='mail-empty'>Здесь пока пусто.</div>")+
       "</div>";
    const hasUnread=list.some(m=>!m.read);
    h+="<div class='mail-bar'><button data-act='mailreadall'"+(hasUnread?"":" disabled")+">Прочитать всё</button></div>";
  }
  h+="</div></div>";
  return h;
}

/* ---- Войско ---- */
function unitAvatarHtml(p,t,i){
  return "<span class='troop-avatar'>"+
    "<img class='portrait' style='object-position:"+unitHeadPos(p.race,t,i)+"' src='images/units/"+p.race+"-"+t+i+".png' alt=''>"+
    "<img class='class-badge' src='images/ui/class-"+t+".png' alt=''>"+
    "<img class='tier-badge' src='images/ui/tier-"+i+".png' alt=''>"+
    "</span>";
}
function troopRowHtml(p,t,i,n){
  return "<div class='troop-row'>"+unitAvatarHtml(p,t,i)+
    "<span class='troop-name'>"+unitName(t,i,p.race)+"</span>"+
    "<span class='troop-count'>"+RU(n)+"</span></div>";
}
function foArmy(){
  const p=me(); syncRes(p);
  const B=bonuses(p);
  let hurt=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)hurt+=p.wounded[t][i]});
  let h=rubric("Смотр войск",fmt(armyPower(p.troops,B,p.race))+" силы");
  const rows=[];
  TKEYS.forEach(t=>{ for(let i=1;i<=5;i++){ const n=p.troops[t][i]; if(n) rows.push(troopRowHtml(p,t,i,n)) } });
  h+= rows.length ? "<div class='entry troop-list'>"+rows.join("")+"</div>"
                  : hollow("&#9876;","В столице пусто. Наберите войско в казармах, на стрельбище, в конюшне или мастерской на карте города.");

  if(hurt>0||p.heal){
    h+=rubric("Лазарет");
    h+="<div class='entry "+(p.heal?"hot":"war")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>Раненых: "+RU(hurt)+"</div>"+
      "<div class='note'>Коек: <em>"+fmt(totalHospitalCap(p)*(1+B.hosp+B.mercy))+"</em>"+
      (p.heal?" · лечится "+RU(p.heal.n)+" — готово через "+fmtDur(p.heal.t1-W.t):" · лечение — в госпитале города")+
      (B.heal<1?" · нежить поднимает своих втрое дешевле":"")+"</div></div></div>";
  }

  h+=rubric("Отряды в поле",W.marches.filter(m=>m.pid===p.id&&!isScoutMarch(m)).length+" из "+marchSlots(p.b.hall));
  const mine=W.marches.filter(m=>m.pid===p.id);
  if(!mine.length) h+=hollow("&#9906;","Все войска дома. Выберите цель на чертеже.");
  mine.forEach(m=>{
    const st={go:"в пути",gather:"собирает",back:"возвращается"}[m.state]||m.state;
    const load=m.carry?RES.filter(r=>m.carry[r]>0).map(r=>RES_NAME[r]+" "+fmt(m.carry[r])).join(", "):"";
    h+="<div class='entry "+(m.state==="back"?"calm":"hot")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>"+RU(countUnits(m.units))+" воинов<span class='tag'>"+st+"</span></div>"+
      "<div class='note'>Цель "+m.tx+" · "+m.ty+" — <em>"+fmtDur(m.t1-W.t)+"</em>"+
      (load?"<br>Везут: "+load:"")+"</div></div>"+
      (m.state!=="back"?"<button class='seal blood' data-act='recall' data-m='"+m.id+"'>Отозвать</button>":"")+
      "</div></div>";
  });
  return h;
}

/* ---- Генерал ---- */
function findTalentNode(id){
  for(const bk in TALENTS) for(const n of TALENTS[bk].nodes) if(n.id===id) return n;
  for(const bk in GENERAL_TREE) for(const n of GENERAL_TREE[bk].nodes) if(n.id===id) return n;
  return null;
}

}

function genSkillBadges(p){

const GEAR_LAYOUT = ["handL","helmet","handR","chest","acc1","gloves","pants","acc2","boots"];
function genGearHtml(p){
  let h=rubric("Экипировка");
  h+="<div class='gear-slots'>";
  GEAR_LAYOUT.forEach(id=>{
    const s=findGearSlot(id), it=p.gear[id];
    h+="<div class='gear-slot"+(it?" filled":"")+(id==="helmet"?" crown":"")+"' "+(it?"style='--pc:"+RARITY_COLOR[it.rarity-1]+"'":"")+">"+
      "<div class='gear-slot-icon'>"+(it?"<img src='"+gearIconSrc(s.id,it.order)+"' alt=''>":"")+"</div>"+
      "<div class='gear-slot-name'>"+s.name+"</div>"+
      "<div class='gear-slot-item'>"+(it?GEAR_NAMES[s.id][it.order][it.rarity-1]+"<span class='tag gilt'>"+RARITY_NAMES[it.rarity-1]+"</span>"
        +"<div class='note'>"+statTxt(gearItemStats(s.cat,it.order,it.rarity))+" · мощь "+RU(GEAR_POWER[it.rarity-1])+"</div>":"пусто")+"</div>"+
      (it?"<button class='seal' data-act='unequip' data-slot='"+s.id+"'>Снять</button>":"")+
      "</div>";
  });
  h+="</div>";

  let any=false, stored="";
  GEAR_SLOTS.forEach(s=>{
    ["bastion","storm"].forEach(order=>{
      for(let r=1;r<=5;r++){
        const cnt=p.inventory[s.id][order][r-1]||0; if(!cnt) continue;
        any=true;
        stored+="<div class='entry'><div class='line'>"+
          "<div class='mat-icon-wrap' style='--pc:"+RARITY_COLOR[r-1]+";box-shadow:inset 0 0 8px var(--pc)'>"+
          "<img class='mat-icon' src='"+gearIconSrc(s.id,order)+"' alt=''></div>"+
          "<div class='fill'>"+
          "<div class='title'>"+GEAR_NAMES[s.id][order][r-1]+"<span class='tag'>×"+cnt+"</span></div>"+
          "<div class='note'>"+s.name+" · "+statTxt(gearItemStats(s.cat,order,r))+" · мощь "+RU(GEAR_POWER[r-1])+"</div></div>"+
          "<button class='seal' data-act='equip' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Надеть</button>"+
          "<button class='seal' data-act='dismantle' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Разобрать</button></div>";
      }
    });
  });
  h+=rubric("На складе","можно надеть или разобрать");
  h+= any ? stored : hollow("&#9884;","Склад снаряжения пуст — куйте в горне.");
  return h;
}
// Книги опыта — предметы снаряжения, тратятся вручную по выбору игрока
// (кнопка "+" у полоски опыта), а не сгорают сами по себе: со временем
// генералов станет больше одного, и решать, какую книгу на кого потратить,
// должен игрок явным действием, а не догадываться по значку на полоске.
function tomesPanelHtml(p,lvCap){
  const owned=TOME_VALUES.filter(v=>(p.tomes&&p.tomes[v])||0);
  if(!owned.length) return "<div class='hint' style='margin-top:7px'>Книг опыта нет на складе — они выпадают за победу над лагерями разбойников в мире.</div>";
  return "<div style='margin-top:7px'>"+owned.map(v=>{
    const cnt=p.tomes[v];
    return "<div class='entry'><div class='line'>"+
      "<img src='images/ui/"+TOME_ICON[v]+".png' alt='' style='width:26px;height:26px;object-fit:contain;flex:0 0 auto'>"+
      "<div class='fill'><div class='title'>"+TOME_NAME[v]+"<span class='tag'>×"+cnt+"</span></div>"+
      "<div class='note'>восполняет "+RU(v)+" опыта</div></div>"+
      "<button class='seal' data-act='usetome' data-v='"+v+"' "+(p.gen.lv>=lvCap?"disabled":"")+">Использовать</button>"+
      "</div></div>";
  }).join("")+"</div>";
}
function foGen(){

    let h=rubric("Выбор полководца","решение окончательное");

      h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+

        "<div class='title'>"+g.name+"<span class='tag gilt'>"+g.role+"</span></div>"+
        "<div class='note'>"+g.flavor+"<span class='gen-stat'>"+g.stat+"</span></div></div></div>"+
        "<button class='seal' data-act='pickgen' data-id='"+i+"'>Выбрать</button></div>";
    });

  }

  const stars=Math.min(6,1+Math.floor(p.gen.lv/10));   // 1 звезда ~= 10 уровней, всего 6 звёзд до 60 ур.

  let h="<div class='gen-figure-wrap'>"+genFigureHtml(p.race,p.gen.id||0)+"</div>";
  h+=rubric("Полководец");
  h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+
    genPortraitHtml(p.race,p.gen.id||0)+"</div>"+ring(p.gen.lv,60)+"<div class='fill'>"+
    "<div class='title'>"+G.name+"<span class='tag gilt'>"+G.role+"</span></div>"+

    "<div class='note'>"+G.flavor+"<span class='gen-stat'>"+G.stat+
    (p.gen.pts>0?" · очков к раздаче: "+p.gen.pts:"")+
    (p.gen.lv>=lvCap&&lvCap<60?" · потолок эпохи: "+lvCap:"")+"</span></div></div></div>"+

    "<button class='seal' data-act='toggletomes' title='Использовать книгу опыта' "+
    "style='flex:0 0 auto;padding:0;width:30px;height:30px;font-size:17px;line-height:28px;text-align:center'>"+
    (genTomesOpen?"&#8722;":"+")+"</button></div>"+
    (genTomesOpen?tomesPanelHtml(p,lvCap):"")+
    "<table class='roll' style='margin-top:9px'><tr><td>Сила полководца</td><td>"+RU(genPower)+"</td></tr></table>"+
    genSkillBadges(p)+
    "</div>";

  h+="<div id='inv-tabs'>"+
    "<button class='"+(genTab==="overview"?"on":"")+"' data-act='gentab' data-t='overview'>Обзор</button>"+
    "<button class='"+(genTab==="talents"?"on":"")+"' data-act='gentab' data-t='talents'>Таланты</button>"+
    "<button class='"+(genTab==="gear"?"on":"")+"' data-act='gentab' data-t='gear'>Экипировка</button>"+
    "</div>";

  if(genTab==="gear") return h+genGearHtml(p);

  if(genTab==="talents"){
    for(const bk in GENERAL_TREE){

        h+="<div class='entry"+(v>0?" hot":"")+"'><div class='line'><div class='fill'>"+

  h+=rubric("Характеристики");

    "<tr><td>"+statIcon("def")+"Защита</td><td>"+RU(S.def)+"</td></tr></table></div>";

  h+=rubric("Итог бонусов");
  h+="<div class='entry'><table class='roll'>"+
    "<tr><td>"+statIcon("atk")+"Атака войск</td><td class='"+(B.atk>0?"good":"")+"'>"+(B.atk>=0?"+":"")+(B.atk*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("def")+"Защита войск</td><td class='"+(B.def<0?"bad":B.def>0?"good":"")+"'>"+(B.def>=0?"+":"")+(B.def*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("hp")+"Здоровье войск</td><td class='"+(B.hp>0?"good":"")+"'>+"+(B.hp*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("speed")+"Скорость марша</td><td>×"+B.march.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость стройки</td><td>×"+B.build.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость сбора</td><td>+"+(B.gather*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Поднятие павших</td><td class='"+(B.raise>0?"good":"")+"'>"+(B.raise*100).toFixed(0)+"%</td></tr>"+
    "</table></div>";
  return h;
}

function foInv(){
  const p=me();
  const tabsHtml="<div id='inv-tabs'>"+
    [["res","Ресурсы"],["mat","Материалы"],["gear","Снаряжение"]].map(([k,label])=>
      "<button class='"+(invTab===k?"on":"")+"' data-act='invtab' data-t='"+k+"'>"+label+"</button>").join("")+
    "</div>";

  if(invTab==="res"){
    let h=tabsHtml+rubric("Ресурсы");
    h+=hollow("&#9884;","Пока нет ни одного предмета, дающего ресурсы.");
    return h;
  }

  if(invTab==="mat"){
    let h=tabsHtml+rubric("Материалы","добываются и куются в горне");
    Object.keys(MATERIALS).forEach(mat=>{
      const stock=p.materials[mat];
      h+="<div class='entry'><div class='line'><div class='fill'>"+
        "<div class='title'>"+MATERIALS[mat].name+"</div>"+
        "<div class='note'>"+RARITY_NAMES.map((rn,i)=>rn.slice(0,3)+": "+(stock[i]||0)).join(" · ")+"</div></div></div></div>";
    });
    return h;
  }

  // Снаряжение: только каталог того, что есть (надето и на складе) — рядом иконками, как в RoK.
  // Экипировка (надеть/снять) — в Генерале, ковка и добыча материалов — в Горне.
  let h=tabsHtml+rubric("Снаряжение","каталог; надеть — у генерала, сковать — в горне");
  const cells=[];
  GEAR_SLOTS.forEach(s=>{
    const it=p.gear[s.id];
    if(it) cells.push("<div class='gear-cell equipped' style='--pc:"+RARITY_COLOR[it.rarity-1]+"' title='"+GEAR_NAMES[s.id][it.order][it.rarity-1]+" ("+s.name+", надето)'>"+
      "<img src='"+gearIconSrc(s.id,it.order)+"' alt=''><span class='eq'>&#9733;</span></div>");
    ["bastion","storm"].forEach(order=>{
      for(let r=1;r<=5;r++){
        const cnt=p.inventory[s.id][order][r-1]||0; if(!cnt) continue;
        cells.push("<div class='gear-cell' style='--pc:"+RARITY_COLOR[r-1]+"' title='"+GEAR_NAMES[s.id][order][r-1]+" ("+s.name+")'>"+
          "<img src='"+gearIconSrc(s.id,order)+"' alt=''><span class='cnt'>×"+cnt+"</span></div>");
      }
    });
  });
  h+= cells.length ? "<div class='gear-grid'>"+cells.join("")+"</div>" : hollow("&#9884;","Пока нет ни одного предмета — куйте в горне.");
  return h;
}

function renderFolio(){
  // Карта города (foCity) хочет остаться единственным edge-to-edge ребёнком

  // в один .folio-pad с внутренними отступами (см. CSS-комментарий у #folio).
  const html = tab==="city"?foCity():
    "<div class='folio-pad'>"+(tab==="army"?foArmy(): tab==="gen"?foGen(): foInv())+"</div>";

}

/* =========================================================================
   СВИТОК ОТПРАВКИ ВОЙСК
   ========================================================================= */
function openLevy(cx,cy){
  const p=me(); syncRes(p);
  let o=W.map[key(cx,cy)];
  if(!o){
    // Пустая клетка ("Пустошь") — свободный тап по местности, отряд можно
    // отправить и сюда (просто дойдёт и сам развернётся домой, см.
    // arriveMarch), кроме воды — туда высадка бессмысленна.
    if(isRealWater(cx,cy)) return herald("Здесь вода — отряд не высадить.");
    o={t:"waste",x:cx,y:cy};
  }
  if(o.t==="city"&&o.pid===p.id) return herald("Это ваша столица.");
  if(W.marches.filter(m=>m.pid===p.id&&!isScoutMarch(m)).length>=marchSlots(p.b.hall))
    return herald("Свободных отрядов нет. Отзовите марш или поднимите ратушу.");
  if(o.t==="city"){
    const q=W.players.find(z=>z.id===o.pid);
    if(q&&W.t<q.shieldUntil) return herald("Город под щитом мира — приступить нельзя.");
  }
  const mode = o.t==="node"?"gather":o.t==="waste"?"scout":"attack";
  const capL = marchCapacity(p);
  // "Взять полководца" — доступно в ЛЮБОЙ поход (сбор/разведку/бой), не
  // только боевой: пользователь прямо попросил решать самому, куда его
  // отправить или оставить в замке, а не гадать за него, где ему "положено"
  // быть полезным. В сборе/разведке (waste) боя не бывает, поэтому там он
  // просто едет с отрядом без combat-эффекта (см. makeForce.withGen — тот
  // ставится только для реальных сил, участвующих в resolveBattle, а сбор/
  // разведка его вообще не зовут) — но это уже осознанный выбор игрока, а не
  // навязанное ограничение. По умолчанию НЕ взят — ни один поход не должен
  // молча забирать его, только явный клик (см. genWorld: gen.away).
  let withGen=false;
  const genAvail = p.gen && p.gen.id!=null;
  const genBusy = genAvail && p.gen.away!=null;
  const st={};
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) st[t+i]=0});
  const auto=f=>{ const u=pickArmy(p,f); TKEYS.forEach(t=>{for(let i=1;i<=5;i++) st[t+i]=u[t][i]}) };
  // Сбор — по умолчанию не "вся армия", а именно то, что реально довезёт
  // жилу (см. pickGatherArmy): осадные в первую очередь, ровно по надобности.
  // "Четверть"/"Половина"/"Всё войско" ниже (data-a=f25/f50/f100) — это уже
  // ручная правка человеком, там общий pickArmy() к месту, его не трогаем.
  if(mode==="gather"){
    const u=pickGatherArmy(p,o.amount);
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++) st[t+i]=u[t][i]});
  } else {
    auto(1);
  }

  function paint(){
    let weight=0,n=0;
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++){weight+=st[t+i]*TIER_MULT[i-1]; n+=st[t+i]}});
    const over=weight>capL;
    const u=emptyUnits(); TKEYS.forEach(t=>{for(let i=1;i<=5;i++)u[t][i]=st[t+i]});
    const dd=Math.hypot(cx-p.x,cy-p.y)*(1-portalShortcut(p)), eta=n?dd/marchSpeed(p,u)*60:0;
    let load=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)load+=st[t+i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(p.race,t,"load")});
    const mine=armyPower(u,bonuses(p),p.race);

    let head = mode==="gather"?"Сбор припасов":mode==="scout"?"Отправка отряда":"Военный поход";
    let lede = o.t==="node" ? resName(o.res)+", жила "+o.lv+" уровня — "+fmt(o.amount)+" осталось"
             : o.t==="city" ? "Столица "+(W.players.find(z=>z.id===o.pid)||{name:"?"}).name
             : o.t==="waste" ? "Пустошь — свободные земли"
             : (o.t==="fort"?"Форт":"Лагерь")+" разбойников "+o.lv+" уровня";

    let h="<h2>"+head+"</h2><div class='lede'>"+lede+" · клетка "+cx+" · "+cy+"</div>";
    h+="<div class='chips'>"+
       "<button class='seal' data-a='f25'>Четверть</button>"+
       "<button class='seal' data-a='f50'>Половина</button>"+
       "<button class='seal' data-a='f100'>Всё войско</button>"+
       "<button class='seal' data-a='f0'>Сбросить</button></div>";
    if(genAvail){
      h+="<label class='gen-take"+(genBusy?" disabled":"")+"'>"+
        "<input type='checkbox' data-gen='1' "+(withGen?"checked":"")+(genBusy?" disabled":"")+">"+
        "<span>Взять полководца в этот поход</span>"+
        "<em>"+(genBusy?"уже в другом походе":"ур. "+p.gen.lv)+"</em></label>";
    }
    let any=false;
    TKEYS.forEach(t=>{ for(let i=1;i<=5;i++){
      const have=p.troops[t][i]; if(!have) continue; any=true;
      h+="<div class='levy'><div class='nm'>"+
        "<div class='t'>"+unitName(t,i,p.race)+"<span class='tag'>T"+i+"</span></div>"+
        "<div class='s'>в столице "+RU(have)+"</div></div>"+
        "<input type='range' min='0' max='"+have+"' value='"+st[t+i]+"' data-s='"+t+i+"'>"+
        "<input type='number' min='0' max='"+have+"' value='"+st[t+i]+"' data-s='"+t+i+"'></div>";
    }});
    if(!any) h+="<div class='hollow'>Войск в столице нет.</div>";

    h+="<table class='roll' style='margin-top:14px'>"+
      "<tr><td>Выступает</td><td>"+RU(n)+"</td></tr>"+
      "<tr><td>Место в отряде</td><td class='"+(over?"bad":"")+"'>"+fmt0(weight)+" из "+fmt0(capL)+"</td></tr>"+
      "<tr><td>Поднимут груза</td><td>"+fmt(load)+"</td></tr>"+
      "<tr><td>Дорога займёт</td><td>"+(n?fmtDur(eta):"—")+"</td></tr>"+
      "<tr><td>Сила отряда</td><td>"+fmt(mine)+"</td></tr></table>";

    if(o.t==="camp"||o.t==="fort"||o.t==="city"){
      let foe, label;
      if(o.t==="city"){ const q=W.players.find(z=>z.id===o.pid);
        foe=q?armyPower(q.troops,bonuses(q),q.race)*(1+wallDefBonus(q.b.wall)):0; label="Гарнизон и стены" }
      else { foe=banditPower(o.lv); label="Сила заставы" }
      const v = mine>foe*1.8?["&#9819;","Разгром без потерь","var(--verdigris)"]
              : mine>foe*1.15?["&#9876;","Победа, но с кровью","var(--gilt)"]
              : mine>foe*0.85?["&#9888;","Исход не ясен","var(--gilt)"]
              : ["&#9760;","Отряд поляжет","var(--garnet)"];
      h+="<div class='verdict' style='border-color:"+v[2]+"44'>"+
         "<span class='vi' style='color:"+v[2]+"'>"+v[0]+"</span><div>"+
         "<div class='vt' style='color:"+v[2]+"'>"+v[1]+"</div>"+
         "<div class='vs'>"+label+": "+fmt(foe)+" против "+fmt(mine)+"</div></div></div>";
    }
    h+="<div class='chips' style='margin-top:16px;margin-bottom:0'>"+
       "<button class='seal' data-a='go' "+(n<=0||over?"disabled":"")+">"+
       (mode==="gather"?"Выслать обоз":mode==="scout"?"Отправить отряд":"Выступить в поход")+"</button>"+
       "<button class='seal' data-a='no'>Отставить</button></div>";
    box.innerHTML=h;
  }
  const box=$("#scroll");
  paint(); $("#veil").classList.add("open");

  box.oninput=e=>{
    if(e.target.dataset.gen){ withGen=e.target.checked; return paint(); }
    const s=e.target.dataset.s; if(!s) return;
    const t=s.slice(0,3), i=+s.slice(3);
    st[s]=clamp(Math.round(+e.target.value||0),0,p.troops[t][i]);
    paint();
  };
  box.onclick=e=>{
    const b=e.target.closest("[data-a]"); if(!b) return;
    const a=b.dataset.a;
    if(a==="no") return closeScroll();
    if(a==="f25"){auto(.25);return paint()}
    if(a==="f50"){auto(.5); return paint()}
    if(a==="f100"){auto(1); return paint()}
    if(a==="f0"){TKEYS.forEach(t=>{for(let i=1;i<=5;i++)st[t+i]=0}); return paint()}
    if(a==="go"){
      const u=emptyUnits(); TKEYS.forEach(t=>{for(let i=1;i<=5;i++)u[t][i]=st[t+i]});
      const r=sendMarch(p,cx,cy,u,mode,genAvail&&withGen&&!genBusy);
      if(r.err) return herald(r.err);
      // Раньше тут был tab="army" (сразу показать список отрядов) — но
      // ribbons скрыты в городском режиме (см. CSS-комментарий у #ribbons),
      // а это единственный не-ribbons-путь, уводивший игрока с "city":
      // застревал на вкладке "Войско" без способа вернуться на карту
      // города (репорт пользователя). Список похода и так виден через
      // герольд ниже и панель "Отряды в поле" в мире/гамбургер-меню.
      closeScroll(); lastFolio=""; renderFolio();
      herald(mode==="gather"?"Обоз выступил.":mode==="scout"?"Отряд отправлен.":"Войско выступило в поход.");
    }
  };
}
function closeScroll(){ $("#veil").classList.remove("open"); $("#scroll").innerHTML="" }
let heraldT=null;
function herald(msg){
  const el=$("#herald"); el.textContent=msg; el.classList.add("up");
  clearTimeout(heraldT); heraldT=setTimeout(()=>el.classList.remove("up"),2800);
}
function ask(title,def,max,cb){
  const box=$("#scroll");
  box.innerHTML="<h2>Сколько набрать?</h2><div class='lede'>"+title+"</div>"+
    "<input id='qty' type='number' value='"+def+"' min='1' max='"+max+"' "+
    "style='width:100%;background:rgba(0,0,0,.4);color:var(--vellum);border:1px solid var(--rule);"+

function handleAct(e){
  const closeBtn=e.target.closest("[data-act='closemenu']");
  if(closeBtn){ closeMenuModal(); return; }
  const closeBm=e.target.closest("[data-act='closebuilding']");
  if(closeBm){ closeBuildingModal(); return; }
  const closeCart=e.target.closest("[data-act='closecartouche']");
  if(closeCart){ sel=null; selMarch=null; renderCartouche(); return; }
  // Фаза 12, кусочек 4 — кнопки cartouche общего мира (renderCartoucheMp).
  // #cartouche уже слушает только handleAct (см. addEventListener ниже) —
  // заводить отдельный "data-mp"-слушатель ради пяти кнопок незачем, тот же
  // атрибут data-mp просто читается прямо здесь, отдельными case'ами, не
  // пересекающимися с data-act одиночки.
  const cartScout=e.target.closest("[data-mp='cartscout']");
  if(cartScout){ mpCartScout(+cartScout.dataset.id); return; }
  const cartRecall=e.target.closest("[data-mp='cartrecall']");
  if(cartRecall){ mpCartRecall(+cartRecall.dataset.id); return; }
  const cartAttackPick=e.target.closest("[data-mp='cartattackpick']");
  if(cartAttackPick){ mpState.attackTarget=+cartAttackPick.dataset.id; sel=null; selMarch=null; openMenuModal("mp"); return; }
  const cartGatherPick=e.target.closest("[data-mp='cartgatherpick']");
  if(cartGatherPick){ mpState.gatherTarget=cartGatherPick.dataset.k; sel=null; selMarch=null; openMenuModal("mp"); return; }
  const cartRaidPick=e.target.closest("[data-mp='cartraidpick']");
  if(cartRaidPick){ mpState.raidTarget=cartRaidPick.dataset.k; sel=null; selMarch=null; openMenuModal("mp"); return; }
  // Фаза 14, кусочек 4 — клик по ячейке mpRenderCityMap(): в отличие от
  // одиночного data-cell (открывает openBuildingModal() — синхронная
  // мутация me(), см. заголовок Фазы 14 в README), тут просто выделение
  // (mpCitySel) — mpRenderCityMap() сама разворачивает mpCellPanelHtml()
  // с настоящим действием (data-mp='build', уже обрабатывается ниже).
  // Повторный клик по той же ячейке снимает выделение.
  const mpCell=e.target.closest("[data-mpcell]");
  if(mpCell){
    const idx=+mpCell.dataset.mpcell;
    mpCitySel = mpCitySel===idx ? -1 : idx;
    mpRenderFolio();
    return;
  }
  const mpCellClose=e.target.closest("[data-mp='citycellclose']");
  if(mpCellClose){ mpCitySel=-1; mpRenderFolio(); return; }
  const cell=e.target.closest("[data-cell]");
  if(cell && !e.target.closest("[data-act]")){
    openBuildingModal(+cell.dataset.cell);
    return;
  }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const p=me(), a=b.dataset.act;
  if(a==="build" && b.closest("#bm-body")){
    const plot=b.dataset.plot!=null&&b.dataset.plot!==""?+b.dataset.plot:undefined;
    const r=startBuild(p,b.dataset.b,plot);
    herald(r.err||"Заложено.");
    lastFolio=""; renderFolio();
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);    return;
  }
  if(a==="build"){
    const plot=b.dataset.plot!=null&&b.dataset.plot!==""?+b.dataset.plot:undefined;
    const r=startBuild(p,b.dataset.b,plot);
    herald(r.err||(buildingName(b.dataset.b,p)+(plot!=null?" (участок "+(plot+1)+")":"")+" заложена."));
  }
  else if(a==="browsetrain"){
    openUnitCarousel(b.dataset.t);
    return;
  }
  else if(a==="ucnav"){
    const track=$("#uc-track"), card=track&&track.querySelector(".uc-card");
    if(track&&card) track.scrollLeft += card.getBoundingClientRect().width*(+b.dataset.dir);
    return;
  }
  else if(a==="ucfocus"){
    const type=carouselCtx.type, tier=+b.dataset.tier;
    const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
    if(b.dataset.mode==="train"){
      const max=trainMax(p,type,tier);
      trainCtx={type,tier,mode:"train",max,n:max,lastLocked:!!p.train[type]||max<1};
    } else {
      const max=retrainMax(p,type,tier);
      trainCtx={type,tier:tier+1,fromTier:tier,mode:"retrain",max,n:max,lastLocked:!!p.train[type]||max<1};
    }
    $("#bm-body").innerHTML=unitCarouselHtml();
    updateTrainSheet();
    const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    return;
  }
  else if(a==="traingo"){
    if(!trainCtx) return;
    const isRetrain=trainCtx.mode==="retrain";
    const r=isRetrain?startRetrain(p,trainCtx.type,trainCtx.fromTier,trainCtx.n):startTrain(p,trainCtx.type,trainCtx.tier,trainCtx.n);
    if(r.err){ herald(r.err); return; }
    herald((isRetrain?"Переобучение начато: ":"Набор начат: ")+RU(trainCtx.n)+".");
    closeBuildingModal(); lastFolio=""; renderFolio();
    return;
  }
  else if(a==="opencell"){
    const idx=+b.dataset.idx; if(idx>=0) openBuildingModal(idx);
    return;
  }
  else if(a==="marchinfo"){
    const m=W.marches.find(x=>x.id==b.dataset.m);
    if(m){
      const st={go:"в пути",gather:"собирает",back:"возвращается"}[m.state]||m.state;
      herald(RU(countUnits(m.units))+" воинов · "+st+" · цель "+m.tx+"·"+m.ty+" · осталось "+fmtDur(m.t1-W.t));
    }
    return;
  }
  else if(a==="followmarch"){
    jumpToMarchFor(+b.dataset.m);
    return;
  }
  else if(a==="browseheal"){
    openHealCarousel();
    return;
  }
  else if(a==="hcfocus"){
    const type=b.dataset.type, tier=+b.dataset.tier;
    const max=healMaxN(p,type,tier);
    healCtx={type,tier,max,n:max,lastLocked:!!p.heal||max<1};
    const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
    $("#bm-body").innerHTML=healCarouselHtml();
    updateHealSheet();
    const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    return;
  }
  else if(a==="healgo"){
    if(!healCtx) return;
    const r=startHeal(p,healCtx.type,healCtx.tier,healCtx.n);
    if(r.err){ herald(r.err); return; }
    herald("Лечение начато: "+RU(healCtx.n)+".");
    closeBuildingModal(); lastFolio=""; renderFolio();
    return;
  }
  else if(a==="research"){
    const r=startResearch(p,b.dataset.id);
    herald(r.err||"Исследование начато.");
  }
  else if(a==="matprod"){
    const r=produceMaterial(p,b.dataset.mat);
    herald(r.err||"Добыча начата.");
  }
  else if(a==="matup"){
    const r=upgradeMaterial(p,b.dataset.mat,+b.dataset.tier);
    herald(r.err||"Материал улучшен.");
    lastFolio=""; renderFolio();
  }
  else if(a==="craft"){
    const r=startCraftItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||"Ковка начата.");
  }
  else if(a==="equip"){
    const r=equipItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||"Надето."); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="unequip"){
    const r=unequipItem(p,b.dataset.slot);
    herald(r.err||"Снято, отправлено на склад."); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="dismantle"){
    const r=dismantleItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||("Разобрано, возвращено золота: "+RU(r.refund)+".")); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="tal"){
    const id=b.dataset.id, node=findTalentNode(id), max=(node&&node.max)||5;
    if(p.gen.pts>0&&(p.gen.tal[id]||0)<max){ p.gen.tal[id]=(p.gen.tal[id]||0)+1; p.gen.pts-- }
  }
  else if(a==="toggletomes"){
    genTomesOpen=!genTomesOpen;
    refreshGenIfOpen();
    return;
  }
  else if(a==="usetome"){
    const v=+b.dataset.v, lvCap=Math.min(60,epochOf(p.b.hall)*12);
    if((p.tomes[v]||0)>0 && p.gen.lv<lvCap){
      p.tomes[v]--; addXp(p,v);
      herald(TOME_NAME[v]+" использована: +"+RU(v)+" опыта.");
      lastFolio=""; renderFolio(); refreshGenIfOpen();
    }
  }
  else if(a==="pickgen"){
    if(p.gen.id==null){ p.gen.id=+b.dataset.id; herald("Выбран генерал: "+GENERALS[p.race][p.gen.id].name+".") }
  }
  // Предпросмотр экрана летописи из профиля. Результат сознательно
  // ВЫБРАСЫВАЕТСЯ: применяет выбор только claimChronicle, а сам экран ничего в
  // мире не меняет, так что «пройти до конца» тут безопасно.
  else if(a==="obdemo"){
    runOnboarding(true).then(r=>{
      herald(r ? "Предпросмотр закрыт. "+RACES[r.race].name+" · "+GENERALS[r.race][r.genId].name+" — ничего не изменилось."
               : "Предпросмотр закрыт.");
    });
    return;
  }
  else if(a==="opentab"){ openMenuModal(b.dataset.tab); }
  else if(a==="savenick"){
    const inp=$("#nick-input");
    if(inp){ const v=inp.value.trim().slice(0,24); p.nick=v||"Безымянный лорд"; herald("Ник сохранён."); renderTop(); }
  }
  else if(a==="gentab"){
    genTab=b.dataset.t;
    refreshGenIfOpen();
  }
  else if(a==="academytab"){
    academyTab=b.dataset.t;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="forgetab"){
    forgeTab=b.dataset.t;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="forgerarity"){
    forgeRarity=+b.dataset.r;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="rtreejump"){
    const n=findNode(b.dataset.id);
    if(n) openResearchCarousel(n.branch,n.id);
  }
  else if(a==="invtab"){
    invTab=b.dataset.t;
    lastFolio=""; renderFolio();
    const menu=$("#menu-modal");
    if(menu.classList.contains("open")&&menu.dataset.tab==="inv"){ lastMenuBody=foInv(); $("#menu-modal-body").innerHTML=lastMenuBody; }
  }
  else if(a==="mailtab"){
    mailCat=b.dataset.cat; mailOpenId=null;
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="mailopen"){
    const id=+b.dataset.id, m=W.mail.find(x=>x.id===id);
    if(m) m.read=true;
    mailOpenId=id;
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="mailback"){
    mailOpenId=null;
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="mailreadall"){
    mailInCat(mailCat).forEach(m=>m.read=true);
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="mailfav"){
    const m=W.mail.find(x=>x.id===+b.dataset.id);
    if(m) m.fav=!m.fav;
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="maildel"){
    const id=+b.dataset.id;
    W.mail=W.mail.filter(x=>x.id!==id);
    mailOpenId=null;
    lastMenuBody=foMail(); $("#menu-modal-body").innerHTML=lastMenuBody;
    return;
  }
  else if(a==="recall"){ const m=W.marches.find(x=>x.id==b.dataset.m);
    if(m){ recallMarch(m); renderCartouche(); herald("Отряд поворачивает домой.") } }
  // Была мгновенная выдача состава войск прямо в панель (см. renderCartouche) —
  // теперь отправка настоящего лазутчика, донесение приходит письмом.
  else if(a==="sendscout"){
    const r=sendScout(me(), +b.dataset.x, +b.dataset.y);
    herald(r.err || ("Лазутчик выслан — вернётся через "+fmtDur(r.eta)+"."));
    renderCartouche();
    return;
  }
  else if(a==="sendscoutmarch"){
    const r=sendScoutMarch(me(), +b.dataset.m);
    herald(r.err || ("Лазутчик выслан — вернётся через "+fmtDur(r.eta)+"."));
    renderCartouche();
    return;
  }
  else if(a==="shield"){
    const s=CFG.SHIELD_COST[+b.dataset.i];
    if(p.res.gold>=s[1]){ p.res.gold-=s[1];
      p.shieldUntil=Math.max(W.t,p.shieldUntil)+s[0];
      logg("Поставлен щит мира на "+fmtDur(s[0])+".","good");
      herald("Щит мира поставлен.") }
  }
  else if(a==="tp"){
    const tp=Math.round(CFG.TELEPORT_BASE*Math.pow(2.2,epochOf(p.b.hall)-1));
    if(p.res.gold>=tp){ p.res.gold-=tp; relocate(p); centerOn(p.x,p.y);
      sel={x:p.x,y:p.y}; herald("Столица перенесена.") }
  }
  else if(a==="look"){
    const x=+b.dataset.x, y=+b.dataset.y;
    centerOn(x,y); sel={x,y}; renderCartouche(); herald("Чертёж наведён на цель.");
  }
  else if(a==="march"){ openLevy(+b.dataset.x,+b.dataset.y); return }
  else if(a==="save"){ save().then(()=>herald("Летопись записана.")); return }
  else if(a==="reset"){
    if(confirm("Заложить новый мир? Всё нажитое исчезнет.")){
      // Новый мир — это новая партия, а значит и новый выбор народа с
      // полководцем: раньше здесь звался только genWorld(), то есть сброс
      // проходил МИМО экрана летописи и молча выдавал очередного человека.
      // Тот же порядок, что и в start(): мир, потом выбор, потом запись.
      Store.del(SAVE_KEY).then(async ()=>{
        genWorld(Date.now()&0xffffff);
        const q=await claimChronicle();
        closeMenuModal();
        sel={x:q.x,y:q.y}; centerOn(q.x,q.y);
        lastFolio=""; renderFolio(); renderCartouche(); renderTop();
        herald("Новая летопись начата.");
      });
    }
    return;
  }
  lastFolio=""; renderFolio(); renderTop();
  const modal=$("#menu-modal");
  if(modal.classList.contains("open")){
    const t=modal.dataset.tab;
    lastMenuBody = t==="army"?foArmy(): t==="gen"?foGen(): t==="profile"?foProfile(): t==="mail"?foMail(): foInv();
    $("#menu-modal-body").innerHTML = lastMenuBody;
  }
}
