      const dist=Math.round(Math.hypot(n.x-p.x,n.y-p.y));
      h+="<div class='entry'><div class='line'>"+shieldSvg(n.race,28)+"<div class='fill'>"+
         "<div class='title'>"+(n.nick||"Безымянный лорд")+(n.is_bot?" <span class='note'>(бот)</span>":"")+"</div>"+
         "<div class='note'>"+RACES[n.race].name+" · "+n.x+", "+n.y+" · "+dist+" клет."+"</div>";
      if(mpState.attackTarget===n.id){
        h+="<div class='note' style='color:#e08'>Бой честный (стена защитника, погода и полководец — "+
           "настоящие; марш и время в пути тоже настоящие — чем медленнее войска, тем дольше идти). "+
           dist+" клет. по прямой, см. supabase/README.md.</div>";
        TKEYS.forEach(t=>{
          const have=(st.troops[t]&&st.troops[t][1])||0; if(!have) return;
          h+="<div class='note'>"+unitName(t,1,p.race)+" (T1, есть "+RU(have)+"): "+
             "<input id='mp-atk-"+t+"' type='number' min='0' max='"+have+"' value='0'></div>";
        });
        h+=mpGenTakeCheckboxHtml("mp-atk-gen");
        h+="<button class='seal' data-mp='attack' data-id='"+n.id+"'"+(mpState.loading?" disabled":"")+">В поход</button> "+
           "<button class='seal' data-mp='attackcancel'>Отмена</button>";
      } else {
        h+="<button class='seal' data-mp='attackpick' data-id='"+n.id+"'>Атаковать</button> ";
        if(scoutLv>0) h+="<button class='seal' data-mp='scout' data-id='"+n.id+"'"+(mpState.loading?" disabled":"")+">Разведать</button>";
      }
      h+="</div></div></div>";
    });
  }

  // Фаза 8, кусочек 1 — точки сбора ресурсов (map_cells, t:"node"), см.
  // mpRefreshNodes/mpDoGather выше. Кольцо в 5 узлов появляется вокруг
  // города при первом входе (seedNodesAround в mp-join) — respawn
  // истощённых точек ещё не перенесён (см. заголовок mp-gather), поэтому
  // список может со временем оскудевать, честно как есть.
  h+=rubric("Точки сбора",embedded?"":"общий мир");
  if(!mpState.nodes.length){
    h+="<div class='entry'><div class='line'><div class='fill'><div class='note'>"+
       "Рядом с городом появляется несколько точек сбора при первом входе — если пусто, обновите вкладку.</div></div></div></div>";
  } else {
    const sortedNodes=[...mpState.nodes].sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
    sortedNodes.forEach(n=>{
      const dist=Math.round(Math.hypot(n.x-p.x,n.y-p.y));
      const key=n.x+","+n.y;
      const amount=(n.data&&n.data.amount)||0, res=(n.data&&n.data.res)||"food", lv=(n.data&&n.data.lv)||1;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+RES_NAME[res]+", жила "+lv+" ур.</div>"+
         "<div class='note'>"+n.x+", "+n.y+" · "+dist+" клет. · осталось "+fmt(amount)+"</div>";
      if(mpState.gatherTarget===key){
        if(amount<=0){
          h+="<div class='note'>Точка истощена.</div></div>"+
             "<button class='seal' data-mp='gathercancel'>Назад</button>";
        } else {
          h+="</div>";
          TKEYS.forEach(t=>{
            const have=(st.troops[t]&&st.troops[t][1])||0; if(!have) return;
            h+="<div class='note'>"+unitName(t,1,p.race)+" (T1, есть "+RU(have)+"): "+
               "<input id='mp-gth-"+t+"' type='number' min='0' max='"+have+"' value='0'></div>";
          });
          h+="<button class='seal' data-mp='gather' data-x='"+n.x+"' data-y='"+n.y+"'"+(mpState.loading?" disabled":"")+">Собрать</button> "+
             "<button class='seal' data-mp='gathercancel'>Отмена</button>";
        }
      } else {
        h+="</div><button class='seal' data-mp='gatherpick' data-k='"+key+"'"+(amount<=0?" disabled":"")+">Собрать</button>";
      }
      h+="</div></div>";
    });
  }

  // Фаза 8, кусочек 2 — лагеря варваров (map_cells, t:"camp"|"fort"), см.
  // mpRefreshCamps/mpDoRaid выше. Бой — однообменный resolveBanditRaid в
  // mp-tick (та же упрощённая модель, что и у PvP), не полный resolveBattle
  // — победа сносит лагерь целиком, respawn пока не перенесён.
  h+=rubric("Лагеря варваров",embedded?"":"общий мир");
  if(!mpState.camps.length){
    h+="<div class='entry'><div class='line'><div class='fill'><div class='note'>"+
       "Рядом с городом появляется несколько лагерей при первом входе — если пусто, обновите вкладку.</div></div></div></div>";
  } else {
    const sortedCamps=[...mpState.camps].sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
    sortedCamps.forEach(c=>{
      const dist=Math.round(Math.hypot(c.x-p.x,c.y-p.y));
      const key=c.x+","+c.y, lv=(c.data&&c.data.lv)||1;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+(c.t==="fort"?"Форт":"Лагерь")+" варваров, "+lv+" ур.</div>"+
         "<div class='note'>"+c.x+", "+c.y+" · "+dist+" клет.</div>";
      if(mpState.raidTarget===key){
        h+="</div>";
        h+="<div class='note' style='color:#e08'>Бой честный (погода и полководец — настоящие). "+
           "Часть потерь отправится в лазарет, часть погибнет насовсем — как при штурме города, но без разграбления вашего дома.</div>";
        TKEYS.forEach(t=>{
          const have=(st.troops[t]&&st.troops[t][1])||0; if(!have) return;
          h+="<div class='note'>"+unitName(t,1,p.race)+" (T1, есть "+RU(have)+"): "+
             "<input id='mp-rd-"+t+"' type='number' min='0' max='"+have+"' value='0'></div>";
        });
        h+=mpGenTakeCheckboxHtml("mp-rd-gen");
        h+="<button class='seal' data-mp='raid' data-x='"+c.x+"' data-y='"+c.y+"'"+(mpState.loading?" disabled":"")+">В поход</button> "+
           "<button class='seal' data-mp='raidcancel'>Отмена</button>";
      } else {
        h+="</div><button class='seal' data-mp='raidpick' data-k='"+key+"'>Атаковать</button>";
      }
      h+="</div></div>";
    });
  }

  if(mpState.marches.length){
    h+=rubric("Отряды в поле",mpState.marches.length+" из "+mpMarchSlots(st.b.hall||0));
    mpState.marches.forEach(m=>{
      const left=Math.max(0,m.t1-Date.now()/1000);
      const going=m.state==="go", gathering=m.state==="gather", isGather=m.mode==="gather", isRaid=m.mode==="raid";
      const opp=mpState.neighbors.find(n=>n.id===(m.data&&m.data.defender_id));
      const title = isGather
        ? (going?"Идёт к точке сбора "+m.tx+", "+m.ty:gathering?"Собирает у "+m.tx+", "+m.ty:"Везёт добычу домой")
        : isRaid
        ? (going?"Идёт на лагерь "+m.tx+", "+m.ty:"Возвращается от лагеря "+m.tx+", "+m.ty)
        : (going?"Идёт к ":"Возвращается от ")+(opp?opp.nick||"Безымянный лорд":m.tx+", "+m.ty);
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+title+"</div>"+
         "<div class='note'>Осталось: "+fmtDur(left)+"</div>";
      // Фаза 4, девятый кусочек — отзыв похода на полпути (mp-recall):
      // разворачивает отряд ОТ ТЕКУЩЕЙ ТОЧКИ, а не мгновенно из дома — чем
      // дальше он уже прошёл, тем дольше идти назад. Фаза 9 (мелкий
      // пробел): mp-recall теперь понимает и gather/raid, не только
      // attack — кнопка доступна, пока отряд ещё идёт (state:"go", любой
      // режим) ИЛИ уже стоит на точке сбора (state:"gather" — тогда сбор
      // засчитывается целиком, см. заголовок mp-recall/index.js).
      if(going || (gathering && isGather)) h+="<button class='seal' data-mp='recall' data-id='"+m.id+"'"+(mpState.loading?" disabled":"")+">Отозвать</button>";
      h+="</div></div></div>";
    });
  }

  if(mpState.mail.length){
    h+=rubric("Бой","последние стычки");
    mpState.mail.forEach(m=>{
      const d=m.data, mine=d.role==="attacker";
      const myLoss=mine?d.attLoss:d.defLoss, oppLoss=mine?d.defLoss:d.attLoss;
      const lostN=u=>TKEYS.reduce((s,t)=>s+[1,2,3,4,5].reduce((s2,i)=>s2+((u[t]&&u[t][i])||0),0),0);
      const won=(mine&&d.winner==="att")||(!mine&&d.winner==="def");
      // Фаза 4, шестой кусочек: лазарет защитника — d.defDead/defHurt/
      // defSlight описывают ВСЕГДА защитника (одна и та же сводка лежит в
      // обоих письмах, и атакующему, и защитнику), поэтому это "наш" разбор
      // при mine===false и "их" при mine===true. У атакующего своей защиты
      // лазаретом нет (штурм чужого города — потери насмерть без остатка),
      // разбирать нечего. Та же терминология и порядок, что в настоящем
      // почтовом отчёте однопользовательской игры (index.html:7219-7221).
      const hospNote=d.defHurt!=null?(" · "+(mine?"у противника":"у нас")+": легкораненые "+
         RU(d.defSlight||0)+", тяжелораненые "+RU(d.defHurt||0)+", убито "+RU(d.defDead||0)):"";
      h+="<div class='entry"+(won?" hot":" war")+"'><div class='line'><div class='fill'>"+
         "<div class='title'>"+(mine?"Напали на ":"Напали от ")+(d.opponent_nick||"Безымянный лорд")+
         " — "+(won?"победа":"поражение")+"</div>"+
         "<div class='note'>Наши потери: "+RU(lostN(myLoss))+" · потери противника: "+RU(lostN(oppLoss))+hospNote+"</div>";
      // Грабёж склада — то же поле d.loot, что и у мока mp-tick, лежит в
      // обоих письмах (атакующему и защитнику), но реально ненулевое
      // только когда won && mine (штурм чужого города удался).
      const lootTxt=d.loot&&RES.filter(r=>d.loot[r]).map(r=>RES_NAME[r]+" "+RU(d.loot[r])).join(" · ");
      if(mine&&won&&lootTxt) h+="<div class='note'>Захвачено: "+lootTxt+"</div>";
      else if(!mine&&!won&&lootTxt) h+="<div class='note'>Разграблено: "+lootTxt+"</div>";
      h+="</div></div></div>";
    });
  }

  // Фаза 4, восьмой кусочек — донесения разведки; глубина по ступеням
  // подключена в Фазе 6 (продолжение) — se=d.se (сырой уровень
  // p.tech.mil_scout2 у ОТПРАВИВШЕГО лазутчика на момент прибытия, не
  // bonuses(p).scoutBonus — та величина к глубине донесения отношения не
  // имеет, см. заголовок applyScoutArrive в mp-tick). Честно НЕ показано:
  // прочность стены (wallHp/wallMax, se>=2) — сама механика прочности как
  // отдельного пула HP ещё не перенесена на сервер, есть только уровень;
  // полководец/снаряжение (se>=2/5) — генералы не перенесены, оба поля
  // сервер честно шлёт null/0/[]. Ступени и пороги — те же самые se>=1..5,
  // что и в scoutSnapshot/scoutReportHtml одиночной игры (index.html:
  // 5237-5282/7080-7151), просто короче (без блочной вёрстки — тут почта).
  if(mpState.scoutMail.length){
    h+=rubric("Разведка","донесения лазутчиков");
    mpState.scoutMail.forEach(m=>{
      const d=m.data;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+(d.found?(d.opponent_nick||"Безымянный лорд"):"Донесение")+"</div>";
      if(!d.found){
        h+="<div class='note'>Лазутчик не нашёл цель на месте — она пропала между отправкой и прибытием.</div>";
      } else {
        const se=d.se||0;
        h+="<div class='note'>Ратуша "+d.hall+" ур."+(d.shielded?" · под щитом мира":"")+"</div>";
        if(se>=1){
          h+="<div class='note'>Войск: "+(se>=3?RU(d.total):"около "+RU(Math.round(d.total/100)*100))+"</div>";
          if(se>=3 && d.byType && d.byType.length){
            h+="<div class='note'>"+d.byType.map(x=>{
              const tiers=se>=4 && d.byTier ? (d.byTier.find(y=>y.t===x.t)||{}).parts : null;
              return TROOP_TYPES[x.t].name+" "+RU(x.n)+
                (tiers&&tiers.length?" ("+tiers.map(pp=>SCOUT_TIER_LABEL[pp.i-1]+" "+RU(pp.n)).join(", ")+")":"");
            }).join(" · ")+"</div>";
          }
          h+="<div class='note'>Запасы: "+RES.map(r=>RES_NAME[r]+" "+RU(d.res[r])).join(" · ")+"</div>";
        } else {
          h+="<div class='note'>Без очков в «Маскировку» (mil_scout2) видно только ратушу и щит.</div>";
        }
        if(se>=2) h+="<div class='note'>Стена: "+d.wall+" ур. · Полководец: "+(d.genLv!=null?"ур. "+d.genLv:"не выбран")+"</div>";
        if(se>=3) h+="<div class='note'>Академия: "+d.academy+" ур.</div>";
        if(se>=4) h+="<div class='note'>Гарнизон (башня): "+d.garrison+" ур.</div>";
        if(se>=5) h+="<div class='note'>Лазарет: "+RU(d.wounded)+" раненых · снаряжение: мощь "+RU(d.gearPower)+"</div>";
      }
      h+="</div></div></div>";
    });
  }

  // Фаза 8, кусочек 2 — донесения о походах на лагеря (mail, kind:"raid").
  if(mpState.raidMail.length){
    h+=rubric("Лагеря","походы на варваров");
    mpState.raidMail.forEach(m=>{
      const d=m.data;
      const lostN=u=>TKEYS.reduce((s,t)=>s+[1,2,3,4,5].reduce((s2,i)=>s2+((u&&u[t]&&u[t][i])||0),0),0);
      h+="<div class='entry"+(d.win?" hot":" war")+"'><div class='line'><div class='fill'>"+
         "<div class='title'>Лагерь "+d.camp_lv+" ур. — "+(d.win?"разгромлен":"отряд разбит")+"</div>"+
         "<div class='note'>Потери: легкораненые "+RU(d.slight||0)+", тяжелораненые "+RU(d.hurt||0)+
         ", убито "+RU(d.dead||0)+" (из "+RU(lostN(d.attLoss))+" пострадавших)</div>";
      if(d.win){
        h+="<div class='note'>Добыча: "+RES.filter(r=>d.loot&&d.loot[r]).map(r=>RES_NAME[r]+" "+RU(d.loot[r])).join(" · ")+"</div>";
        const tomesTxt=Object.keys(d.tomes||{}).map(v=>TOME_NAME[v]+" ×"+d.tomes[v]).join(", ");
        if(tomesTxt) h+="<div class='note'>Книги опыта: "+tomesTxt+"</div>";
      }
      h+="</div></div></div>";
    });
  }

  const perHour=mpProdPerHour(p);
  h+="<div class='entry'><div class='line'><div class='fill'><div class='title'>Ресурсы</div>"+
     "<div class='note'>"+RES.map(r=>RES_NAME[r]+": "+RU(st.res[r])).join(" · ")+"</div>"+
     "<div class='note'>Добыча/час: "+RES.map(r=>RES_NAME[r]+" "+RU(perHour[r])).join(" · ")+
     " — досчитывается при каждом действии и при опросе (раз в 5с, пока открыта вкладка).</div>"+
     "</div></div></div>";

  // hospital/farm/lumber/quarry/mine — multi-здания (BUILDINGS.*.plots=4,
  // index.html:2425), все 4 участка (0-3) теперь строятся отдельно — участок
  // 0 всегда разблокирован (и это ровно тот, что нужен HALL_REQ у hospital),
  // участки 1-3 — по эпохе ратуши (plotUnlocked/epochOf, те же функции из
  // однопользовательской игры, что и здесь; см. _shared/rules.js на сервере
  // для точного зеркала). Старые записи могли завести здание скаляром (баг
  // mp-join, уже починен) — mpBuildLv/mpBuildLvAt читают защитно.
  const mpBuildLv=(bld)=>{ const raw=st.b[bld]; return BUILD_MP_MULTI.has(bld)?((Array.isArray(raw)?raw[0]:raw)||0):(raw||0) };
  const mpBuildLvAt=(bld,plot)=>{ const raw=st.b[bld]; return BUILD_MP_MULTI.has(bld)?((Array.isArray(raw)?raw[plot]:(plot===0?raw:0))||0):(raw||0) };
  const hallLv=mpBuildLv("hall");
  h+=rubric("Постройки","ратуша и хозяйство");
  const renderPlotRow=(bld,plot,lv,titleSuffix)=>{
    const nextLv=lv+1, plotKey=BUILD_MP_MULTI.has(bld)?plot:null;
    const queued=st.queues.find(q=>q&&q.b===bld&&q.plot===plotKey);
    h+="<div class='entry'><div class='line'><div class='fill'>"+
       "<div class='title'>"+buildingName(bld,pShim)+titleSuffix+" — уровень "+lv+"</div>";
    if(BUILD_MP_MULTI.has(bld) && !plotUnlocked(bld,plot,hallLv)){
      h+="<div class='note'>Участок откроется позже (нужна ратуша "+([0,7,13,19][plot])+" ур.).</div>";
    } else if(queued){
      const left=Math.max(0,queued.t1-Date.now()/1000);
      h+="<div class='note'>Строится до "+nextLv+" ур., осталось "+fmtDur(left)+"</div>";
    } else if(nextLv>buildingMax(bld)){
      h+="<div class='note'>Максимальный уровень.</div>";
    } else if(bld==="hall"){
      const need=HALL_REQ.filter(k=>mpBuildLv(k)<hallLv);
      if(need.length){
        h+="<div class='note'>Сначала до "+hallLv+" ур.: "+need.map(k=>buildingName(k,pShim)).join(", ")+"</div>";
      } else {
        const c=buildCost(bld,nextLv), t=buildTime(bld,nextLv);
        h+="<div class='note'>До "+nextLv+" ур.: "+
           (RES.some(r=>c[r])?RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", "):"бесплатно")+
           " · "+fmtDur(t)+"</div>"+
           "<button class='seal' data-mp='build' data-bk='"+bld+"'"+(mpState.loading?" disabled":"")+">Улучшить</button>";
      }
    } else if(nextLv>hallLv){
      h+="<div class='note'>Требуется ратуша "+nextLv+" уровня (сейчас "+hallLv+").</div>";
    } else {
      const c=buildCost(bld,nextLv), t=buildTime(bld,nextLv);
      h+="<div class='note'>До "+nextLv+" ур.: "+
         (RES.some(r=>c[r])?RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", "):"бесплатно")+
         " · "+fmtDur(t)+"</div>"+
         "<button class='seal' data-mp='build' data-bk='"+bld+"'"+(plotKey!=null?" data-plot='"+plotKey+"'":"")+(mpState.loading?" disabled":"")+">"+(lv?"Улучшить":"Построить")+"</button>";
    }
    h+="</div></div></div>";
  };
  BUILD_MP_BLDS.forEach(bld=>{
    if(BUILD_MP_MULTI.has(bld)){
      for(let plot=0;plot<4;plot++) renderPlotRow(bld,plot,mpBuildLvAt(bld,plot)," — участок "+(plot+1));
    } else {
      renderPlotRow(bld,null,mpBuildLv(bld),"");
    }
  });

  // Фаза 11: кусочек 1 — Горн, добыча сырых материалов (mp-forge, только
  // kind:"material"); кусочек 2 — слияние 4-в-1 на более редкое качество
  // (mp-upgrade); кусочек 3 — ковка снаряжения (mp-craft, kind:"item"),
  // предмет при удаче доезжает до склада (p.inventory) — надеть его
  // (equipItem) пока нельзя, отдельный следующий кусочек.
  h+=rubric("Горн","добыча и слияние материалов");
  if(!(mpBuildLv("forge")>0)){
    h+="<div class='entry'><div class='line'><div class='fill'>"+
       "<div class='note'>Нужно построить Горн (см. «Постройки» выше).</div></div></div></div>";
  } else {
    const craft=st.craft;
    if(craft && craft.kind==="material"){
      const left=Math.max(0,craft.t1-Date.now()/1000);
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>Добывается: "+MATERIALS[craft.mat].name+" ×"+craft.n+"</div>"+
         "<div class='note'>Осталось: "+fmtDur(left)+"</div></div></div></div>";
    } else if(craft && craft.kind==="item"){
      const left=Math.max(0,craft.t1-Date.now()/1000);
      const orderName=craft.order==="storm"?"Буря":"Бастион";
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>Куётся: "+GEAR_NAMES[craft.slot][craft.order][craft.rarity-1]+"</div>"+
         "<div class='note'>"+orderName+", "+RARITY_NAMES[craft.rarity-1]+" · осталось "+fmtDur(left)+"</div></div></div></div>";
    } else {
      Object.keys(MATERIALS).forEach(mat=>{
        const stock=(st.materials&&st.materials[mat])||[0,0,0,0,0];
        h+="<div class='entry'><div class='line'><div class='fill'>"+
           "<div class='title'>"+MATERIALS[mat].name+"</div>"+
           "<div class='note'>"+RARITY_NAMES.map((rn,i)=>rn+": "+RU(stock[i]||0)).join(" · ")+"</div>"+
           "<button class='seal' data-mp='forge' data-mat='"+mat+"'"+(mpState.loading?" disabled":"")+">Добыть обычного (×3 · 100 золота · "+fmtDur(2400)+")</button> "+
           [0,1,2,3].map(t=>
             "<button class='seal' data-mp='matup' data-mat='"+mat+"' data-tier='"+t+"'"+
             (mpState.loading||(stock[t]||0)<4?" disabled":"")+">4×"+RARITY_NAMES[t]+" → "+RARITY_NAMES[t+1]+"</button>"
           ).join(" ")+
           "</div></div></div>";
      });
    }
  }

  if(mpBuildLv("forge")>0){
    h+=rubric("Ковка снаряжения","Горн");
    if(st.craft){
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='note'>Горн занят — дождитесь окончания текущей работы выше.</div></div></div></div>";
    } else {
      const hallLvFull=Array.isArray(st.b.hall)?Math.max(0,...st.b.hall):(st.b.hall||0);
      const maxRarity=Math.min(5,epochOf(hallLvFull));
      GEAR_SLOTS.forEach(s=>{
        const matStock=(st.materials&&st.materials[s.mat])||[0,0,0,0,0];
        h+="<div class='entry'><div class='line'><div class='fill'>"+
           "<div class='title'>"+s.name+" ("+MATERIALS[s.mat].name+")</div>"+
           "<select id='mp-craft-order-"+s.id+"'><option value='bastion'>Бастион</option><option value='storm'>Буря</option></select> "+
           "<select id='mp-craft-rarity-"+s.id+"'>"+
             Array.from({length:maxRarity},(_,i)=>i+1).map(r=>{
               const need=CRAFT_MAT_NEED[r-1], have=matStock[r-1]||0, c=craftCost(s.mat,r-1,r);
               return "<option value='"+r+"'"+(have<need?" disabled":"")+">"+RARITY_NAMES[r-1]+" — нужно "+need+"× ("+have+" есть) · "+RU(c.gold)+" золота · "+fmtDur(1800*r*r)+"</option>";
             }).join("")+
           "</select> "+
           "<button class='seal' data-mp='craft' data-slot='"+s.id+"'"+(mpState.loading?" disabled":"")+">Ковать</button>"+
           "</div></div></div>";
      });
    }
  }

  // Новый кусочек (после Портала) — книги опыта генерала (mp-usetome),
  // зеркало клиентского "usetome" (index.html:7943-7950). Появляются с
  // разгрома лагерей разбойников (mp-tick, applyRaidArrive — bookDrop
  // тем же коммитом наконец подключён, раньше честно не переносился).
  {
    const owned=TOME_VALUES.filter(v=>(st.tomes&&st.tomes[v])||0);
    const hallLvT=Array.isArray(st.b.hall)?Math.max(0,...st.b.hall):(st.b.hall||0);
    const lvCap=Math.min(60,epochOf(hallLvT)*12);
    const genLv=(st.gen&&st.gen.lv)||1;
    if(owned.length){
      h+=rubric("Книги опыта","+"+RU(genLv)+" ур. генерала из "+lvCap);
      owned.forEach(v=>{
        const cnt=st.tomes[v];
        h+="<div class='entry'><div class='line'><div class='fill'>"+
           "<div class='title'>"+TOME_NAME[v]+" ×"+RU(cnt)+"</div>"+
           "<div class='note'>+"+RU(v)+" опыта генералу"+(genLv>=lvCap?" (генерал уже на максимуме эпохи)":"")+"</div>"+
           "<button class='seal' data-mp='usetome' data-v='"+v+"'"+(mpState.loading||genLv>=lvCap?" disabled":"")+">Использовать</button>"+
           "</div></div></div>";
      });
    }
  }

  // Фаза 11, кусочек 4 — надеть/снять/разобрать. Зеркало equipItem/
  // unequipItem/dismantleItem (index.html:5895-5917). Показываем 9 слотов
  // GEAR_SLOTS: что надето сейчас (с бонусом через statTxt+gearItemStats,
  // как в SP genGearHtml) и что лежит на складе (st.inventory[slot][order][r-1]).
  h+=rubric("Снаряжение","надето и склад");
  GEAR_SLOTS.forEach(s=>{
    const cur=st.gear&&st.gear[s.id];
    h+="<div class='entry'><div class='line'><div class='fill'>"+
       "<div class='title'>"+s.name+"</div>";
    if(cur){
      const stat=gearItemStats(s.cat,cur.order,cur.rarity);
      h+="<div class='note'>"+GEAR_NAMES[s.id][cur.order][cur.rarity-1]+" · "+RARITY_NAMES[cur.rarity-1]+" · "+statTxt(stat)+"</div>"+
         "<button class='seal' data-mp='unequip' data-slot='"+s.id+"'"+(mpState.loading?" disabled":"")+">Снять</button>";
    } else {
      h+="<div class='note'>Пусто</div>";
    }
    const inv=(st.inventory&&st.inventory[s.id])||{};
    ["bastion","storm"].forEach(order=>{
      const stock=inv[order]||[0,0,0,0,0];
      stock.forEach((n,i)=>{
        if(!n) return;
        const rarity=i+1, orderName=order==="storm"?"Буря":"Бастион";
        h+="<div class='note'>"+GEAR_NAMES[s.id][order][i]+" ("+orderName+", "+RARITY_NAMES[i]+") ×"+RU(n)+" — "+
           "<button class='seal' data-mp='equip' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+rarity+"'"+(mpState.loading?" disabled":"")+">Надеть</button> "+
           "<button class='seal' data-mp='dismantle' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+rarity+"'"+(mpState.loading?" disabled":"")+">Разобрать ("+RU(Math.round(200*rarity*rarity*0.5))+" золота)</button>"+
           "</div>";
      });
    });
    h+="</div></div></div>";
  });

  h+=rubric("Набор войск","тир 1");
  TKEYS.forEach(t=>{
    const bld=TRAIN_BLD[t], lv=st.b[bld]||0, cap=trainCap(lv);
    const have=(st.troops[t]&&st.troops[t][1])||0;
    const training=st.train&&st.train[t];
    h+="<div class='entry'><div class='line'><div class='fill'>"+
       "<div class='title'>"+unitName(t,1,p.race)+" — есть "+RU(have)+"</div>";
    if(training){
      const left=Math.max(0,training.t1-Date.now()/1000);
      h+="<div class='note'>В наборе: ×"+RU(training.n)+", осталось "+fmtDur(left)+"</div>";
    } else if(cap<=0){
      h+="<div class='note'>Нужно здание ("+buildingName(bld,pShim)+") — постройте его выше.</div>";
    } else {
      const c=troopCost(t,1);
      h+="<div class='note'>Цена за штуку: "+RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", ")+
         " · максимум за раз: "+cap+"</div>"+
         "<input id='mp-n-"+t+"' type='number' min='1' max='"+cap+"' value='"+Math.min(cap,10)+"'> "+
         "<button class='seal' data-mp='train' data-t='"+t+"'"+(mpState.loading?" disabled":"")+">Обучить</button>";
    }
    h+="</div></div></div>";
  });

  // Новый кусочек (после Фазы 11) — переобучение в следующий тир (mp-retrain),
  // зеркало startRetrain(p,type,fromTier,n) (index.html:5828-5847). Строка
  // появляется на каждый тип войск, у которого есть хоть один воин тира
  // fromTier И следующий тир уже открыт исследованием (tierUnlockedFor,
  // используем ту же функцию, что и в академии выше — pShim2 там строится
  // позже по тексту, поэтому здесь свой минимальный {tech:st.tech||{}}).
  h+=rubric("Переобучение","в следующий тир");
  { const techShim={tech:st.tech||{}};
    let any=false;
    TKEYS.forEach(t=>{
      const maxT=tierUnlockedFor(techShim,t);
      for(let fromTier=1; fromTier<maxT; fromTier++){
        const have=(st.troops[t]&&st.troops[t][fromTier])||0;
        if(!have) continue;
        any=true;
        const bld=TRAIN_BLD[t], cap=trainCap(Array.isArray(st.b[bld])?Math.max(0,...st.b[bld]):(st.b[bld]||0));
        const training=st.train&&st.train[t];
        h+="<div class='entry'><div class='line'><div class='fill'>"+
           "<div class='title'>"+unitName(t,fromTier,p.race)+" → "+unitName(t,fromTier+1,p.race)+" — есть "+RU(have)+"</div>";
        if(training){
          h+="<div class='note'>Здание занято набором/переобучением.</div>";
        } else {
          const c=retrainCost(t,fromTier,1), n=Math.min(have,cap);
          h+="<div class='note'>Цена за штуку (сверх уже вложенного): "+RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", ")+
             " · максимум за раз: "+cap+"</div>"+
             "<input id='mp-rt-n-"+t+"-"+fromTier+"' type='number' min='1' max='"+n+"' value='"+n+"'> "+
             "<button class='seal' data-mp='retrain' data-t='"+t+"' data-from='"+fromTier+"'"+(mpState.loading?" disabled":"")+">Переобучить</button>";
        }
        h+="</div></div></div>";
      }
    });
    if(!any) h+="<div class='entry'><div class='line'><div class='fill'>"+
       "<div class='note'>Нет войск, готовых к переобучению — либо всё уже в высшем открытом тире, либо следующий тир ещё не изучен в Академии.</div></div></div></div>";
  }

  // Фаза 4, седьмой кусочек — лазарет: тяжелораненые (Фаза 4, шестой
  // кусочек) больше не застревают в p.wounded навсегда, их можно вылечить
  // обратно в строй. Как и "Добыча/час" выше, здесь НЕ вызывается настоящий
  // healUnitCost(p,type,tier)/healDuration(p,...) из одиночной игры — те
  // читают bonuses(p), а pShim не полноценный игрок; вместо них — та же
  // лёгкая переформулировка без bonuses (стоимость/время ровно с
  // healBonus=1/healSpeedBonus=1, см. _shared/rules.js), что и на сервере
  // в mp-heal. Только тир 1 — в общем мире набор войск (Фаза 2/5) тоже
  // только тира 1, других тиров тут взяться неоткуда.
  const mpHospLv=Array.isArray(st.b.hospital)?Math.max(0,...st.b.hospital):(st.b.hospital||0);
  const mpHealCap=trainCap(mpHospLv);
  const healing=st.heal;
  const anyWounded=TKEYS.some(t=>(st.wounded&&st.wounded[t]&&st.wounded[t][1])||0);
  if(anyWounded||healing){
    h+=rubric("Лазарет","лечение раненых, тир 1");
    TKEYS.forEach(t=>{
      const wounded=(st.wounded&&st.wounded[t]&&st.wounded[t][1])||0;
      const healingThis=healing&&healing.type===t&&healing.tier===1;
      if(!wounded && !healingThis) return;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+unitName(t,1,p.race)+" — ранено "+RU(wounded)+"</div>";
      if(healingThis){
        const left=Math.max(0,healing.t1-Date.now()/1000);
        h+="<div class='note'>Лечится: ×"+RU(healing.n)+", осталось "+fmtDur(left)+"</div>";
      } else if(healing){
        h+="<div class='note'>Лазарет занят лечением другого рода войск.</div>";
      } else if(mpHealCap<=0){
        h+="<div class='note'>Нужен построенный госпиталь.</div>";
      } else {
        const tc=troopCost(t,1);
        const c={food:Math.round((tc.food||0)/2),wood:Math.round((tc.wood||0)/2),stone:Math.round((tc.stone||0)/2),gold:0};
        const maxN=Math.min(wounded,mpHealCap);
        h+="<div class='note'>Цена за штуку: "+(RES.some(r=>c[r])?RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", "):"бесплатно")+
           " · вдвое дешевле и быстрее набора · максимум за раз: "+mpHealCap+"</div>"+
           "<input id='mp-heal-n-"+t+"' type='number' min='1' max='"+maxN+"' value='"+Math.min(maxN,10)+"'> "+
           "<button class='seal' data-mp='heal' data-t='"+t+"'"+(mpState.loading?" disabled":"")+">Лечить</button>";
      }
      h+="</div></div></div>";
    });
  }

  // Фаза 7 — выбор полководца (mp-pickgen), зеркало foGen()'s "Выбор
  // полководца" (index.html:7414-7426) и клика (index.html:7951-7953).
  // Честно переиспользует ту же самую глобальную таблицу GENERALS, что и
  // одиночная игра — один файл, отдельной копии не заводим. Одноразово,
  // бесплатно, необратимо: как только st.gen.id не null, кнопка выбора
  // больше не показывается вообще (переиграть нельзя, ровно как в клиенте).
  // Фаза 10, кусочек 1 — уровень/опыт генерала наконец начисляются
  // (addXp в mp-tick, на победу над лагерем/игроком) — переиспользует те
  // же самые genXpNeed/epochOf, что и одиночная игра (тот же файл, приём
  // как у mpProdPerHour ниже). Очки таланта (p.gen.pts) уже копятся
  // по-настоящему, но тратить их пока негде — mp-talent и подключение
  // самих бонусов в bonuses() отдельными следующими кусочками, см.
  // supabase/README.md.
  h+=rubric("Полководец","решение окончательное");
  if(!st.gen||st.gen.id==null){
    GENERALS[p.race].forEach((g,i)=>{
      h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+
        genPortraitHtml(p.race,i)+shieldSvg(p.race,26)+"</div><div class='fill'>"+
        "<div class='title'>"+g.name+"<span class='tag gilt'>"+g.role+"</span></div>"+
        "<div class='note'>"+g.flavor+"<span class='gen-stat'>"+g.stat+"</span></div></div></div>"+
        "<button class='seal' data-mp='pickgen' data-id='"+i+"'"+(mpState.loading?" disabled":"")+">Выбрать</button></div>";
    });
  } else {
    const g=GENERALS[p.race][st.gen.id];
    const lv=st.gen.lv||1, xp=st.gen.xp||0, pts=st.gen.pts||0;
    const lvCap=Math.min(60,epochOf(st.b.hall||0)*12), need=genXpNeed(lv);
    h+="<div class='entry'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+
      genPortraitHtml(p.race,st.gen.id)+shieldSvg(p.race,26)+"</div><div class='fill'>"+
      "<div class='title'>"+g.name+"<span class='tag gilt'>"+g.role+"</span> · "+lv+" ур."+"</div>"+
      "<div class='note'>"+g.flavor+"<span class='gen-stat'>"+g.stat+"</span></div>"+
      "<div class='note'>Опыт: "+RU(xp)+" / "+RU(need)+(lv>=lvCap?" · потолок эпохи":"")+
      (pts>0?" · очков таланта: "+pts:"")+"</div>"+
      "<div class='note'>"+(st.gen.away!=null?"В походе — недоступен для другого марша и обороны города.":"Дома — доступен для похода и обороны города.")+"</div>"+
      "</div></div></div>";
  }

  // Фаза 10, кусочек 2 — трата очков таланта (mp-talent). Честно
  // переиспользует TALENT_BRANCHES/TALENTS/GENERAL_TREE одиночной игры
  // (тот же файл, как и GENERALS выше) — пять веток (Город/Армия/Война/
  // Развитие/Сбор), максимум узла — n.max у GENERAL_TREE, ||5 у голых
  // TALENTS (там своего max нет, тот же приём, что findTalentNode в
  // index.html:7935). Сам эффект вложенных очков в bonuses() подключён
  // кусочком 3 той же Фазы 10 (см. supabase/README.md).
  if(st.gen && st.gen.id!=null){
    h+=rubric("Таланты",(st.gen.pts||0)+" очков свободно");
    TALENT_BRANCHES.forEach(([key,br])=>{
      let spent=0; br.nodes.forEach(n=>spent+=((st.gen.tal&&st.gen.tal[n.id])||0));
      h+="<div class='entry'><div class='line'><div class='fill'><div class='title'>"+br.name+"</div></div></div>";
      br.nodes.forEach(n=>{
        const max=n.max||5, lv2=(st.gen.tal&&st.gen.tal[n.id])||0, full=lv2>=max;
        h+="<div class='line' style='margin-top:4px'><div class='fill'>"+
           "<div class='note'>"+n.name+" — "+n.txt+" <span class='tag"+(full?" gilt":"")+"'>"+lv2+"/"+max+"</span></div></div>"+
           "<button class='seal' data-mp='talent' data-id='"+n.id+"'"+
           ((st.gen.pts||0)<=0||full||mpState.loading?" disabled":"")+">Вложить</button></div>";
      });
      h+="</div>";
    });
  }

  // Фаза 5, Академия — дерево исследований (ACADEMY_TREE, зеркало
  // startResearch(p,id) из index.html:5848-5863, см. mp-research). Честно
  // переиспользует те же самые глобальные ACADEMY_TREE/researchLocked/
  // lockReason/nodeVisibleFor/findNode/nodeTitle/researchCost/researchTime,
  // что и одиночная игра — это ОДИН И ТОТ ЖЕ файл, отдельной копии не
  // заводим (как buildCost/buildTime/troopCost выше в этой же панели).
  // pShim2 несёт race/b/gen/tech — этого достаточно ДЛЯ ВСЕГО, что здесь
  // нужно, включая настоящий bonuses(pShim2) (Фаза 6): предпросмотр времени
  // исследования теперь совпадает с тем, что реально спишет сервер
  // (researchTime(n,lv)/(1+B.researchSpeed), см. mp-research).
  const academyLv=st.b.academy||0;
  if(academyLv>0){
    h+=rubric("Академия","дерево исследований");
    // portal:0 — см. тот же приём в mpProdPerHour выше (Портал не входит в
    // постройки общего мира, без явного 0 portalMarchBonus(undefined) внутри
    // bonuses() уходит в NaN — не влияет на B.researchSpeed, но так чище).
    const pShim2={race:p.race,b:Object.assign({portal:0},st.b),gen:st.gen||{id:null},tech:st.tech||{}};
    const rschB=bonuses(pShim2);
    const rsch=st.rsch;
    if(rsch){
      const rn=findNode(rsch.id);
      const left=Math.max(0,rsch.t1-Date.now()/1000);
      h+="<div class='entry hot'><div class='line'><div class='fill'>"+
         "<div class='title'>Исследуется: "+(rn?nodeTitle(rn):rsch.id)+" ур. "+rsch.lv+"</div>"+
         "<div class='note'>Осталось: "+fmtDur(left)+"</div></div></div></div>";
    }
    h+="<div class='entry'><div class='line'><div class='fill'><div id='ac-tabs'>"+
       "<button class='"+(mpState.rschTab==="mil"?"on":"")+"' data-mp='rschtab' data-t='mil'>Военные</button>"+
       "<button class='"+(mpState.rschTab!=="mil"?"on":"")+"' data-mp='rschtab' data-t='eco'>Экономические</button>"+
       "</div></div></div></div>";
    const branch=mpState.rschTab==="mil"?"mil":"eco";
    ACADEMY_TREE[branch].filter(n=>nodeVisibleFor(n,pShim2)).forEach(n=>{
      const lv=(st.tech&&st.tech[n.id])||0, maxed=lv>=n.max;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
         "<div class='title'>"+nodeTitle(n)+" — "+lv+"/"+n.max+"</div>";
      if(maxed){
        h+="<div class='note'>Максимальный уровень.</div>";
      } else if(researchLocked(n,pShim2)){
        h+="<div class='note'>"+lockReason(n,pShim2)+"</div>";
      } else if(rsch){
        h+="<div class='note'>Академия уже занята другим исследованием.</div>";
      } else {
        const nlv=lv+1, c=researchCost(n,nlv), t=researchTime(n,nlv)/(1+rschB.researchSpeed);
        h+="<div class='note'>До "+nlv+" ур.: "+
           (RES.some(r=>c[r])?RES.filter(r=>c[r]).map(r=>RES_NAME[r]+" "+RU(c[r])).join(", "):"бесплатно")+
           " · "+fmtDur(t)+"</div>"+
           "<button class='seal' data-mp='research' data-id='"+n.id+"'"+(mpState.loading?" disabled":"")+">Исследовать</button>";
      }
      h+="</div></div></div>";
    });
  }

  if(mpState.err) h+="<div class='entry'><div class='line'><div class='fill'><div class='note' style='color:#e08'>"+mpState.err+"</div></div></div></div>";
  return h;
}

/* ---- Запуск ---- */
(async function start(){
  // Фаза 13, продолжение (3) — почему СНАЧАЛА mpOpen(), а openMenuModal("mp")
  // только ПОСЛЕ, а не наоборот (как было раньше — и давало ровно ту
  // "сначала старая регистрация, через пару секунд поверх новая" гонку,
  // о которой сообщил автор): openMenuModal("mp") сама, синхронно, тут же
  // рисует foMultiplayer(true) внутрь #menu-modal-body и показывает
  // модалку — если mpState.joined ещё false (а для нового anon-uid оно
  // именно false, mpOpen() ещё даже не сходил на сервер), это и есть та
  // самая плоская форма "Выберите народ". Только СЕКУНДЫ спустя, когда
  // mpOpen() внутри неё же долетает до сервера и узнаёт "нужна раса",
  // поверх (z-index:70 у #onboard выше 25 у #menu-modal) выезжает
  // настоящий визард — то есть игрок ГАРАНТИРОВАННО видел плоскую форму
  // первым кадром, а не как редкий сетевой лаг.
  // Правильный порядок: сперва дождаться mpOpen() целиком (сам решает —
  // авто-резюме уже существующего игрока, или runMpOnboarding() для
  // нового, см. её же ветвление) — он ничего не показывает, пока модалка
  // не открыта (mpRerender() внутри неё — no-op при закрытой модалке), и
  // только ПОСЛЕ этого звать openMenuModal("mp") ровно один раз, уже с
  // готовым результатом (mpState.joined либо true, либо форма для
  // истинного сбоя сети — но не для "просто ещё не успели спросить").
  // Одиночный claimChronicle() тут больше не может зависнуть, ожидая
  // клика по невидимому экрану — он не вызывается при .mp-gated вовсе
  // (см. ниже), а не просто спрятан, так что и прежней причины звать
  // openMenuModal("mp") ДО загрузки одиночки (чтобы не отстать от
  // зависшего await) тоже больше нет.
  if(!SP_UNLOCKED){
    // Фаза 14, кусочек 1 — объёмная карта общего мира видна и в
    // gate-режиме, не только при ?sp=1. #app.view-world прячет #ledger
    // (одиночные вкладки) и показывает #chart (#world3d/#tools/
    // #cartouche) — тот же переключатель классов, что и toggleView(),
    // просто выставлен сразу на "мир" по умолчанию. #view-toggle (кусочек 2)
    // умеет переключить на .view-city — там теперь mpRenderCityMap() (см.
    // mpRenderFolio() ниже), а не пустой #ledger, как было раньше.
    // src у #world3d — тот же ленивый приём, что и в toggleView() (не
    // тянуть WebGPU/модели, пока не нужно), просто здесь "нужно" сразу.
    $("#app").className="view-world";
    const w3d=$("#world3d"); if(w3d && !w3d.src) w3d.src="engine/dist/index.html";
    // Иконка #view-toggle показывает пункт НАЗначения клика (см. toggleView()
    // — тот же приём для одиночки: в .view-city лежит icon-world.png, "жми,
    // чтобы попасть в мир"). Разметка по умолчанию несёт icon-world.png (под
    // одиночный старт с .view-city) — при старте сразу в .view-world её надо
    // довернуть на icon-city.png, иначе кнопка звала бы туда, где мы уже есть.
    const vtImg=$("#view-toggle img");
    if(vtImg){ vtImg.src="images/ui/icon-city.png"; vtImg.alt="Город"; }
    await mpOpen();
    mpRenderFolio();
    mpRenderTop();
    openMenuModal("mp");
  }
  const ok=await load();
  if(!ok) genWorld(Date.now()&0xffffff);
  // Старые сохранения флага не несут вовсе, поэтому у них экран не появится —
  // они остаются как были, и выбор полководца у них живёт во вкладке «Генерал».
  // При .mp-gated claimChronicle() НЕ зовётся вовсе (не только не видна) —
  // она использует тот же #onboard/#ob-body, что теперь занят под
  // регистрацию в общем мире (runMpOnboarding(), см. mpOpen()); звать обе
  // одновременно — гонка за одним и тем же DOM. W.pendingSetup остаётся
  // true молча — newPlayer() уже создаёт валидного me() с race:"human" по
  // умолчанию (см. genWorld), так что W/me() всё равно валидны для всего
  // остального кода, просто раса не "подтверждена" — а раз партия никому
  // не видна, это ничему не мешает.
  if(SP_UNLOCKED && W.pendingSetup) await claimChronicle();
  // Одиночная партия (W/me()) должна СУЩЕСТВОВАТЬ валидной и при .mp-gated
  // (см. menuBadges/visibilitychange и другой код по всему файлу, молча на
  // это рассчитывающий) — но раз она в этом режиме никому не видна, гонять
  // ради неё рендер-цикл/боты каждый кадр для каждого невидимого посетителя
  // незачем, чистая трата CPU. Дальше — только при ?sp=1.
  if(SP_UNLOCKED){
    const p=me();
    centerOn(p.x,p.y); sel={x:p.x,y:p.y};
    syncRibbons(); renderTop(); renderFolio(); renderCartouche();
    lastReal=Date.now();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
