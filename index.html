// Настоящие гербы рас (загружены пользователем в images/ui/) вместо
// цветных SVG-щитков — картинки портретные (выше, чем шире, у каждой
// расы свои пропорции), object-fit:contain в фиксированном боксе не
// искажает исходник ни на одной из четырёх. Имя функции не поменяли —
// звать её продолжают из тех же мест теми же аргументами (race, ширина в
// px), поменялась только реализация внутри.
const RACE_CREST={human:"Human",dwarf:"Dwarf",elf:"Elf",undead:"Undead"};
function shieldSvg(race,w){
  const width=w||13, height=Math.round(width*1.5);
  return "<img class='shield' src='images/ui/"+RACE_CREST[race]+".png' alt='"+RACES[race].name+"' "+
    "style='width:"+width+"px;height:"+height+"px;object-fit:contain'>";
}
function ring(lv,max){
  const f=Math.min(1,lv/(max||25)), C=2*Math.PI*14;
  return "<div class='ring'><svg viewBox='0 0 34 34'>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#3d3121' stroke-width='2.5'/>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#c2993c' stroke-width='2.5'"+
    " stroke-dasharray='"+(C*f).toFixed(1)+" "+C.toFixed(1)+"' stroke-linecap='butt'/>"+
    "</svg><b>"+lv+"</b></div>";
}
function priceRow(p,c){
  const out=RES.filter(r=>c[r]).map(r=>{
    const short=p.res[r]<c[r];
    return "<span class='"+(short?"short":"")+"' style='--c:"+RSHADE[r]+
      "' title='"+RES_NAME[r]+"'>"+fmt(c[r])+"</span>";
  }).join("");
  return out?"<div class='price'>"+out+"</div>":"";
}
function rubric(text,note){
  return "<div class='rubric'>"+text+(note?"<span class='n'>"+note+"</span>":"")+"</div>";
}
function hollow(mark,text){
  return "<div class='hollow'><span class='big'>"+mark+"</span>"+text+"</div>";
}

/* Аватар игрока = аватар выбранного полководца (пока не выбран — герба достаточно) */
function playerAvatarSrc(p){
  return (p.gen&&p.gen.id!=null) ? "images/ui/avatar-"+p.race+(p.gen.id+1)+".png" : null;
}

/* ---- Верхняя строка: кошель и хроника ---- */
let lastCrestAvatar;
function renderTop(){
  const p=me(); syncRes(p);
  const pr=production(p);
  $("#purse").innerHTML = ["food","stone","wood","gold"].map(r=>{
    const v=pr[r];
    return "<div class='coin' title='"+RES_NAME[r]+"'>"+
      "<img class='disc' src='images/ui/res-"+r+".png' alt=''>"+
      "<span><b class='amt'>"+fmt(p.res[r])+"</b>"+
      "<s class='rate"+(v<0?" neg":"")+"'>"+(v<0?"−":"+")+fmt(Math.abs(v))+"/ч</s></span></div>";
  }).join("");
  $("#crest-name").textContent=p.nick||"Безымянный лорд";
  $("#crest-power").innerHTML="<img class='ico' src='images/ui/icon-power.png' alt=''>"+fmt(power(p));
  const avSrc=playerAvatarSrc(p);
  if(avSrc!==lastCrestAvatar){
    lastCrestAvatar=avSrc;
    const av=$("#crest-avatar"), mark=$("#crest .mark");
    if(avSrc){
      av.onload=()=>{ av.style.display="block"; mark.style.display="none" };
      av.onerror=()=>{ av.style.display="none"; mark.style.display="" };
      av.src=avSrc;
    } else {
      av.style.display="none"; mark.style.display="";
    }
  }
  const d=Math.floor(W.t/86400), hh=Math.floor(W.t%86400/3600), mm=Math.floor(W.t%3600/60);
  $("#daytime").textContent="д."+(d+1)+" "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* ---- Картуш: что выбрано на карте. Ник/уровень ратуши у каждого замка
   теперь висят прямо в 3D над моделью (см. updateLabels в obyom-3d-infinite.
   html) — панели тут остаются только там, где нужно ДЕЙСТВИЕ (собрать,
   атаковать, разведать), а не просто повторить то, что уже подписано в
   мире. Пустошь и своя столица не открывают панель вовсе. ---- */
let lastCart="";
function renderCartouche(){
  const el=$("#cartouche");
  // Крестик добавляется тут ОДИН раз, а не в каждой из трёх веток ниже
  // (node/camp-fort/city) — put() оборачивает готовое тело панели, ветки
  // ничего не знают про кнопку закрытия.
  const put=h=>{
    const full=h?"<button class='cart-close' data-act='closecartouche' title='Закрыть' aria-label='Закрыть'>&times;</button>"+h:h;
    if(full!==lastCart){ lastCart=full; el.innerHTML=full } el.style.display=full?"":"none";
  };
  if(!sel){ put(""); return }
  const o=W.map[key(sel.x,sel.y)], p=me();
  const coord="<span class='n' style='font-family:var(--data);font-size:10px;color:var(--vellum-faint)'>"+
    sel.x+" · "+sel.y+"</span>";
  if(!o){ put(""); return; }

  if(o.t==="node"){
    // "Сборщик" — кто сейчас черпает эту жилу (o.busy хранит id игрока,
    // ставится в arriveMarch при входе в режим gather); своя добыча
    // показывает прогресс и позволяет отозвать обоз вместо повторной
    // отправки — как отозвать в списке маршей, но прямо с карты.
    const g=W.marches.find(m=>m.tx===o.x&&m.ty===o.y&&m.state==="gather");
    const gp=o.busy!=null?W.players.find(q=>q.id===o.busy):null;
    const mine=g&&g.pid===p.id;
    let body="<div class='hd'>"+RES_SITE_NAME[o.res]+" "+coord+"</div>"+
      "<div class='co'><span>Уровень</span><b>"+o.lv+" из 5</b></div>"+
      "<div class='co'><span>Резервы</span><b>"+fmt(o.amount)+"</b></div>"+
      "<div class='co'><span>Сборщик</span><b>"+(gp?gp.nick:"Никто")+"</b></div>";
    if(mine){
      const f=clamp((W.t-g.t0)/Math.max(1,g.t1-g.t0),0,1);
      const target=(g.carry&&g.carry[o.res])||0, got=Math.round(target*f);
      body+="<div class='co'><span>Собрано</span><b>"+fmt(got)+" / "+fmt(target)+"</b></div>"+
        "<button class='seal wide' style='margin-top:9px' data-act='recall' data-m='"+g.id+"'>Отозвать</button>";
    } else {
      body+="<button class='seal wide' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Собрать</button>";
    }
    put(body);
    return;
  }
  if(o.t==="camp"||o.t==="fort"){
    const fp=banditPower(o.lv), my=armyPower(p.troops,bonuses(p),p.race);
    const ok = my>fp*1.8?["Разгром без потерь","var(--verdigris)"]
             : my>fp*1.1?["Победа с потерями","var(--gilt)"]
             : my>fp*0.8?["Исход не ясен","var(--gilt)"]
             : ["Отряд поляжет","var(--garnet)"];
    put("<div class='hd'>"+(o.t==="fort"?"Форт":"Лагерь")+" разбойников "+coord+"</div>"+
      "<div class='co'><span>Уровень</span><b>"+o.lv+"</b></div>"+
      "<div class='co'><span>Сила заставы</span><b>"+fmt(fp)+"</b></div>"+
      "<div class='co'><span>Ваше войско</span><b>"+fmt(my)+"</b></div>"+
      "<div class='co'><span>Прогноз</span><b style='color:"+ok[1]+"'>"+ok[0]+"</b></div>"+
      "<button class='seal wide blood' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Атаковать</button>");
    return;
  }
  if(o.t==="city"){
    const q=W.players.find(z=>z.id===o.pid);
    if(!q){ put(""); return }
    if(q.id===p.id){ put(""); return }   // своя столица — подпись в 3D, панель тут ни к чему
    const cellKey=o.x+","+o.y, scoutOpen=scoutOpenKey===cellKey;
    let scout="";
    if(scoutOpen){
      const sl=p.b.scout||0;
      if(sl<=0) scout="<div class='hint'>Постройте "+buildingName("scout",p).toLowerCase()+", чтобы узнать состав войск.</div>";
      else {
        const se=epochOf(sl), total=countUnits(q.troops);
        if(se===1){
          scout="<div class='co'><span>Войск (примерно)</span><b>~"+fmt(Math.round(total/100)*100)+"</b></div>";
        } else if(se===2){
          scout="<div class='co'><span>Войск (точно)</span><b>"+RU(total)+"</b></div>";
        } else if(se===3){
          scout=TKEYS.map(t=>{
            const n=Object.values(q.troops[t]).reduce((a,b)=>a+b,0);
            return "<div class='co'><span>"+TROOP_TYPES[t].name+"</span><b>"+RU(n)+"</b></div>";
          }).join("");
        } else {
          scout=TKEYS.map(t=>{
            const parts=[]; for(let i=1;i<=5;i++) if(q.troops[t][i]) parts.push(unitName(t,i,q.race)+" ×"+RU(q.troops[t][i]));
            return parts.length?"<div class='co' style='display:block'><span>"+TROOP_TYPES[t].name+"</span><b style='display:block;text-align:left;font-size:11px'>"+parts.join(", ")+"</b></div>":"";
          }).join("");
          if(se===5){
            scout+="<div class='co'><span>Полководец</span><b>"+GENERALS[q.race][q.gen.id||0].name+"</b></div>"+
              "<div class='co'><span>Стена / гарнизон</span><b>"+q.b.wall+" / "+q.b.garrison+"</b></div>";
          }
        }
      }
    }
    const shielded=W.t<q.shieldUntil;
    put("<div class='hd'>"+shieldSvg(q.race,14)+q.nick+" "+coord+"</div>"+
      "<div class='co'><span>Город</span><b>"+q.name+"</b></div>"+
      "<div class='co'><span>Знамя</span><b>"+RACES[q.race].name+"</b></div>"+
      "<div class='co'><span>Ратуша</span><b>"+q.b.hall+" · эпоха "+epochOf(q.b.hall)+"</b></div>"+
      "<div class='co'><span>Сила</span><b>"+fmt(power(q))+"</b></div>"+
      (shielded?"<div class='co'><span>Статус</span><b style='color:#7ab2e0'>Под щитом мира</b></div>":"")+
      scout+
      "<div class='chips' style='margin-top:9px'>"+
        "<button class='seal' data-act='scouttoggle' data-x='"+o.x+"' data-y='"+o.y+"'>"+(scoutOpen?"Скрыть":"Разведка")+"</button>"+
        (shielded?"":"<button class='seal blood' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Атака</button>")+
      "</div>");
  }
}
// Обёртка для 3D-вкладки: тап по замку/лагерю/точке там вызывает её через

function cityCellLevel(p,c){
  if(!c.bk) return -1; // задел на будущее, не активна
  return c.pl!=null ? p.b[c.bk][c.pl] : p.b[c.bk];
}
function cityCellImg(c){
  return c.bk ? "images/buildings/"+c.bk+(c.pl!=null?(c.pl+1):"")+".png" : "";
}
function renderCityMap(){
  const p=me();
  let h="<div id='citymap-wrap'><img class='base' src='map.jpg'>";
  CITY_CELLS.forEach(c=>{
    const lv=cityCellLevel(p,c);
    if(c.bk===null){ // Портал — задел на будущее
      h+="<div class='cbuild locked' style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
         "<div class='shape' style='"+cityShapeCss(c)+"'></div></div>";
      return;
    }
    const built=lv>0, locked=c.bk!=="hall" && !built && (c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall));
    h+="<div class='cbuild"+(built?" built":"")+(locked?" locked":"")+"' data-cell='"+CITY_CELLS.indexOf(c)+"' "+
       "style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
       "<div class='shape' style='"+cityShapeCss(c)+"'></div>"+
       (built?(c.bk!=="wall"?"<img class='bimg' src='"+cityCellImg(c)+"'>":"")+"<span class='lvl'>"+lv+"</span>":"")+
       "</div>";
  });
  h+="</div>";
  return h;
}
function cityCellIndexFor(bk,plot){
  const key = plot==null ? null : plot;

}

function nodeTitle(n){
  if(n.unlock) return ({inf:"Пехота",arc:"Лучники",cav:"Кавалерия",sie:"Осада"}[n.unlock.type])+": "+TIER_NAMES[n.unlock.type][n.unlock.tier-1];
  return n.name;
}
function waveLabel(w){ return {1:"Начало",2:"Развитие",3:"Расцвет",4:"Венец"}[w]||("Ступень "+w); }
function nodeDepth(n,arr,cache){
  if(cache.has(n.id)) return cache.get(n.id);
  cache.set(n.id,0); // защита от случайного цикла в данных
  const reqs=n.requires||[];
  const d = reqs.length ? 1+Math.max(...reqs.map(id=>{
    const pn=arr.find(x=>x.id===id); return pn?nodeDepth(pn,arr,cache):0;
  })) : 0;
  cache.set(n.id,d);
  return d;
}
const ROW_SIZES=[4,3,4,2];    // рядами по 2-4 для красоты, а не одной длинной стеной
function computeRows(arr,p){
  const visible=arr.filter(n=>nodeVisibleFor(n,p));
  const cache=new Map();
  const byDepth={};
  visible.forEach(n=>{ const d=nodeDepth(n,arr,cache); (byDepth[d]=byDepth[d]||[]).push(n); });
  const depths=Object.keys(byDepth).map(Number).sort((a,b)=>a-b);
  let sizeIdx=0;
  const rows=[];
  depths.forEach(d=>{
    const unlockNodes=byDepth[d].filter(n=>n.unlock);
    let list=byDepth[d].filter(n=>!n.unlock);
    while(list.length){
      const n=ROW_SIZES[sizeIdx%ROW_SIZES.length]; sizeIdx++;
      rows.push(list.slice(0,n));
      list=list.slice(n);
    }
    if(unlockNodes.length) rows.push(unlockNodes);   // открытие тира войск — всегда своей строкой целиком, без разбивки
  });
  return rows;
}
function rowGate(n,p){
  const rows=computeRows(ACADEMY_TREE[n.branch],p);
  const idx=rows.findIndex(row=>row.some(x=>x.id===n.id));
  if(idx<=0) return {locked:false,missing:[]};
  const missing=rows[idx-1].filter(x=>(p.tech[x.id]||0)<x.max);
  return {locked:missing.length>0,missing};
}
function researchLocked(n,p){
  if(epochOf(p.b.hall)<n.wave) return true;
  return rowGate(n,p).locked;
}
const EPOCH_HALL_MIN=[1,7,13,19,25];
function lockReason(n,p){
  if(epochOf(p.b.hall)<n.wave) return "нужна ратуша "+EPOCH_HALL_MIN[n.wave-1]+" уровня";
  const missing=rowGate(n,p).missing;
  if(missing.length) return "нужно закончить: "+missing.map(x=>nodeTitle(x)).join(", ");
  return "заблокировано";
}
function renderTreeMap(arr,p){
  const rows=computeRows(arr,p);
  let h="<div class='rtree'>";
  rows.forEach((row,ri)=>{
    if(ri>0) h+="<div class='rtree-link'></div>";
    h+="<div class='rtree-row'><div class='rtree-nodes'>"+
      row.map(n=>{
        const lv=p.tech[n.id]||0, maxed=lv>=n.max, locked=researchLocked(n,p);
        const state=maxed?"maxed":locked?"locked":lv>0?"started":"open";
        return "<div class='rtree-node "+state+"' data-act='rtreejump' data-id='"+n.id+"' title='"+nodeTitle(n)+"'>"+
          "<img src='"+nodeImgSrc(n,p)+"'"+(n.unlock?" style='object-position:"+unitHeadPos(p.race,n.unlock.type,n.unlock.tier)+"'":"")+" alt='' onerror=\"this.style.display='none'\">"+
          "<span class='rtree-node-lv'>"+lv+"/"+n.max+"</span></div>";
      }).join("")+
      "</div></div>";
  });
  h+="</div>";
  return h;
}
function nodeEffectRows(n,lv,nx){
  if(n.unlock) return [{label:"Открывает бойца",icon:"class-"+n.unlock.type,now:lv>=1?"открыто":"заперто",next:null}];
  const list=n.effects||[{field:n.field,total:n.total}];
  const fname=f=>RESEARCH_FIELD_NAME[f]||f;
  const maxed=lv>=n.max;
  return list.map(e=>({
    label:fname(e.field),
    icon:RESEARCH_FIELD_ICON[e.field],
    now:"+"+Math.round(e.total*(lv/n.max)*100)+"%",
    next:maxed?null:"+"+Math.round(e.total*(nx/n.max)*100)+"%"
  }));
}

function foArmy(){
  const p=me(); syncRes(p);
  const B=bonuses(p);
  let hurt=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)hurt+=p.wounded[t][i]});
  let h=rubric("Смотр войск",fmt(armyPower(p.troops,B,p.race))+" силы");
  const rows=[];
  TKEYS.forEach(t=>{ for(let i=1;i<=5;i++){ const n=p.troops[t][i]; if(n) rows.push(troopRowHtml(p,t,i,n)) } });
  h+= rows.length ? "<div class='entry troop-list'>"+rows.join("")+"</div>"
                  : hollow("&#9876;","В столице пусто. Наберите войско в казармах, на стрельбище, в конюшне или мастерской на карте города.");

  if(hurt>0||p.heal){
    h+=rubric("Лазарет");
    h+="<div class='entry "+(p.heal?"hot":"war")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>Раненых: "+RU(hurt)+"</div>"+
      "<div class='note'>Коек: <em>"+fmt(totalHospitalCap(p)*(1+B.hosp+B.mercy))+"</em>"+
      (p.heal?" · лечится "+RU(p.heal.n)+" — готово через "+fmtDur(p.heal.t1-W.t):" · лечение — в госпитале города")+
      (B.heal<1?" · нежить поднимает своих втрое дешевле":"")+"</div></div></div>";
  }

  h+=rubric("Отряды в поле",W.marches.filter(m=>m.pid===p.id).length+" из "+marchSlots(p.b.hall));
  const mine=W.marches.filter(m=>m.pid===p.id);
  if(!mine.length) h+=hollow("&#9906;","Все войска дома. Выберите цель на чертеже.");
  mine.forEach(m=>{
    const st={go:"в пути",gather:"собирает",back:"возвращается"}[m.state]||m.state;
    const load=m.carry?RES.filter(r=>m.carry[r]>0).map(r=>RES_NAME[r]+" "+fmt(m.carry[r])).join(", "):"";
    h+="<div class='entry "+(m.state==="back"?"calm":"hot")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>"+RU(countUnits(m.units))+" воинов<span class='tag'>"+st+"</span></div>"+
      "<div class='note'>Цель "+m.tx+" · "+m.ty+" — <em>"+fmtDur(m.t1-W.t)+"</em>"+
      (load?"<br>Везут: "+load:"")+"</div></div>"+
      (m.state!=="back"?"<button class='seal blood' data-act='recall' data-m='"+m.id+"'>Отозвать</button>":"")+
      "</div></div>";
  });
  return h;
}

/* ---- Генерал ---- */
function findTalentNode(id){
  for(const bk in TALENTS) for(const n of TALENTS[bk].nodes) if(n.id===id) return n;
  for(const bk in GENERAL_TREE) for(const n of GENERAL_TREE[bk].nodes) if(n.id===id) return n;
  return null;
}
function statIcon(kind){
  return "<img class='stat-ico' src='images/ui/stat-"+kind+".png' alt='' onerror=\"this.remove()\">";
}
function genStats(p){
  // 1 ур. полководца ~= статы юнита Т5 (как в RoK), дальше растёт той же кривой, что и раньше
  const lv=p.gen.lv, B=bonuses(p), g=Math.pow(lv,1.15);
  const gear=gearBonus(p);   // теперь проценты — умножаем, а не прибавляем флэтом
  return {
    hp:  Math.round((250+30*g)*(1+B.genHpMod)*(1+gear.hp)),
    atk: Math.round((200+40*g)*(1+B.genAtkMod)*(1+gear.atk)),
    def: Math.round((170+30*g)*(1+B.genDefMod)*(1+gear.def)),
  };
}
function genPortraitHtml(race,i){
  return "<img class='gen-portrait' src='images/ui/avatar-"+race+(i+1)+".png' alt='' "+
    "onload=\"if(this.nextElementSibling)this.nextElementSibling.style.display='none'\" onerror=\"this.remove()\">";
}
function genFigureHtml(race,i){
  return "<img class='gen-figure' src='images/generals/"+race+"-"+(i+1)+".png' alt='' "+
    "onerror=\"this.parentElement.style.display='none'\">";
}
function genSkillBadges(p){
  const branches=[["city",GENERAL_TREE.city],["army",GENERAL_TREE.army],["war",TALENTS.war],["dev",TALENTS.dev],["gath",TALENTS.gath]];
  return "<div class='gen-skills'>"+branches.map(([key,br])=>{
    let spent=0; br.nodes.forEach(n=>spent+=(p.gen.tal[n.id]||0));
    return "<span class='gen-skill' title='"+br.name+"'><img src='images/ui/talent-"+key+".png' alt=''><s>"+spent+"</s></span>";
  }).join("")+"</div>";
}
const GEAR_LAYOUT = ["handL","helmet","handR","chest","acc1","gloves","pants","acc2","boots"];
function genGearHtml(p){
  const statTxt=st=>Object.keys(st).map(k=>({atk:"атк",def:"защ",hp:"хп"}[k]+" +"+(st[k]*100).toFixed(1)+"%")).join(", ");
  let h=rubric("Экипировка","снаряжение куётся в горне, а не здесь");
  h+="<div class='gear-slots'>";
  GEAR_LAYOUT.forEach(id=>{
    const s=findGearSlot(id), it=p.gear[id];
    h+="<div class='gear-slot"+(it?" filled":"")+(id==="helmet"?" crown":"")+"' "+(it?"style='--pc:"+RARITY_COLOR[it.rarity-1]+"'":"")+">"+
      "<div class='gear-slot-icon'>"+(it?"<img src='"+gearIconSrc(s.id,it.order)+"' alt=''>":"")+"</div>"+
      "<div class='gear-slot-name'>"+s.name+"</div>"+
      "<div class='gear-slot-item'>"+(it?GEAR_NAMES[s.id][it.order][it.rarity-1]+"<span class='tag gilt'>"+RARITY_NAMES[it.rarity-1]+"</span>"
        +"<div class='note'>"+statTxt(gearItemStats(s.cat,it.order,it.rarity))+" · мощь "+RU(GEAR_POWER[it.rarity-1])+"</div>":"пусто")+"</div>"+
      (it?"<button class='seal' data-act='unequip' data-slot='"+s.id+"'>Снять</button>":"")+
      "</div>";
  });
  h+="</div>";

  let any=false, stored="";
  GEAR_SLOTS.forEach(s=>{
    ["bastion","storm"].forEach(order=>{
      for(let r=1;r<=5;r++){
        const cnt=p.inventory[s.id][order][r-1]||0; if(!cnt) continue;
        any=true;
        stored+="<div class='entry'><div class='line'>"+
          "<div class='mat-icon-wrap' style='--pc:"+RARITY_COLOR[r-1]+";box-shadow:inset 0 0 8px var(--pc)'>"+
          "<img class='mat-icon' src='"+gearIconSrc(s.id,order)+"' alt=''></div>"+
          "<div class='fill'>"+
          "<div class='title'>"+GEAR_NAMES[s.id][order][r-1]+"<span class='tag'>×"+cnt+"</span></div>"+
          "<div class='note'>"+s.name+" · "+statTxt(gearItemStats(s.cat,order,r))+" · мощь "+RU(GEAR_POWER[r-1])+"</div></div>"+
          "<button class='seal' data-act='equip' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Надеть</button>"+
          "<button class='seal' data-act='dismantle' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Разобрать</button></div>";
      }
    });
  });
  h+=rubric("На складе","можно надеть или разобрать");
  h+= any ? stored : hollow("&#9884;","Склад снаряжения пуст — куйте в горне.");
  return h;
}
function foGen(){
  const p=me();
  if(p.gen.id==null){
    let h=rubric("Выбор полководца","решение окончательное");
    GENERALS[p.race].forEach((g,i)=>{
      h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+
        genPortraitHtml(p.race,i)+shieldSvg(p.race,26)+"</div><div class='fill'>"+
        "<div class='title'>"+g.name+"<span class='tag gilt'>"+g.role+"</span></div>"+
        "<div class='note'>"+g.bonus+"</div></div></div>"+
        "<button class='seal' data-act='pickgen' data-id='"+i+"'>Выбрать</button></div>";
    });
    return h;
  }
  const G=genOf(p), B=bonuses(p), S=genStats(p);
  const need=genXpNeed(p.gen.lv), f=p.gen.xp/need, lvCap=Math.min(60,epochOf(p.b.hall)*12);
  const stars=Math.min(6,1+Math.floor(p.gen.lv/10));   // 1 звезда ~= 10 уровней, всего 6 звёзд до 60 ур.
  const genPower=genPowerOf(p);
  let h="<div class='gen-figure-wrap'>"+genFigureHtml(p.race,p.gen.id||0)+"</div>";
  h+=rubric("Полководец");
  h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto' class='gen-portrait-wrap'>"+
    genPortraitHtml(p.race,p.gen.id||0)+"</div>"+ring(p.gen.lv,60)+"<div class='fill'>"+
    "<div class='title'>"+G.name+"<span class='tag gilt'>"+G.role+"</span></div>"+
    "<div class='stars'>"+"&#9733;".repeat(stars)+"&#9734;".repeat(6-stars)+"</div>"+
    "<div class='note'>"+G.bonus+
    (p.gen.pts>0?" · <em>очков к раздаче: "+p.gen.pts+"</em>":"")+
    (p.gen.lv>=lvCap&&lvCap<60?" · потолок эпохи: "+lvCap:"")+"</div></div></div>"+
    "<div class='line' style='margin-top:7px;gap:8px'><div class='progress' style='flex:1;margin-top:0'>"+
    "<i style='width:"+(f*100).toFixed(1)+"%'></i></div></div>"+
    "<div class='gen-tomes'>"+TOME_VALUES.map(v=>{
      const cnt=(p.tomes&&p.tomes[v])||0; if(!cnt) return "";
      return "<button class='gen-tome' data-act='usetome' data-v='"+v+"' "+(p.gen.lv>=lvCap?"disabled":"")+
        " title='"+TOME_NAME[v]+" — восполняет "+RU(v)+" опыта'>"+
        "<img src='images/ui/"+TOME_ICON[v]+".png' alt=''><s>×"+cnt+"</s></button>";
    }).join("")+"</div>"+
    "<table class='roll' style='margin-top:9px'><tr><td>Сила полководца</td><td>"+RU(genPower)+"</td></tr></table>"+
    genSkillBadges(p)+
    "</div>";

  h+="<div id='inv-tabs'>"+
    "<button class='"+(genTab==="overview"?"on":"")+"' data-act='gentab' data-t='overview'>Обзор</button>"+
    "<button class='"+(genTab==="talents"?"on":"")+"' data-act='gentab' data-t='talents'>Таланты</button>"+
    "<button class='"+(genTab==="gear"?"on":"")+"' data-act='gentab' data-t='gear'>Экипировка</button>"+
    "</div>";

  if(genTab==="gear") return h+genGearHtml(p);

  if(genTab==="talents"){
    for(const bk in GENERAL_TREE){
      const br=GENERAL_TREE[bk];
      let spent=0; br.nodes.forEach(n=>spent+=(p.gen.tal[n.id]||0));
      const totalMax=br.nodes.reduce((a,n)=>a+n.max,0);
      h+=rubric("Личное дерево: "+br.name, spent+" из "+totalMax);
      br.nodes.forEach(n=>{
        const v=p.gen.tal[n.id]||0, full=v>=n.max;
        h+="<div class='entry"+(v>0?" hot":"")+"'><div class='line'><div class='fill'>"+
          "<div class='title'>"+n.name+"<span class='tag"+(full?" gilt":"")+"'>"+v+"/"+n.max+"</span></div>"+
          "<div class='note'>"+n.txt+" · сейчас <em>+"+(v*n.per*100).toFixed(0)+"%</em></div></div>"+
          "<button class='seal' data-act='tal' data-id='"+n.id+"' "+
          (p.gen.pts<=0||full?"disabled":"")+">Вложить</button></div></div>";
      });
    }
    for(const bk in TALENTS){
      const br=TALENTS[bk];
      let spent=0; br.nodes.forEach(n=>spent+=(p.gen.tal[n.id]||0));
      h+=rubric(br.name, spent+" из 25");
      br.nodes.forEach(n=>{
        const v=p.gen.tal[n.id]||0, full=v>=5;
        h+="<div class='entry"+(v>0?" hot":"")+"'><div class='line'><div class='fill'>"+
          "<div class='title'>"+n.name+"<span class='tag"+(full?" gilt":"")+"'>"+v+"/5</span></div>"+
          "<div class='note'>"+n.txt+" · сейчас <em>+"+(v*n.per*100).toFixed(0)+"%</em></div></div>"+
          "<button class='seal' data-act='tal' data-id='"+n.id+"' "+
          (p.gen.pts<=0||full?"disabled":"")+">Вложить</button></div></div>";
      });
    }
    return h;
  }

  h+=rubric("Личные статы","участвует в бою наравне с войском");
  h+="<div class='entry'><table class='roll'>"+
    "<tr><td>"+statIcon("hp")+"Здоровье</td><td>"+RU(S.hp)+"</td></tr>"+
    "<tr><td>"+statIcon("atk")+"Атака</td><td>"+RU(S.atk)+"</td></tr>"+
    "<tr><td>"+statIcon("def")+"Защита</td><td>"+RU(S.def)+"</td></tr></table></div>";

  h+=rubric("Итог бонусов");
  h+="<div class='entry'><table class='roll'>"+
    "<tr><td>"+statIcon("atk")+"Атака войск</td><td class='"+(B.atk>0?"good":"")+"'>"+(B.atk>=0?"+":"")+(B.atk*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("def")+"Защита войск</td><td class='"+(B.def<0?"bad":B.def>0?"good":"")+"'>"+(B.def>=0?"+":"")+(B.def*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("hp")+"Здоровье войск</td><td class='"+(B.hp>0?"good":"")+"'>+"+(B.hp*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>"+statIcon("speed")+"Скорость марша</td><td>×"+B.march.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость стройки</td><td>×"+B.build.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость сбора</td><td>+"+(B.gather*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Поднятие павших</td><td class='"+(B.raise>0?"good":"")+"'>"+(B.raise*100).toFixed(0)+"%</td></tr>"+
    "</table></div>";
  return h;
}

function foInv(){

    [["res","Ресурсы"],["mat","Материалы"],["gear","Снаряжение"]].map(([k,label])=>

      "<img src='"+gearIconSrc(s.id,it.order)+"' alt=''><span class='eq'>&#9733;</span></div>");
    ["bastion","storm"].forEach(order=>{
      for(let r=1;r<=5;r++){
        const cnt=p.inventory[s.id][order][r-1]||0; if(!cnt) continue;

  h+= cells.length ? "<div class='gear-grid'>"+cells.join("")+"</div>" : hollow("&#9884;","Пока нет ни одного предмета — куйте в горне.");

}

    const own=q.id===p.id, d=own?0:Math.round(dist(p,q));
    h+="<div class='entry"+(own?" hot":"")+"'><div class='line'>"+
      "<div style='flex:0 0 auto;width:22px;text-align:center;font-family:var(--data);font-size:11px;color:var(--vellum-faint)'>"+
      (i+1)+"</div><div style='flex:0 0 auto'>"+shieldSvg(q.race,17)+"</div><div class='fill'>"+
      "<div class='title'>"+(own?"Ваш город":q.name)+
      (W.t<q.shieldUntil?"<span class='tag'>под щитом</span>":"")+"</div>"+
      "<div class='note'>"+RACES[q.race].name+" · ратуша "+q.b.hall+" · "+fmt(power(q))+
      (d?" · "+d+" кл.":"")+"</div>"+
      "<div class='progress' style='margin-top:6px'><i style='width:"+
      (power(q)/top*100).toFixed(1)+"%;background:"+TINCT[q.race]+"'></i></div></div>"+
      (own?"":"<button class='seal' data-act='look' data-x='"+q.x+"' data-y='"+q.y+"'>Найти</button>")+
      "</div></div>";
  });

  h+=rubric("Управление");
  h+="<div class='entry'><div class='line'>"+
    "<button class='seal' data-act='save'>Записать</button>"+
    "<button class='seal blood' data-act='reset'>Новый мир</button></div>"+
    "<div class='note' style='margin-top:8px'>Летопись пишется сама каждые двадцать секунд. "+
    "Мир не замирает, пока вкладка закрыта: при возвращении движок досчитывает пропущенное.</div></div>";
  return h;
}

/* ---- Хроника ---- */
function foLog(){
  if(!W.log.length) return hollow("&#9998;","Летопись пока пуста.");
  return rubric("Летопись",W.log.length+" записей")+
    W.log.slice(0,90).map(e=>"<div class='chron-e "+(e.kind||"")+"'>"+
      "<div class='when'>день "+(Math.floor(e.t/86400)+1)+", "+
      String(Math.floor(e.t%86400/3600)).padStart(2,"0")+":"+
      String(Math.floor(e.t%3600/60)).padStart(2,"0")+"</div>"+
      "<div class='what'>"+e.text+"</div></div>").join("");
}

function renderFolio(){
  const html = tab==="city"?foCity(): tab==="army"?foArmy(): tab==="gen"?foGen(): foInv();
  if(html===lastFolio) return;                    // не перерисовываем зря
  lastFolio=html;
  const el=$("#folio"), st=el.scrollTop;
  el.innerHTML=html; el.scrollTop=st;
}

/* =========================================================================
   СВИТОК ОТПРАВКИ ВОЙСК
   ========================================================================= */
function openLevy(cx,cy){
  const p=me(); syncRes(p);
  const o=W.map[key(cx,cy)];
  if(!o) return herald("На пустошь войско слать незачем.");
  if(o.t==="city"&&o.pid===p.id) return herald("Это ваша столица.");
  if(W.marches.filter(m=>m.pid===p.id).length>=marchSlots(p.b.hall))
    return herald("Свободных отрядов нет. Отзовите марш или поднимите ратушу.");
  if(o.t==="city"){
    const q=W.players.find(z=>z.id===o.pid);
    if(q&&W.t<q.shieldUntil) return herald("Город под щитом мира — приступить нельзя.");
  }
  const mode = o.t==="node"?"gather":"attack";
  const capL = marchCapacity(p);
  const st={};
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) st[t+i]=0});
  const auto=f=>{ const u=pickArmy(p,f); TKEYS.forEach(t=>{for(let i=1;i<=5;i++) st[t+i]=u[t][i]}) };
  auto(1);

  function paint(){
    let weight=0,n=0;
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++){weight+=st[t+i]*TIER_MULT[i-1]; n+=st[t+i]}});
    const over=weight>capL;
    const u=emptyUnits(); TKEYS.forEach(t=>{for(let i=1;i<=5;i++)u[t][i]=st[t+i]});
    const dd=Math.hypot(cx-p.x,cy-p.y)*(1-portalShortcut(p)), eta=n?dd/marchSpeed(p,u)*60:0;
    let load=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)load+=st[t+i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(p.race,t,"load")});
    const mine=armyPower(u,bonuses(p),p.race);

    let head = mode==="gather"?"Сбор припасов":"Военный поход";
    let lede = o.t==="node" ? RES_NAME[o.res]+", жила "+o.lv+" уровня — "+fmt(o.amount)+" осталось"
             : o.t==="city" ? "Столица "+(W.players.find(z=>z.id===o.pid)||{name:"?"}).name
             : (o.t==="fort"?"Форт":"Лагерь")+" разбойников "+o.lv+" уровня";

    let h="<h2>"+head+"</h2><div class='lede'>"+lede+" · клетка "+cx+" · "+cy+"</div>";
    h+="<div class='chips'>"+
       "<button class='seal' data-a='f25'>Четверть</button>"+
       "<button class='seal' data-a='f50'>Половина</button>"+
       "<button class='seal' data-a='f100'>Всё войско</button>"+
       "<button class='seal' data-a='f0'>Сбросить</button></div>";
    let any=false;
    TKEYS.forEach(t=>{ for(let i=1;i<=5;i++){
      const have=p.troops[t][i]; if(!have) continue; any=true;
      h+="<div class='levy'><div class='nm'>"+
        "<div class='t'>"+unitName(t,i,p.race)+"<span class='tag'>T"+i+"</span></div>"+
        "<div class='s'>в столице "+RU(have)+"</div></div>"+
        "<input type='range' min='0' max='"+have+"' value='"+st[t+i]+"' data-s='"+t+i+"'>"+
        "<input type='number' min='0' max='"+have+"' value='"+st[t+i]+"' data-s='"+t+i+"'></div>";
    }});
    if(!any) h+="<div class='hollow'>Войск в столице нет.</div>";

    h+="<table class='roll' style='margin-top:14px'>"+
      "<tr><td>Выступает</td><td>"+RU(n)+"</td></tr>"+
      "<tr><td>Место в отряде</td><td class='"+(over?"bad":"")+"'>"+fmt0(weight)+" из "+fmt0(capL)+"</td></tr>"+
      "<tr><td>Поднимут груза</td><td>"+fmt(load)+"</td></tr>"+
      "<tr><td>Дорога займёт</td><td>"+(n?fmtDur(eta):"—")+"</td></tr>"+
      "<tr><td>Сила отряда</td><td>"+fmt(mine)+"</td></tr></table>";

    if(o.t==="camp"||o.t==="fort"||o.t==="city"){
      let foe, label;
      if(o.t==="city"){ const q=W.players.find(z=>z.id===o.pid);
        foe=q?armyPower(q.troops,bonuses(q),q.race)*(1+wallDefBonus(q.b.wall)):0; label="Гарнизон и стены" }
      else { foe=banditPower(o.lv); label="Сила заставы" }
      const v = mine>foe*1.8?["&#9819;","Разгром без потерь","var(--verdigris)"]
              : mine>foe*1.15?["&#9876;","Победа, но с кровью","var(--gilt)"]
              : mine>foe*0.85?["&#9888;","Исход не ясен","var(--gilt)"]
              : ["&#9760;","Отряд поляжет","var(--garnet)"];
      h+="<div class='verdict' style='border-color:"+v[2]+"44'>"+
         "<span class='vi' style='color:"+v[2]+"'>"+v[0]+"</span><div>"+
         "<div class='vt' style='color:"+v[2]+"'>"+v[1]+"</div>"+
         "<div class='vs'>"+label+": "+fmt(foe)+" против "+fmt(mine)+"</div></div></div>";
    }
    h+="<div class='chips' style='margin-top:16px;margin-bottom:0'>"+
       "<button class='seal' data-a='go' "+(n<=0||over?"disabled":"")+">"+
       (mode==="gather"?"Выслать обоз":"Выступить в поход")+"</button>"+
       "<button class='seal' data-a='no'>Отставить</button></div>";
    box.innerHTML=h;
  }
  const box=$("#scroll");
  paint(); $("#veil").classList.add("open");

  box.oninput=e=>{
    const s=e.target.dataset.s; if(!s) return;
    const t=s.slice(0,3), i=+s.slice(3);
    st[s]=clamp(Math.round(+e.target.value||0),0,p.troops[t][i]);
    paint();
  };
  box.onclick=e=>{
    const b=e.target.closest("[data-a]"); if(!b) return;
    const a=b.dataset.a;
    if(a==="no") return closeScroll();
    if(a==="f25"){auto(.25);return paint()}
    if(a==="f50"){auto(.5); return paint()}
    if(a==="f100"){auto(1); return paint()}
    if(a==="f0"){TKEYS.forEach(t=>{for(let i=1;i<=5;i++)st[t+i]=0}); return paint()}
    if(a==="go"){
      const u=emptyUnits(); TKEYS.forEach(t=>{for(let i=1;i<=5;i++)u[t][i]=st[t+i]});
      const r=sendMarch(p,cx,cy,u,mode);
      if(r.err) return herald(r.err);
      closeScroll(); tab="army"; syncRibbons(); lastFolio=""; renderFolio();
      herald(mode==="gather"?"Обоз выступил.":"Войско выступило в поход.");
    }
  };
}
function closeScroll(){ $("#veil").classList.remove("open"); $("#scroll").innerHTML="" }
let heraldT=null;
function herald(msg){
  const el=$("#herald"); el.textContent=msg; el.classList.add("up");
  clearTimeout(heraldT); heraldT=setTimeout(()=>el.classList.remove("up"),2800);
}
function ask(title,def,max,cb){
  const box=$("#scroll");
  box.innerHTML="<h2>Сколько набрать?</h2><div class='lede'>"+title+"</div>"+
    "<input id='qty' type='number' value='"+def+"' min='1' max='"+max+"' "+
    "style='width:100%;background:rgba(0,0,0,.4);color:var(--vellum);border:1px solid var(--rule);"+
    "padding:10px;font-family:var(--data);font-size:16px;text-align:right'>"+
    "<div class='chips' style='margin-top:16px;margin-bottom:0'>"+
    "<button class='seal' id='q-ok'>Набрать</button><button class='seal' id='q-no'>Отставить</button></div>";
  box.oninput=null; box.onclick=null;
  $("#veil").classList.add("open");
  $("#qty").focus(); $("#qty").select();
  $("#q-ok").onclick=()=>{ const v=clamp(Math.round(+$("#qty").value||0),1,max); closeScroll(); cb(v) };
  $("#q-no").onclick=closeScroll;
  $("#qty").onkeydown=e=>{ if(e.key==="Enter") $("#q-ok").click() };
}

}

function refreshGenIfOpen(){
  const menu=$("#menu-modal");
  if(menu.classList.contains("open")&&menu.dataset.tab==="gen"){ lastMenuBody=foGen(); $("#menu-modal-body").innerHTML=lastMenuBody; }
}
function handleAct(e){
  const closeBtn=e.target.closest("[data-act='closemenu']");
  if(closeBtn){ closeMenuModal(); return; }
  const closeBm=e.target.closest("[data-act='closebuilding']");
  if(closeBm){ closeBuildingModal(); return; }
  const closeCart=e.target.closest("[data-act='closecartouche']");
  if(closeCart){ sel=null; renderCartouche(); return; }
  const cell=e.target.closest("[data-cell]");
  if(cell && !e.target.closest("[data-act]")){
    openBuildingModal(+cell.dataset.cell);
    return;
  }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const p=me(), a=b.dataset.act;
  if(a==="build" && b.closest("#bm-body")){
    const plot=b.dataset.plot!=null&&b.dataset.plot!==""?+b.dataset.plot:undefined;
    const r=startBuild(p,b.dataset.b,plot);
    herald(r.err||"Заложено.");
    lastFolio=""; renderFolio();
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);    return;
  }
  if(a==="build"){
    const plot=b.dataset.plot!=null&&b.dataset.plot!==""?+b.dataset.plot:undefined;
    const r=startBuild(p,b.dataset.b,plot);
    herald(r.err||(buildingName(b.dataset.b,p)+(plot!=null?" (участок "+(plot+1)+")":"")+" заложена."));
  }
  else if(a==="browsetrain"){
    openUnitCarousel(b.dataset.t);
    return;
  }
  else if(a==="ucnav"){
    const track=$("#uc-track"), card=track&&track.querySelector(".uc-card");
    if(track&&card) track.scrollLeft += card.getBoundingClientRect().width*(+b.dataset.dir);
    return;
  }
  else if(a==="ucfocus"){
    const type=carouselCtx.type, tier=+b.dataset.tier;
    const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
    if(b.dataset.mode==="train"){
      const max=trainMax(p,type,tier);
      trainCtx={type,tier,mode:"train",max,n:max,lastLocked:!!p.train[type]||max<1};
    } else {
      const max=retrainMax(p,type,tier);
      trainCtx={type,tier:tier+1,fromTier:tier,mode:"retrain",max,n:max,lastLocked:!!p.train[type]||max<1};
    }
    $("#bm-body").innerHTML=unitCarouselHtml();
    updateTrainSheet();
    const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    return;
  }
  else if(a==="traingo"){
    if(!trainCtx) return;
    const isRetrain=trainCtx.mode==="retrain";
    const r=isRetrain?startRetrain(p,trainCtx.type,trainCtx.fromTier,trainCtx.n):startTrain(p,trainCtx.type,trainCtx.tier,trainCtx.n);
    if(r.err){ herald(r.err); return; }
    herald((isRetrain?"Переобучение начато: ":"Набор начат: ")+RU(trainCtx.n)+".");
    closeBuildingModal(); lastFolio=""; renderFolio();
    return;
  }
  else if(a==="opencell"){
    const idx=+b.dataset.idx; if(idx>=0) openBuildingModal(idx);
    return;
  }
  else if(a==="marchinfo"){
    const m=W.marches.find(x=>x.id==b.dataset.m);
    if(m){
      const st={go:"в пути",gather:"собирает",back:"возвращается"}[m.state]||m.state;
      herald(RU(countUnits(m.units))+" воинов · "+st+" · цель "+m.tx+"·"+m.ty+" · осталось "+fmtDur(m.t1-W.t));
    }
    return;
  }
  else if(a==="browseheal"){
    openHealCarousel();
    return;
  }
  else if(a==="hcfocus"){
    const type=b.dataset.type, tier=+b.dataset.tier;
    const max=healMaxN(p,type,tier);
    healCtx={type,tier,max,n:max,lastLocked:!!p.heal||max<1};
    const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
    $("#bm-body").innerHTML=healCarouselHtml();
    updateHealSheet();
    const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    return;
  }
  else if(a==="healgo"){
    if(!healCtx) return;
    const r=startHeal(p,healCtx.type,healCtx.tier,healCtx.n);
    if(r.err){ herald(r.err); return; }
    herald("Лечение начато: "+RU(healCtx.n)+".");
    closeBuildingModal(); lastFolio=""; renderFolio();
    return;
  }
  else if(a==="research"){
    const r=startResearch(p,b.dataset.id);
    herald(r.err||"Исследование начато.");
  }
  else if(a==="matprod"){
    const r=produceMaterial(p,b.dataset.mat);
    herald(r.err||"Добыча начата.");
  }
  else if(a==="matup"){
    const r=upgradeMaterial(p,b.dataset.mat,+b.dataset.tier);
    herald(r.err||"Материал улучшен.");
    lastFolio=""; renderFolio();
  }
  else if(a==="craft"){
    const r=startCraftItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||"Ковка начата.");
  }
  else if(a==="equip"){
    const r=equipItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||"Надето."); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="unequip"){
    const r=unequipItem(p,b.dataset.slot);
    herald(r.err||"Снято, отправлено на склад."); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="dismantle"){
    const r=dismantleItem(p,b.dataset.slot,b.dataset.order,+b.dataset.rarity);
    herald(r.err||("Разобрано, возвращено золота: "+RU(r.refund)+".")); lastFolio=""; renderFolio(); refreshGenIfOpen();
  }
  else if(a==="tal"){
    const id=b.dataset.id, node=findTalentNode(id), max=(node&&node.max)||5;
    if(p.gen.pts>0&&(p.gen.tal[id]||0)<max){ p.gen.tal[id]=(p.gen.tal[id]||0)+1; p.gen.pts-- }
  }
  else if(a==="usetome"){
    const v=+b.dataset.v, lvCap=Math.min(60,epochOf(p.b.hall)*12);
    if((p.tomes[v]||0)>0 && p.gen.lv<lvCap){
      p.tomes[v]--; addXp(p,v);
      herald(TOME_NAME[v]+" использована: +"+RU(v)+" опыта.");
      lastFolio=""; renderFolio(); refreshGenIfOpen();
    }
  }
  else if(a==="pickgen"){
    if(p.gen.id==null){ p.gen.id=+b.dataset.id; herald("Выбран генерал: "+GENERALS[p.race][p.gen.id].name+".") }
  }
  else if(a==="opentab"){ openMenuModal(b.dataset.tab); }
  else if(a==="savenick"){
    const inp=$("#nick-input");
    if(inp){ const v=inp.value.trim().slice(0,24); p.nick=v||"Безымянный лорд"; herald("Ник сохранён."); renderTop(); }
  }
  else if(a==="gentab"){
    genTab=b.dataset.t;
    refreshGenIfOpen();
  }
  else if(a==="academytab"){
    academyTab=b.dataset.t;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="forgetab"){
    forgeTab=b.dataset.t;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="forgerarity"){
    forgeRarity=+b.dataset.r;
    if(buildingModalSel>=0) $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);  }
  else if(a==="rtreejump"){
    const n=findNode(b.dataset.id);
    if(n) openResearchCarousel(n.branch,n.id);
  }
  else if(a==="invtab"){
    invTab=b.dataset.t;
    lastFolio=""; renderFolio();
    const menu=$("#menu-modal");
    if(menu.classList.contains("open")&&menu.dataset.tab==="inv"){ lastMenuBody=foInv(); $("#menu-modal-body").innerHTML=lastMenuBody; }
  }
  else if(a==="recall"){ const m=W.marches.find(x=>x.id==b.dataset.m);
    if(m){ recallMarch(m); renderCartouche(); herald("Отряд поворачивает домой.") } }
  else if(a==="scouttoggle"){
    const k=b.dataset.x+","+b.dataset.y;
    scoutOpenKey = scoutOpenKey===k ? null : k;
    renderCartouche();
    return;
  }
  else if(a==="shield"){
    const s=CFG.SHIELD_COST[+b.dataset.i];
    if(p.res.gold>=s[1]){ p.res.gold-=s[1];
      p.shieldUntil=Math.max(W.t,p.shieldUntil)+s[0];
      logg("Поставлен щит мира на "+fmtDur(s[0])+".","good");
      herald("Щит мира поставлен.") }
  }
  else if(a==="tp"){
    const tp=Math.round(CFG.TELEPORT_BASE*Math.pow(2.2,epochOf(p.b.hall)-1));
    if(p.res.gold>=tp){ p.res.gold-=tp; relocate(p); centerOn(p.x,p.y);
      sel={x:p.x,y:p.y}; herald("Столица перенесена.") }
  }
  else if(a==="look"){
    const x=+b.dataset.x, y=+b.dataset.y;
    centerOn(x,y); sel={x,y}; renderCartouche(); herald("Чертёж наведён на цель.");
  }
  else if(a==="march"){ openLevy(+b.dataset.x,+b.dataset.y); return }
  else if(a==="save"){ save().then(()=>herald("Летопись записана.")); return }
  else if(a==="reset"){
    if(confirm("Заложить новый мир? Всё нажитое исчезнет.")){
      Store.del(SAVE_KEY).then(()=>{
        genWorld(Date.now()&0xffffff);
        sel=null; centerOn(me().x,me().y);
        lastFolio=""; renderFolio(); renderCartouche();
        herald("Новый мир заложен.");
      });
    }
    return;
  }
  lastFolio=""; renderFolio(); renderTop();
  const modal=$("#menu-modal");
  if(modal.classList.contains("open")){
    const t=modal.dataset.tab;
    lastMenuBody = t==="army"?foArmy(): t==="gen"?foGen(): t==="profile"?foProfile(): foInv();
    $("#menu-modal-body").innerHTML = lastMenuBody;
  }
}
$("#folio").addEventListener("click",handleAct);
$("#cartouche").addEventListener("click",handleAct);
function toggleView(){
  const app=$("#app"), img=$("#view-toggle img");
  const showingCity=app.classList.contains("view-city");
  app.classList.toggle("view-city", !showingCity);
  app.classList.toggle("view-world", showingCity);
  img.src = showingCity ? "images/ui/icon-city.png" : "images/ui/icon-world.png";
  img.alt = showingCity ? "Город" : "Мир";
  if(showingCity){
    // 3D-мир грузим лениво, при первом заходе во вкладку — ни к чему тянуть
    // WebGPU, загрузку моделей и рельефа, пока игрок вообще не открыл "Мир".
    // engine/dist/index.html — новый WebGPU-движок вместо старого WebGL2-
    // рендера (obyom-3d-infinite.html, файл оставлен в репозитории —

    if(carouselCtx && trainCtx){
      const p=me();
      const newMax=trainCtx.mode==="retrain"?retrainMax(p,trainCtx.type,trainCtx.fromTier):trainMax(p,trainCtx.type,trainCtx.tier);
      const newLocked=!!p.train[trainCtx.type]||newMax<1;
      if(newLocked!==trainCtx.lastLocked){
        trainCtx.max=newMax; trainCtx.n=Math.min(trainCtx.n,newMax); trainCtx.lastLocked=newLocked;
        const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;

        const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;

    } else if(researchCtx){

      $("#bm-body").innerHTML=researchCarouselHtml();
      const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;

      const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
      $("#bm-body").innerHTML=healCarouselHtml();
      updateHealSheet();
      const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    } else if(buildingModalSel>=0){
      $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);    }
  }

  const typingInModal = document.activeElement && $("#menu-modal-body").contains(document.activeElement) &&
    (document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA");
  if(menu.classList.contains("open") && !typingInModal){
    const t=menu.dataset.tab;
    const html = t==="army"?foArmy(): t==="gen"?foGen(): t==="profile"?foProfile(): foInv();

      lastMenuBody=html;
      $("#menu-modal-body").innerHTML = html;
    }

}

// Двойной тап по чужой клетке в 3D сразу открывал лист похода (openLevy) —
// удобный ярлык поверх обычного тапа+кнопки в cartouche, но не необходимый:
// то же действие всегда доступно кнопкой "Выступить"/"Идти войной" в самой
// панели. Раз этого жеста в 3D нет, ярлык не восстанавливаем — усложнять
// жестовый слой ради необязательного сокращения пути не стоит.
// f — тот же множитель, что и раньше (1.35 — "ближе", 1/1.35 — "дальше"),
// только теперь он делит cam.dist, а не умножает view.z: у 3D-камеры меньше
// расстояние — значит ближе, обратная логика по сравнению со старым
// "клеток на пиксель" у 2D.
function zoomAt(f){
  const w=world3dWin();
  if(w) w.cam.dist=Math.max(9,Math.min(240,w.cam.dist/f));
}
// Когда открыта вкладка "Мир", те же три кнопки должны крутить 3D-камеру, а
// не невидимую 2D-канву позади неё. iframe#world3d — тот же origin, поэтому
// его contentWindow.cam доступен отсюда напрямую (тот же приём, что и в
// обратную сторону — window.parent.W из obyom-3d-infinite.html). Проверяем
// cam, а не просто наличие iframe: до первого openView("world") src ещё
// пустой, а сразу после назначения src скрипт внутри мог не успеть создать
// cam.
function world3dWin(){
  const f=$("#world3d");
  try{ return (f && f.contentWindow && f.contentWindow.cam) ? f.contentWindow : null; }
  catch(_){ return null; }
}
$("#t-in").onclick=()=>zoomAt(1.35);
$("#t-out").onclick=()=>zoomAt(1/1.35);
$("#t-home").onclick=()=>{
  const p=me();
  centerOn(p.x,p.y);
  const w=world3dWin();
  if(w){ w.cam.dist=40; w.cam.pitch=0.5; }   // облёт пошире, не тот же, что у обычного тапа
  renderCartoucheFor(p.x,p.y);
};

/* Клавиши */
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="Escape") closeScroll();
  else if(e.key==="+"||e.key==="=") zoomAt(1.3);
  else if(e.key==="-") zoomAt(1/1.3);
  else if(e.key.toLowerCase()==="h"||e.key==="р") $("#t-home").click();
  else {
    const n=["city","army","gen","world","log"][+e.key-1];
    if(n){ tab=n; syncRibbons(); lastFolio=""; renderFolio() }
  }
});

   ГЛАВНЫЙ ЦИКЛ
   ========================================================================= */
let sinceSave=0, sinceUi=0;
function frame(){
  const now=Date.now();
  let dt=(now-lastReal)/1000; lastReal=now;
  if(dt>0){ advanceTo(W.t+dt*tempo); sinceSave+=Math.min(dt,3600); sinceUi+=dt }
  if(sinceUi>1.0){ sinceUi=0; renderTop(); renderFolio(); renderCartouche(); refreshOpenModal() }
  if(sinceSave>20){ sinceSave=0; save() }
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ save(); return }
  // Пока вкладка была свёрнута/экран заблокирован, requestAnimationFrame не тикал —
  // досчитываем реальное время сразу, иначе очереди построек «замирают» до перезагрузки.
  const away=Math.max(0,(Date.now()-lastReal)/1000);
  lastReal=Date.now();
  if(away>0) advanceTo(W.t+away);
  renderTop(); renderFolio(); renderCartouche(); refreshOpenModal();
});
window.addEventListener("beforeunload",()=>{
  try{ W.savedAt=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(W)) }catch(e){}
});

/* ---- Запуск ---- */
(async function start(){
  const ok=await load();
  if(!ok) genWorld(Date.now()&0xffffff);
  const p=me();
  centerOn(p.x,p.y); sel={x:p.x,y:p.y};
  syncRibbons(); renderTop(); renderFolio(); renderCartouche();
  lastReal=Date.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
