<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
// Фаза 13 — общий мир как единственная точка входа. По умолчанию (обычная
// ссылка на прод, без параметров) посетитель сразу видит регистрацию в
// общем мире (вход по расе/нику, foMultiplayer) — не одиночную партию.
// Одиночка НЕ удалена и не сломана: она по-прежнему полностью грузится
// (см. start() ниже — W/me()/save() должны существовать валидными, на них
// молча полагается уйма кода по всему файлу, от бэджей до
// visibilitychange), просто спрятана классом .mp-gated (см. CSS у
// #menu-modal) и не запускает свой рендер-цикл/боты (requestAnimationFrame
// (frame) — тратить CPU на невидимую партию для каждого гостя незачем).
// ?sp=1 в адресной строке возвращает всё как было — для собственного
// тестирования автора, без пересборки/отдельной ветки/редеплоя.
const SP_UNLOCKED = new URLSearchParams(location.search).get("sp")==="1";
if(!SP_UNLOCKED) document.body.classList.add("mp-gated");
/* =========================================================================
   БЛОК НАСТРОЕК. Всё, что влияет на баланс, собрано здесь.
   Раньше построечная/ресурсная кривая была геометрическим приближением
   реального RoK (по паре опорных точек) и продолжалась своей же выдумкой
   на уровни 26-30 сверх настоящего потолка RoK. Оказалось, что эта
   самопальная добавка была разорительной: 30-й уровень одного здания
   строился дольше (216 дней), чем весь путь 1→25 вместе взятый (126д8ч), —
   контент, до которого без ускорителей и помощи альянса (которых тут нет)
   не доходит вообще никто. Вернулись к настоящему потолку RoK — 25 уровень.
     — BUILD_TABLE — точная табличка Ратуши с riseofkingdoms.fandom.com
       (время и цена постройки 1→25, еда=дерево, камень отдельным числом).
       1 уровень — стартовый, бесплатный (см. newPlayer). Как и раньше, одна
       и та же кривая используется как курс времени/цены для ЛЮБОГО здания
       в игре, не только Ратуши — иметь 26 разных кривых было бы точнее, но
       это отдельная переработка; Ратуша и раньше была эталоном калибровки.
     — PROD_TABLE — точная табличка Фермы (добыча/ч, 1→25); Лесопилка по
       вики идентична Ферме. Каменоломня/Золотая шахта используют ту же
       кривую с постоянным множителем (0.75 и 0.5 — см. production()),
       это не оценка: множитель РОВНО такой на каждом уровне таблички.
     — STORE_TABLE — точная табличка защиты Склада от разграбления, 1→25
       (еда=дерево в источнике на каждом уровне; камень/золото свои, но
       склад в этой игре защищает все ресурсы одним числом — берём еду).
     — Обучение T4-юнита в RoK = 100 сек за штуку — trainTime откалиброван
       под эту точку, тиры 1-3 и 5 продолжают ту же кривую ×1.9 за тир.
     — Для исследований точных цифр по каждому уровню найти не удалось —
       масштаб проставлен так, чтобы первое исследование ощущалось на уровне
       ранних построек (10-15 минут), а не по формуле "то же соотношение,
       что у построек", которое раньше давало 4+ часа на самый первый узел
       ветки — совсем не похоже на "быстрый старт" реального RoK.
   Числа получаются очень долгими — это осознанный выбор: игра рассчитана
   на будущее добавление ускорителей, а без них длительность должна быть
   настоящей роковской, а не сокращённой.
   ========================================================================= */
// Ратуша 1-25, riseofkingdoms.fandom.com: {t: время постройки в сек, food,
// wood (=food в источнике на каждом уровне), stone}. Индекс 0 = уровень 1.
const BUILD_TABLE=[
  {t:0,        food:0,        wood:0,        stone:0},        // 1  — стартовый, бесплатный
  {t:2,        food:3500,     wood:3500,     stone:0},        // 2  — 2с
  {t:300,      food:6500,     wood:6500,     stone:0},        // 3  — 5м
  {t:1200,     food:11800,    wood:11800,    stone:0},        // 4  — 20м
  {t:3600,     food:21300,    wood:21300,    stone:0},        // 5  — 1ч
  {t:7200,     food:36300,    wood:36300,    stone:12000},    // 6  — 2ч
  {t:18000,    food:54400,    wood:54400,    stone:19200},    // 7  — 5ч
  {t:36000,    food:81800,    wood:81800,    stone:30800},    // 8  — 10ч
  {t:54000,    food:122800,   wood:122800,   stone:49200},    // 9  — 15ч
  {t:79200,    food:184300,   wood:184300,   stone:78700},    // 10 — 22ч
  {t:108000,   food:277500,   wood:277500,   stone:120000},   // 11 — 1д6ч
  {t:144000,   food:417500,   wood:417500,   stone:180000},   // 12 — 1д16ч
  {t:180000,   food:627500,   wood:627500,   stone:270000},   // 13 — 2д2ч
  {t:216000,   food:942500,   wood:942500,   stone:405000},   // 14 — 2д12ч
  {t:252000,   food:1400000,  wood:1400000,  stone:607500},   // 15 — 2д22ч
  {t:345600,   food:2100000,  wood:2100000,  stone:912500},   // 16 — 4д
  {t:417600,   food:3200000,  wood:3200000,  stone:1400000},  // 17 — 4д20ч
  {t:504000,   food:4800000,  wood:4800000,  stone:2100000},  // 18 — 5д20ч
  {t:604800,   food:7200000,  wood:7200000,  stone:3100000},  // 19 — 7д
  {t:712800,   food:10800000, wood:10800000, stone:4700000},  // 20 — 8д6ч
  {t:950400,   food:16200000, wood:16200000, stone:7000000},  // 21 — 11д
  {t:1483200,  food:24300000, wood:24300000, stone:10600000}, // 22 — 17д3ч
  {t:2070000,  food:36500000, wood:36500000, stone:15900000}, // 23 — 23д23ч
  {t:3110400,  food:54800000, wood:54800000, stone:24000000}, // 24 — 36д
  {t:10915200, food:82200000, wood:82200000, stone:36000000}, // 25 — 126д8ч (Master's Blueprint в RoK)
];
// Ферма 1-25, добыча/ч. Лесопилка в источнике — та же кривая (еда↔дерево).
const PROD_TABLE=[400,430,470,520,580,650,730,830,950,1100,1300,1550,1850,2200,2700,
  3200,3700,4300,5000,5800,6700,7800,9000,10400,20800]; // 25 ур. — вики честно даёт ровно ×2 к 24 ур.
// Склад 1-25, защита от разграбления (еда=дерево в источнике на каждом уровне).
const STORE_TABLE=[300000,320000,350000,380000,410000,450000,500000,550000,600000,
  650000,700000,750000,800000,850000,900000,1000000,1100000,1200000,1300000,1400000,
  1500000,1600000,1800000,2000000,2500000];

// Три здания, у которых собственный, отличный от общей BUILD_TABLE, курс
// цены/времени/мощи в RoK (плюс собственная боевая характеристика) — Стена,
// Сторожевая башня ("Гарнизон" в игре — комментарий у garrisonVolley уже
// звал её так) и Лагерь разведки. Портал сюда не входит — своей выдумки,
// прообраза в RoK нет, использует общую BUILD_TABLE как любое здание без
// таблицы. Уровень 1 бесплатный у Стены и Башни (стартовые, см. newPlayer),
// у Разведки — нет (строится позже, начинается с нуля, как Каменоломня).
// WALL: макс. прочность стены (hp) — заменяет старую формулу 3000+ур.*2500.
const WALL_TABLE=[

// оставлена (не мёртвый код в строгом смысле — сработает для любого будущего
// узла без своей RS_*-таблицы, как и для остальных wave 1-3 без своих таблиц).
const RESEARCH_GROWTH=1.6, RESEARCH_WAVE={1:1,2:5,3:20,4:60};
const RESEARCH_POWER_BASE={eco:28500, mil:26200};
const RESEARCH_POWER_WAVE = {1:0.018, 2:5, 3:20, 4:60};
const ECO_TIME_BASE=900, MIL_TIME_BASE=720;
function researchTime(n,lv){
  const row=(RESEARCH_TABLE[n.id]||[])[lv-1];
  if(row) return row.t;
  const base = n.branch==="eco"?ECO_TIME_BASE:MIL_TIME_BASE;
  return Math.round(base*RESEARCH_WAVE[n.wave]*Math.pow(RESEARCH_GROWTH,lv-1));
}
function researchCost(n,lv){
  const row=(RESEARCH_TABLE[n.id]||[])[lv-1];
  if(row) return {food:row.food||0,wood:row.wood||0,stone:row.stone||0,gold:row.gold||0};
  const t=researchTime(n,lv), base=t*4.44;   // та же пропорция цена/время, что у построек — только для венцов
  return {food:Math.round(base),wood:Math.round(base),stone:Math.round(base*.435),gold:0};
}
function researchPower(n,lv){
  const row=(RESEARCH_TABLE[n.id]||[])[lv-1];
  if(row) return row.power;
  return lv*RESEARCH_POWER_WAVE[n.wave]*RESEARCH_POWER_BASE[n.branch];
}

function tierUnlockedFor(p,type){
  let mx=1;
  for(let t=2;t<=5;t++){ if((p.tech["mil_tier_"+type+t]||0)>=1) mx=t; else break }
  return mx;
}
function findNode(id){
  for(const arr of [ACADEMY_TREE.eco, ACADEMY_TREE.mil]) for(const n of arr) if(n.id===id) return n;
  return null;
}
function nodeVisibleFor(n,p){                          // раса + выбор генерала (венец только один — в его ветке)
  if(n.race && n.race!==p.race) return false;
  if(n.gen!=null && n.gen!==(p.gen.id||0)) return false;
  return true;
}
function nodeImgSrc(n,p){                               // открытие тира — портрет самого юнита, чтобы сразу видно, кого дают
  if(n.unlock) return "images/units/"+p.race+"-"+n.unlock.type+n.unlock.tier+".png";
  // Янтарные узлы (eco_amber0/1) — своей картинки-исследования для них никогда
  // не рисовали (images/ui/research-eco_amber0.png и research-eco_amber1.png
  // не существуют — узел оставался вовсе без иконки, onerror просто прятал
  // img). Ресурс уже есть готовой иконкой (см. #amber-badge выше) — переиспользуем
  // её же, а не рисуем отдельную картинку с нуля под конкретный узел.
  if(n.field==="gatherAmber") return "images/ui/res-amber.png";
  return "images/ui/research-"+n.id+".png";
}

// Бонусы снаряжения — теперь в процентах к статам (не флэт-числа), по заданным игроком
// диапазонам на редкость: обычная 0.5-1%, необычная 1-2.5%, редкая 2-4%, эпическая 4.5-8%,
// легендарная 7.5-11% (до 15% на топовом оружии). Основной стат предмета берёт верхнюю
// границу диапазона, второстепенные — пониже, третий (у аксессуаров) — ещё меньше.
const GEAR_PCT_PRIMARY  =[0.010, 0.025, 0.040, 0.075, 0.11 ];
const GEAR_PCT_SECONDARY=[0.005, 0.012, 0.022, 0.045, 0.075];
const GEAR_PCT_TERTIARY =[0.0025,0.006, 0.011, 0.0225,0.0375];
// Мощь предмета за редкость (середина заданного диапазона) — учитывается, только пока надето.
const GEAR_POWER=[1250, 2750, 6250, 15000, 37500];
function gearItemStats(cat,order,r){     // r = редкость 1..5
  const P=GEAR_PCT_PRIMARY[r-1], S=GEAR_PCT_SECONDARY[r-1], T=GEAR_PCT_TERTIARY[r-1];
  if(cat==="armor") return order==="bastion" ? {def:P,hp:S} : {hp:P,def:S};
  if(cat==="weapon"){
    if(order==="storm") return {atk: r===5?0.15:P};   // буря — чистый урон, легендарное оружие — до 15%
    return {atk:P,def:S};
  }
  return order==="bastion" ? {hp:P,def:S,atk:T} : {atk:P,hp:S,def:T};   // акссессуар
}
// Было двумя одинаковыми локальными const внутри forgeInfoHtml и
// genGearHtml — вынес один раз сюда, рядом с gearItemStats, которую он
// форматирует: третье место (scoutReportHtml, разведка снаряжения) уже не
// стало поводом заводить третью копию.
function statTxt(st){ return Object.keys(st).map(k=>({atk:"атк",def:"защ",hp:"хп"}[k]+" +"+(st[k]*100).toFixed(1)+"%")).join(", "); }
function gearPowerOf(p){     // мощь надетого снаряжения
  let v=0; GEAR_SLOTS.forEach(s=>{ const it=p.gear&&p.gear[s.id]; if(it) v+=GEAR_POWER[it.rarity-1]; });
  return v;
}
const gearIconSrc = (slot,order) => "images/ui/gear-"+slot+"-"+order+".png";
const CRAFT_CHANCE = [1.0, 0.9, 0.75, 0.55, 0.35];  // шанс успеха ковки по редкости 1..5
const CRAFT_MAT_NEED = [2, 1, 1, 1, 1];             // сколько единиц материала своего тира нужно
function craftCost(mat,tier,r){          // r = редкость/тир материала 1..5 (индекс tier-1)
  const gold=200*r*r;
  const c={gold, food:Math.round(gold*0.3), wood:Math.round(gold*0.3)};
  c[mat]=null; // материал расходуется отдельно (см. startCraftItem), не через обычные ресурсы
  return c;
}
function findGearSlot(id){ return GEAR_SLOTS.find(s=>s.id===id) }
function gearBonus(p){       // суммарный бонус всего надетого снаряжения
  const out={atk:0,def:0,hp:0};
  GEAR_SLOTS.forEach(s=>{
    const it=p.gear&&p.gear[s.id]; if(!it) return;
    const st=gearItemStats(s.cat,it.order,it.rarity);
    out.atk+=st.atk||0; out.def+=st.def||0; out.hp+=st.hp||0;
  });
  return out;
}

   в очереди и обрабатываются только когда до них дошло время. Тиков нет.
   ========================================================================= */

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = mulberry(1);
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---- Рельеф. Лежит здесь, в движке, а не в UI-половине, потому что от него
   зависит САМА ГЕНЕРАЦИЯ мира: findSpot/genWorld/relocate спрашивают
   isRealWater("тут вода?") до того, как посадить город, лагерь или точку.
   Раньше весь этот блок стоял ниже, среди интерфейсных функций, и движок
   тянулся за ним вверх по файлу — из-за таких же обратных связей движок
   нельзя было запустить отдельно от браузера. Чистая математика, ни одного
   обращения к DOM. ---- */
function hash2(x,y,s){ let h=x*374761393+y*668265263+s*1274126177;
  h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296 }
function noise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function ridge(x,y,s){ return 1-Math.abs(2*noise(x,y,s)-1) }   // излом шума даёт хребты

/* ---- Настоящая вода 3D-мира (obyom-3d-infinite.html): её сеет ФИКСИРОВАННЫЙ
   RW_SEED, один и тот же на любой партии (не W.seed) — рельеф там не зависит
   от того, чья это карта. Раньше 2D-генератор клеток вообще не знал про
   рельеф и мог посадить город/лагерь/точку прямо в море: 3D-сторона потом
   искусственно поднимала landtу ПОД объектом (flattenNear), но саму воду
   вокруг это не убирало — выглядело как замок в озере. Порт heightAt/isWater
   сюда даёт 2D-генератору спросить "тут вода?" ДО того, как объект лёг на
   карту, вместо косметической подчистки постфактум. Формула — дословная
   копия heightRaw/heightAt из obyom-3d-infinite.html; hash2/noise/ridge выше
   уже совпадают с тамошними один в один. ---- */
const RW_SEED=12345, RW_SEA=0.235;
function rwSstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t) }
function rwRegionKind(x,y){
  return { mount: rwSstep(0.40,0.72, noise(x/40,y/40,RW_SEED+55)),
           plat:  rwSstep(0.62,0.84, noise(x/34,y/34,RW_SEED+88)),
           rough: noise(x/26,y/26,RW_SEED+123) };
}
function rwHeightRaw(x,y){
  const wx=(noise(x/34,y/34,RW_SEED+101)*2-1)*13;
  const wy=(noise(x/34,y/34,RW_SEED+102)*2-1)*13;
  const X=x+wx, Y=y+wy;
  const R=rwRegionKind(x,y);
  const cont=noise(X/62,Y/62,RW_SEED+201);
  let e=0.16+cont*0.50;
  const amp=0.16+0.84*R.mount+0.35*R.rough;
  e+=(noise(X/27,Y/27,RW_SEED)*0.20+noise(X/13,Y/13,RW_SEED+9)*0.10
     +noise(X/6,Y/6,RW_SEED+21)*0.045)*amp;
  e+=ridge(X/17,Y/17,RW_SEED+37)*0.33*R.mount;
  e+=R.mount*0.10-(1-R.mount)*0.05;
  if(R.plat>0.02){
    const terr=Math.round(e*6.0)/6.0;
    e=e*(1-R.plat*0.80)+terr*(R.plat*0.80);
  }
  if(e>=0.42){
    const k=rwSstep(0.42,0.68,e);
    e+=(noise(x/2.4,y/2.4,RW_SEED+180)-0.5)*0.075*k
      +(noise(x/5.5,y/5.5,RW_SEED+181)-0.5)*0.055*k;
  }
  return Math.max(0.02,Math.min(1,e));
}
function rwHeightAt(x,y){
  const c=rwHeightRaw(x,y);
  const s=(rwHeightRaw(x+0.7,y)+rwHeightRaw(x-0.7,y)+rwHeightRaw(x,y+0.7)+rwHeightRaw(x,y-0.7))*0.25;
  return c*0.55+s*0.45;
}
// Клетка (x,y) — центр клетки (+0.5), та же точка, что 3D берёт под объект
// (см. buildRealCandidate в obyom-3d-infinite.html).
function isRealWater(x,y){ return rwHeightAt(x+0.5,y+0.5)<RW_SEA }

const maxWallHp = lv => lv<=0?0:tblRow(WALL_TABLE,lv).hp;

  const a=field?tbl[lo][field]:tbl[lo], b=field?tbl[hi][field]:tbl[hi];
  return a+(b-a)*f;
}

// половину" — имело смысл только пока у мира был край. Мир теперь не

// ботов) как был, так и остаётся расставлен вокруг той же неподвижной

// (тут CFG.MAP/2 — это по-прежнему буквально 50, просто больше не "половина

// естественно продолжает расти и упирается в потолок/пол однажды заданного
// диапазона, то есть плато, а не обрыв.
const originDist=p=>Math.hypot(p.x-CFG.MAP/2,p.y-CFG.MAP/2)/(CFG.MAP/2);
// Сила/уровень лагерей и точек ресурсов больше НЕ считаются от originDist
// (фиксированная точка {50,50}) — за пределами старого радиуса кластера
// (originDist>~1.2) формула на его основе гарантированно даёт floor(1) для
// ЛЮБОЙ точки бесконечного мира сколь угодно далеко, что и есть баг
// "лагеря/точки только первого уровня встречаются постоянно": весь мир за
// пределами исходного квадрата 100×100 читает как выжженную нулевую зону.
// Новая мера — расстояние до БЛИЖАЙШЕГО города (своего или чужого, не
// только исходного центра): рядом с любым городом (в пределах SAFE_RADIUS)
// всё так же безопасно — слабые цели, level~1. За пределами этого личного
// радиуса густота городов больше не имеет значения — используется
// РЕГИОНАЛЬНЫЙ шум от координат (не от дистанции), дающий полный разброс
// уровней/фортов независимо от того, насколько далеко зашла разведка:
// исследование вглубь бесконечного мира продолжает встречать все уровни,
// а не только 1. taper плавно смешивает "рядом с городом — тихо" и
// "далеко от всех городов — как повезёт" вместо жёсткого обрыва.
function nearestCityDist(x,y){
  let best=Infinity;
  for(const p of W.players){ const d=Math.hypot(p.x-x,p.y-y); if(d<best) best=d; }
  return best;
}
const NODE_SAFE_RADIUS=12, CAMP_SAFE_RADIUS=15;
function nodeLevelAt(x,y){
  const taper=clamp(nearestCityDist(x,y)/NODE_SAFE_RADIUS,0,1);
  const regional=hash2(x,y,W.seed+STRUCT_SALT_NODE+21); // 0..1, от координат — не убывает с дистанцией
  const jitter=hash2(x,y,W.seed+STRUCT_SALT_NODE+22)*1.2-0.6;
  return clamp(Math.round(1+(regional*4+jitter)*taper),1,5);
}
function campRawAt(x,y){
  const taper=clamp(nearestCityDist(x,y)/CAMP_SAFE_RADIUS,0,1);
  const regional=hash2(x,y,W.seed+STRUCT_SALT_CAMP+21);
  const jitter=hash2(x,y,W.seed+STRUCT_SALT_CAMP+22)*8-4;
  return clamp(Math.round(1+(regional*24+jitter)*taper),1,CFG.MAX_LEVEL);
}

function newPlayer(id,race,x,y,isBot){
  const aggr=.4+RNG()*.5;
  const p={id,race,x,y,isBot,name:"",nick:"",
    res:{food:100000,wood:100000,stone:100000,gold:100000},resAt:0,
    b:{},queues:[null,null],train:{inf:null,arc:null,cav:null,sie:null},
    troops:{},wounded:{},heal:null,
    // pts:5 — свободные очки талантов сразу на старте (просьба игрока:
    // "чтобы у каждого было хоть что-то, чтобы начать вкладываться"), не
    // ноль, как раньше. Ботов это не задевает — их pts тут же
    // перезаписываются отдельно (b.gen.pts=b.gen.lv-1, см. ниже по файлу).
    // away — id похода, что сейчас несёт полководца (null = дома). Раньше
    // генерал участвовал сразу везде разом — во всех одновременных походах
    // И в обороне города — что при пяти маршах разом означало "первый же
    // отправленный поход как бы забирал генерала" не по-настоящему, а
    // просто путало игрока: генерал незримо был "и там, и там". Теперь он
    // ровно один и физически в одном месте — см. openLevy (выбор похода) и
    // makeForce/EV.home (кто на самом деле его несёт и когда возвращается).
    gen:{lv:1,xp:0,pts:5,tal:{},id:isBot?(aggr>0.5?0:1):null,away:null}, gear:{}, tech:{}, rsch:null,
    inventory:Object.fromEntries(GEAR_SLOTS.map(s=>[s.id,{bastion:[0,0,0,0,0],storm:[0,0,0,0,0]}])),
    materials:{ore:[0,0,0,0,0],leather:[0,0,0,0,0],bone:[0,0,0,0,0],ebony:[0,0,0,0,0]}, craft:null,
    tomes:{},
    shieldUntil:0, lostTo:null, power:0,
    ai:{aggr, greed:.4+RNG()*.5, caution:.3+RNG()*.6, nextThink:0, target:null},
  };
  BKEYS.forEach(k=>p.b[k]=isMulti(k)?new Array(BUILDINGS[k].plots).fill(0):0);
  p.b.hall=1; p.b.wall=1; p.b.farm[0]=1; p.b.lumber[0]=1; p.b.store=1;
  TKEYS.forEach(t=>{p.troops[t]={};p.wounded[t]={};for(let i=1;i<=5;i++){p.troops[t][i]=0;p.wounded[t][i]=0}});
  p.troops.inf[1]=200; p.troops.arc[1]=150;
  return p;
}

// Общее правило посадки лагерей/точек — используется и при первой генерации
// мира, и при респауне (истощившаяся точка, разгромленный лагерь появляются
// заново, см. respawn/nodeback ниже): без общей функции респаун жил бы своей
// жизнью и постепенно свёл бы на нет весь смысл фильтра — залил бы карту
// заново без зазора и вперемешку с водой, стоило бы поиграть подольше.
// STRUCT_CHUNK/STRUCT_CHUNK_CHANCE — вторая (независимая от зазора) причина
// пустых мест: раньше даже с зазором в 6 клеток жадная выборка добирала
// плотность до предела в КАЖДОМ уголке карты (жадная лотерея не оставляет
// пропусков сама по себе — только раздвигает соседей). Само наличие точки
// в квадрате 16×16 клеток теперь ещё и монетка (своя для точек, своя для
// лагерей — не спаяны в один бросок, иначе они бы либо всегда встречались
// вместе, либо никогда), кроме зазора это даёт настоящие пустые области.
// CITY_STRUCT_GAP отдельно от MIN_STRUCT_GAP: масштаб модели города в 3D
// удвоился (5→10, см. историю коммитов), пока лагерь/форт/точка (6.5/5/5)
// остались как были — общий MIN_STRUCT_GAP=6 тогда рассчитывался под
// объекты близкого масштаба и с городом (визуально вдвое крупнее) больше
// не даёт настоящего зазора: лагеря/точки застревали внутри города или
// город внутри них. Не через MIN_STRUCT_GAP, а отдельной, более широкой
// величиной — и проверяется НЕ через 3×3-соседство чанков (см. комментарий
// у findFreeCellInChunk ниже: тот приём годится только для гэпов заведомо
// меньше половины STRUCT_CHUNK=16, то есть <8, а CITY_STRUCT_GAP шире), а
// напрямую по W.players — в этой локальной one-player-vs-bots партии их
// всегда мало (игрок + до CFG.BOTS ботов), полный перебор дешёв и не имеет
// слепых зон на границах чанков.
const CITY_STRUCT_GAP=12;
// Было 6, потом 9 — по прямому запросу пользователя ("в масштабе карты и 9
// мало") поднято до 20: заметный, недвусмысленный промежуток между точками,
// а не просто "центры не совпадают". Значение больше не заведомо меньше
// половины чанка (16/2=8) — окрестность соседних чанков в
// findFreeCellInChunk теперь считается ОТ ЭТОЙ константы (см. там), иначе
// сам зазор бы тихо не соблюдался на границах чанков.
const MIN_STRUCT_GAP=20, STRUCT_TRIES=150, STRUCT_CHUNK=16, STRUCT_CHUNK_CHANCE=0.5;
const STRUCT_SALT_NODE=501, STRUCT_SALT_CAMP=502;
function structChunkOk(x,y,salt,chance){
  const cx=Math.floor(x/STRUCT_CHUNK), cy=Math.floor(y/STRUCT_CHUNK);
  return hash2(cx,cy,W.seed+salt) < (chance===undefined?STRUCT_CHUNK_CHANCE:chance);
}
// Индекс W.map по чанку 16×16 ("cx,cy" -> [ключи W.map]) — без него зазор
// (structFarEnough, было) и наводка ботов (findNear, ниже) сканировали бы
// ВЕСЬ W.map целиком на каждую попытку/каждую мысль бота; в бесконечном
// мире W.map растёт без верхней границы по мере исследования, полный
// перебор рано или поздно станет заметно дорогим. mapSet/mapDelete —
// единственные места, где W.map мутируется, — держат индекс в актуальном
// состоянии всегда одной и той же парой функций, а не россыпью прямых
// присваиваний W.map[key(...)]=... по всему файлу.
function chunkKeyOf(x,y){ return Math.floor(x/STRUCT_CHUNK)+","+Math.floor(y/STRUCT_CHUNK); }
function mapSet(x,y,obj){
  const k=key(x,y);
  W.map[k]=obj;
  const ck=chunkKeyOf(x,y);
  if(!W.mapChunks[ck]) W.mapChunks[ck]=[];
  if(!W.mapChunks[ck].includes(k)) W.mapChunks[ck].push(k);
}
function mapDelete(x,y){
  const k=key(x,y);
  if(!W.map[k]) return;
  delete W.map[k];
  const arr=W.mapChunks[chunkKeyOf(x,y)];
  if(arr){ const i=arr.indexOf(k); if(i>=0) arr.splice(i,1); }
}
// Замена findFreeCell — тот же смысл (свободная непроходная клетка с
// зазором от соседей), но ищет ТОЛЬКО внутри одного чанка 16×16, а зазор
// проверяет по соседям из W.mapChunks в чанке и его окрестности, а не по
// всему W.map. Раньше окрестность была жёстко 3×3 (±1 чанк) — годилось,
// пока MIN_STRUCT_GAP=6 был заведомо меньше половины стороны чанка (16).
// MIN_STRUCT_GAP с тех пор вырос (см. константу) — радиус окрестности
// теперь считается ОТ НЕГО (ceil(gap/STRUCT_CHUNK) чанков в каждую сторону),
// иначе структура из чанка чуть дальше 3×3 могла бы оказаться ближе гэпа к
// кандидату, а функция её просто не увидела бы — тихий возврат старого бага
// "зазор не соблюдается" при следующем же увеличении константы. Кандидаты
// перебираются детерминированно через hash2(cx,cy,seed+salt+t*2[+1]), а не
// ri()/RNG() — вызов должен быть идемпотентным и не зависеть от того, когда
// именно и в каком порядке чанки открываются игроком (см. ensureChunkContent
// ниже), а не только от результата случайного блуждания по общему потоку
// RNG(), общему с ботами/маршами.
function findFreeCellInChunk(cx,cy,salt){
  const x0=cx*STRUCT_CHUNK, y0=cy*STRUCT_CHUNK;
  const r=Math.ceil(MIN_STRUCT_GAP/STRUCT_CHUNK);
  const neighborKeys=[];
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const arr=W.mapChunks[(cx+dx)+","+(cy+dy)];
    if(arr) for(const k of arr) neighborKeys.push(k);
  }
  function farEnough(x,y){
    for(const p of W.players){
      if(Math.hypot(p.x-x,p.y-y)<CITY_STRUCT_GAP) return false;
    }
    for(const k of neighborKeys){
      const o=W.map[k];
      if(o && o.t!=="city" && Math.hypot(o.x-x,o.y-y)<MIN_STRUCT_GAP) return false;
    }
    return true;
  }
  for(let t=0;t<STRUCT_TRIES;t++){
    const hx=hash2(cx,cy,W.seed+salt+t*2), hy=hash2(cx,cy,W.seed+salt+t*2+1);
    const x=x0+Math.floor(hx*STRUCT_CHUNK), y=y0+Math.floor(hy*STRUCT_CHUNK);
    if(W.map[key(x,y)]) continue;
    if(isRealWater(x,y)) continue;
    if(!farEnough(x,y)) continue;
    return {x,y};
  }
  return null;
}
// Дикий контент по требованию: детерминированная и идемпотентная функция
// от координат чанка и сида партии — намеренно НЕ использует ri()/RNG()/
// pick() нигде внутри (те читают общий мутируемый поток RNG(), общий с
// ботами/маршами/событиями — тот же вызов в разный момент партии дал бы
// разный результат), а вместо этого соль+hash2 на каждое решение, как и
// structChunkOk. W.genChunks помечает уже обработанные чанки, чтобы не
// накинуть контент дважды — ни при повторном вызове моста ensureWorldChunk
// (см. ниже), ни при заходе камеры в тот же чанк снова.
function hashPick(arr,x,y,salt){ return arr[Math.floor(hash2(x,y,salt)*arr.length)]; }
// Плотность дикого контента на бесконечной карте: раньше (до чанковой
// генерации по требованию) её напрямую задавал явный предел попыток в
// genWorld — nodeCount=22, campCount=13 на ~49 стартовых чанков (после
// нескольких раундов сокращения за сессию — было 900/520, потом 130/75,
// 65/38, наконец 22/13). Голая монетка STRUCT_CHUNK_CHANCE=0.5 на КАЖДЫЙ
// чанк (без отдельного предела попыток) даёт для точек ~24 из 49 — почти
// совпадает с прежними 22 — а для лагерей ~24 вместо прежних 13, вдвое
// больше нужного: лагерей на карте требовалось заметно меньше, чем точек
// ресурсов, а общая монетка этого не различала. Отдельные вероятности —
// прямой перевод старых целевых чисел (22/49, 13/49) в "шанс на чанк",
// применяется одинаково что к стартовому кластеру, что к любому чанку при
// дальнейшем исследовании — та же смысловая плотность везде, не только у
// истока.
// Пользователь снова счёл карту слишком плотной — сократил ещё на 66%
// (×0.34) поверх прежних 22/49 и 13/49 (см. thinMapDensity6 ниже для
// ретроактивного применения к уже сгенерированным чанкам).
const NODE_CHUNK_CHANCE=22/49*0.34, CAMP_CHUNK_CHANCE=13/49*0.34;
// Доля точек, которые оказываются Янтарной жилой вместо обычного ресурса.
// Янтарь — валюта не из общей четвёрки (в запас склада не идёт, в стройку не
// уходит), поэтому и на карте он должен быть находкой, а не рядовой точкой:
// одна жила примерно на восемь обычных точек.
const AMBER_NODE_SHARE=0.12;
const STRUCT_SALT_AMBER=771;
function ensureChunkContent(cx,cy){
  const ck=cx+","+cy;
  if(W.genChunks[ck]) return;
  W.genChunks[ck]=true;
  const bx=cx*STRUCT_CHUNK, by=cy*STRUCT_CHUNK;
  if(structChunkOk(bx,by,STRUCT_SALT_NODE,NODE_CHUNK_CHANCE)){
    const spot=findFreeCellInChunk(cx,cy,STRUCT_SALT_NODE);
    if(spot){
      const lv=nodeLevelAt(spot.x,spot.y);
      // Тип точки — от координат, как и всё прочее в чанковой генерации:
      // тот же чанк при повторном заходе даёт ту же жилу, а не новую монетку.
      const isAmber = hash2(spot.x,spot.y,W.seed+STRUCT_SALT_AMBER) < AMBER_NODE_SHARE;
      const type = isAmber ? "amber" : hashPick(RES,spot.x,spot.y,W.seed+STRUCT_SALT_NODE+12);
      // Янтаря в жиле кратно меньше, чем еды в пашне: это премиальный ресурс,
      // и объём тут не про «сколько увезёшь», а про «сколько вообще есть».
      const base = isAmber ? 240*Math.pow(1.9,lv-1) : 6000*Math.pow(2.6,lv-1);
      mapSet(spot.x,spot.y,{t:"node",x:spot.x,y:spot.y,res:type,lv,
        amount:Math.round(base), max:Math.round(base), busy:null});
    }
  }
  if(structChunkOk(bx,by,STRUCT_SALT_CAMP,CAMP_CHUNK_CHANCE)){
    const spot=findFreeCellInChunk(cx,cy,STRUCT_SALT_CAMP);
    if(spot){
      const raw=campRawAt(spot.x,spot.y);
      const isFort=raw>15;
      mapSet(spot.x,spot.y,{t:isFort?"fort":"camp",x:spot.x,y:spot.y,lv:raw,hp:1,power:banditPower(raw),busy:null});
    }
  }
}
// Мост от 3D-движка (engine/src/main.ts, менеджер чанков рельефа): при
// входе нового чанка рельефа в радиус загрузки движок зовёт эту функцию с
// его координатами — та же обёртка-приём, что и renderCartoucheFor (движок
// не знает и не должен знать, как устроена генерация дикого контента,
// только то, что такая функция может существовать у родителя).
function ensureWorldChunk(cx,cy){
  if(!W) return;
  ensureChunkContent(cx,cy);
}
// Засеять дикий контент вокруг точки на радиус в клетках.
// Раньше единственным, кто вообще запускал генерацию, был 3D-движок — он зовёт
// ensureWorldChunk для чанков рельефа вокруг КАМЕРЫ. То есть контент появлялся
// только там, куда смотрел игрок, а вокруг ботов мир оставался буквально
// пустым: на всей карте набиралось 8 точек и 6 лагерей, и все — возле столицы
// игрока. Отсюда и «армии ботов стоят на месте»: боту некуда идти собирать и
// некого бить, findNear не находит ни точки, ни лагеря ни в каком радиусе.
// Дёшево: ensureChunkContent сразу выходит на уже засеянном чанке (genChunks).
function ensureChunksAround(x,y,cells){
  const c0x=Math.floor((x-cells)/STRUCT_CHUNK), c1x=Math.floor((x+cells)/STRUCT_CHUNK);
  const c0y=Math.floor((y-cells)/STRUCT_CHUNK), c1y=Math.floor((y+cells)/STRUCT_CHUNK);
  for(let cy=c0y;cy<=c1y;cy++) for(let cx=c0x;cx<=c1x;cx++) ensureChunkContent(cx,cy);
}
// Выбрасывает дикий контент далёких чанков вместе с отметкой "чанк уже засеян".
// Мир бесконечный: W.map/mapChunks/genChunks росли по мере исследования и не
// чистились никогда, а весь W уходит в JSON.stringify синхронно каждые 20 секунд
// и в beforeunload — то есть цена разрастания платится не когда-нибудь, а на
// каждом сохранении.
// Выбрасывать безопасно, потому что генерация ЧИСТАЯ: ensureChunkContent зависит
// только от (cx,cy) и W.seed через structChunkOk/findFreeCellInChunk/hashPick —
// вернётесь в тот же чанк, и он засеется ровно тем же содержимым. Поэтому здесь
// снимается и флаг genChunks: без этого чанк остался бы навсегда пустым.
// Города НЕ трогаем ни при каких условиях — это состояние игроков, из зерна оно
// не восстанавливается. Занятые объекты (busy — туда идёт или там стоит чей-то
// отряд) тоже оставляем, иначе поход прибудет в никуда.
const KEEP_CHUNK_RADIUS=6;   // ~96 клеток от города — заметно больше любого обзора
function pruneFarChunks(){
  if(!W||!W.map) return 0;
  const anchors=[];
  W.players.forEach(p=>anchors.push([Math.floor(p.x/STRUCT_CHUNK),Math.floor(p.y/STRUCT_CHUNK)]));
  // у возвращающегося похода цели уже нет — его дом и так среди якорей выше
  W.marches.forEach(m=>{ if(isFinite(m.tx)&&isFinite(m.ty))
    anchors.push([Math.floor(m.tx/STRUCT_CHUNK),Math.floor(m.ty/STRUCT_CHUNK)]); });
  const near=(cx,cy)=>anchors.some(a=>Math.abs(a[0]-cx)<=KEEP_CHUNK_RADIUS&&Math.abs(a[1]-cy)<=KEEP_CHUNK_RADIUS);
  let dropped=0;
  for(const ck in W.mapChunks){
    const [cx,cy]=ck.split(",").map(Number);
    if(near(cx,cy)) continue;
    const keys=W.mapChunks[ck]||[];
    let keptAny=false;
    for(const k of keys.slice()){
      const o=W.map[k];
      if(!o) continue;
      if(o.t==="city"||o.busy){ keptAny=true; continue }
      mapDelete(o.x,o.y); dropped++;
    }
    // Чанк пересеется при возвращении — но только если снять отметку. Снимаем
    // лишь тогда, когда вынесли из него всё: иначе к оставшемуся городу
    // добавился бы второй экземпляр точки/лагеря.
    if(!keptAny){ delete W.mapChunks[ck]; delete W.genChunks[ck] }
  }
  return dropped;
}
function genWorld(seed){
  RNG = mulberry(seed);
  // pendingSetup — «мир создан, но правителя ещё не выбрали». Ставится прямо
  // здесь, потому что любой новый мир требует выбора народа и полководца, и
  // забыть про это на каком-нибудь новом пути создания станет невозможно.
  // Снимается только в claimChronicle, после того как выбор сделан и записан.
  // Без флага была дыра: сброс мира сохраняется автоматически раз в двадцать
  // секунд, и перезагрузка страницы посреди экрана летописи оставляла игрока с
  // готовым сейвом, где раса молча осталась человеческой, а экран больше не
  // показывался — сейв-то уже есть.
  W = { seed, t:0, born:Date.now(), map:{}, mapChunks:{}, genChunks:{}, players:[], marches:[], events:[],
        log:[], nextId:1, savedAt:Date.now(), mail:[], mailNextId:1, pendingSetup:true };

  // Города — первыми и с гарантией места (findSpot ниже всегда что-нибудь
  // найдёт, пусть и с нарушением зазора после 4000 попыток): без города
  // игра не работает, а лагерь или точка — необязательны, могут просто не
  // появиться, если вокруг тесно. Раньше было наоборот (города — последними),
  // из-за чего с добавленным ниже зазором между лагерями/точками город иногда
  // просто не находил бы себе места вовсе.
  const spots=[];
  const minGap=9;
  function findSpot(minD,maxD){
    for(let tries=0;tries<4000;tries++){
      const x=ri(3,CFG.MAP-4), y=ri(3,CFG.MAP-4);
      const d=originDist({x,y});
      if(d<minD||d>maxD) continue;
      if(isRealWater(x,y)) continue;   // город на воде — нельзя, вода исключение без компромиссов
      if(spots.some(s=>Math.hypot(s.x-x,s.y-y)<minGap)) continue;
      spots.push({x,y}); return {x,y};
    }
    // 4000 честных попыток исчерпаны (совсем зажатый регион) — берём что
    // есть, но воду всё равно не нарушаем: без города игра не работает,
    // а без воды — работает, эти два требования не равнозначны.
    for(let tries=0;tries<2000;tries++){
      const x=ri(3,CFG.MAP-4),y=ri(3,CFG.MAP-4);
      if(isRealWater(x,y)) continue;
      spots.push({x,y}); return {x,y};
    }
    const x=ri(3,CFG.MAP-4),y=ri(3,CFG.MAP-4); spots.push({x,y}); return {x,y};
  }
  const ps = findSpot(.62,.9);
  const me = newPlayer(W.nextId++, "human", ps.x, ps.y, false);
  me.name="Ваш город";
  me.nick="Безымянный лорд";
  me.gen.pts=5; me.gen.gotStartPts=true; // стартовые очки таланта — сразу есть что вложить; флаг гасит повторную выдачу в load()
  me.shieldUntil = 3*86400;      // три дня защиты новичка
  Object.assign(me.b,{hall:3,store:8,barracks:2,range:2,stable:1,academy:2,wall:2});
  me.b.farm[0]=3; me.b.lumber[0]=3; me.b.quarry[0]=2; me.b.mine[0]=2; me.b.hospital[0]=3;
  W.players.push(me);
  clearArea(ps.x,ps.y,1); mapSet(ps.x,ps.y,{t:"city",x:ps.x,y:ps.y,pid:me.id});

  const used={};
  for(let i=0;i<CFG.BOTS;i++){
    const race = RACE_KEYS[i%4];
    const s = findSpot(.15+RNG()*.15, .55+RNG()*.4);
    const b = newPlayer(W.nextId++, race, s.x, s.y, true);
    const pool = BOT_NAMES[race];
    used[race]=(used[race]||0);
    b.name = pool[used[race]%pool.length] + (used[race]>=pool.length?" II":"");
    const nickPool = BOT_NICKS[race];
    b.nick = nickPool[used[race]%nickPool.length] + (used[race]>=nickPool.length?" II":"");
    used[race]++;
    // боты стартуют не с нуля, иначе мир мёртвый
    const head = ri(2,5);
    for(const k of ["hall","store","barracks","range","stable","academy","wall"])
      b.b[k]=clamp(head+ri(-2,1),1,CFG.MAX_LEVEL);
    for(const k of ["farm","lumber","quarry","mine","hospital"])
      b.b[k][0]=clamp(head+ri(-2,1),1,CFG.MAX_LEVEL);   // на старте эпоха 1 — доступен только участок №1
    b.b.hall = head;
    b.b.store = Math.max(b.b.store,8);   // склад должен вмещать стартовые 100к, иначе они тут же обрежутся
    TKEYS.forEach(t=>{b.troops[t][1]=ri(200,900)});
    b.gen.lv = ri(3,10); b.gen.pts = b.gen.lv-1;
    autoTalents(b);
    b.res={food:100000,wood:100000,stone:100000,gold:100000};
    W.players.push(b);
    clearArea(s.x,s.y,1); mapSet(s.x,s.y,{t:"city",x:s.x,y:s.y,pid:b.id});
    schedule(ri(0,CFG.BOT_THINK), "think", {pid:b.id});
  }

  // Дикий контент стартового кластера — тот же диспетчер (ensureChunkContent),
  // что и при дальнейшем исследовании за пределами старой карты (см. мост
  // ensureWorldChunk выше, зовётся движком по мере подгрузки чанков рельефа):
  // чанки всего стартового квадрата 0..CFG.MAP кидаются сразу, одним и тем
  // же кодом, что сработает и для любого чанка за её пределами, когда игрок
  // туда доберётся — это и даёт бесшовность не только рельефу, но и контенту.
  // CFG.MAP тут — больше не граница мира (её нет), а фиксированный размер
  // стартовой зоны, в которой расставлены игрок и 12 ботов.
  const startChunks = Math.ceil(CFG.MAP/STRUCT_CHUNK);
  for(let cy=0;cy<startChunks;cy++)for(let cx=0;cx<startChunks;cx++) ensureChunkContent(cx,cy);

  // Свежий мир уже построен через ensureChunkContent (зазор + вода +
  // "монетка" на чанк) — всем миграциям ниже тут нечего делать.
  W.densityMigrated=true; W.densityMigrated2=true; W.densityMigrated3=true; W.densityMigrated4=true; W.densityMigrated5=true; W.densityMigrated6=true; W.densityMigrated7=true; W.densityMigrated8=true; W.infiniteWorldMigrated=true; W.levelMigrated=true; W.marchRescueMigrated=true; W.marchSpeedMigrated=true;
  logg("Мир создан. Зерно "+seed+". Городов: "+W.players.length+".", "good");
  return W;
}
// Старые сохранения несут в себе плотность ДО фильтра зазора (были созданы
// до того, как genWorld() научился требовать MIN_STRUCT_GAP=6) — сам факт
// починки genWorld() их не трогает: он не запускается повторно для
// существующего сохранения (см. load() ниже). Прорежаем то, что уже лежит
// в W.map, тем же правилом, что и свежая генерация. Города не трогаем
// вовсе — они привязаны к W.players (pid), удалить город значило бы снести
// чей-то замок; лагеря/точки удалять безопасно и без города: arriveMarch()
// уже штатно обрабатывает исчезнувшую клетку (marches.recallMarch), это тот
// же путь, что при обычном истощении точки или разгроме лагеря игроком.
function thinMapDensity(){
  if(W.densityMigrated) return;
  const MIN_STRUCT_GAP=6;
  const kept=[], drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city"){ kept.push(o); continue; }
    let ok=true;
    for(const c of kept){ if(Math.hypot(c.x-o.x,c.y-o.y)<MIN_STRUCT_GAP){ ok=false; break; } }
    if(ok) kept.push(o); else drop.push(o);
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated=true;
  if(drop.length) logg("Карта разрежена: убрано "+drop.length+" тесно стоявших точек/лагерей.","good");
}
// Вторая волна: даже с зазором в 6 клеток жадный отбор без "монетки" на
// чанк раздвигает соседей до предела зазора В КАЖДОМ углу карты — заполнено
// выглядит "на 100%" везде, без настоящих пустых мест. И раз 2D-генератор
// изначально не знал о рельефе 3D-мира, часть точек/лагерей (а изредка и
// городов) могла лечь прямо в воду. Правит оба разом, той же безопасной
// механикой удаления, что и thinMapDensity() (арест — не рост боли: см.
// комментарий там). relocate() уже умеет искать не-водное место и правит
// разом и W.map, и p.x/p.y — переиспользуем её для города на воде вместо
// отдельной логики.
function thinMapDensity2(){
  if(W.densityMigrated2) return;
  W.players.forEach(p=>{ if(isRealWater(p.x,p.y)) relocate(p,"Город стоял на воде — перенесён на сушу."); });
  const drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city") continue;
    const salt=o.t==="node"?STRUCT_SALT_NODE:STRUCT_SALT_CAMP;
    if(isRealWater(o.x,o.y) || !structChunkOk(o.x,o.y,salt)) drop.push(o);
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated2=true;
  if(drop.length) logg("Карта разрежена ещё раз: убрано "+drop.length+" точек/лагерей (вода или повторный отбор).","good");
}
// Третья волна: даже после первых двух проходов лагерей и точек всё ещё
// "мозолит глаза" — режем то, что осталось, ещё втрое. Не перевызываем
// structChunkOk (уже применена в thinMapDensity2, второй раз тем же порогом
// ничего бы не убрала) — независимый бросок монеты с шансом оставить 1 из 3,
// свой на каждую клетку (детерминированный от координаты и сида партии, не
// Math.random() — при повторном заходе даёт тот же результат, не срезает
// снова и снова при каждой загрузке).
const STRUCT_SALT_NODE2=701, STRUCT_SALT_CAMP2=702, THIRD_WAVE_KEEP=1/3;
function thinMapDensity3(){
  if(W.densityMigrated3) return;
  const drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city") continue;
    const salt=o.t==="node"?STRUCT_SALT_NODE2:STRUCT_SALT_CAMP2;
    if(hash2(Math.round(o.x),Math.round(o.y),W.seed+salt)>=THIRD_WAVE_KEEP) drop.push(o);
