function arriveMarch(m){
  if(!m) return;
  const p=W.players.find(q=>q.id===m.pid);
  const cell=W.map[key(m.tx,m.ty)];

  if(!cell){ recallMarch(m); return; }

  if(cell.t==="node" && m.mode==="gather"){
    const B=bonuses(p);
    let rate=(60+p.b.hall*22)*(1+B.gather);
    rate*= (cell.res==="food"||cell.res==="wood") ? 1+(B.gatherFW||0) : 1+(B.gatherSG||0);
    let load=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) load+=m.units[t][i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(p.race,t,"load")});
    load=Math.round(load*(1+B.load));
    const take=Math.min(load, cell.amount);
    const secs=take/rate*3600;
    m.state="gather"; m.t0=W.t; m.t1=W.t+secs;
    cell.amount-=take; cell.busy=p.id;
    m.carry={}; m.carry[cell.res]=take;
    if(cell.amount<=0){ delete W.map[key(m.tx,m.ty)]; schedule(CFG.NODE_RESPAWN,"nodeback",{x:m.tx,y:m.ty}) }
    schedule(secs,"gathered",{mid:m.id});
    return;
  }

  if(cell.t==="camp"||cell.t==="fort"){
    const B=bonuses(p);
    const A=makeForce(m.units,p,{name:p.name});
    const bandUnits=banditArmy(cell.lv);
    const D=makeForce(bandUnits,null,{bandit:true,name:"Разбойники ур. "+cell.lv});
    D.B={atk:0,def:0,hp:0,archer:0,raise:0};
    A.B.atk += B.bandit;
    const r=resolveBattle(A,D,{startA:countUnits(m.units)});
    const sp=splitLosses(p,r.lossA,false);
    if(r.win==="A"){
      const xp=Math.round(40*Math.pow(1.22,cell.lv-1));
      addXp(p,xp);
      const loot={}; const lootBase=Math.round(1800*Math.pow(1.28,cell.lv-1));
      RES.forEach(rr=>loot[rr]=Math.round(lootBase*(rr==="gold"?.25:rr==="stone"?.6:1)));
      m.carry=loot;
      delete W.map[key(m.tx,m.ty)];
      schedule(CFG.RESPAWN_CAMP,"respawn",{x:m.tx,y:m.ty});
      if(!p.isBot) logg("Разбитый лагерь ур. "+cell.lv+". Опыт +"+xp+", убито "+sp.dead+
        ", ранено "+sp.hurt+".","war");
    } else {
      if(!p.isBot) logg("Отряд разбит лагерем ур. "+cell.lv+". Убито "+sp.dead+", ранено "+sp.hurt+".","war");
    }
    m.units=A.units; recallMarch(m); return;
  }

  if(cell.t==="city"){
    const def=W.players.find(q=>q.id===cell.pid);
    if(!def || def.id===p.id){ recallMarch(m); return }
    if(W.t < def.shieldUntil){
      if(!p.isBot) logg("Город под щитом мира — атака невозможна.","war");
      recallMarch(m); return;
    }
    battleCity(p,def,m);
    return;
  }
  recallMarch(m);
}

function banditArmy(lv){
  const u=emptyUnits();
  const tier=clamp(Math.ceil(lv/6),1,5);
  const n=Math.round(90*Math.pow(1.235,lv-1)/TIER_MULT[tier-1]);
  u.inf[tier]=Math.round(n*.45); u.arc[tier]=Math.round(n*.3);
  u.cav[tier]=Math.round(n*.25);
  return u;
}
function addXp(p,xp){
  p.gen.xp+=xp;
  while(p.gen.xp>=genXpNeed(p.gen.lv) && p.gen.lv<Math.min(60,epochOf(p.b.hall)*12)){
    p.gen.xp-=genXpNeed(p.gen.lv); p.gen.lv++; p.gen.pts++;
    if(!p.isBot) logg("Генерал достиг "+p.gen.lv+" уровня. Очко таланта доступно.","good");
  }
  if(p.isBot) autoTalents(p);
}
function autoTalents(p){
  const aggr=(p.ai&&p.ai.aggr)||0.5;
  const weight=id=>{
    if(id==="gt_a1"||id==="gt_a2"||id==="gt_a3") return 10;              // личные статы — генерал теперь боец, это всегда ценно
    if(["w1","w2","w3","gt_a4","gt_a5","gt_a6"].includes(id)) return 6+8*aggr;      // статы войск
    if(["gt_c1","gt_c2","gt_c3","gt_c4","gt_c5","d1","d2","d3","d4","d5"].includes(id)) return 6+8*(1-aggr); // город/хозяйство
    return 4;                                                            // марш/груз/мародёрство/милосердие
  };
  while(p.gen.pts>0){
    const cands=[];
    for(const bk in TALENTS) for(const n of TALENTS[bk].nodes) if((p.gen.tal[n.id]||0)<(n.max||5)) cands.push(n.id);
    for(const bk in GENERAL_TREE) for(const n of GENERAL_TREE[bk].nodes) if((p.gen.tal[n.id]||0)<n.max) cands.push(n.id);
    if(!cands.length) break;
    cands.sort((a,b)=>weight(b)-weight(a));
    const id=cands[0];
    p.gen.tal[id]=(p.gen.tal[id]||0)+1; p.gen.pts--;
  }
}

function battleCity(att,def,m){
  const garrison=emptyUnits();
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++)garrison[t][i]=def.troops[t][i]});
  const A=makeForce(m.units,att,{name:att.name});
  const D=makeForce(garrison,def,{wall:def.b.wall+def.b.garrison*0.5,defending:true,name:def.name});
  const r=resolveBattle(A,D,{startA:countUnits(m.units),toDeath:false});
  const la=splitLosses(att,r.lossA,false);
  const ld=splitLosses(def,r.lossD,true);
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++)def.troops[t][i]=D.units[t][i]});
  m.units=A.units;

  if(r.win==="A"){
    syncRes(def);
    const loot={}; let sum=0;
    let carryCap=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)carryCap+=m.units[t][i]*TROOP_TYPES[t].load*TIER_MULT[i-1]*troopMod(att.race,t,"load")});
    const prot=capacity(def);
    RES.forEach(rr=>{ const take=Math.min(Math.max(0,def.res[rr]-prot[rr]), carryCap/4); loot[rr]=Math.round(take); def.res[rr]-=take; sum+=take });
    m.carry=loot;
    addXp(att, Math.round(200+def.b.hall*60));
    // Полный разгром бьёт по прочности стены; при обнулении — город переносится
    if(countUnits(def.troops)<=0 && r.aliveA>0){
      syncWall(def);
      def.wallHp -= maxWallHp(def.b.wall)*0.34;
      def.wallHitAt=W.t;
      if(def.wallHp<=0){
        relocate(def);
        def.wallHp=maxWallHp(def.b.wall)*0.5;
        if(!def.isBot) def.shieldUntil=Math.max(def.shieldUntil, W.t+8*3600);
      }
    }
    logMsg(att,def,"Победа при "+def.name+". Захвачено "+Math.round(sum).toLocaleString("ru")+" ресурсов.",
                   "Город атакован ("+att.name+"). Потери: "+ld.dead+" убито, "+ld.hurt+" ранено.");
  } else {
    logMsg(att,def,"Штурм "+def.name+" провалился. Убито "+la.dead+", ранено "+la.hurt+".",
                   "Отражена атака "+att.name+". Убито "+ld.dead+", ранено "+ld.hurt+".");
  }
  if(!def.isBot||!att.isBot){/* nothing */}
  recallMarch(m);
}
function logMsg(att,def,forAtt,forDef){
  if(!att.isBot) logg(forAtt,"war");
  if(!def.isBot) logg(forDef,"war");
}
function relocate(p){
  // после разгрома город переносится туда, где меньше всего соседей
  let best=null,bestScore=-1;
  for(let i=0;i<400;i++){
    const x=ri(4,CFG.MAP-5), y=ri(4,CFG.MAP-5);
    if(W.map[key(x,y)]) continue;
    let near=1e9;
    W.players.forEach(q=>{ if(q.id!==p.id) near=Math.min(near,Math.hypot(q.x-x,q.y-y)) });
    if(near>bestScore){ bestScore=near; best={x,y} }
  }
  if(!best) return;
  delete W.map[key(p.x,p.y)];
  p.x=best.x; p.y=best.y;
  clearArea(p.x,p.y,1);
  W.map[key(p.x,p.y)]={t:"city",x:p.x,y:p.y,pid:p.id};
  if(!p.isBot) logg("Город разрушен и перенесён в безопасный край карты.","war");
}

/* =========================================================================
   ИИ БОТОВ — utility AI.
   Каждое возможное действие получает оценку по формулам. Бот делает то,
   что набрало больше всего. Ни деревьев поведения, ни нейросетей: так
   поведение остаётся объяснимым и правится одной цифрой.
   Личность бота задают три числа: агрессия, жадность, осторожность.
   ========================================================================= */
function relation(a,b){
  if(a.race===b.race) return 0.35;      // свои — мирно
  return -0.35;                         // чужие расы одинаково враждебны, без случайного перекоса
}
function botAlarm(bot,incoming){
  // Марш замечен в момент вылета. Бот реагирует как живой игрок: с паузой.
  const react = 30+RNG()*240;
  schedule(react,"alarm",{pid:bot.id});
  bot.ai.threat = W.t + (incoming.t1-W.t);
}
function botThink(p){
  syncRes(p);
  const B=bonuses(p), acts=[];
  const cap=capacity(p);
  const pr=production(p);
  const busyQ=p.queues.filter(Boolean).length;
  const freeSlots=marchSlots(p.b.hall)-W.marches.filter(m=>m.pid===p.id).length;

  /* --- стройка --- */
  if(busyQ<2){
    for(const bk of BKEYS){
      const plots = isMulti(bk) ? p.b[bk].length : 1;
      for(let pi=0; pi<plots; pi++){
        if(isMulti(bk) && !plotUnlocked(bk,pi,p.b.hall)) continue;
        const cur = isMulti(bk) ? p.b[bk][pi] : p.b[bk];
        const lv=cur+1;
        if(lv>CFG.MAX_LEVEL) continue;
        if(bk!=="hall" && lv>p.b.hall) continue;
        if(bk==="hall" && lv>1){
          if(HALL_REQ.some(k=>p.b[k]<p.b.hall)) continue;   // ратуша ждёт ключевые здания
        }
        const c=buildCost(lv,p);
        if(!RES.every(r=>p.res[r]>=(c[r]||0))) continue;
        let sc=20;
        if(bk==="hall") sc+=45;
        if(BUILDINGS[bk].prod){ const r=BUILDINGS[bk].prod;
          sc += 30*p.ai.greed + (p.res[r]<cap[r]*0.15?25:0);
          if(isMulti(bk) && cur===0) sc+=15;    // новый участок выгоднее докачки старого
        }
        if(bk==="store" && RES.some(r=>p.res[r]>cap[r]*0.85)) sc+=40;
        if(["barracks","range","stable"].includes(bk)) sc += 25*p.ai.aggr;
        if(bk==="wall")     sc += 30*p.ai.caution;
        if(bk==="garrison") sc += 26*p.ai.caution;
        if(bk==="scout")    sc += 16;
        if(bk==="hospital") sc += 22*p.ai.caution;
        if(bk==="academy")  sc += 34;
        sc -= cur*0.8;
        acts.push({sc,run:()=>startBuild(p,bk,isMulti(bk)?pi:undefined)});
      }
    }
  }
  /* --- обучение --- */
  if(!p.train){
    const types=["inf","arc","cav","sie"].filter(t=>p.b[TRAIN_BLD[t]]>0);
    if(types.length){
      const t=types[Math.floor(RNG()*types.length)];
      const tier=tierUnlockedFor(p,t);
      const c=troopCost(t,tier);
      // Бот копит на следующую ступень ратуши и тратит на войска только излишек.
      // Раньше эту роль случайно играла проверка на еду.
      const reserve=buildCost(p.b.hall+1,p);
      // Если армия просела ниже критической, город бросает стройку и вооружается.
      const desperate = countUnits(p.troops) < p.b.hall*80;
      const keep = desperate ? 0 : 0.6;
      const spare={}; RES.forEach(r=>spare[r]=Math.max(0,p.res[r]-reserve[r]*keep));
      const affordable=Math.min(trainCap(p.b[TRAIN_BLD[t]]), Math.floor(Math.min(...RES.map(r=>c[r]?spare[r]/c[r]:1e9))*0.5));
      if(affordable>=30){
        let sc=25+40*p.ai.aggr;
        if(countUnits(p.troops)<p.b.hall*180) sc+=35;
        if(desperate) sc+=60;
        acts.push({sc,run:()=>startTrain(p,t,tier,affordable)});
      }
    }
  }
  /* --- исследования --- */
  if(!p.rsch && p.b.academy>0){
    const pool=[...ACADEMY_TREE.eco,...ACADEMY_TREE.mil].filter(n=>{
      if(n.race && n.race!==p.race) return false;
      const cur=p.tech[n.id]||0; if(cur>=n.max) return false;
      if(n.unlock){ if(n.unlock.tier>2 && !(p.tech["mil_tier_"+n.unlock.type+(n.unlock.tier-1)]>=1)) return false; }
      const c=researchCost(n.branch,n.wave,cur+1);
      return RES.every(r=>p.res[r]>=(c[r]||0));
    });
    if(pool.length){
      const scored=pool.map(n=>{
        let s=18+(n.unlock?40:0)+(n.race?15:0);
        s+= n.branch==="mil" ? 8*p.ai.aggr : 8*(1-p.ai.aggr);
        return {n,s};
      }).sort((a,b)=>b.s-a.s);
      acts.push({sc:scored[0].s, run:()=>startResearch(p,scored[0].n.id)});
    }
  }
  /* --- снаряжение --- */
  if(!p.craft && p.b.forge>0){
    const curR=Math.min(5,epochOf(p.b.hall));
    const order=p.ai.aggr>0.5?"storm":"bastion";
    GEAR_SLOTS.forEach(s=>{
      const stock=p.materials[s.mat];
      let handled=false;
      for(let t=curR-2;t>=0;t--){
        if((stock[t]||0)>=4){ acts.push({sc:26,run:()=>upgradeMaterial(p,s.mat,t)}); handled=true; break; }
      }
      const haveEnough=(stock[curR-1]||0)>=1;
      const cur=p.gear[s.id];
      if(!haveEnough && !handled) acts.push({sc:14+8*p.ai.greed,run:()=>produceMaterial(p,s.mat)});
      else if(haveEnough && (!cur||cur.rarity<curR)) acts.push({sc:22,run:()=>startCraftItem(p,s.id,order,curR)});
    });
    // надеть лучшее с собственного склада, если оно лучше того, что уже надето
    GEAR_SLOTS.forEach(s=>{
      const cur=p.gear[s.id];
      let bestOrder=null,bestR=cur?cur.rarity:0;
      ["bastion","storm"].forEach(o=>{
        for(let r=5;r>=1;r--){ if((p.inventory[s.id][o][r-1]||0)>0 && r>bestR){ bestOrder=o; bestR=r; break } }
      });
      if(bestOrder) acts.push({sc:28,run:()=>equipItem(p,s.id,bestOrder,bestR)});
    });
  }
  /* --- лечение --- */
  let hurt=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)hurt+=p.wounded[t][i]});
  if(hurt>0){
    const c=healCost(p);
    if(RES.every(r=>p.res[r]>=(c[r]||0))) acts.push({sc:40+hurt/50,run:()=>doHeal(p)});
  }
  /* --- сбор ресурсов --- */
  if(freeSlots>0){
    const scarce=RES.slice().sort((a,b)=>(p.res[a]/cap[a])-(p.res[b]/cap[b]))[0];
    const node=findNear(p,c=>c.t==="node"&&!c.busy, 30, c=>
      (c.res===scarce?18:0)+c.lv*7-dist(p,c)*0.55);
    if(node){
      let sc=30+35*p.ai.greed+(p.res[scarce]<cap[scarce]*0.2?30:0);
      acts.push({sc,run:()=>{ const u=pickArmy(p,0.45); if(countUnits(u)>0) sendMarch(p,node.x,node.y,u,"gather") }});
    }
  }
  /* --- разбойники (прокачка генерала) --- */
  if(freeSlots>0 && p.gen.lv<40){
    // Сравниваем силу лагеря с тем отрядом, который реально уйдёт в бой,
    // а не со всей армией — иначе ИИ переоценивает себя и теряет войска.
    const sendable=armyPower(pickArmy(p,0.55),B,p.race);
    const camp=findNear(p,c=>(c.t==="camp"||c.t==="fort")&&banditPower(c.lv)<sendable*0.55, 26,
      c=>c.lv*4-dist(p,c)*0.7);
    if(camp) acts.push({sc:44+22*(1-p.ai.greed)+(p.gen.lv<12?18:0),
      run:()=>{ const u=pickArmy(p,0.55); if(countUnits(u)>0) sendMarch(p,camp.x,camp.y,u,"attack") }});
  }
  /* --- нападение на город --- */
  if(freeSlots>0){
    const my=armyPower(p.troops,B,p.race);
    let best=null,bs=0;
    W.players.forEach(q=>{
      if(q.id===p.id) return;
      if(W.t<q.shieldUntil) return;
      const d=dist(p,q); if(d>34) return;
      const their=armyPower(q.troops,bonuses(q),q.race)*(1+q.b.wall*0.03);
      const ratio=my/Math.max(1,their);
      if(ratio<1.35+p.ai.caution*0.9) return;
      const rel=relation(p,q);
      let sc = 26 + 46*p.ai.aggr + (ratio-1)*18 - d*0.55 - rel*55;
      if(sc>bs){bs=sc;best=q}
    });
    if(best) acts.push({sc:bs,run:()=>{
      const u=pickArmy(p,0.8); if(countUnits(u)>0) sendMarch(p,best.x,best.y,u,"attack") }});
  }
  /* --- страх: отозвать войска домой --- */
  if(p.ai.threat && W.t<p.ai.threat){
    const away=W.marches.filter(m=>m.pid===p.id&&m.state!=="back");
    if(away.length) acts.push({sc:55*p.ai.caution+30,run:()=>away.forEach(recallMarch)});
  }
  /* --- щит, если страшно и есть золото --- */
  if(p.ai.threat && W.t<p.ai.threat && W.t>p.shieldUntil && p.res.gold>3000){
    acts.push({sc:48*p.ai.caution,run:()=>{ p.res.gold-=3000; p.shieldUntil=W.t+24*3600 }});
  }

  if(!acts.length) return;
  acts.sort((a,b)=>b.sc-a.sc);
  acts[0].run();
  if(acts[1]&&acts[1].sc>acts[0].sc*0.85) acts[1].run();   // бот успевает делать два дела
}
function findNear(p,filter,radius,score){
  let best=null,bs=-1e9;
  for(const k in W.map){
    const c=W.map[k];
    if(dist(p,c)>radius) continue;
    if(!filter(c)) continue;
    const s=score(c);
    if(s>bs){bs=s;best=c}
  }
  return best;
}
function pickArmy(p,frac){
  const cap=marchCapacity(p), u=emptyUnits();
  let room=cap;
  for(let i=5;i>=1;i--) for(const t of TKEYS){
    const have=Math.floor(p.troops[t][i]*frac); if(have<=0) continue;
    const weight=TIER_MULT[i-1];
    const n=Math.min(have, Math.floor(room/weight));
    if(n>0){ u[t][i]=n; room-=n*weight }
  }
  return u;
}

/* --- действия, общие для игрока и ботов --- */
function startBuild(p,bk,plot){
  const multi=isMulti(bk);
  if(multi && !plotUnlocked(bk,plot,p.b.hall)) return {err:"Участок откроется позже"};
  const cur = multi ? p.b[bk][plot] : p.b[bk];
  const lv=cur+1;
  if(lv>CFG.MAX_LEVEL) return {err:"Максимальный уровень"};
  if(bk!=="hall"&&lv>p.b.hall) return {err:"Требуется ратуша "+lv+" уровня"};
  if(bk==="hall"){ const need=HALL_REQ.filter(k=>p.b[k]<p.b.hall);
    if(need.length) return {err:"Сначала до "+p.b.hall+" ур.: "+need.map(k=>buildingName(k,p)).join(", ")} }
  const slot=p.queues.findIndex(q=>!q);
  if(slot<0) return {err:"Обе бригады заняты"};
  const c=buildCost(lv,p);
  if(!canPay(p,c)) return {err:"Не хватает ресурсов"};
  pay(p,c);
  const t=buildTime(lv)/bonuses(p).build;
  p.queues[slot]={b:bk,lv,plot:multi?plot:null,t0:W.t,t1:W.t+t};
  schedule(t,"build",{pid:p.id,slot});
  return {ok:1};
}
function startTrain(p,type,tier,n){
  if(p.train) return {err:"Казармы заняты"};
  const blv=p.b[TRAIN_BLD[type]], cap=trainCap(blv);
  if(n>cap) return {err:"За раз можно набрать не больше "+cap};
  const c=troopCost(type,tier), tot={};
  RES.forEach(r=>tot[r]=Math.round((c[r]||0)*n));
  if(!canPay(p,tot)) return {err:"Не хватает ресурсов"};
  pay(p,tot);
  const t=trainTime(type,tier)*n/((1+p.b.hall*0.06)*(1+bonuses(p).trainSpeed)*(1+lateSpeed(blv)));
  p.train={type,tier,n,t0:W.t,t1:W.t+t};
  schedule(t,"train",{pid:p.id});
  return {ok:1};
}
function startResearch(p,id){
  if(p.rsch) return {err:"Академия занята"};
  const n=findNode(id); if(!n) return {err:"Неизвестное исследование"};
  if(n.race && n.race!==p.race) return {err:"Не для вашей расы"};
  const cur=p.tech[id]||0;
  if(cur>=n.max) return {err:"Уже на максимуме"};
  if(n.unlock && n.unlock.tier>2 && !(p.tech["mil_tier_"+n.unlock.type+(n.unlock.tier-1)]>=1))
    return {err:"Сначала откройте предыдущий тир"};
  const lv=cur+1;
  const c=researchCost(n.branch,n.wave,lv);
  if(!canPay(p,c)) return {err:"Не хватает ресурсов"};
  pay(p,c);
  const t=researchTime(n.branch,n.wave,lv)/((1+bonuses(p).researchSpeed)*(1+lateSpeed(p.b.academy)));
  p.rsch={id,lv,t0:W.t,t1:W.t+t};
  schedule(t,"research",{pid:p.id});
  return {ok:1};
}
function produceMaterial(p,mat){
  if(p.craft) return {err:"Кузница занята"};
  const n=5, cost={gold:100};
  if(!canPay(p,cost)) return {err:"Не хватает золота"};
  pay(p,cost);
  const t=600/(1+lateSpeed(p.b.forge));
  p.craft={kind:"material",mat,n,t0:W.t,t1:W.t+t};
  schedule(t,"craft",{pid:p.id});
  return {ok:1};
}
function upgradeMaterial(p,mat,tier){   // 4 штуки уровня tier (0..3) → 1 штука уровня tier+1
  if((p.materials[mat][tier]||0)<4) return {err:"Нужно 4 штуки этого качества"};
  p.materials[mat][tier]-=4; p.materials[mat][tier+1]=(p.materials[mat][tier+1]||0)+1;
  return {ok:1};
}
function startCraftItem(p,slot,order,rarity){
  if(p.craft) return {err:"Кузница занята"};
  if(p.b.forge<=0) return {err:"Нужен горн"};
  if(rarity>epochOf(p.b.hall)) return {err:"Такая редкость откроется позже"};
  const s=findGearSlot(slot); if(!s) return {err:"Неизвестный слот"};
  const tier=rarity-1;
  if((p.materials[s.mat][tier]||0)<1) return {err:"Не хватает материала нужного качества"};
  const c=craftCost(s.mat,tier,rarity);
  if(!canPay(p,{gold:c.gold,food:c.food,wood:c.wood})) return {err:"Не хватает ресурсов"};
  pay(p,{gold:c.gold,food:c.food,wood:c.wood});
  p.materials[s.mat][tier]--;
  const t=1800*rarity*rarity/(1+lateSpeed(p.b.forge));
  p.craft={kind:"item",slot,order,rarity,t0:W.t,t1:W.t+t};
  schedule(t,"craft",{pid:p.id});
  return {ok:1};
}
function equipItem(p,slot,order,rarity){
  const inv=p.inventory[slot][order];
  if((inv[rarity-1]||0)<1) return {err:"Такого предмета нет на складе"};
  const cur=p.gear[slot];
  inv[rarity-1]--;
  if(cur) p.inventory[slot][cur.order][cur.rarity-1]=(p.inventory[slot][cur.order][cur.rarity-1]||0)+1;
  p.gear[slot]={order,rarity};
  return {ok:1};
}
function unequipItem(p,slot){
  const cur=p.gear[slot]; if(!cur) return {err:"Слот пуст"};
  p.inventory[slot][cur.order][cur.rarity-1]=(p.inventory[slot][cur.order][cur.rarity-1]||0)+1;
  p.gear[slot]=null;
  return {ok:1};
}
function dismantleItem(p,slot,order,rarity){
  const inv=p.inventory[slot][order];
  if((inv[rarity-1]||0)<1) return {err:"Такого предмета нет на складе"};
  inv[rarity-1]--;
  const refund=Math.round(200*rarity*rarity*0.5);
  p.res.gold=(p.res.gold||0)+refund;
  return {ok:1,refund};
}
function healCost(p){
  const k=bonuses(p).heal;
  let n=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)n+=p.wounded[t][i]*TIER_MULT[i-1]});
  return {food:Math.round(n*12*k),wood:Math.round(n*9*k),gold:Math.round(n*1.5*k)};
}
function doHeal(p){
  const c=healCost(p);
  if(!canPay(p,c)) return {err:"Не хватает ресурсов на лечение"};
  pay(p,c);
  const t=Math.max(30, Math.sqrt(RES.reduce((a,r)=>a+(c[r]||0),0))*1.4*bonuses(p).healSpeed);
  schedule(t,"heal",{pid:p.id});
  return {ok:1};
}

/* =========================================================================
   ХОД ВРЕМЕНИ. Догоняющая симуляция: сколько бы вас не было, движок
   прокручивает очередь событий до текущего момента.
   ========================================================================= */
function advanceTo(target){
  let guard=0;
  while(W.events.length && W.events[0].t<=target){
    if(++guard>200000) break;
    const ev=W.events.shift();
    W.t=ev.t;
    const fn=EV[ev.type]; if(fn) fn(ev.data);
  }
  W.t=target;
  W.players.forEach(syncRes);
}

/* =========================================================================
   СОХРАНЕНИЕ. Работает и внутри Claude (window.storage), и локально
   (localStorage), и просто в памяти, если нет ни того ни другого.
   ========================================================================= */
const Store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);return r?r.value:null} }catch(e){}
    try{ return localStorage.getItem(k) }catch(e){ return null }
  },
  async set(k,v){
    try{ if(window.storage){await window.storage.set(k,v);return} }catch(e){}
    try{ localStorage.setItem(k,v) }catch(e){}
  },
  async del(k){
    try{ if(window.storage){await window.storage.delete(k);return} }catch(e){}
    try{ localStorage.removeItem(k) }catch(e){}
  }
};
const SAVE_KEY="fourbanners:save1";
async function save(){
  W.savedAt=Date.now();
  try{ await Store.set(SAVE_KEY, JSON.stringify(W)) }catch(e){ console.warn("save failed",e) }
}
async function load(){
  const raw=await Store.get(SAVE_KEY);
  if(!raw) return false;
  try{
    const s=JSON.parse(raw);
    if(!s||!s.players) return false;
    W=s; RNG=mulberry(W.seed+Math.floor(W.t));
    // догоняем реальное время, прошедшее с последнего захода
    const away=Math.max(0,(Date.now()-W.savedAt)/1000);
    if(away>60){
      advanceTo(W.t+away);
      logg("Пока вас не было, прошло "+fmtDur(away)+". Мир жил своей жизнью.","good");
    }
    return true;
  }catch(e){ return false }
}

/* =========================================================================
   ИНТЕРФЕЙС. Карта — не сетка клеток, а чертёж кампании на штабном столе.
   Рельеф рисуется один раз в буфер и растягивается со сглаживанием: получается
   мягкая размывка вместо пиксельных квадратов, и это дёшево.
   ========================================================================= */
const $=s=>document.querySelector(s);
const me=()=>W.players[0];
const RU=n=>Math.round(n).toLocaleString("ru-RU");
function fmt(n){ n=Math.round(n);
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+" млрд";
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+" млн";
  if(Math.abs(n)>=1e4) return (n/1e3).toFixed(1)+" тыс";
  return RU(n) }
function fmtDur(s){ s=Math.max(0,Math.round(s));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d) return d+" д "+h+" ч";
  if(h) return h+" ч "+m+" мин";
  if(m) return m+" мин "+x+" с";
  return x+" с" }

const TINCT={human:"#d9b14b",dwarf:"#bb5730",elf:"#4c8d5e",undead:"#7d56a4"};
const RSHADE={food:"#83a049",wood:"#9c6b3a",stone:"#8791a0",gold:"#d6ae40"};
// на карте те же ресурсы берём светлее: сепия под ними глушит цвет
const RMAP  ={food:"#a8c96a",wood:"#c68d4e",stone:"#b3bcc9",gold:"#f0c757"};
const GILT="#c2993c", GILT_HI="#e6c273", VELLUM="#ece2ca", GARNET="#96323b";

const FONT=getComputedStyle(document.body).fontFamily;   // читаем один раз, не каждый кадр
const cv=$("#map"), g=cv.getContext("2d");
const mini=$("#mini"), mg=mini.getContext("2d");
let view={x:0,y:0,z:8}, drag=null, sel=null, hover=null;
let tab="city", tempo=1, lastReal=Date.now(), lastFolio="";

/* ---- Рельеф в буфер ---------------------------------------------------- */
let terrain=null;
function hash2(x,y,s){ let h=x*374761393+y*668265263+s*1274126177;
  h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296 }
function noise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function ridge(x,y,s){ return 1-Math.abs(2*noise(x,y,s)-1) }   // излом шума даёт хребты
function elevation(x,y,s){
  let e = noise(x/23,y/23,s)*.42 + noise(x/11,y/11,s+9)*.24 + noise(x/5,y/5,s+21)*.10;
  e += ridge(x/15,y/15,s+37)*.24;
  return e<0?0:e>1?1:e;
}
const MIX=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const DEEP=[28,40,52], SHOAL=[42,58,66], MARSH=[46,52,40], PLAIN=[60,63,42],
      FIELD=[78,74,46], HILL=[92,82,52], CRAG=[112,100,74], PEAK=[146,136,112];

function buildTerrain(){
  const N=CFG.MAP, s=W.seed;
  terrain=document.createElement("canvas"); terrain.width=N; terrain.height=N;
  const t=terrain.getContext("2d"), img=t.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const e=elevation(x,y,s);
    const d=Math.hypot(x-N/2,y-N/2)/(N/2);
    const heart=Math.pow(Math.max(0,1-d),1.4);      // сердце мира — земли богаче
    let c;
    if      (e<0.17) c=MIX(DEEP,SHOAL,e/0.17);
    else if (e<0.22) c=MIX(SHOAL,MARSH,(e-0.17)/0.05);
    else if (e<0.42) c=MIX(MARSH,PLAIN,(e-0.22)/0.20);
    else if (e<0.58) c=MIX(PLAIN,FIELD,(e-0.42)/0.16);
    else if (e<0.71) c=MIX(FIELD,HILL,(e-0.58)/0.13);
    else if (e<0.83) c=MIX(HILL,CRAG,(e-0.71)/0.12);
    else             c=MIX(CRAG,PEAK,(e-0.83)/0.17);
    c=[c[0]*(1+heart*.30)+heart*16, c[1]*(1+heart*.20)+heart*7, c[2]*(1-heart*.10)];
    const band=(e*14)%1;
    if(e>0.24 && band<0.07) c=[c[0]*.84,c[1]*.84,c[2]*.86];    // горизонтали
    if(e>0.165 && e<0.182)  c=[c[0]*.55,c[1]*.58,c[2]*.68];    // береговая линия
    const lum=c[0]*.34+c[1]*.5+c[2]*.16;                       // выцветшая сепия,
    c=[c[0]*.62+lum*.42, c[1]*.62+lum*.37, c[2]*.62+lum*.27];  // чтобы золото читалось
    const i=(y*N+x)*4;
    img.data[i]=c[0]; img.data[i+1]=c[1]; img.data[i+2]=c[2]; img.data[i+3]=255;
  }
  t.putImageData(img,0,0);
}

/* ---- Геометрия экрана ---- */
function resize(){
  const r=cv.parentElement.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  g.setTransform(dpr,0,0,dpr,0,0); cv._w=r.width; cv._h=r.height;
  const m=mini.getBoundingClientRect();
  mini.width=Math.round(m.width*dpr); mini.height=Math.round(m.height*dpr);
  mg.setTransform(dpr,0,0,dpr,0,0); mini._w=m.width; mini._h=m.height;
}
const SX=x=>(x-view.x)*view.z, SY=y=>(y-view.y)*view.z;
function centerOn(x,y){ view.x=x-cv._w/2/view.z; view.y=y-cv._h/2/view.z; clampView() }
function clampView(){
  const pad=1.5;
  view.x=Math.max(-pad,Math.min(CFG.MAP+pad-cv._w/view.z,view.x));
  view.y=Math.max(-pad,Math.min(CFG.MAP+pad-cv._h/view.z,view.y));
}

/* ---- Гербовый щит ---- */
function shield(c,cx,cy,w,h,fill,edge,lw){
  c.beginPath();
  const l=cx-w/2, r=cx+w/2, t=cy-h/2, b=cy+h/2, sh=t+h*0.58;
  c.moveTo(l,t); c.lineTo(r,t); c.lineTo(r,sh);
  c.quadraticCurveTo(r,b-h*0.06, cx,b); c.quadraticCurveTo(l,b-h*0.06, l,sh);
  c.closePath();
  c.fillStyle=fill; c.fill();
  if(edge){ c.strokeStyle=edge; c.lineWidth=lw||1.2; c.stroke() }
}
/* ---- Значки ресурсных точек ---- */
function glyph(c,kind,cx,cy,s,col){
  c.save();
  c.shadowColor="rgba(0,0,0,.75)"; c.shadowBlur=Math.max(2,s*.5); c.shadowOffsetY=1;
  c.strokeStyle=col; c.fillStyle=col; c.lineWidth=Math.max(1.2,s*0.17); c.lineCap="round";
  if(kind==="food"){                               // сноп
    c.beginPath();
    for(const a of [-0.42,0,0.42]){ c.moveTo(cx-Math.sin(a)*s*.5,cy+s*.55);
      c.lineTo(cx+Math.sin(a)*s*.55,cy-s*.6) }
    c.stroke();
    c.beginPath(); c.moveTo(cx-s*.42,cy+s*.12); c.lineTo(cx+s*.42,cy+s*.12); c.stroke();
  } else if(kind==="wood"){                        // дерево
    c.beginPath(); c.moveTo(cx,cy-s*.65); c.lineTo(cx+s*.5,cy+s*.2);
    c.lineTo(cx-s*.5,cy+s*.2); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(cx,cy+s*.2); c.lineTo(cx,cy+s*.62); c.stroke();
  } else if(kind==="stone"){                       // глыба
    c.beginPath(); c.moveTo(cx-s*.55,cy+s*.45); c.lineTo(cx-s*.3,cy-s*.4);
    c.lineTo(cx+s*.25,cy-s*.55); c.lineTo(cx+s*.58,cy+s*.1);
    c.lineTo(cx+s*.3,cy+s*.5); c.closePath(); c.fill();
  } else {                                         // монета
    c.beginPath(); c.arc(cx,cy,s*.52,0,7); c.fill();
    c.shadowColor="transparent";
    c.strokeStyle="rgba(0,0,0,.5)"; c.lineWidth=Math.max(1,s*.13);
    c.beginPath(); c.arc(cx,cy,s*.27,0,7); c.stroke();
  }
  c.restore();
}
function camp(c,cx,cy,s,fort){
  c.save();
  c.shadowColor="rgba(0,0,0,.7)"; c.shadowBlur=Math.max(2,s*.45); c.shadowOffsetY=1;
  if(fort){                                        // форт с зубцами
    c.fillStyle="#7a6134"; c.strokeStyle="#4a3a1d"; c.lineWidth=1;
    const w=s*1.05,h=s*.85;
    c.beginPath(); c.rect(cx-w/2,cy-h/2+h*.22,w,h*.78); c.fill(); c.stroke();
    for(let i=0;i<3;i++){ const bw=w/5;
      c.beginPath(); c.rect(cx-w/2+i*bw*2,cy-h/2,bw,h*.3); c.fill(); c.stroke() }
  } else {                                         // палатка
    c.fillStyle="#6a5530"; c.strokeStyle="#42341a"; c.lineWidth=1;
    c.beginPath(); c.moveTo(cx,cy-s*.6); c.lineTo(cx+s*.62,cy+s*.5);
    c.lineTo(cx-s*.62,cy+s*.5); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
}
// подпись с тёмной подложкой — иначе цифры теряются на рельефе
function tagText(c,txt,cx,cy,size,col){
  c.font=size+"px ui-monospace,monospace"; c.textAlign="center";
  const w=c.measureText(txt).width;
  c.fillStyle="rgba(10,7,3,.62)";
  c.fillRect(cx-w/2-3,cy-size*.82,w+6,size+3);
  c.fillStyle=col; c.fillText(txt,cx,cy);
}

/* ---- Главная отрисовка ---- */
function draw(){
  const w=cv._w,h=cv._h,z=view.z;
  g.clearRect(0,0,w,h);
  g.fillStyle="#100c08"; g.fillRect(0,0,w,h);

  // рельеф: растянутый буфер даёт мягкую акварельную заливку
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  g.drawImage(terrain, SX(0),SY(0), CFG.MAP*z, CFG.MAP*z);

  const x0=Math.max(0,Math.floor(view.x)-1), x1=Math.min(CFG.MAP,Math.ceil(view.x+w/z)+1);
  const y0=Math.max(0,Math.floor(view.y)-1), y1=Math.min(CFG.MAP,Math.ceil(view.y+h/z)+1);

  // кольца областей — чем ближе к сердцу, тем богаче земли
  g.save(); g.strokeStyle="rgba(226,196,133,.13)"; g.lineWidth=1; g.setLineDash([7,9]);
  for(let k=1;k<=4;k++){
    g.beginPath();
    g.arc(SX(CFG.MAP/2),SY(CFG.MAP/2),(CFG.MAP/2)*(k/5)*z,0,7); g.stroke();
  }
  g.restore();

  // сетка проступает только вблизи
  if(z>=13){
    g.strokeStyle="rgba(0,0,0,.16)"; g.lineWidth=1; g.beginPath();
    for(let x=x0;x<=x1;x++){ g.moveTo(Math.round(SX(x))+.5,SY(y0)); g.lineTo(Math.round(SX(x))+.5,SY(y1)) }
    for(let y=y0;y<=y1;y++){ g.moveTo(SX(x0),Math.round(SY(y))+.5); g.lineTo(SX(x1),Math.round(SY(y))+.5) }
    g.stroke();
  }
  // граница обжитого мира
  g.strokeStyle="rgba(226,196,133,.22)"; g.lineWidth=1.5;
  g.strokeRect(SX(0),SY(0),CFG.MAP*z,CFG.MAP*z);

  // объекты
  const cities=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.x<x0-2||o.x>x1+2||o.y<y0-2||o.y>y1+2) continue;
    const cx=SX(o.x)+z/2, cy=SY(o.y)+z/2;
    if(o.t==="node"){
      if(z<7){ g.fillStyle=RMAP[o.res]; const s=Math.max(2,z*.34);
        g.fillRect(cx-s/2,cy-s/2,s,s) }
      else glyph(g,o.res,cx,cy,z*(0.30+o.lv*0.055),RMAP[o.res]);
      if(z>=17) tagText(g,o.lv,cx,cy+z*.68,9,"rgba(236,226,202,.72)");
    } else if(o.t==="camp"||o.t==="fort"){
      if(z<6){ g.fillStyle=o.t==="fort"?"#8a6a3a":"#5f4d2c";
        g.fillRect(cx-z*.2,cy-z*.2,z*.4,z*.4) }
      else camp(g,cx,cy,z*(o.t==="fort"?.72:.55),o.t==="fort");
      if(z>=13) tagText(g,o.lv,cx,cy+z*.82,z>=20?11:9,
        o.t==="fort"?"#e8bd7a":"rgba(236,226,202,.8)");
    } else if(o.t==="city") cities.push(o);
  }

  // марши: линия туши, по ней ползёт восковая печать
  W.marches.forEach(m=>{
    const p=W.players.find(q=>q.id===m.pid); if(!p) return;
    const mine=!p.isBot;
    const from = m.state==="back" ? {x:m.tx,y:m.ty} : {x:m.x0,y:m.y0};
    const to   = m.state==="back" ? {x:p.x,y:p.y}   : {x:m.tx,y:m.ty};
    const a=marchPos(m);
    g.save();
    g.strokeStyle = mine?"rgba(238,206,130,.62)":"rgba(196,74,84,.55)";
    g.lineWidth=mine?1.9:1.5; g.setLineDash([5,6]); g.lineDashOffset=-(W.t*0.6)%11;
    g.beginPath(); g.moveTo(SX(from.x)+z/2,SY(from.y)+z/2);
    g.lineTo(SX(to.x)+z/2,SY(to.y)+z/2); g.stroke();
    g.restore();
    const px=SX(a.x)+z/2, py=SY(a.y)+z/2, rr=Math.max(3,z*.24);
    g.fillStyle=mine?"#c2993c":"#8f2f38";
    g.beginPath(); g.arc(px,py,rr,0,7); g.fill();
    g.strokeStyle="rgba(0,0,0,.5)"; g.lineWidth=1; g.stroke();
    g.strokeStyle=mine?"rgba(255,236,190,.75)":"rgba(255,190,190,.6)";
    g.lineWidth=Math.max(1,rr*.28);
    g.beginPath(); g.moveTo(px-rr*.4,py); g.lineTo(px+rr*.4,py);
    g.moveTo(px,py-rr*.4); g.lineTo(px,py+rr*.4); g.stroke();
  });

  // города рисуем поверх всего
  cities.forEach(o=>{
    const p=W.players.find(q=>q.id===o.pid); if(!p) return;
    const cx=SX(o.x)+z/2, cy=SY(o.y)+z/2;
    const scale=z*(0.62+citySize(p.b.hall)*0.14);
    const own=!p.isBot;
    g.save();
    g.shadowColor="rgba(0,0,0,.65)"; g.shadowBlur=z*.35; g.shadowOffsetY=z*.08;
    shield(g,cx,cy,scale*.8,scale,TINCT[p.race],own?GILT_HI:"rgba(0,0,0,.55)",own?1.8:1.1);
    g.restore();
    if(own){                                  // своё знамя на древке
      g.strokeStyle=GILT_HI; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(cx,cy-scale*.5); g.lineTo(cx,cy-scale*1.15); g.stroke();
      g.fillStyle=GILT_HI;
      g.beginPath(); g.moveTo(cx,cy-scale*1.15); g.lineTo(cx+scale*.5,cy-scale*1.0);
      g.lineTo(cx,cy-scale*.85); g.closePath(); g.fill();
    }
    if(W.t<p.shieldUntil){                    // щит мира — стеклянный купол
      g.strokeStyle="rgba(122,178,224,.85)"; g.lineWidth=1.4;
      g.beginPath(); g.arc(cx,cy,scale*.95,Math.PI,0); g.stroke();
      g.strokeStyle="rgba(122,178,224,.3)";
      g.beginPath(); g.arc(cx,cy,scale*.95,0,Math.PI); g.stroke();
    }
    if(z>=10){
      g.font="500 "+Math.min(13,Math.max(10,z*.42))+"px "+FONT;
      g.textAlign="center";
      const label=p.name;
      const tw=g.measureText(label).width;
      g.fillStyle="rgba(12,8,4,.6)";
      g.fillRect(cx-tw/2-4,cy+scale*.62,tw+8,15);
      g.fillStyle=own?GILT_HI:"rgba(236,226,202,.82)";
      g.fillText(label,cx,cy+scale*.62+11);
    }
  });

  // прицел под курсором и выбранная клетка
  if(hover&&!drag){
    g.strokeStyle="rgba(226,194,115,.4)"; g.lineWidth=1;
    g.strokeRect(Math.round(SX(hover.x))+.5,Math.round(SY(hover.y))+.5,z,z);
  }
  if(sel){
    const sx=SX(sel.x), sy=SY(sel.y), c=z*.34;
    g.strokeStyle=GILT_HI; g.lineWidth=1.8;
    g.beginPath();
    g.moveTo(sx,sy+c); g.lineTo(sx,sy); g.lineTo(sx+c,sy);
    g.moveTo(sx+z-c,sy); g.lineTo(sx+z,sy); g.lineTo(sx+z,sy+c);
    g.moveTo(sx+z,sy+z-c); g.lineTo(sx+z,sy+z); g.lineTo(sx+z-c,sy+z);
    g.moveTo(sx+c,sy+z); g.lineTo(sx,sy+z); g.lineTo(sx,sy+z-c);
    g.stroke();
  }
  compass(w,h); scaleBar(w,h);
}

/* ---- Роза ветров и масштабная линейка ---- */
function compass(w,h){
  const cx=w/2, cy=34, R=17;
  g.save(); g.translate(cx,cy);
  g.strokeStyle="rgba(226,196,133,.42)"; g.lineWidth=1.2;
  g.beginPath(); g.arc(0,0,R,0,7); g.stroke();
  g.beginPath(); g.arc(0,0,R*.62,0,7); g.stroke();
  for(let i=0;i<4;i++){
    g.rotate(Math.PI/2);
    g.fillStyle=i===3?"rgba(240,212,140,.95)":"rgba(226,196,133,.5)";
    g.beginPath(); g.moveTo(0,-R); g.lineTo(R*.19,0); g.lineTo(0,R*.2); g.lineTo(-R*.19,0);
    g.closePath(); g.fill();
  }
  g.restore();
  g.fillStyle="rgba(226,194,115,.7)"; g.textAlign="center";
  g.font="10px "+FONT;
  g.fillText("С",cx,cy-R-5);
}
function scaleBar(w,h){
  const target=110, cells=Math.max(1,Math.round(target/view.z)), px=cells*view.z;
  const x=w/2-px/2, y=h-24;
  g.strokeStyle="rgba(226,196,133,.4)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(x,y-4); g.lineTo(x,y); g.lineTo(x+px,y); g.lineTo(x+px,y-4); g.stroke();
  g.fillStyle="rgba(226,196,133,.55)"; g.textAlign="center";
  g.font="10px ui-monospace,monospace";
  g.fillText(cells+" клеток",x+px/2,y-8);
}

/* ---- Миникарта ---- */
function drawMini(){
  const w=mini._w,h=mini._h,s=Math.min(w,h)/CFG.MAP;
  mg.clearRect(0,0,w,h);
  mg.imageSmoothingEnabled=true;
  // рельеф в таком масштабе почти чёрный — вытягиваем яркость
  mg.filter="brightness(1.75) contrast(1.1) saturate(1.15)";
  mg.drawImage(terrain,0,0,w,h);
  mg.filter="none";
  mg.strokeStyle="rgba(226,196,133,.3)"; mg.lineWidth=1; mg.strokeRect(.5,.5,w-1,h-1);
  W.players.forEach(p=>{
    const x=p.x*s, y=p.y*s, own=!p.isBot;
    mg.beginPath(); mg.arc(x,y,own?4:3,0,7);
    mg.fillStyle="rgba(0,0,0,.55)"; mg.fill();
    mg.beginPath(); mg.arc(x,y,own?2.8:2,0,7);
    mg.fillStyle=TINCT[p.race]; mg.fill();
    if(own){ mg.strokeStyle=GILT_HI; mg.lineWidth=1.4; mg.stroke() }
  });
  mg.strokeStyle="rgba(226,194,115,.85)"; mg.lineWidth=1;
  mg.strokeRect(view.x*s,view.y*s,(cv._w/view.z)*s,(cv._h/view.z)*s);
}

/* =========================================================================
   ПАНЕЛИ. Правая колонна — канцелярская книга похода: рубрики, записи,
   цены эмалевыми точками, цифры моноширинно.
   ========================================================================= */
function shieldSvg(race,w){
  return "<svg class='shield' viewBox='0 0 12 15' style='width:"+(w||13)+"px'>"+
    "<path d='M1 1h10v8.2C11 12 6 14 6 14S1 12 1 9.2Z' fill='"+TINCT[race]+
    "' stroke='#c2993c' stroke-width='.8'/></svg>";
}
function ring(lv,max){
  const f=Math.min(1,lv/(max||25)), C=2*Math.PI*14;
  return "<div class='ring'><svg viewBox='0 0 34 34'>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#3d3121' stroke-width='2.5'/>"+
    "<circle cx='17' cy='17' r='14' fill='none' stroke='#c2993c' stroke-width='2.5'"+
    " stroke-dasharray='"+(C*f).toFixed(1)+" "+C.toFixed(1)+"' stroke-linecap='butt'/>"+
    "</svg><b>"+lv+"</b></div>";
}
function priceRow(p,c){
  const out=RES.filter(r=>c[r]).map(r=>{
    const short=p.res[r]<c[r];
    return "<span class='"+(short?"short":"")+"' style='--c:"+RSHADE[r]+
      "' title='"+RES_NAME[r]+"'>"+fmt(c[r])+"</span>";
  }).join("");
  return out?"<div class='price'>"+out+"</div>":"";
}
function rubric(text,note){
  return "<div class='rubric'>"+text+(note?"<span class='n'>"+note+"</span>":"")+"</div>";
}
function hollow(mark,text){
  return "<div class='hollow'><span class='big'>"+mark+"</span>"+text+"</div>";
}

/* ---- Верхняя строка: кошель и хроника ---- */

/* ---- Картуш: что выбрано на карте ---- */
let lastCart="";
function renderCartouche(){
  const el=$("#cartouche");
  const put=h=>{ if(h!==lastCart){ lastCart=h; el.innerHTML=h } };
  if(!sel){ put("<div class='hd'>Штабной стол</div>"+
      "<div class='hint'>Выберите клетку на чертеже, чтобы рассмотреть её.</div>"); return }

      "<div class='hint'>Ни поселений, ни припасов. Земля ждёт хозяина.</div>"); return;
  }
  if(o.t==="node"){
    put("<div class='hd'>"+RES_NAME[o.res]+" "+coord+"</div>"+

      "<div class='co'><span>Расстояние</span><b>"+Math.round(dist(p,o))+" кл.</b></div>"+
      "<button class='seal wide' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Выслать обоз</button>");
    return;
  }
  if(o.t==="camp"||o.t==="fort"){
    const fp=banditPower(o.lv), my=armyPower(p.troops,bonuses(p),p.race);
    const ok = my>fp*1.8?["Разгром без потерь","var(--verdigris)"]
             : my>fp*1.1?["Победа с потерями","var(--gilt)"]
             : my>fp*0.8?["Исход не ясен","var(--gilt)"]
             : ["Отряд поляжет","var(--garnet)"];
    put("<div class='hd'>"+(o.t==="fort"?"Форт":"Лагерь")+" разбойников "+coord+"</div>"+
      "<div class='co'><span>Уровень</span><b>"+o.lv+"</b></div>"+
      "<div class='co'><span>Сила заставы</span><b>"+fmt(fp)+"</b></div>"+
      "<div class='co'><span>Ваше войско</span><b>"+fmt(my)+"</b></div>"+
      "<div class='co'><span>Прогноз</span><b style='color:"+ok[1]+"'>"+ok[0]+"</b></div>"+
      "<button class='seal wide' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Выступить</button>");
    return;
  }
  if(o.t==="city"){
    const q=W.players.find(z=>z.id===o.pid);
    if(!q){ put("<div class='hd'>Руины</div>"); return }
    const own=q.id===p.id;
    let scout="";
    if(!own){
      const sl=p.b.scout||0;
      if(sl<=0) scout="<div class='hint'>Постройте "+buildingName("scout",p).toLowerCase()+", чтобы узнать состав войск.</div>";
      else {
        const se=epochOf(sl), total=countUnits(q.troops);
        if(se===1){
          scout="<div class='co'><span>Войск (примерно)</span><b>~"+fmt(Math.round(total/100)*100)+"</b></div>";
        } else if(se===2){
          scout="<div class='co'><span>Войск (точно)</span><b>"+RU(total)+"</b></div>";
        } else if(se===3){
          scout=TKEYS.map(t=>{
            const n=Object.values(q.troops[t]).reduce((a,b)=>a+b,0);
            return "<div class='co'><span>"+TROOP_TYPES[t].name+"</span><b>"+RU(n)+"</b></div>";
          }).join("");
        } else {
          scout=TKEYS.map(t=>{
            const parts=[]; for(let i=1;i<=5;i++) if(q.troops[t][i]) parts.push(unitName(t,i,q.race)+" ×"+RU(q.troops[t][i]));
            return parts.length?"<div class='co' style='display:block'><span>"+TROOP_TYPES[t].name+"</span><b style='display:block;text-align:left;font-size:11px'>"+parts.join(", ")+"</b></div>":"";
          }).join("");
          if(se===5){
            scout+="<div class='co'><span>Полководец</span><b>"+GENERALS[q.race][q.gen.id||0].name+"</b></div>"+
              "<div class='co'><span>Стена / гарнизон</span><b>"+q.b.wall+" / "+q.b.garrison+"</b></div>";
          }
        }
      }
    }
    put("<div class='hd'>"+shieldSvg(q.race,14)+q.name+" "+coord+"</div>"+
      "<div class='co'><span>Знамя</span><b>"+RACES[q.race].name+"</b></div>"+
      "<div class='co'><span>Ратуша</span><b>"+q.b.hall+" · эпоха "+epochOf(q.b.hall)+"</b></div>"+
      "<div class='co'><span>Сила</span><b>"+fmt(power(q))+"</b></div>"+
      scout+
      (own?"<div class='hint'>Ваша столица.</div>"
          :(W.t<q.shieldUntil
            ?"<div class='hint' style='color:#7ab2e0'>Под щитом мира ещё "+fmtDur(q.shieldUntil-W.t)+".</div>"
            :"<button class='seal wide blood' style='margin-top:9px' data-act='march' data-x='"+o.x+"' data-y='"+o.y+"'>Идти войной</button>")));
  }
}

/* ---- Город ---- */
function cityCellLevel(p,c){
  if(!c.bk) return -1; // задел на будущее, не активна
  return c.pl!=null ? p.b[c.bk][c.pl] : p.b[c.bk];
}
function cityCellImg(c){
  return c.bk ? "images/buildings/"+c.bk+(c.pl!=null?(c.pl+1):"")+".png" : "";
}
function renderCityMap(){
  const p=me();
  let h="<div id='citymap-wrap'><img class='base' src='map.jpg'>";
  CITY_CELLS.forEach(c=>{
    const lv=cityCellLevel(p,c);
    if(c.bk===null){ // Портал — задел на будущее
      h+="<div class='cbuild locked' style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
         "<div class='shape' style='"+cityShapeCss(c)+"'></div></div>";
      return;
    }
    const built=lv>0, locked=c.bk!=="hall" && !built && (c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall));
    h+="<div class='cbuild"+(built?" built":"")+(locked?" locked":"")+"' data-cell='"+CITY_CELLS.indexOf(c)+"' "+
       "style='left:"+c.x+"%;top:"+c.y+"%;width:"+c.w+"%;height:"+c.h+"%'>"+
       "<div class='shape' style='"+cityShapeCss(c)+"'></div>"+
       (built?"<img class='bimg' src='"+cityCellImg(c)+"'>"+"<span class='lvl'>"+lv+"</span>":"")+
       "</div>";
  });
  h+="</div>";
  return h;
}
function buildingModalHtml(ci){
  const p=me(), c=CITY_CELLS[ci];
  if(!c||!c.bk) return "";
  const lv=cityCellLevel(p,c), nx=lv+1, maxed=lv>=CFG.MAX_LEVEL;
  let gated=c.bk!=="hall"&&nx>p.b.hall, gateTxt=gated?"нужна ратуша "+nx:"";
  if(c.bk==="hall"){ const need=HALL_REQ.filter(k=>p.b[k]<p.b.hall);
    if(need.length){ gated=true; gateTxt="сначала "+need.map(k=>buildingName(k,p).toLowerCase()+" до "+p.b.hall+" ур.").join(", "); } }
  const locked=c.pl!=null && !plotUnlocked(c.bk,c.pl,p.b.hall);
  if(locked){ gated=true; gateTxt="откроется на эпохе "+(c.pl+1); }
  const cst=buildCost(nx,p), canGo=!maxed&&!gated;
  const img=cityCellImg(c);
  const desc=(BUILDINGS[c.bk]&&BUILDINGS[c.bk].desc)||"";
  let h="<img id=\'bm-art\' src=\'"+img+"\'>";
  h+="<div id=\'bm-title\'>"+buildingName(c.bk,p)+(c.pl!=null?" · участок "+(c.pl+1):"")+"</div>";
  h+="<div id=\'bm-sub\'>уровень "+lv+(maxed?" (максимум)":" &rarr; "+nx)+"</div>";
  if(desc) h+="<div id=\'bm-desc\'>"+desc+"</div>";
  if(canGo){
    h+="<div id=\'bm-reqs\'>"+RES.map(r=>{
      const need=cst[r]||0; if(!need) return "";
      const short=p.res[r]<need;
      return "<div class=\'req-row\'><img src=\'images/ui/res-"+r+".png\'>"+
        "<span class=\'req-name\'>"+RES_NAME[r]+"</span>"+
        "<span class=\'req-amt"+(short?" short":"")+"\'>"+fmt(need)+" / "+fmt(p.res[r])+"</span></div>";
    }).join("")+"</div>";
    h+="<div id=\'bm-time\'>Время строительства: "+fmtDur(buildTime(nx)/bonuses(p).build)+"</div>";
  } else if(gated){
    h+="<div id=\'bm-time\'>"+gateTxt+"</div>";
  }
  const actionLabel = lv<=0?"Построить":"Улучшить";
  h+="<button id=\'bm-btn\' data-act=\'build\' data-b=\'"+c.bk+"\' "+(c.pl!=null?"data-plot=\'"+c.pl+"\' ":"")+
     (canGo?"":"disabled")+">"+(maxed?"Предел уровня":canGo?actionLabel:"Недоступно")+"</button>";
  return h;
}

function foCity(){
  const p=me(); syncRes(p);
  const B=bonuses(p), cap=capacity(p), inField=W.marches.filter(m=>m.pid===p.id).length;
  let h=rubric("Столица","эпоха "+epochOf(p.b.hall)+" из 5");
  h+=renderCityMap();
  h+="<div class='entry hot'><div class='line'>"+
     "<div style='flex:0 0 auto'>"+shieldSvg(p.race,26)+"</div><div class='fill'>"+
     "<div class='title'>"+RACES[p.race].name+"<span class='tag gilt'>"+
     citySize(p.b.hall)+"×"+citySize(p.b.hall)+"</span></div>"+
     "<div class='note'>"+RACES[p.race].desc+"</div></div></div>"+
     "<table class='roll' style='margin-top:9px'>"+
     "<tr><td>Войск в столице</td><td>"+RU(garrison(p))+"</td></tr>"+
     "<tr><td>Отрядов в поле</td><td>"+inField+" из "+marchSlots(p.b.hall)+"</td></tr>"+
     "<tr><td>Вместимость марша</td><td>"+fmt(marchCapacity(p))+"</td></tr>"+
     "<tr><td>Хранилище</td><td>"+RES.map(r=>fmt(cap[r])).join(" · ")+"</td></tr>"+
     "<tr><td>Доступный тир</td><td>"+TKEYS.map(t=>TROOP_TYPES[t].name+" T"+tierUnlockedFor(p,t)).join(" · ")+"</td></tr></table></div>";

  h+=rubric("Черты расы");
  const epoch=epochOf(p.b.hall), track=RACE_EPOCHS[p.race], minus=RACES[p.race].minus;
  h+="<div class='entry war'><div class='line'><div class='fill'>"+
     "<div class='title'>Природа расы<span class='tag'>всегда</span></div>"+
     "<div class='note'>"+minus.desc+"</div></div></div></div>";
  track.forEach((e,i)=>{
    const unlocked=i<epoch;
    h+="<div class='entry"+(unlocked?" hot":"")+"'><div class='line'><div class='fill'>"+
       "<div class='title'>"+e.title+"<span class='tag"+(unlocked?" gilt":"")+"'>эпоха "+(i+1)+
       (unlocked?" · открыто":" · закрыто")+"</span></div>"+
       "<div class='note'>"+e.desc+"</div></div></div></div>";
  });

  h+=rubric("Строительные бригады");
  p.queues.forEach((q,i)=>{
    if(q){ const f=(W.t-q.t0)/Math.max(1,q.t1-q.t0);
      h+="<div class='entry hot'><div class='line'>"+ring(q.lv,CFG.MAX_LEVEL)+"<div class='fill'>"+
        "<div class='title'>"+buildingName(q.b,p)+"</div>"+
        "<div class='note'>Готово через <em>"+fmtDur(q.t1-W.t)+"</em></div></div></div>"+
        "<div class='progress'><i style='width:"+(f*100).toFixed(1)+"%'></i></div></div>";
    } else h+="<div class='entry'><div class='note' style='margin:0'>Бригада "+(i+1)+" ждёт распоряжений</div></div>";
  });

  h+=rubric("Постройки");
  for(const bk of BKEYS){
    const Bd=BUILDINGS[bk], plotsN = isMulti(bk) ? p.b[bk].length : 1;
    for(let pi=0; pi<plotsN; pi++){
      const locked = isMulti(bk) && !plotUnlocked(bk,pi,p.b.hall);
      const lv = isMulti(bk) ? p.b[bk][pi] : p.b[bk], nx=lv+1;
      const maxed=lv>=CFG.MAX_LEVEL;
      let gated=bk!=="hall"&&nx>p.b.hall, gateTxt=gated?"нужна ратуша "+nx:"";
      if(bk==="hall"){ const need=HALL_REQ.filter(k=>p.b[k]<p.b.hall);
        if(need.length){ gated=true; gateTxt="ждёт: "+need.map(k=>buildingName(k,p).toLowerCase()).join(", ") } }
      if(locked){ gated=true; gateTxt="откроется на эпохе "+(pi+1); }
      let note="";
      if(Bd.prod) note="Даёт <em>"+fmt(prodRate(lv)*(1+lateSpeed(lv))*({food:1.25,wood:1.25,stone:.9,gold:.5}[Bd.prod]))+"</em> в час"+
        (lv>0?" · защищает <em>"+fmt(plotCap(lv))+"</em>":"");
      else if(bk==="store") note="Вмещает <em>"+fmt(storeCap(lv))+"</em>";
      else if(bk==="hospital") note="Коек: <em>"+fmt(hospitalCap(lv))+"</em>";
      else if(bk==="academy") note = lv<=0?"Пока не построена":"Тиры и статы войск — через исследования ниже";
      else if(bk==="wall"){ syncWall(p);
        note="Оборона <em>+"+(lv*3)+"%</em> · прочность <em>"+fmt(Math.round(p.wallHp))+"</em> из "+fmt(maxWallHp(lv));
      }
      else if(bk==="garrison") note = lv<=0?"Пока не построен"
        :"Бьёт атакующих залпом до общей схватки (<em>"+fmt(lv*900)+"</em> урона), плюс защита стены +"+Math.round(lv*1.5)+"%, тревога за <em>"+fmtDur(Math.min(lv*60,3600))+"</em> до удара";
      else if(bk==="scout"){ const se=epochOf(lv);
        note = lv<=0?"Пока не построена"
          : se===1?"Видно примерную силу войск"
          : se===2?"Видно точную общую численность"
          : se===3?"Видно состав войск по родам"
          : se===4?"Видно точный состав войск по тирам"
          : "Видно тиры, плюс полководец и уровень стены/гарнизона";
      }
      else if(bk==="forge") note = lv<=0?"Пока не построен"
        :"Уровень готов принять ковку снаряжения — сама ковка появится отдельно";
      else if(Bd.train) note="Готовит: "+TROOP_TYPES[Bd.train].name;
      else if(bk==="hall") note="Отрядов <em>"+marchSlots(lv)+"</em>, эпоха <em>"+epochOf(lv)+"</em>";
      const c=buildCost(nx,p), plotLabel = isMulti(bk) ? " · участок "+(pi+1) : "";
      h+="<div class='entry'><div class='line'>"+ring(lv,CFG.MAX_LEVEL)+"<div class='fill'>"+
        "<div class='title'>"+buildingName(bk,p)+plotLabel+(bk==="hall"?"<span class='tag gilt'>основа</span>":"")+"</div>"+
        "<div class='note'>"+note+"</div>"+(maxed||locked?"":priceRow(p,c))+"</div>"+
        "<button class='seal' data-act='build' data-b='"+bk+"' "+(isMulti(bk)?"data-plot='"+pi+"' ":"")+
        (maxed||gated?"disabled":"")+">"+
        (maxed?"предел":gated?gateTxt:"Возвести")+"</button></div>"+
        (maxed||gated?"":"<div class='note' style='margin-top:5px;color:var(--vellum-faint)'>Срок работ: "+
          fmtDur(buildTime(nx)/B.build)+"</div>")+"</div>";
    }
  }

  const nodeEffectDesc=(n,lv,nx)=>{
    if(n.unlock) return lv>=1?"Открыто":"Откроет T"+n.unlock.tier;
    const list=n.effects||[{field:n.field,total:n.total}];
    const now=list.map(e=>"+"+Math.round(e.total*(lv/n.max)*100)+"% "+e.field).join(", ");
    const next=list.map(e=>"+"+Math.round(e.total*(nx/n.max)*100)+"% "+e.field).join(", ");
    return "сейчас <em>"+now+"</em>"+(lv>=n.max?"":" · дальше <em>"+next+"</em>");
  };
  const renderTree=(arr,label)=>{
    h+=rubric("Исследования: "+label,"академия ур. "+p.b.academy);
    arr.filter(n=>!n.race||n.race===p.race).forEach(n=>{
      const lv=p.tech[n.id]||0, maxed=lv>=n.max, nx=lv+1, gated=p.b.academy<=0;
      const locked = !!(n.unlock && n.unlock.tier>2 && !(p.tech["mil_tier_"+n.unlock.type+(n.unlock.tier-1)]>=1));
      const c = maxed||locked?null:researchCost(n.branch,n.wave,nx);
      h+="<div class='entry"+(lv>0?" hot":"")+"'><div class='line'><div class='fill'>"+
        "<div class='title'>"+n.name+(n.race?"<span class='tag gilt'>венец</span>":"")+
        "<span class='tag"+(maxed?" gilt":"")+"'>"+lv+"/"+n.max+"</span></div>"+
        "<div class='note'>"+nodeEffectDesc(n,lv,nx)+"</div>"+
        (maxed||gated||locked?"":priceRow(p,c))+"</div>"+
        "<button class='seal' data-act='research' data-id='"+n.id+"' "+(maxed||gated||locked||p.rsch?"disabled":"")+">"+
        (maxed?"предел":gated?"нужна академия":locked?"нужен пред. тир":"Исследовать")+"</button></div>"+
        (maxed||gated||locked?"":"<div class='note' style='margin-top:5px;color:var(--vellum-faint)'>Срок: "+
          fmtDur(researchTime(n.branch,n.wave,nx)/((1+B.researchSpeed)*(1+lateSpeed(p.b.academy))))+"</div>")+"</div>";
    });
  };
  if(p.rsch){
    const rn=findNode(p.rsch.id), rf=(W.t-p.rsch.t0)/Math.max(1,p.rsch.t1-p.rsch.t0);
    h+=rubric("Идёт исследование");
    h+="<div class='entry hot'><div class='line'><div class='fill'>"+
       "<div class='title'>"+rn.name+" → ур. "+p.rsch.lv+"</div>"+
       "<div class='note'>Готово через <em>"+fmtDur(p.rsch.t1-W.t)+"</em></div></div></div>"+
       "<div class='progress'><i style='width:"+(rf*100).toFixed(1)+"%'></i></div></div>";
  }
  renderTree(ACADEMY_TREE.eco,"Хозяйство");
  renderTree(ACADEMY_TREE.mil,"Армия");
  return h;
}

/* ---- Войско ---- */
function foArmy(){
  const p=me(); syncRes(p);
  const B=bonuses(p);
  let hurt=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++)hurt+=p.wounded[t][i]});
  let h=rubric("Смотр войск",fmt(armyPower(p.troops,B,p.race))+" силы");
  const rows=[];
  TKEYS.forEach(t=>{ for(let i=1;i<=5;i++){ const n=p.troops[t][i]; if(n)
    rows.push("<tr><td>"+unitName(t,i,p.race)+" · "+TROOP_TYPES[t].name.toLowerCase()+
      "</td><td>"+RU(n)+"</td></tr>") } });
  h+= rows.length ? "<div class='entry'><table class='roll'>"+rows.join("")+"</table></div>"
                  : hollow("&#9876;","В столице пусто. Наберите ополчение ниже.");

  if(hurt>0){
    const c=healCost(p);
    h+=rubric("Лазарет");
    h+="<div class='entry war'><div class='line'><div class='fill'>"+
      "<div class='title'>Раненых: "+RU(hurt)+"</div>"+
      "<div class='note'>Коек: <em>"+fmt(hospitalCap(p.b.hospital)*(1+B.hosp))+"</em>"+
      (B.heal<1?" · нежить поднимает своих втрое дешевле":"")+"</div>"+priceRow(p,c)+"</div>"+
      "<button class='seal' data-act='heal'>Поднять</button></div></div>";
  }

  h+=rubric("Набор");
  if(p.train){
    const f=(W.t-p.train.t0)/Math.max(1,p.train.t1-p.train.t0);
    h+="<div class='entry hot'><div class='line'><div class='fill'>"+
      "<div class='title'>"+unitName(p.train.type,p.train.tier,p.race)+
      "<span class='tag gilt'>×"+RU(p.train.n)+"</span></div>"+
      "<div class='note'>Готовы через <em>"+fmtDur(p.train.t1-W.t)+"</em></div></div></div>"+
      "<div class='progress'><i style='width:"+(f*100).toFixed(1)+"%'></i></div></div>";
  } else {
    TKEYS.forEach(t=>{
      const maxT=tierUnlockedFor(p,t);
      const bk={inf:"barracks",arc:"range",cav:"stable",sie:"siege"}[t];
      if(p.b[bk]<1){
        h+="<div class='entry'><div class='line'><div class='fill'><div class='title' style='color:var(--vellum-faint)'>"+
          TROOP_TYPES[t].name+"</div><div class='note'>Нужна постройка: "+buildingName(bk,p).toLowerCase()+
          "</div></div></div></div>"; return;
      }
      const c=troopCost(t,maxT);
      const can=Math.floor(Math.min.apply(null,RES.map(r=>c[r]?p.res[r]/c[r]:1e9)));
      const beats=TROOP_TYPES[t].beats;
      h+="<div class='entry'><div class='line'><div class='fill'>"+
        "<div class='title'>"+unitName(t,maxT,p.race)+"<span class='tag'>T"+maxT+"</span>"+
        (beats?"<span class='tag'>бьёт "+TROOP_TYPES[beats].name.toLowerCase()+"</span>":"<span class='tag'>"+(p.race==="undead"&&t==="sie"?"чудовище":"осада")+"</span>")+"</div>"+
        "<div class='note'>Атака <em>"+Math.round(troopStat(t,maxT,"atk")*troopMod(p.race,t,"atk"))+"</em> · защита <em>"+troopStat(t,maxT,"def")+
        "</em> · здоровье <em>"+troopStat(t,maxT,"hp")+"</em><br>Груз "+
        Math.round(TROOP_TYPES[t].load*TIER_MULT[maxT-1]*troopMod(p.race,t,"load"))+" · шаг "+(TROOP_TYPES[t].speed*troopMod(p.race,t,"speed")).toFixed(2)+
        " · по средствам <em>"+fmt(can)+"</em></div>"+priceRow(p,c)+"</div>"+
        "<button class='seal' data-act='train' data-t='"+t+"' data-tier='"+maxT+"' "+
        (can<1?"disabled":"")+">Набрать</button></div></div>";
    });
  }

  h+=rubric("Отряды в поле",W.marches.filter(m=>m.pid===p.id).length+" из "+marchSlots(p.b.hall));
  const mine=W.marches.filter(m=>m.pid===p.id);
  if(!mine.length) h+=hollow("&#9906;","Все войска дома. Выберите цель на чертеже.");
  mine.forEach(m=>{
    const st={go:"в пути",gather:"собирает",back:"возвращается"}[m.state]||m.state;
    const load=m.carry?RES.filter(r=>m.carry[r]>0).map(r=>RES_NAME[r]+" "+fmt(m.carry[r])).join(", "):"";
    h+="<div class='entry "+(m.state==="back"?"calm":"hot")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>"+RU(countUnits(m.units))+" воинов<span class='tag'>"+st+"</span></div>"+
      "<div class='note'>Цель "+m.tx+" · "+m.ty+" — <em>"+fmtDur(m.t1-W.t)+"</em>"+
      (load?"<br>Везут: "+load:"")+"</div></div>"+
      (m.state!=="back"?"<button class='seal blood' data-act='recall' data-m='"+m.id+"'>Отозвать</button>":"")+
      "</div></div>";
  });
  return h;
}

/* ---- Генерал ---- */
function findTalentNode(id){
  for(const bk in TALENTS) for(const n of TALENTS[bk].nodes) if(n.id===id) return n;
  for(const bk in GENERAL_TREE) for(const n of GENERAL_TREE[bk].nodes) if(n.id===id) return n;
  return null;
}
function genStats(p){
  const lv=p.gen.lv, B=bonuses(p), g=Math.pow(lv,1.15);   // рост ускоряется с уровнем, не линейно
  const gear=gearBonus(p);
  return {
    hp:  Math.round((100+12*g)*(1+B.genHpMod))+gear.hp,
    atk: Math.round((20+3.2*g)*(1+B.genAtkMod))+gear.atk,
    def: Math.round((15+2.4*g)*(1+B.genDefMod))+gear.def,
  };
}
function foGen(){
  const p=me();
  if(p.gen.id==null){
    let h=rubric("Выбор полководца","решение окончательное");
    GENERALS[p.race].forEach((g,i)=>{
      h+="<div class='entry hot'><div class='line'><div style='flex:0 0 auto'>"+shieldSvg(p.race,26)+"</div><div class='fill'>"+
        "<div class='title'>"+g.name+"<span class='tag gilt'>"+g.role+"</span></div>"+
        "<div class='note'>"+g.bonus+"</div></div></div>"+
        "<button class='seal' data-act='pickgen' data-id='"+i+"'>Выбрать</button></div>";
    });
    return h;
  }
  const G=genOf(p), B=bonuses(p), S=genStats(p);
  const need=genXpNeed(p.gen.lv), f=p.gen.xp/need, lvCap=Math.min(60,epochOf(p.b.hall)*12);
  let h=rubric("Полководец");
  h+="<div class='entry hot'><div class='line'>"+ring(p.gen.lv,60)+"<div class='fill'>"+
    "<div class='title'>"+G.name+"<span class='tag gilt'>"+G.role+"</span></div><div class='note'>"+G.bonus+
    (p.gen.pts>0?" · <em>очков к раздаче: "+p.gen.pts+"</em>":"")+
    (p.gen.lv>=lvCap&&lvCap<60?" · потолок эпохи: "+lvCap:"")+"</div></div></div>"+
    "<div class='progress'><i style='width:"+(f*100).toFixed(1)+"%'></i></div>"+
    "<div class='note' style='margin-top:5px'>Опыт "+RU(p.gen.xp)+" из "+RU(need)+
    " — берётся с разбойничьих застав.</div></div>";

  h+=rubric("Личные статы","участвует в бою наравне с войском");
  h+="<div class='entry'><table class='roll'>"+
    "<tr><td>Здоровье</td><td>"+RU(S.hp)+"</td></tr>"+
    "<tr><td>Атака</td><td>"+RU(S.atk)+"</td></tr>"+
    "<tr><td>Защита</td><td>"+RU(S.def)+"</td></tr></table></div>";

  h+=rubric("Итог бонусов");
  h+="<div class='entry'><table class='roll'>"+
    "<tr><td>Атака войск</td><td class='"+(B.atk>0?"good":"")+"'>"+(B.atk>=0?"+":"")+(B.atk*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Защита войск</td><td class='"+(B.def<0?"bad":B.def>0?"good":"")+"'>"+(B.def>=0?"+":"")+(B.def*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Здоровье войск</td><td class='"+(B.hp>0?"good":"")+"'>+"+(B.hp*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Скорость марша</td><td>×"+B.march.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость стройки</td><td>×"+B.build.toFixed(2)+"</td></tr>"+
    "<tr><td>Скорость сбора</td><td>+"+(B.gather*100).toFixed(0)+"%</td></tr>"+
    "<tr><td>Поднятие павших</td><td class='"+(B.raise>0?"good":"")+"'>"+(B.raise*100).toFixed(0)+"%</td></tr>"+
    "</table></div>";

  for(const bk in GENERAL_TREE){
    const br=GENERAL_TREE[bk];
    let spent=0; br.nodes.forEach(n=>spent+=(p.gen.tal[n.id]||0));
    const totalMax=br.nodes.reduce((a,n)=>a+n.max,0);
    h+=rubric("Личное дерево: "+br.name, spent+" из "+totalMax);
    br.nodes.forEach(n=>{
      const v=p.gen.tal[n.id]||0, full=v>=n.max;
      h+="<div class='entry"+(v>0?" hot":"")+"'><div class='line'><div class='fill'>"+
        "<div class='title'>"+n.name+"<span class='tag"+(full?" gilt":"")+"'>"+v+"/"+n.max+"</span></div>"+
        "<div class='note'>"+n.txt+" · сейчас <em>+"+(v*n.per*100).toFixed(0)+"%</em></div></div>"+
        "<button class='seal' data-act='tal' data-id='"+n.id+"' "+
        (p.gen.pts<=0||full?"disabled":"")+">Вложить</button></div></div>";
    });
  }

  for(const bk in TALENTS){
    const br=TALENTS[bk];
    let spent=0; br.nodes.forEach(n=>spent+=(p.gen.tal[n.id]||0));
    h+=rubric(br.name, spent+" из 25");
    br.nodes.forEach(n=>{
      const v=p.gen.tal[n.id]||0, full=v>=5;
      h+="<div class='entry"+(v>0?" hot":"")+"'><div class='line'><div class='fill'>"+
        "<div class='title'>"+n.name+"<span class='tag"+(full?" gilt":"")+"'>"+v+"/5</span></div>"+
        "<div class='note'>"+n.txt+" · сейчас <em>+"+(v*n.per*100).toFixed(0)+"%</em></div></div>"+
        "<button class='seal' data-act='tal' data-id='"+n.id+"' "+
        (p.gen.pts<=0||full?"disabled":"")+">Вложить</button></div></div>";
    });
  }
  return h;
}

function foInv(){
  const p=me();
  let h="";
  h+=rubric("Снаряжение","горн ур. "+p.b.forge);
  if(p.craft){
    const cf=(W.t-p.craft.t0)/Math.max(1,p.craft.t1-p.craft.t0);
    const title = p.craft.kind==="material" ? MATERIALS[p.craft.mat].name+" ×"+p.craft.n
                : GEAR_NAMES[p.craft.slot][p.craft.order][p.craft.rarity-1];
    h+="<div class='entry hot'><div class='line'><div class='fill'>"+
       "<div class='title'>"+title+"</div><div class='note'>Готово через <em>"+fmtDur(p.craft.t1-W.t)+"</em></div></div></div>"+
       "<div class='progress'><i style='width:"+(cf*100).toFixed(1)+"%'></i></div></div>";
  }
  const curRarity=Math.min(5,epochOf(p.b.hall));
  const statTxt=st=>Object.keys(st).map(k=>({atk:"атк",def:"защ",hp:"хп"}[k]+" +"+st[k])).join(", ");
  GEAR_SLOTS.forEach(s=>{
    const it=p.gear[s.id];
    h+="<div class='entry"+(it?" hot":"")+"'><div class='line'><div class='fill'>"+
      "<div class='title'>"+s.name+(it?"<span class='tag gilt'>"+RARITY_NAMES[it.rarity-1]+"</span>":"")+"</div>"+
      "<div class='note'>"+(it?GEAR_NAMES[s.id][it.order][it.rarity-1]+" · "+statTxt(gearItemStats(s.cat,it.order,it.rarity))
        :"пусто")+"</div></div>"+
      (it?"<button class='seal' data-act='unequip' data-slot='"+s.id+"'>Снять</button>":"")+"</div>";
    ["bastion","storm"].forEach(order=>{
      for(let r=1;r<=5;r++){
        const cnt=p.inventory[s.id][order][r-1]||0; if(!cnt) continue;
        h+="<div class='entry'><div class='line'><div class='fill'>"+
          "<div class='title'>"+GEAR_NAMES[s.id][order][r-1]+"<span class='tag'>×"+cnt+"</span></div>"+
          "<div class='note'>склад · "+statTxt(gearItemStats(s.cat,order,r))+"</div></div>"+
          "<button class='seal' data-act='equip' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Надеть</button>"+
          "<button class='seal' data-act='dismantle' data-slot='"+s.id+"' data-order='"+order+"' data-rarity='"+r+"'>Разобрать</button></div>";
      }
    });
    const haveMat=(p.materials[s.mat][curRarity-1]||0)>=1;
    h+="<div class='entry'><div class='line'><div class='fill'>"+
      "<div class='title'>Сковать "+RARITY_NAMES[curRarity-1].toLowerCase()+"</div>"+
      "<div class='note'>нужен материал: "+MATERIALS[s.mat].name+" ("+RARITY_NAMES[curRarity-1]+")</div></div>"+
      "<button class='seal' data-act='craft' data-slot='"+s.id+"' data-order='bastion' data-rarity='"+curRarity+"' "+
      (p.craft||!haveMat?"disabled":"")+">Бастион</button>"+
      "<button class='seal' data-act='craft' data-slot='"+s.id+"' data-order='storm' data-rarity='"+curRarity+"' "+
      (p.craft||!haveMat?"disabled":"")+">Буря</button></div></div>";
  });

  h+=rubric("Материалы","добываются и сливаются в горне");
  Object.keys(MATERIALS).forEach(mat=>{
    const stock=p.materials[mat];
    h+="<div class='entry'><div class='line'><div class='fill'>"+
      "<div class='title'>"+MATERIALS[mat].name+"</div>"+
      "<div class='note'>"+RARITY_NAMES.map((rn,i)=>rn.slice(0,3)+": "+(stock[i]||0)).join(" · ")+"</div></div>"+
      "<button class='seal' data-act='matprod' data-mat='"+mat+"' "+(p.craft?"disabled":"")+">Добыть</button></div>"+
      "<div class='line' style='margin-top:6px'>"+[0,1,2,3].map(t=>
        "<button class='seal' data-act='matup' data-mat='"+mat+"' data-tier='"+t+"' "+
        ((stock[t]||0)<4?"disabled":"")+" style='margin-right:4px'>4×"+RARITY_NAMES[t].slice(0,3)+"→"+RARITY_NAMES[t+1].slice(0,3)+"</button>"
      ).join("")+"</div></div>";
  });

    return h;
}

    "</div></div></div>";
  CFG.SHIELD_COST.forEach((s,i)=>{
    h+="<div class='line' style='margin-top:7px'><div class='fill'><div class='note' style='margin:0'>"+
      fmtDur(s[0])+"</div><div class='price'><span class='"+(p.res.gold<s[1]?"short":"")+

    "<div class='title'>Перенос столицы</div>"+

    "<button class='seal' data-act='tp' "+(p.res.gold<tp?"disabled":"")+">Перенести</button></div></div>";

      "<div style='flex:0 0 auto;width:22px;text-align:center;font-family:var(--data);font-size:11px;color:var(--vellum-faint)'>"+
      (i+1)+"</div><div style='flex:0 0 auto'>"+shieldSvg(q.race,17)+"</div><div class='fill'>"+
      "<div class='title'>"+(own?"Ваш город":q.name)+
      (W.t<q.shieldUntil?"<span class='tag'>под щитом</span>":"")+"</div>"+
      "<div class='note'>"+RACES[q.race].name+" · ратуша "+q.b.hall+" · "+fmt(power(q))+
      (d?" · "+d+" кл.":"")+"</div>"+
      "<div class='progress' style='margin-top:6px'><i style='width:"+
      (power(q)/top*100).toFixed(1)+"%;background:"+TINCT[q.race]+"'></i></div></div>"+
      (own?"":"<button class='seal' data-act='look' data-x='"+q.x+"' data-y='"+q.y+"'>Найти</button>")+
      "</div></div>";
  });

  h+=rubric("Управление");
  h+="<div class='entry'><div class='line'>"+
    "<button class='seal' data-act='save'>Записать</button>"+
    "<button class='seal blood' data-act='reset'>Новый мир</button></div>"+
    "<div class='note' style='margin-top:8px'>Летопись пишется сама каждые двадцать секунд. "+
    "Мир не замирает, пока вкладка закрыта: при возвращении движок досчитывает пропущенное.</div></div>";

/* ---- Хроника ---- */
function foLog(){
  if(!W.log.length) return hollow("&#9998;","Летопись пока пуста.");
  return rubric("Летопись",W.log.length+" записей")+
    W.log.slice(0,90).map(e=>"<div class='chron-e "+(e.kind||"")+"'>"+
      "<div class='when'>день "+(Math.floor(e.t/86400)+1)+", "+
