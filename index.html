let buildingModalSel=-1;
function openBuildingModal(ci){
  trainCtx=null; carouselCtx=null; forgeTab=null; forgeRarity=null; researchCtx=null; healCarouselOpen=false; healCtx=null;
  buildingModalSel=ci;
  $("#bm-body").innerHTML = buildingModalHtml(ci);
  $("#building-modal").classList.add("open");
}
function closeBuildingModal(){ $("#building-modal").classList.remove("open"); buildingModalSel=-1; trainCtx=null; carouselCtx=null; researchCtx=null; healCarouselOpen=false; healCtx=null; }
$("#building-modal").addEventListener("click",e=>{ if(e.target.id==="building-modal") closeBuildingModal(); });
$("#building-modal").addEventListener("click",handleAct);
$("#building-modal").addEventListener("input",e=>{
  const s=e.target.id;
  if((s==="qty-range"||s==="qty-num")&&trainCtx){
    trainCtx.n=clamp(Math.round(+e.target.value||0),0,trainCtx.max);
    updateTrainSheet();
  } else if((s==="hqty-range"||s==="hqty-num")&&healCtx){
    healCtx.n=clamp(Math.round(+e.target.value||0),0,healCtx.max);
    updateHealSheet();
  }
});

/* ---- Витрина юнитов: все тиры листаются вправо-влево, обучение — прямо с той же карточки ---- */
let carouselCtx=null, trainCtx=null;
let healCtx=null, healCarouselOpen=false, lastHealFingerprint="";
function openUnitCarousel(type){
  const p=me(), maxT=tierUnlockedFor(p,type);
  carouselCtx={type}; researchCtx=null; healCarouselOpen=false; healCtx=null;
  buildingModalSel=-1;
  const max=trainMax(p,type,maxT);
  trainCtx={type,tier:maxT,mode:"train",max,n:max,lastLocked:!!p.train[type]||max<1};
  $("#bm-body").innerHTML = unitCarouselHtml();
  $("#building-modal").classList.add("open");
  updateTrainSheet();
  requestAnimationFrame(()=>{
    const track=$("#uc-track"), card=track&&track.querySelectorAll(".uc-card")[maxT-1];
    if(track&&card) track.scrollLeft = card.offsetLeft;
  });
}
function unitCardStatsHtml(p,type,tier){
  return "<table id='bm-stats'>"+
    "<tr><td>"+statIcon("atk")+"Атака</td><td>"+Math.round(troopStat(type,tier,"atk")*troopMod(p.race,type,"atk"))+"</td></tr>"+
    "<tr><td>"+statIcon("def")+"Защита</td><td>"+troopStat(type,tier,"def")+"</td></tr>"+
    "<tr><td>"+statIcon("hp")+"Здоровье</td><td>"+troopStat(type,tier,"hp")+"</td></tr>"+
    "<tr><td>"+statIcon("matk")+"Магическая атака</td><td>"+troopStat(type,tier,"magicAtk")+"</td></tr>"+
    "<tr><td>"+statIcon("mdef")+"Магическая защита</td><td>"+troopStat(type,tier,"magicDef")+"</td></tr>"+
    "<tr><td>"+statIcon("speed")+"Скорость</td><td>"+Math.round(TROOP_TYPES[type].speed*troopMod(p.race,type,"speed")*MARCH_SPEED_SCALE)+" кл/мин</td></tr>"+
    "<tr><td>"+statIcon("load")+"Грузоподъёмность</td><td>"+TROOP_TYPES[type].load+"</td></tr>"+
    "<tr><td><img class='stat-ico' src='images/ui/icon-power.png' alt=''>Мощь</td><td>"+unitPower(tier)+"</td></tr>"+
  "</table>";
}
function trainInlineHtml(){
  const p=me(), {type,tier,max,n,fromTier}=trainCtx, isRetrain=trainCtx.mode==="retrain";
  const busy=!!p.train[type], locked=busy||max<1;
  let h="<div id='bm-qty'><div class='cap'><span>Доступно максимум</span><b>"+RU(max)+"</b></div>"+
     "<div class='row'><input type='range' id='qty-range' min='0' max='"+max+"' value='"+n+"' "+(locked?"disabled":"")+">"+
     "<input type='number' id='qty-num' min='0' max='"+max+"' value='"+n+"' "+(locked?"disabled":"")+"></div></div>";
  if(busy){
    h+="<div id='bm-time'>Казармы заняты другим набором.</div>";
  } else if(max<1){
    h+="<div id='bm-time'>"+(isRetrain?"Нет воинов этого тира или не хватает ресурсов на переобучение.":"Не хватает ресурсов ни на одного воина.")+"</div>";
  } else {
    const c=isRetrain?retrainCost(type,fromTier,1):troopCost(type,tier);
    h+="<div id='bm-reqs'>"+RES.map(r=>{
      if(!c[r]) return "";
      return "<div class='req-row' data-r='"+r+"'><img src='images/ui/res-"+r+".png'>"+
        "<span class='req-name'>"+RES_NAME[r]+"</span><span class='req-amt'></span></div>";
    }).join("")+"</div>";
    h+="<div id='bm-time'></div>";
  }
  h+="<button id='bm-btn' class='uc-go' data-act='traingo' "+((busy||max<1||n<=0)?"disabled":"")+">"+(isRetrain?"Переобучить":"Обучить")+"</button>";
  return h;
}
function unitCarouselHtml(){
  const p=me(), type=carouselCtx.type, maxT=tierUnlockedFor(p,type);
  let h="<div id='bm-title'>"+TROOP_TYPES[type].name+"</div>";
  h+="<div id='uc-track'>";
  for(let tier=1; tier<=5; tier++){
    const locked=tier>maxT, have=p.troops[type][tier]||0;
    const active = trainCtx && trainCtx.type===type &&
      (trainCtx.mode==="train" ? trainCtx.tier===tier : trainCtx.fromTier===tier);
    h+="<div class='uc-card"+(locked?" locked":"")+"'>"+
      "<img class='uc-img' src='images/units/"+p.race+"-"+type+tier+".png' alt=''>"+
      "<div class='uc-name'>"+unitName(type,tier,p.race)+"</div>"+
      (locked?"<div class='uc-lock'>&#128274; чтобы обучить, нужно исследование в академии</div>":"")+
      unitCardStatsHtml(p,type,tier)+
      (have>0?"<div class='uc-have'>в строю: "+RU(have)+"</div>":"");
    if(!locked && active) h+=trainInlineHtml();
    else if(!locked && tier===maxT) h+="<button class='rnode-go uc-go' data-act='ucfocus' data-mode='train' data-tier='"+tier+"'>Обучить</button>";
    else if(!locked && tier<maxT && have>0) h+="<button class='rnode-go uc-go' data-act='ucfocus' data-mode='retrain' data-tier='"+tier+"'>Переобучить</button>";
    h+="</div>";
  }
  h+="</div>";
  h+="<div id='uc-nav'><button data-act='ucnav' data-dir='-1'>&lsaquo; Назад</button>"+
    "<button data-act='ucnav' data-dir='1'>Вперёд &rsaquo;</button></div>";
  return h;
}
/* ---- Лазарет: карусель раненых по типу/тиру, лечение с тем же ползунком, что и набор ---- */
function healCardStatsHtml(p,type,tier){
  const have=p.wounded[type][tier]||0;
  return "<table id='bm-stats'>"+
    "<tr><td>Раненых</td><td>"+RU(have)+"</td></tr>"+
    "<tr><td>Лечение 1 воина</td><td>"+fmtDur(healUnitTime(type,tier))+"</td></tr>"+
  "</table>";
}
function healInlineHtml(){
  const p=me(), {type,tier,max,n}=healCtx;
  const busy=!!p.heal, locked=busy||max<1;
  let h="<div id='bm-qty'><div class='cap'><span>Доступно максимум</span><b>"+RU(max)+"</b></div>"+
     "<div class='row'><input type='range' id='hqty-range' min='0' max='"+max+"' value='"+n+"' "+(locked?"disabled":"")+">"+
     "<input type='number' id='hqty-num' min='0' max='"+max+"' value='"+n+"' "+(locked?"disabled":"")+"></div></div>";
  if(busy){
    h+="<div id='bm-time'>Лазарет занят лечением.</div>";
  } else if(max<1){
    h+="<div id='bm-time'>Не хватает ресурсов ни на одного раненого.</div>";
  } else {
    const c=healUnitCost(p,type,tier);
    h+="<div id='bm-reqs'>"+RES.map(r=>{
      if(!c[r]) return "";
      return "<div class='req-row' data-r='"+r+"'><img src='images/ui/res-"+r+".png'>"+
        "<span class='req-name'>"+RES_NAME[r]+"</span><span class='req-amt'></span></div>";
    }).join("")+"</div>";
    h+="<div id='bm-time'></div>";
  }
  h+="<button id='bm-btn' class='uc-go' data-act='healgo' "+((busy||max<1||n<=0)?"disabled":"")+">Лечить</button>";
  return h;
}
function healCarouselHtml(){
  const p=me(), list=woundedList(p);
  let h="<div id='bm-title'>Лазарет</div>";
  if(!list.length){
    healCtx=null;
    h+="<div id='bm-tree'><div class='rgroup'>Раненых нет</div></div>";
    return h;
  }
  if(!healCtx || !list.some(x=>x.type===healCtx.type&&x.tier===healCtx.tier)){
    const f=list[0], max=healMaxN(p,f.type,f.tier);
    healCtx={type:f.type,tier:f.tier,max,n:max,lastLocked:!!p.heal||max<1};
  }
  h+="<div id='uc-track'>";
  list.forEach(({type,tier})=>{
    const active = healCtx.type===type && healCtx.tier===tier;
    h+="<div class='uc-card'>"+
      "<img class='uc-img' src='images/units/"+p.race+"-"+type+tier+".png' alt=''>"+
      "<div class='uc-name'>"+unitName(type,tier,p.race)+"</div>"+
      healCardStatsHtml(p,type,tier);
    if(active) h+=healInlineHtml();
    else h+="<button class='rnode-go uc-go' data-act='hcfocus' data-type='"+type+"' data-tier='"+tier+"'>Лечить</button>";
    h+="</div>";
  });
  h+="</div>";
  h+="<div id='uc-nav'><button data-act='ucnav' data-dir='-1'>&lsaquo; Назад</button>"+
    "<button data-act='ucnav' data-dir='1'>Вперёд &rsaquo;</button></div>";
  return h;
}
function updateHealSheet(){
  const p=me(); if(!healCtx || !$("#hqty-range")) return;
  const {type,tier,max,n}=healCtx;
  $("#hqty-range").value=n; $("#hqty-num").value=n;
  const unitC=healUnitCost(p,type,tier);
  RES.forEach(r=>{
    if(!unitC[r]) return;
    const need=Math.round(unitC[r]*n), short=p.res[r]<need;
    const el=document.querySelector("#bm-reqs [data-r='"+r+"'] .req-amt");
    if(el){ el.textContent=fmt(need)+" / "+fmt(p.res[r]); el.classList.toggle("short",short) }
  });
  if($("#bm-reqs")){
    const dur=healDuration(p,type,tier,n);
    $("#bm-time").textContent = n>0 ? "Время лечения: "+fmtDur(dur) : "Выберите хотя бы одного раненого.";
  }
  $("#bm-btn").disabled = !!p.heal || max<1 || n<=0;
}
function openHealCarousel(){
  trainCtx=null; carouselCtx=null; researchCtx=null; forgeTab=null; forgeRarity=null;
  buildingModalSel=-1; healCarouselOpen=true; healCtx=null;
  $("#bm-body").innerHTML = healCarouselHtml();
  lastHealFingerprint = woundedList(me()).map(x=>x.type+x.tier).join(",");
  $("#building-modal").classList.add("open");
  updateHealSheet();
}
let researchCtx=null;
function researchNodeList(branch,p){
  return ACADEMY_TREE[branch].filter(n=>nodeVisibleFor(n,p));
}
function openResearchCarousel(branch,startId){
  const p=me();
  trainCtx=null; carouselCtx=null; forgeTab=null; forgeRarity=null; healCarouselOpen=false; healCtx=null;
  buildingModalSel=-1;
  const list=researchNodeList(branch,p);
  const idx=Math.max(0,list.findIndex(n=>n.id===startId));
  researchCtx={branch,idx};
  $("#bm-body").innerHTML = researchCarouselHtml();
  $("#building-modal").classList.add("open");
  requestAnimationFrame(()=>{
    const track=$("#uc-track"), card=track&&track.querySelectorAll(".uc-card")[idx];
    if(track&&card) track.scrollLeft = card.offsetLeft;
  });
}
function researchCarouselHtml(){
  const p=me(), B=bonuses(p);
  const list=researchNodeList(researchCtx.branch,p);
  let h="<div id='bm-title'>"+(researchCtx.branch==="mil"?"Военные исследования":"Экономические исследования")+"</div>";
  h+="<div id='uc-track'>";
  list.forEach(n=>{
    const lv=p.tech[n.id]||0, maxed=lv>=n.max, nx=lv+1, gated=p.b.academy<=0;
    const locked=researchLocked(n,p);
    const c = maxed||locked||gated?null:researchCost(n,nx);
    const powNow=researchPower(n,lv), powNext=researchPower(n,nx);
    const rows=nodeEffectRows(n,lv,nx);
    h+="<div class='uc-card"+(locked?" locked":"")+"'>"+
      "<img class='uc-img' style='max-height:170px;border-radius:50%' src='"+nodeImgSrc(n,p)+"' alt='' onerror=\"this.style.display='none'\">"+
      "<div class='uc-name'>"+nodeTitle(n)+(n.race?" · венец":"")+"</div>"+
      "<div class='uc-have'>"+waveLabel(n.wave)+" · уровень "+lv+"/"+n.max+"</div>"+
      (locked?"<div class='uc-lock'>&#128274; "+lockReason(n,p)+"</div>":"")+
      "<table id='bm-stats'>"+
        rows.map(r=>"<tr><td>"+(r.icon?"<img class='stat-ico' src='images/ui/"+r.icon+".png' alt='' onerror=\"this.remove()\">":"")+
          r.label+"</td><td>"+r.now+(r.next?" &rarr; "+r.next:"")+"</td></tr>").join("")+
        "<tr><td><img class='stat-ico' src='images/ui/icon-power.png' alt=''>Мощь</td><td>"+fmt(powNow)+(maxed?"":" &rarr; "+fmt(powNext))+"</td></tr>"+
      "</table>"+
      (c?"<div id='bm-reqs'>"+RES.filter(r=>c[r]).map(r=>
        "<div class='req-row'><img src='images/ui/res-"+r+".png' alt=''>"+
        "<span class='req-name'>"+RES_NAME[r]+"</span>"+
        "<span class='req-amt"+(p.res[r]<c[r]?" short":"")+"'>"+fmt(c[r])+"</span></div>").join("")+"</div>":"")+
      (p.rsch&&p.rsch.id===n.id ?
        "<div class='progress'><i style='width:"+(Math.min(1,(W.t-p.rsch.t0)/Math.max(1,p.rsch.t1-p.rsch.t0))*100).toFixed(1)+"%'></i></div>"+
        "<div class='rnode-eff'>Готово через <em>"+fmtDur(p.rsch.t1-W.t)+"</em></div>"
      : "<button class='rnode-go uc-go' data-act='research' data-id='"+n.id+"' "+(maxed||gated||locked||p.rsch?"disabled":"")+">"+
        (maxed?"Предел":gated?"Нужна академия":locked?lockReason(n,p):p.rsch?"Академия занята":
          "Исследовать · "+fmtDur(researchTime(n,nx)/(1+B.researchSpeed)))+
        "</button>")+
      "</div>";
  });
  h+="</div>";
  h+="<div id='uc-nav'><button data-act='ucnav' data-dir='-1'>&lsaquo; Назад</button>"+
    "<button data-act='ucnav' data-dir='1'>Вперёд &rsaquo;</button></div>";
  return h;
}
function updateTrainSheet(){
  const p=me(), {type,tier,max,n,fromTier}=trainCtx, isRetrain=trainCtx.mode==="retrain";
  if(!$("#qty-range")) return;
  $("#qty-range").value=n; $("#qty-num").value=n;
  const unitC=isRetrain?retrainCost(type,fromTier,1):troopCost(type,tier);
  const totC=isRetrain?retrainCost(type,fromTier,n):null;
  RES.forEach(r=>{
    if(!unitC[r]) return;
    const need=isRetrain?totC[r]:Math.round(unitC[r]*n), short=p.res[r]<need;
    const el=document.querySelector("#bm-reqs [data-r='"+r+"'] .req-amt");
    if(el){ el.textContent=fmt(need)+" / "+fmt(p.res[r]); el.classList.toggle("short",short) }
  });
  if($("#bm-reqs")){
    const dur=isRetrain?retrainDuration(p,type,fromTier,n):trainDuration(p,type,tier,n);
    $("#bm-time").textContent = n>0 ? "Время "+(isRetrain?"переобучения: ":"набора: ")+fmtDur(dur) : "Выберите хотя бы одного воина.";
  }
  $("#bm-btn").disabled = !!p.train[type] || max<1 || n<=0;
}
function openMenuModal(t){
  // Инвентарь — единственный раздел, где "новое" не выводится из данных
  // (материалы и снаряжение просто числа), поэтому его флаг гасим здесь, при
  // открытии. У почты и генерала гасить нечего: метка сама пропадёт, когда
  // письма прочитаны, а очки таланта вложены.
  if(t==="inv") me().invNew=false;
  // Общий мир — отдельная вкладка со своим опросом сервера (см. mpStartPolling
  // ниже): уходя с неё, глушим таймер, чтобы не дёргать Supabase впустую,
  // пока игрок смотрит другую вкладку.
  if($("#menu-modal").dataset.tab==="mp" && t!=="mp") mpStopPolling();
  $("#menu-modal").dataset.tab = t;
  const html = t==="army"?foArmy(): t==="gen"?foGen(): t==="profile"?foProfile(): t==="mail"?foMail(): t==="mp"?foMultiplayer(!SP_UNLOCKED): foInv();
  lastMenuBody = html;
  $("#menu-modal-body").innerHTML = html;
  $("#menu-modal").classList.add("open");
  $("#side-menu").classList.remove("open");
  renderBadges();
  if(t==="mp") mpOpen();
}
// Метки перерисовываются в общем такте с шапкой (renderTop раз в секунду) —
// отдельного таймера им не нужно.
function renderBadges(){
  const b=menuBadges();
  let any=0;
  for(const k of ["mail","gen","inv","army"]){
    const el=$("#nb-"+k); if(!el) continue;
    const n=b[k]||0; any+=n;
    el.classList.toggle("on", n>0);
    // Инвентарь помечаем голой точкой: "сколько там нового" мы не считаем,
    // а рисовать честную единицу было бы враньём про количество.
    el.setAttribute("data-n", (k==="inv"||n<=0) ? "" : (n>99?"99+":String(n)));
  }
  const mb=$("#nb-menu");
  if(mb){ mb.classList.toggle("on", any>0); mb.setAttribute("data-n",""); }
}
// Фаза 13 — при .mp-gated закрывать модалку некуда (под ней спрятана
// одиночка, не рабочий экран) — крестик и клик по подложке уже скрыты/
// не заведены в этом режиме, но это ЕДИНСТВЕННОЕ место, которое реально
// снимает .open и глушит опрос — второй барьер на случай другого пути
// вызова (например, будущей кнопки), а не просто украшение.
// Фаза 14, кусочек 1 — модалку теперь можно закрывать и при .mp-gated
// (под ней с этого кусочка видна объёмная карта, а не пустота, как
// было). Опрос (mpStopPolling) глушится ТОЛЬКО при SP_UNLOCKED — уходя
// со вкладки "mp" рядом с одиночкой, дёргать Supabase незачем; при
// .mp-gated карта позади модалки сама всё ещё живая и ей нужны свежие
// mpState.* (соседи/точки/лагеря/походы), даже когда сама панель закрыта.
function closeMenuModal(){
  $("#menu-modal").classList.remove("open");
  if(SP_UNLOCKED) mpStopPolling();
}
/* ---- Живое обновление открытых окошек раз в секунду, без переоткрытия ---- */
function refreshOpenModal(){
  if($("#building-modal").classList.contains("open")){
    if(carouselCtx && trainCtx){
      const p=me();
      const newMax=trainCtx.mode==="retrain"?retrainMax(p,trainCtx.type,trainCtx.fromTier):trainMax(p,trainCtx.type,trainCtx.tier);
      const newLocked=!!p.train[trainCtx.type]||newMax<1;
      if(newLocked!==trainCtx.lastLocked){
        trainCtx.max=newMax; trainCtx.n=Math.min(trainCtx.n,newMax); trainCtx.lastLocked=newLocked;
        const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
        $("#bm-body").innerHTML=unitCarouselHtml();
        const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
      }
      updateTrainSheet();
    } else if(researchCtx){
      const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
      $("#bm-body").innerHTML=researchCarouselHtml();
      const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
    } else if(healCarouselOpen){
      // Раньше тут карусель раненых пересобиралась целиком (innerHTML)
      // КАЖДУЮ секунду безусловно, даже когда список раненых не менялся —
      // #uc-track (со scroll-snap, см. CSS) уничтожался и пересоздавался
      // прямо посреди свайпа/тапа "Вперёд", жест срывался на середине
      // (баг с реального устройства: "не могу листать странички с
      // ранеными"). Тот же приём, что уже работает у trainCtx ниже —
      // пересобираем DOM, только когда список раненых или доступность
      // лечения реально изменились, а не на каждый тик таймера.
      const p=me();
      const fp=woundedList(p).map(x=>x.type+x.tier).join(",");
      const newMax=healCtx?healMaxN(p,healCtx.type,healCtx.tier):0;
      const newLocked=healCtx?(!!p.heal||newMax<1):true;
      if(fp!==lastHealFingerprint || (healCtx && newLocked!==healCtx.lastLocked)){
        if(healCtx){ healCtx.max=newMax; healCtx.n=Math.min(healCtx.n,newMax); healCtx.lastLocked=newLocked; }
        lastHealFingerprint=fp;
        const track=$("#uc-track"), keepScroll=track?track.scrollLeft:0;
        $("#bm-body").innerHTML=healCarouselHtml();
        const track2=$("#uc-track"); if(track2) track2.scrollLeft=keepScroll;
      }
      updateHealSheet();
    } else if(buildingModalSel>=0){
      $("#bm-body").innerHTML=buildingModalHtml(buildingModalSel);    }
  }
  const menu=$("#menu-modal");
  const typingInModal = document.activeElement && $("#menu-modal-body").contains(document.activeElement) &&
    (document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA");
  if(menu.classList.contains("open") && !typingInModal){
    const t=menu.dataset.tab;

// Двойной тап по чужой клетке в 3D сразу открывал лист похода (openLevy) —
// удобный ярлык поверх обычного тапа+кнопки в cartouche, но не необходимый:
// то же действие всегда доступно кнопкой "Выступить"/"Идти войной" в самой
// панели. Раз этого жеста в 3D нет, ярлык не восстанавливаем — усложнять
// жестовый слой ради необязательного сокращения пути не стоит.
// f — тот же множитель, что и раньше (1.35 — "ближе", 1/1.35 — "дальше"),
// только теперь он делит cam.dist, а не умножает view.z: у 3D-камеры меньше
// расстояние — значит ближе, обратная логика по сравнению со старым
// "клеток на пиксель" у 2D.
function zoomAt(f){
  const w=world3dWin();
  if(w) w.cam.dist=Math.max(9,Math.min(240,w.cam.dist/f));
}
// Когда открыта вкладка "Мир", те же три кнопки должны крутить 3D-камеру, а
// не невидимую 2D-канву позади неё. iframe#world3d — тот же origin, поэтому
// его contentWindow.cam доступен отсюда напрямую (тот же приём, что и в
// обратную сторону — window.parent.W из obyom-3d-infinite.html). Проверяем
// cam, а не просто наличие iframe: до первого openView("world") src ещё
// пустой, а сразу после назначения src скрипт внутри мог не успеть создать
// cam.
function world3dWin(){
  const f=$("#world3d");
  try{ return (f && f.contentWindow && f.contentWindow.cam) ? f.contentWindow : null; }
  catch(_){ return null; }
}
// Фаза 12, кусочек 2 — мост к объёмной карте (engine/src/realData.ts +
// marchData.ts, см. их readLiveWorld/readLiveWorldMarches): раньше 3D-вкладка
// "Мир" всегда читала window.parent.W — локальную партию с ботами. Эта
// функция даёт ей вместо этого W-подобный снимок общего мира, собранный из
// mpState (mpRefreshNeighbors/Nodes/Camps/Marches/Incoming, тот же опрос
// раз в 5с, что уже крутит панель «Общий мир»). Возвращает null, пока игрок
// не вошёл в общий мир — тогда 3D сама откатывается на обычный W с ботами,
// ни одна строчка одиночной игры не трогается.
//
// Собирается заново на каждый вызов — дешёво (десятки объектов, не тысячи),
// кэшировать пока незачем. НЕ подменяет сам глобальный W: локальная партия
// (если она у игрока тоже открыта) продолжает жить своей жизнью — общий
// мир это отдельный, паралелльный источник данных для той же 3D-сцены.
//
// Честные упрощения этого кусочка (см. supabase/README.md):
//   - mapChunks не строится — loadRealEntities() в движке сама откатывается
//     на полный перебор карты без него (тот же путь, что и у одиночной
//     партии до первого сохранения с индексом чанков). При размере общего
//     мира на сегодня (десятки записей) разницы не видно; понадобится,
//     когда точек/лагерей/городов станет действительно много.
//   - Только СВОИ походы (mpState.marches) и походы, идущие НА тебя
//     (mpState.incoming) — чужие походы, тебя не касающиеся, не показаны:
//     меньше трафика, меньше визуального шума (см. план, "Открытые
//     вопросы").
//   - Путь похода — прямая от текущего города отправителя до цели (path
//     синтезируется тут же, двумя точками): так же честно, как и вся
//     остальная система маршей общего мира (mp-attack/mp-recall) — реального
//     waterPath() по рельефу для общего мира по-прежнему нет.
function mpWorldSnapshot(){
  if(!mpState.joined || !mpState.player) return null;
  const me=mpState.player, st=me.state||{};
  const meHall=(st.b&&st.b.hall)||1;
  const players=[{id:me.id, race:me.race, nick:me.nick, x:me.x, y:me.y, b:{hall:meHall}}];
  const byId={}; byId[me.id]=players[0];
  mpState.neighbors.forEach(n=>{
    const p={id:n.id, race:n.race, nick:n.nick, x:n.x, y:n.y, b:{hall:Number(n.hall)||1}};
    players.push(p); byId[n.id]=p;
  });
  const map={};
  players.forEach(p=>{ map[p.x+","+p.y]={t:"city", x:p.x, y:p.y, pid:p.id}; });
  mpState.nodes.forEach(c=>{
    const d=c.data||{};
    map[c.x+","+c.y]={t:"node", x:c.x, y:c.y, res:d.res, lv:d.lv, amount:d.amount, max:d.max};
  });
  mpState.camps.forEach(c=>{
    const d=c.data||{};
    map[c.x+","+c.y]={t:c.t, x:c.x, y:c.y, lv:d.lv};
  });
  // withPath(m,home) — та же честная прямая, что и marchPos у recall/gather/
  // raid-маршей общего мира: путь всегда из ДВУХ точек (текущий дом
  // отправителя → цель), а не настоящий рельефный path[] одиночки. pathCum/
  // pathLen — тот же формат, что pathPointAt(m,f) в index.html уже умеет
  // читать (дословный порт в marchData.ts), поэтому дальше 3D ничего
  // отдельного знать не должно.
  function withPath(m,home){
    const dist=Math.hypot(m.tx-home.x, m.ty-home.y);
    return Object.assign({}, m, { path:[{x:home.x,y:home.y},{x:m.tx,y:m.ty}], pathCum:[0,dist], pathLen:dist });
  }
  const marches=[];
  mpState.marches.forEach(m=>{ marches.push(withPath(Object.assign({pid:me.id},m), me)); });
  mpState.incoming.forEach(m=>{
    const att=byId[m.player_id]; if(!att) return; // соседа уже нет в mpState.neighbors — не рисуем повисший маркер
    marches.push(withPath(Object.assign({pid:m.player_id},m), att));
  });
  return { t: Date.now()/1000, map, players, marches };
}
// Фаза 12, кусочек 3 — переключатель показа. mpWorldSnapshot() выше уже
// подключён в движке (readLiveWorld/readLiveWorldMarches предпочитают его
// обычному W) — движок САМ подхватит общий мир на ближайшем 3-секундном
// опросе (syncLiveEntities в engine/src/main.ts), без единой правки здесь.
// Но радиус выборки сущностей центрирован на cam.target, а если "Мир" был
// открыт ДО входа в общий мир, cam.target всё ещё смотрит на столицу
// ОДИНОЧНОЙ партии — от столицы общего мира она может быть сколь угодно
// далеко. Без явного перевода камеры игрок увидел бы пустую карту: все
// сущности общего мира просто не попали бы в радиус выборки вокруг
// устаревшего центра. window.cam.tx/tz — тот же готовый мост "к своему
// городу", что уже использует кнопка "Домой" ($("#t-home") ниже), просто
// нацеленный на настоящую столицу общего мира, а не на me() из одиночки.
// Если "Мир" ещё не открывали вовсе (iframe без src, world3dWin()===null)
// — трогать нечего, самый первый рендер и так возьмёт верную точку через
// getOwnCityPos()→mpWorldSnapshot() (см. её же комментарий).
function mpFocusWorld3D(){
  const w=world3dWin();
  if(!w || !mpState.player) return;
  const p=mpState.player;
  w.cam.tx=p.x; w.cam.tz=p.y;
  if(typeof w.H==="function") w.cam.ty=w.H(p.x,p.y)+2;
  w.cam.dist=40; w.cam.pitch=0.5;
}

// Фаза 14, кусочек 1 — при .mp-gated "к своему городу" должно вести на

let sinceSave=0, sinceUi=0;
function frame(){
  const now=Date.now();
  // Пока идёт покадровый догон, время двигает он — цикл только ждёт и не
  // трогает ни W.t, ни очередь (см. catchingUp у advanceToAnimated). lastReal
  // при этом подтягиваем, чтобы после разблокировки не пришёл гигантский dt
  // за уже отсчитанный догоном промежуток.
  if(catchingUp){ lastReal=now; requestAnimationFrame(frame); return }
  let dt=(now-lastReal)/1000; lastReal=now;
  if(dt>0){ advanceTo(W.t+dt*tempo); sinceSave+=Math.min(dt,3600); sinceUi+=dt }
  if(sinceUi>1.0){ sinceUi=0; renderTop(); renderFolio(); renderCartouche(); refreshOpenModal(); renderFieldArmyWorld() }
  if(sinceSave>20){ sinceSave=0; save() }
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ save(); return }
  // Пока вкладка была свёрнута/экран заблокирован, requestAnimationFrame не тикал —
  // досчитываем реальное время сразу, иначе очереди построек «замирают» до перезагрузки.
  // Телефон нередко держит вкладку свёрнутой сутками, а это уже секунды счёта:
  // короткие промежутки догоняем на месте, длинные — порциями по кадру с полосой,
  // тем же путём, что и загрузка после отсутствия (см. advanceToAnimated).
  const away=Math.max(0,(Date.now()-lastReal)/1000);
  const after=()=>{ renderTop(); renderFolio(); renderCartouche(); refreshOpenModal() };
  lastReal=Date.now();
  if(away>3600){
    advanceToAnimated(W.t+away, f=>catchUpProgress(f,away)).then(()=>{ catchUpProgress(null); after() });
    return;
  }
  if(away>0) advanceTo(W.t+away);
  after();
});

   ЗАВЕДЕНИЕ ЛЕТОПИСИ — первый запуск: раса, полководец, имя.
   Раса игрока до сих пор была ЗАШИТА людьми (genWorld создавал столицу как
   "human"), хотя весь механизм рас давно готов и работает — но только у
   ботов: у каждой расы свой минус, свои венцы в академии, свои названия
   войск, гербы и модификаторы боя. Три расы из четырёх существовали в игре
   только как противники. Этот экран их и открывает.
   Полководец выбирается тут же, следом за расой: выбор всё равно разовый и
   необратимый, и правильнее показать его на входе, чем прятать во вкладке,
   где игрок наткнётся на него посреди партии (а до тех пор будет играть с
   genOf() по умолчанию, даже не зная, что решение не принято).
   Почты и пароля здесь намеренно нет: сейв работает по device_id, а на ВК и
   в Телеграме личность даёт сама платформа — форма регистрации там лишняя.
   Привязка аккаунта, когда понадобится, встанет отдельным шагом в профиле,
   уже после того как игроку будет что терять.
   ========================================================================= */
// demo=true — предпросмотр из профиля: тот же экран слово в слово, но с
// пометкой и крестиком выхода. Сам выбор всё равно никуда не пишется — это
// делает claimChronicle, — так что «демка» отличается только возможностью уйти
// на полпути; всё, что игрок оценивает глазами, остаётся ровно тем же.
function runOnboarding(demo){
  return new Promise(resolve=>{
    const wrap=$("#onboard"), body=$("#ob-body");
    const pick={race:null, genId:null, nick:""};
    let step=1;
    const raceColor=r=>r?RACES[r].color:"#8a6d2c";

    function render(){
      let h="";
      if(step===1){
        h+="<div id='ob-hd'>Летопись нового правителя</div>"+
           "<div id='ob-title'>Выберите народ</div>"+
           "<div id='ob-lede'>Решение окончательное: народ определяет войска, "+
           "венцы в академии и слабость, с которой придётся жить всю партию.</div>";
        h+="<div class='ob-races'>"+RACE_KEYS.map(r=>
          "<div class='ob-race"+(pick.race===r?" on":"")+"' data-ob='race' data-r='"+r+"' "+
          "style='--rc:"+RACES[r].color+"'>"+shieldSvg(r)+"<b>"+RACES[r].name+"</b></div>").join("")+"</div>";
        if(pick.race){
          const R=RACES[pick.race];
          h+="<div class='ob-detail' style='--rc:"+R.color+"'>"+
             "<div class='nm'>"+R.name+"</div><div class='ds'>"+R.desc+"</div>"+
             "<div class='mn'><b>Слабость</b><br>"+R.minus.desc+"</div></div>";
        }
        h+="<button class='ob-go' data-ob='next'"+(pick.race?"":" disabled")+">Далее</button>";
      } else if(step===2){
        const R=RACES[pick.race];
        h+="<div id='ob-hd'>"+R.name+"</div>"+
           "<div id='ob-title'>Кто поведёт войско</div>"+
           "<div id='ob-lede'>Полководец тоже выбирается один раз и до конца партии. Один из двух "+
           "обычно усиливает то, в чём народ и так силён, другой платит своим даром за слабость расы.</div>";
        h+="<div class='ob-gens'>"+GENERALS[pick.race].map((g,i)=>
          "<div class='ob-gen"+(pick.genId===i?" on":"")+"' data-ob='gen' data-i='"+i+"' "+
          "style='--rc:"+R.color+"'>"+
          "<img src='images/ui/avatar-"+pick.race+(i+1)+".png' alt='' onerror=\"this.style.visibility='hidden'\">"+
          "<div><div class='nm'>"+g.name+"</div><div class='rl'>"+g.role+"</div>"+
          "<div class='bn'>"+g.flavor+"</div><div class='gen-stat'>"+g.stat+"</div></div></div>").join("")+"</div>";
        h+="<button class='ob-go' data-ob='next'"+(pick.genId!=null?"":" disabled")+">Далее</button>"+
           "<button class='ob-back' data-ob='back'>Назад к выбору народа</button>";
      } else {
        const R=RACES[pick.race], G=GENERALS[pick.race][pick.genId];
        // Итог выбора показываем не только строкой, но и теми же гербом и
        // портретом, по которым игрок выбирал: последний шаг должен выглядеть
        // подтверждением решения, а не отдельной анкетой, приехавшей ниоткуда.
        h+="<div id='ob-hd'>Летопись нового правителя</div>"+
           "<div class='ob-sum' style='--rc:"+R.color+"'>"+shieldSvg(pick.race)+
             "<img src='images/ui/avatar-"+pick.race+(pick.genId+1)+".png' alt='' "+
             "onerror=\"this.style.visibility='hidden'\">"+
             "<div><div class='nm'>"+R.name+"</div><div class='gn'>"+G.name+"</div></div></div>"+
           "<div id='ob-title'>Внесите своё имя</div>"+
           "<div id='ob-lede'>Под этим именем вас запомнят соседи.</div>"+
           "<input id='ob-name' maxlength='24' placeholder='Имя правителя' autocomplete='off'>"+
           "<div class='ob-note'>Имя можно будет сменить позже в профиле. Народ и полководец — нет.</div>"+
           "<button class='ob-go' data-ob='done'>Начать летопись</button>"+
           "<button class='ob-back' data-ob='back'>Назад к полководцу</button>";
      }
      // Пометка и выход — только в предпросмотре. В настоящем заведении партии
      // уйти некуда: без народа и полководца игру начинать не с чем.
      if(demo) h="<div class='ob-demo'>Предпросмотр · выбор никуда не запишется"+
                 "<button class='ob-x' data-ob='close' title='Закрыть'>&times;</button></div>"+h;
      body.innerHTML=h;
      const inp=$("#ob-name");
      if(inp){ inp.value=pick.nick; inp.focus(); }
    }

    body.onclick=e=>{
      const el=e.target.closest("[data-ob]"); if(!el) return;
      const a=el.dataset.ob;
      if(a==="race"){ pick.race=el.dataset.r; pick.genId=null; render(); }
      else if(a==="gen"){ pick.genId=+el.dataset.i; render(); }
      else if(a==="next"){ if(step===1&&pick.race) step=2; else if(step===2&&pick.genId!=null) step=3; render(); }
      else if(a==="back"){ const inp=$("#ob-name"); if(inp) pick.nick=inp.value; step--; render(); }
      else if(a==="done"||a==="close"){
        const inp=$("#ob-name");
        pick.nick=((inp&&inp.value)||"").trim().slice(0,24)||"Безымянный лорд";
        wrap.classList.remove("open");
        body.onclick=null;
        // close бывает только в предпросмотре (кнопки в настоящем экране нет),
        // но помечаем результат явно — вызывающий не должен догадываться по
        // флагу, с которым сам же и звал.
        resolve(a==="close" ? null : pick);
      }
    };
    wrap.classList.add("open");
    render();
  });
}

// Фаза 13, продолжение (4) — тот же экран летописи (#onboard/#ob-body/
// .ob-*), что и у runOnboarding() выше, и с тем же составом шагов (народ
// → полководец → имя) — регистрация в общем мире не должна казаться
// урезанной версией одиночной. mp-join сам по себе полководца НЕ
// принимает (его тело — только race/nick), поэтому genId, выбранный на
// шаге 2, применяется отдельным вызовом mp-pickgen (Фаза 7) сразу после
// успешного mp-join — см. mpOpen(). Отдельная функция, а не runOnboarding
// с новым параметром: та либо демо (без сети), либо настоящее одиночное
// заведение партии (claimChronicle) — здесь третий, MP-путь дописывать
// внутрь и так плотной функции веткой на каждый шаг рискованнее, чем
// иметь свою копию, которая просто устроена ТОЧНО ТАК ЖЕ. Не демо:
// результат реально уходит на сервер, поэтому баннера "Предпросмотр"
// здесь нет.
function runMpOnboarding(){
  return new Promise(resolve=>{
    const wrap=$("#onboard"), body=$("#ob-body");
    const pick={race:null, genId:null, nick:""};
    let step=1;
    function render(){
      let h="";
      if(step===1){

        h+="<div class='ob-races'>"+RACE_KEYS.map(r=>

          "style='--rc:"+RACES[r].color+"'>"+shieldSvg(r)+"<b>"+RACES[r].name+"</b></div>").join("")+"</div>";
        if(pick.race){
          const R=RACES[pick.race];
          h+="<div class='ob-detail' style='--rc:"+R.color+"'>"+
             "<div class='nm'>"+R.name+"</div><div class='ds'>"+R.desc+"</div>"+
             "<div class='mn'><b>Слабость</b><br>"+R.minus.desc+"</div></div>";
        }
        h+="<button class='ob-go' data-ob='next'"+(pick.race?"":" disabled")+">Далее</button>";
      } else if(step===2){
        // Тот же шаг, что и в runOnboarding() (одиночка) — GENERALS/
        // avatar-<race><i+1> те же самые данные и картинки, mp-pickgen
        // (Фаза 7) принимает ровно этот genId сразу после mp-join.
        const R=RACES[pick.race];
        h+="<div id='ob-hd'>"+R.name+"</div>"+
           "<div id='ob-title'>Кто поведёт войско</div>"+
           "<div id='ob-lede'>Полководец тоже выбирается один раз и до конца партии. Один из двух "+
           "обычно усиливает то, в чём народ и так силён, другой платит своим даром за слабость расы.</div>";
        h+="<div class='ob-gens'>"+GENERALS[pick.race].map((g,i)=>
          "<div class='ob-gen"+(pick.genId===i?" on":"")+"' data-ob='gen' data-i='"+i+"' "+
          "style='--rc:"+R.color+"'>"+
          "<img src='images/ui/avatar-"+pick.race+(i+1)+".png' alt='' onerror=\"this.style.visibility='hidden'\">"+
          "<div><div class='nm'>"+g.name+"</div><div class='rl'>"+g.role+"</div>"+
          "<div class='bn'>"+g.flavor+"</div><div class='gen-stat'>"+g.stat+"</div></div></div>").join("")+"</div>";
        h+="<button class='ob-go' data-ob='next'"+(pick.genId!=null?"":" disabled")+">Далее</button>"+
           "<button class='ob-back' data-ob='back'>Назад к выбору народа</button>";
      } else {
        const R=RACES[pick.race], G=GENERALS[pick.race][pick.genId];
        h+="<div id='ob-hd'>Летопись нового правителя</div>"+
           "<div class='ob-sum' style='--rc:"+R.color+"'>"+shieldSvg(pick.race)+
             "<img src='images/ui/avatar-"+pick.race+(pick.genId+1)+".png' alt='' "+
             "onerror=\"this.style.visibility='hidden'\">"+
             "<div><div class='nm'>"+R.name+"</div><div class='gn'>"+G.name+"</div></div></div>"+
           "<div id='ob-title'>Внесите своё имя</div>"+
           "<div id='ob-lede'>Под этим именем вас запомнят соседи.</div>"+
           "<input id='ob-name' maxlength='24' placeholder='Имя правителя' autocomplete='off'>"+
           "<div class='ob-note'>Имя можно будет сменить позже. Народ и полководец — нет.</div>"+
           "<button class='ob-go' data-ob='done'>Начать</button>"+
           "<button class='ob-back' data-ob='back'>Назад к полководцу</button>";
      }
      body.innerHTML=h;
      const inp=$("#ob-name");
      if(inp){ inp.value=pick.nick; inp.focus(); }
    }
    body.onclick=e=>{
      const el=e.target.closest("[data-ob]"); if(!el) return;
      const a=el.dataset.ob;
      if(a==="race"){ pick.race=el.dataset.r; pick.genId=null; render(); }
      else if(a==="gen"){ pick.genId=+el.dataset.i; render(); }
      else if(a==="next"){ if(step===1&&pick.race) step=2; else if(step===2&&pick.genId!=null) step=3; render(); }
      else if(a==="back"){ const inp=$("#ob-name"); if(inp) pick.nick=inp.value; step--; render(); }
      else if(a==="done"){
        const inp=$("#ob-name");
        pick.nick=((inp&&inp.value)||"").trim().slice(0,24)||"Безымянный лорд";
        wrap.classList.remove("open");
        body.onclick=null;
        resolve(pick);
      }
    };
    wrap.classList.add("open");
    render();
  });
}

// Показать экран летописи и записать выбор в мир. Один путь на оба случая —
// первый запуск и «Новый мир» из вкладки Мир, чтобы они не разъезжались.
// Мир к этому моменту уже создан: столица на месте, соседи расставлены. Меняем
// только выбранное — newPlayer расу нигде не запекает (см. его код), она
// читается по p.race везде, где нужна, так что подмена безопасна.
async function claimChronicle(){
  const c=await runOnboarding();
  const q=me();
  q.race=c.race; q.gen.id=c.genId; q.nick=c.nick;
  delete W.pendingSetup;
  await save();
  return q;
}

/* =========================================================================
   Общий мир (бета) — Фаза 2/3 (см. supabase/README.md). Полностью
   изолированная от одиночной игры панель: собственное состояние (mpState),
   собственные запросы к Supabase Edge Functions (mp-join/mp-train),
   собственный рендер (foMultiplayer) и собственный обработчик кликов (см.
   делегированный listener на #menu-modal-body выше) — ничего из W/me()/
   handleAct/frame() не читает и не меняет, сломать одиночную игру не может.
   Пока умеет ровно то, что уже перенесено на сервер: вход в общий мир и
   набор войск тира 1 (постройки/исследования/маршруты/бой — ещё локальные,
   следующие шаги переноса). Ресурсы игрока в общем мире пока НЕ
   восполняются со временem — серверное производство ещё не перенесено,
   стартовых 100000 хватает на несколько заказов набора для проверки.
   ========================================================================= */
let mpState = { loading:false, joined:false, player:null, err:null, race:null, nick:"", neighbors:[], attackTarget:null, mail:[], marches:[], incoming:[], scoutMail:[], rschTab:"eco", nodes:[], gatherTarget:null, camps:[], raidTarget:null, raidMail:[] };
let mpPollTimer = null;
// Все здания BUILDINGS (index.html) перенесены на сервер (mp-build): 4
// разблокируют mp-train (barracks/range/stable/siege), ещё 5 — это
// HALL_REQ плюс сама ратуша (wall/store/academy/hospital + hall), без
// которых ратуша не растёт выше 1 уровня, farm/lumber/quarry/mine дают
// реальную добычу по времени (production(), см. mpProdPerHour ниже),
// garrison бьёт настоящим залпом в бою (Фаза 4, пятый кусочек), scout
// разведывает соседей (mp-scout, Фаза 4, восьмой кусочек — глубина
// донесения от исследований, se всегда 0, см. заголовок mp-scout), forge —
// добыча/ковка снаряжения (Фаза 11), portal — реальный marchBonus во всех
// действиях с маршем (отдельный кусочек после Фазы 11 — до него p.b.portal
// был честно всегда 0, здания было негде построить). Порядок в списке —
// тот, в котором здания реально нужны игроку (сначала HALL_REQ, потом
// ратуша, потом казармы/мастерские/хозяйство).
const BUILD_MP_BLDS = ["wall","store","academy","hospital","hall","barracks","range","stable","siege","farm","lumber","quarry","mine","garrison","scout","forge","portal"];
// hospital/farm/lumber/quarry/mine — multi-здания (plots:4 у каждого), все
// 4 участка (0-3) строятся отдельно — см. renderPlotRow/mpBuildLvAt в
// foMultiplayer, зеркало plotUnlocked/epochOf.
const BUILD_MP_MULTI = new Set(["hospital","farm","lumber","quarry","mine"]);

async function mpEnsureAuth(){
  // Переиспользуем уже сохранённую supabase-клиентом anon-сессию, если она
  // есть — signInAnonymously() без этой проверки заводит НОВОГО анонимного
  // пользователя при каждом вызове (проверено на практике: id игрока рос
  // при каждом визите), а нужен один и тот же игрок между заходами.
  const { data:{ session } } = await sb.auth.getSession();
  if(session) return session;
  const { data, error } = await sb.auth.signInAnonymously();
  if(error) throw error;
  return data.session;
}
async function mpCall(fn, body){
  const session = await mpEnsureAuth();
  const r = await fetch(SUPABASE_URL+"/functions/v1/"+fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":SUPABASE_ANON_KEY },
    body: JSON.stringify(body||{}),
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.err) throw new Error(j.err || ("HTTP "+r.status));
  return j;
}
function mpRerender(){
  if($("#menu-modal").classList.contains("open") && $("#menu-modal").dataset.tab==="mp"){
    lastMenuBody = foMultiplayer(!SP_UNLOCKED);
    $("#menu-modal-body").innerHTML = lastMenuBody;
  }
  // Фаза 14, кусочек 2 — держим 2D-карту города (#folio) свежей на каждый
  // опрос/действие, не только пока открыта модалка "Общий мир": пользователь
  // может стоять на вкладке "Город" (#view-toggle) с закрытым меню и должен
  // видеть новые уровни/постройки без лишнего клика.
  if(!SP_UNLOCKED) mpRenderFolio();
  // Фаза 14, кусочек 3 — тот же довод для шапки (#top): ник/раса/мощь и
  // запасы с добычей/час должны обновляться сами, а не только пока открыта
  // модалка меню — шапка видна поверх и карты, и города одновременно.
  if(!SP_UNLOCKED) mpRenderTop();
}
function mpStartPolling(){ mpStopPolling(); mpPollTimer=setInterval(mpPollTick,5000); }
function mpStopPolling(){ if(mpPollTimer){ clearInterval(mpPollTimer); mpPollTimer=null; } }
async function mpPollTick(){ await mpRefreshPlayer(); await mpRefreshNeighbors(); await mpRefreshMail(); await mpRefreshMarches(); await mpRefreshIncoming(); await mpRefreshScoutMail(); await mpRefreshNodes(); await mpRefreshCamps(); await mpRefreshRaidMail(); }
async function mpRefreshPlayer(){
  if(!mpState.player) return;
  const { data, error } = await sb.from("players").select("*").eq("id",mpState.player.id).maybeSingle();
  if(!error && data){ mpState.player=data; mpRerender(); }
}
// Фаза 3 — общая видимость: остальные игроки того же мира читаются напрямую
// клиентом (RLS players_select_world из миграции 0001 уже разрешает SELECT
// всем — новая Edge Function не нужна). Берём только нечувствительные
// колонки (ник/раса/координаты) — полное состояние (ресурсы/войска) в
// список соседей нарочно не тянем, хотя RLS формально это тоже позволяет.
async function mpRefreshNeighbors(){
  if(!mpState.player) return;
  // hall добавился для Фазы 12 (объёмная карта) — 3D-модели замка нужна
  // эпоха (epochOf(hall)), иначе все чужие города рисовались бы деревней
  // 1 уровня. Именно уровень ратуши, а не весь state — гарнизон/ресурсы
  // соседей по-прежнему нарочно не тянем (то же решение, что и раньше),
  // ровно как в RoK: размер замка на карте виден всем без разведки, состав
  // войск — нет.
  const { data, error } = await sb.from("players").select("id,nick,race,x,y,is_bot,hall:state->b->>hall")
    .eq("world_id", mpState.player.world_id).neq("id", mpState.player.id).order("id");
  if(!error && data){ mpState.neighbors=data; mpRerender(); }
}
// Фаза 4 — свежие боевые отчёты (mail, RLS mail_select_own из миграции
// 0001 уже ограничивает выборку своими же письмами, читаем напрямую).
async function mpRefreshMail(){
  if(!mpState.player) return;
  const { data, error } = await sb.from("mail").select("*").eq("player_id",mpState.player.id)
    .eq("kind","battle").order("created_at",{ascending:false}).limit(10);
  if(!error && data){ mpState.mail=data; mpRerender(); }
}
// Фаза 4, восьмой кусочек — донесения разведки (mail, kind:"scout"), тем
// же путём, что и боевые письма (mail_select_own уже ограничивает выборку
// своими же письмами).
async function mpRefreshScoutMail(){
  if(!mpState.player) return;
  const { data, error } = await sb.from("mail").select("*").eq("player_id",mpState.player.id)
    .eq("kind","scout").order("created_at",{ascending:false}).limit(10);
  if(!error && data){ mpState.scoutMail=data; mpRerender(); }
}
// Открытие вкладки: если этот anon-uid уже заходил в общий мир раньше
// (сессия сохранена в localStorage), mp-join без указания расы вернёт уже
// существующего игрока — сразу дашборд, без анкеты. Если нет — тихо ловим
// ожидаемую ошибку "Нужна раса" и показываем анкету, это не сбой.
async function mpOpen(){
  // wasJoined — mpOpen() зовётся КАЖДЫЙ раз при открытии вкладки «Общий
  // мир», не только при первом входе (это же и есть авто-резюме уже
  // существующего игрока, см. комментарий выше). mpFocusWorld3D() ниже не
  // должен дёргаться на каждое такое открытие — иначе игрока, который сам
  // отъехал по 3D-карте куда-то ещё, молча одёргивало бы обратно к столице
  // при каждом заходе в этот же folio-таб. Фокусируем только на переходе
  // false→true — тот самый момент, когда камера впервые может смотреть в
  // устаревшую точку (см. mpFocusWorld3D()).
  const wasJoined=mpState.joined;
  mpState.loading=true; mpState.err=null; mpRerender();
  try{
    const j=await mpCall("mp-join",{});
    mpState.joined=true; mpState.player=j.player; if(!wasJoined) mpFocusWorld3D(); mpStartPolling(); await mpRefreshNeighbors(); await mpRefreshMail(); await mpRefreshMarches(); await mpRefreshIncoming(); await mpRefreshScoutMail(); await mpRefreshNodes(); await mpRefreshCamps(); await mpRefreshRaidMail();
  }catch(e){
    mpState.joined=false;
    // Фаза 13, продолжение — различаем ДВА разных "отказа" mp-join с
    // пустым телом: "Нужна раса..." (mp-join/index.js) — ожидаемый ответ
    // для СОВСЕМ НОВОГО anon-uid, не сбой — гость видит тот же красивый
    // экран летописи, что и одиночка (runMpOnboarding — #onboard/.ob-*,
    // см. её же комментарий), а не голую форму внутри самой панели.
    // Любая ДРУГАЯ ошибка (сеть, 500) — настоящий сбой, не анкета: он
    // просто оседает в mpState.err, панель его уже честно показывает
    // (см. низ foMultiplayer), запускать визард на реальной ошибке было
    // бы враньём "нужно выбрать расу", когда на деле просто не достучались
    // до сервера. Только в gate-режиме: при ?sp=1 это по-прежнему один из
    // нескольких табов в бургер-меню, там плоская форма (см. !embedded в
    // foMultiplayer) остаётся честным быстрым путём, не первым
    // впечатлением от игры.
    if(!SP_UNLOCKED && !wasJoined && /Нужна раса/.test(e.message)){
      const pick=await runMpOnboarding();
      mpState.race=pick.race; mpState.nick=pick.nick;
      await mpDoJoin();
      // Полководец выбран в визарде (шаг 2), но mp-join его не принимает
      // (тело только race/nick) — mp-pickgen (Фаза 7) отдельным вызовом
      // сразу следом, только если сам join реально удался (иначе mpState.
      // player ещё нет, mp-pickgen закономерно откажет — и затрёт своей
      // ошибкой куда более информативную ошибку самого join).
      if(mpState.joined) await mpDoPickGen(pick.genId);
    } else {
      mpState.err=e.message;
    }
  }
  finally{ mpState.loading=false; mpRerender(); }
}
async function mpDoJoin(){
  if(!mpState.race) return;
  mpState.loading=true; mpState.err=null; mpRerender();

// Превью добычи/час для панели — Фаза 6: теперь зовёт НАСТОЯЩИЙ клиентский
// production(p) (тот самый, единый файл, никакой копии) через тот же приём
// pShim, что и у Академии ниже (pShim2) — {race,b,gen,tech}. p.gen.tal у
// игрока общего мира всегда {} (система вложения очков таланта в MP не
// заведена), поэтому талантовые и GENERAL_TREE-слагаемые bonuses() дают
// ровно 0 вклада — то же самое честное подмножество, что и на сервере
// (_shared/rules.js, Фаза 6), просто получено настоящей функцией, а не
// её портированной копией: числа гарантированно совпадают 1-в-1.
// race — из САМОЙ строки игрока (p.race), а не st.race: st (players.state)
// у записей ДО Фазы 6 могло не нести race вовсе (сервер сам самоисцеляется
// при следующем действии, но эта функция получает состояние "как есть" в
// текущем сеансе клиента).
function mpProdPerHour(p){
  // portal:0 — Портал не входит в постройки общего мира (см. заголовок
  // bonuses() в _shared/rules.js); без явного 0 portalMarchBonus(undefined)
  // внутри настоящего bonuses() уходит в NaN (не влияет на саму добычу,
  // production() не читает B.march, но лучше не оставлять NaN в объекте).
  const pShim={race:p.race, b:Object.assign({portal:0},p.state.b), gen:p.state.gen, tech:p.state.tech};
  const pr=production(pShim), out={};
  RES.forEach(r=>{ out[r]=Math.round(pr[r]); });
  return out;
}

function foMultiplayer(embedded){

  if(!embedded) h+="<div class='entry'><div class='line'><div class='fill'>"+
     "<div class='note'>Один настоящий мир на всех, кто сюда заходит — не отдельная копия для "+

     "раз, венцы рас, грабёж склада при победе), лечение раненых, разведка, дерево исследований "+
     "Академии, опыт/уровень/таланты/книги опыта генерала, точки сбора и лагеря варваров на "+
     "карте — всё уже здесь, честно упрощённое (см. подсказки на месте и supabase/README.md). "+
     "Щит мира и перенос столицы намеренно не переносятся вовсе.</div></div></div></div>";

  if(!mpState.joined){
    h+="<div class='entry'><div class='line'><div class='fill'>"+

  }

  const p=mpState.player, st=p.state, pShim={race:p.race,b:st.b};
  // Новый кусочек — полководец теперь физически один (index.html:4655
  // takeGen), участвует только в марше, куда его реально взяли. Чекбокс

  const mpGenTakeCheckboxHtml=(id)=>{

  };

  if(mpState.incoming.length){

    mpState.incoming.forEach(m=>{
      const left=Math.max(0,m.t1-Date.now()/1000);

      h+="<div class='entry war'><div class='line'><div class='fill'>"+
         "<div class='title'>"+(att?att.nick||"Безымянный лорд":"Неизвестный")+" идёт на вас</div>"+
         "<div class='note'>Подход через "+fmtDur(left)+" — состав отряда неизвестен без разведки.</div>"+
         "</div></div></div>";
    });
  }

  // Фаза 3, первый кусочек — общая видимость: список соседей вместо самой
  // 3D-карты (та рассчитана на локальных ботов одного браузера — встроить
  // туда настоящих других игроков отдельная большая задача, следующий шаг

  h+=rubric("Соседи",embedded?"":"общий мир");
  if(!mpState.neighbors.length){
    h+="<div class='entry'><div class='line'><div class='fill'><div class='note'>"+
       "Пока никого рядом — позовите друга, он увидит вас здесь же, как только зайдёт.</div></div></div></div>";
