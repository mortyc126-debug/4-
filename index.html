  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated3=true;
  if(drop.length) logg("Карта разрежена в третий раз: убрано ещё "+drop.length+" точек/лагерей.","good");
}
// Четвёртая волна: NODE_CHUNK_CHANCE/CAMP_CHUNK_CHANCE (см. ensureChunkContent
// выше) разделили общую монетку 0.5 на отдельные шансы для точек и лагерей
// (лагерей было ровно вдвое больше нужного — ту же монету бросали ОБА раза),
// но это правит только НОВЫЕ чанки — уже сгенерированные (W.genChunks[ck]=true)
// ensureChunkContent больше не трогает никогда, а именно они и есть весь
// исследованный игроком мир. Без этой волны игрок с давним сохранением
// остаётся с прежней, вдвое завышенной плотностью лагерей навсегда, сколько
// бы патчей ни вышло позже — тот самый баг с реального устройства ("фильтр
// применяется к новым объектам, а старые так же остались"). structChunkOk
// той же солью (STRUCT_SALT_NODE/CAMP), что и сама генерация — раз объект
// физически СТОИТ в W.map, он либо единственный кандидат своего чанка (тогда
// хватает одной проверки), либо уже пережил thinMapDensity2/3 выше.
function thinMapDensity4(){
  if(W.densityMigrated4) return;
  const drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city") continue;
    const isNode=o.t==="node";
    const salt=isNode?STRUCT_SALT_NODE:STRUCT_SALT_CAMP;
    const chance=isNode?NODE_CHUNK_CHANCE:CAMP_CHUNK_CHANCE;
    if(!structChunkOk(o.x,o.y,salt,chance)) drop.push(o);
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated4=true;
  if(drop.length) logg("Плотность точек/лагерей приведена к текущей норме: убрано "+drop.length+".","good");
}
// Пятая волна: старые сохранения размещали лагеря/точки по прежнему
// MIN_STRUCT_GAP=6 даже рядом с городом — тогда как модель города с тех
// пор визуально удвоилась (см. CITY_STRUCT_GAP выше). Результат виден
// сразу: лагерь или точка ресурса буквально стоят внутри стен города.
// Города не двигаем (привязаны к p.x/p.y реального игрока/бота) — убираем
// младшего по правилу приоритета (город > форт/лагерь > точка), той же
// безопасной механикой удаления, что и во всех волнах выше (respawn/
// nodeback штатно возвращают убранное в другое, уже проверенное место).
function thinMapDensity5(){
  if(W.densityMigrated5) return;
  const drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city") continue;
    for(const p of W.players){
      if(Math.hypot(p.x-o.x,p.y-o.y)<CITY_STRUCT_GAP){ drop.push(o); break; }
    }
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated5=true;
  if(drop.length) logg("Убраны лагеря/точки, застрявшие в городах: "+drop.length+".","good");
}
// thinMapDensity6 — ещё одна волна разрежения: пользователь счёл карту
// всё ещё слишком плотной, NODE_CHUNK_CHANCE/CAMP_CHUNK_CHANCE урезаны
// ещё на 66% (см. выше). Тот же приём, что и thinMapDensity4 (та же соль
// STRUCT_SALT_NODE/CAMP — раз объект физически стоит в W.map, повторная
// проверка того же детерминированного хэша против НОВОГО, более низкого
// порога отбирает именно ту долю, что осталась бы, генерируйся мир заново
// с текущими константами) — отдельная функция и свой флаг миграции, а не
// повторный вызов thinMapDensity4(), чтобы не переписывать её уже
// сработавшую (для старых сохранений) историю миграции.
function thinMapDensity6(){
  if(W.densityMigrated6) return;
  const drop=[];
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="city") continue;
    const isNode=o.t==="node";
    const salt=isNode?STRUCT_SALT_NODE:STRUCT_SALT_CAMP;
    const chance=isNode?NODE_CHUNK_CHANCE:CAMP_CHUNK_CHANCE;
    if(!structChunkOk(o.x,o.y,salt,chance)) drop.push(o);
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated6=true;
  if(drop.length) logg("Плотность точек/лагерей сокращена ещё раз: убрано "+drop.length+".","good");
}
// Седьмая волна: MIN_STRUCT_GAP поднят с 6 до 9 (репорт пользователя "точки
// стоят почти вплотную"). Новый порог сам по себе действует только для
// НОВЫХ точек (findFreeCellInChunk) — уже расставленные слишком тесные пары
// так и остались бы тесными навсегда, поэтому разово раздвигаем и старые: у
// кого от соседа (не города) меньше MIN_STRUCT_GAP — младший из пары
// убирается (respawn/nodeback штатно найдёт ему новое, уже проверенное на
// зазор место), тем же приоритетом, что и в thinMapDensity5 (лагерь/форт
// "старше" простой точки ресурса). При равном приоритете (точка vs точка,
// лагерь vs лагерь) выбор не по порядку W.map (не гарантирован) — сортируем
// по координатам, детерминированно.
// ВАЖНО: тело намеренно читает MIN_STRUCT_GAP как ЖИВУЮ внешнюю константу, а
// не замораживает своё число (в отличие от thinMapDensity() выше, которая
// умышленно держит свою локальную копию) — поэтому когда константу подняли
// СНОВА (9→20, см. thinMapDensity8 ниже), эта функция и без правки кода уже
// "хотела" бы честно применить новое число. Не помогает: densityMigrated7
// уже мог сработать (и сохраниться) на проде под старым значением 9 у
// игроков, что успели загрузиться между релизами — гвоздь не в теле функции,
// а в разовом флаге, который не перезапускает уже отработавшую волну.
function thinMapDensity7(){
  if(W.densityMigrated7) return;
  const items=[];
  for(const k in W.map){ const o=W.map[k]; if(o.t==="node"||o.t==="camp"||o.t==="fort") items.push(o); }
  items.sort((a,b)=>a.x-b.x||a.y-b.y);
  const rank=o=>o.t==="node"?0:1;
  const drop=new Set();
  for(let i=0;i<items.length;i++){
    if(drop.has(items[i])) continue;
    for(let j=i+1;j<items.length;j++){
      if(drop.has(items[j])) continue;
      if(items[j].x-items[i].x>=MIN_STRUCT_GAP) break;   // отсортировано по x — дальше уже точно не ближе
      if(Math.hypot(items[i].x-items[j].x,items[i].y-items[j].y)>=MIN_STRUCT_GAP) continue;
      drop.add(rank(items[i])<rank(items[j]) ? items[i] : items[j]);
    }
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated7=true;
  if(drop.size) logg("Слишком тесные точки/лагеря раздвинуты: убрано "+drop.size+".","good");
}
// Восьмая волна: MIN_STRUCT_GAP поднят ЕЩЁ раз, 9→20 (прямой запрос
// пользователя — "в масштабе карты и 9 мало"). Дословно та же чистка, что и
// в thinMapDensity7 (см. её комментарий про "живую" константу выше) — просто
// под собственным флагом, раз thinMapDensity7 у части игроков уже успела
// отработать и молчаливо разойтись под старым порогом (9), а не новым (20).
function thinMapDensity8(){
  if(W.densityMigrated8) return;
  const items=[];
  for(const k in W.map){ const o=W.map[k]; if(o.t==="node"||o.t==="camp"||o.t==="fort") items.push(o); }
  items.sort((a,b)=>a.x-b.x||a.y-b.y);
  const rank=o=>o.t==="node"?0:1;
  const drop=new Set();
  for(let i=0;i<items.length;i++){
    if(drop.has(items[i])) continue;
    for(let j=i+1;j<items.length;j++){
      if(drop.has(items[j])) continue;
      if(items[j].x-items[i].x>=MIN_STRUCT_GAP) break;
      if(Math.hypot(items[i].x-items[j].x,items[i].y-items[j].y)>=MIN_STRUCT_GAP) continue;
      drop.add(rank(items[i])<rank(items[j]) ? items[i] : items[j]);
    }
  }
  for(const o of drop) delete W.map[key(o.x,o.y)];
  W.densityMigrated8=true;
  if(drop.size) logg("Точки/лагеря раздвинуты ещё раз: убрано "+drop.size+".","good");
}
// Шестая волна: старые сохранения несут в себе уровни, посчитанные ещё по
// originDist от фиксированной точки {50,50} — за пределами исходного
// кластера (originDist>~1.2) это ВСЕГДА давало floor(1), сколько бы игрок
// ни исследовал дальше (см. комментарий у nodeLevelAt/campRawAt выше — тот
// самый баг "лагеря/точки только первого уровня встречаются постоянно").
// Пересчитываем lv (и зависящие от него amount/max/power) для всего, что
// уже лежит в W.map, тем же правилом, что теперь использует свежая
// генерация — координаты и тип объекта не трогаем, лагерь остаётся
// лагерем/фортом там же, где стоял, просто получает актуальную силу.
function migrateStructLevels(){
  if(W.levelMigrated) return;
  let changed=0;
  for(const k in W.map){
    const o=W.map[k];
    if(o.t==="node"){
      const lv=nodeLevelAt(o.x,o.y);
      if(lv!==o.lv){
        const wasFull=o.amount>=o.max;
        o.max=Math.round(6000*Math.pow(2.6,lv-1));
        o.amount=wasFull?o.max:Math.min(o.amount,o.max);
        o.lv=lv;
        changed++;
      }
    } else if(o.t==="camp"||o.t==="fort"){
      const raw=campRawAt(o.x,o.y);
      if(raw!==o.lv){
        o.lv=raw; o.t=raw>15?"fort":"camp"; o.power=banditPower(raw);
        changed++;
      }
    }
  }
  W.levelMigrated=true;
  if(changed) logg("Сила лагерей и точек ресурсов пересчитана для всей исследованной карты ("+changed+" объектов).","good");
}
// Скорость похода была занижена буквально в MARCH_SPEED_SCALE раз (см.
// marchSpeed) — путь через полкарты растягивался на часы вместо секунд-минут
// по механике RoK (репорт пользователя: "3 часа на путь, а должно быть около
// минуты"). Уже ИДУЩИЕ на момент фикса походы несут в себе t0/t1, посчитанные
// по старой медленной скорости — простого умножения b.march задним числом
// недостаточно, маршрут нужно пересчитать от ТЕКУЩЕЙ позиции (marchPos) до
// той же цели (destination похода вперёд, либо родной город при возврате),
// тем же способом, что и recallMarch. Прогресс похода при этом не теряется:
// отряд просто резко ускоряется на оставшемся отрезке пути.
function migrateMarchSpeed(){
  if(W.marchSpeedMigrated) return;
  W.marches.forEach(m=>{
    if(m.state!=="go"&&m.state!=="back") return; // gather/siege — тайминг не про скорость марша
    const p=W.players.find(q=>q.id===m.pid); if(!p) return;
    const cur=marchPos(m);
    const dest = m.state==="back" ? {x:p.x,y:p.y} : {x:m.tx,y:m.ty};
    const path=waterPath(cur.x,cur.y,dest.x,dest.y);
    const d=pathLength(path)*(1-portalShortcut(p));
    const spd=marchSpeed(p,m.units);
    const travel=Math.max(10, d/spd*60);
    setMarchPath(m,path);
    m.t0=W.t; m.t1=W.t+travel;
    unschedule(e=>e.data&&e.data.mid===m.id);
    schedule(travel, m.state==="back"?"home":"arrive", {mid:m.id});
  });
  W.marchSpeedMigrated=true;
}
// Мигрирует сохранения до появления W.mapChunks/W.genChunks (координаты
// объектов не меняются вообще — они и так абсолютные, остаются корректными
// в бескрайней системе координат): строит индекс по чанкам заново из уже
// существующего W.map (после того как thinMapDensity* выше уже прорядили
// его до финального состояния — индексировать нечего было бы дважды), и
// помечает чанки стартового кластера (0..CFG.MAP, тот же квадрат, что и
// genWorld) уже обработанными, чтобы ensureChunkContent не досыпала ещё
// точек/лагерей поверх того, что там когда-то расставил старый генератор.
function migrateInfiniteWorld(){
  if(W.infiniteWorldMigrated) return;
  W.mapChunks={};
  for(const k in W.map){
    const o=W.map[k];
    const ck=chunkKeyOf(o.x,o.y);
    if(!W.mapChunks[ck]) W.mapChunks[ck]=[];
    W.mapChunks[ck].push(k);
  }
  W.genChunks={};
  const startChunks=Math.ceil(CFG.MAP/STRUCT_CHUNK);
  for(let cy=0;cy<startChunks;cy++)for(let cx=0;cx<startChunks;cx++) W.genChunks[cx+","+cy]=true;
  W.infiniteWorldMigrated=true;
}
function clearArea(x,y,r){for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++)mapDelete(x+i,y+j)}
function banditPower(lv){
  // Та же мерка, что и armyPower: иначе сравнение "потяну ли я этот лагерь"
  // бессмысленно и для ботов, и для подсказок игроку.
  return armyPower(banditArmy(lv), null);
}


/* ---- Ниже — то, что раньше жило среди интерфейсных функций, хотя зовётся
   отсюда, из движка: гейты дерева исследований (их спрашивают БОТЫ в
   startResearch), статы полководца (считаются в КАЖДОМ бою, makeForce) и
   путь к аватару (уходит в почтовый отчёт о сражении). DOM ни одна из них
   не трогает — стояли внизу просто потому, что там же рисуются. Из-за таких
   обратных ссылок движок нельзя было прогнать без браузера. ---- */
function nodeTitle(n){
  if(n.unlock) return ({inf:"Пехота",arc:"Лучники",cav:"Кавалерия",sie:"Осада"}[n.unlock.type])+": "+TIER_NAMES[n.unlock.type][n.unlock.tier-1];
  return n.name;
}
function waveLabel(w){ return {1:"Начало",2:"Развитие",3:"Расцвет",4:"Венец"}[w]||("Ступень "+w); }
function nodeDepth(n,arr,cache){
  if(cache.has(n.id)) return cache.get(n.id);
  cache.set(n.id,0); // защита от случайного цикла в данных
  const reqs=n.requires||[];
  const d = reqs.length ? 1+Math.max(...reqs.map(id=>{
    const pn=arr.find(x=>x.id===id); return pn?nodeDepth(pn,arr,cache):0;
  })) : 0;
  cache.set(n.id,d);
  return d;
}
const ROW_SIZES=[4,3,4,2];    // рядами по 2-4 для красоты, а не одной длинной стеной
function computeRows(arr,p){
  const visible=arr.filter(n=>nodeVisibleFor(n,p));
  const cache=new Map();
  const byDepth={};
  visible.forEach(n=>{ const d=nodeDepth(n,arr,cache); (byDepth[d]=byDepth[d]||[]).push(n); });
  const depths=Object.keys(byDepth).map(Number).sort((a,b)=>a-b);
  let sizeIdx=0;
  const rows=[];
  depths.forEach(d=>{
    const unlockNodes=byDepth[d].filter(n=>n.unlock);
    let list=byDepth[d].filter(n=>!n.unlock);
    while(list.length){
      const n=ROW_SIZES[sizeIdx%ROW_SIZES.length]; sizeIdx++;
      rows.push(list.slice(0,n));
      list=list.slice(n);
    }
    if(unlockNodes.length) rows.push(unlockNodes);   // открытие тира войск — всегда своей строкой целиком, без разбивки
  });
  return rows;
}
function rowGate(n,p){
  const rows=computeRows(ACADEMY_TREE[n.branch],p);
  const idx=rows.findIndex(row=>row.some(x=>x.id===n.id));
  if(idx<=0) return {locked:false,missing:[]};
  const missing=rows[idx-1].filter(x=>(p.tech[x.id]||0)<x.max);
  return {locked:missing.length>0,missing};
}
function researchLocked(n,p){
  if(epochOf(p.b.hall)<n.wave) return true;
  return rowGate(n,p).locked;
}
const EPOCH_HALL_MIN=[1,7,13,19,25];
function lockReason(n,p){
  if(epochOf(p.b.hall)<n.wave) return "нужна ратуша "+EPOCH_HALL_MIN[n.wave-1]+" уровня";
  const missing=rowGate(n,p).missing;
  if(missing.length) return "нужно закончить: "+missing.map(x=>nodeTitle(x)).join(", ");
  return "заблокировано";
}

function genStats(p){
  // 1 ур. полководца ~= статы юнита Т5 (как в RoK), дальше растёт той же кривой, что и раньше
  const lv=p.gen.lv, B=bonuses(p), g=Math.pow(lv,1.15);
  const gear=gearBonus(p);   // теперь проценты — умножаем, а не прибавляем флэтом
  return {
    hp:  Math.round((250+30*g)*(1+B.genHpMod)*(1+gear.hp)),
    atk: Math.round((200+40*g)*(1+B.genAtkMod)*(1+gear.atk)),
    def: Math.round((170+30*g)*(1+B.genDefMod)*(1+gear.def)),
  };
}

function playerAvatarSrc(p){
  return (p.gen&&p.gen.id!=null) ? "images/ui/avatar-"+p.race+(p.gen.id+1)+".png" : null;
}

/* ---- Очередь событий ------------------------------------------------- */
function schedule(dt,type,data){
  const ev={t:W.t+Math.max(0,dt),type,data,id:W.nextId++};
  let i=W.events.length; while(i>0 && W.events[i-1].t>ev.t) i--;
  W.events.splice(i,0,ev); return ev;
}
function unschedule(fn){ W.events=W.events.filter(e=>!fn(e)) }
function logg(text,kind){ W.log.unshift({t:W.t,text,kind:kind||""}); if(W.log.length>300)W.log.pop() }

/* ---- Ленивая экономика ------------------------------------------------ */
function bonuses(p, defending){
  const b={build:1, march:1, heal:1, healSpeed:1,
    atk:0, def:0, hp:0, archer:0, raise:0, raiseHurt:0, gather:0, load:0, hosp:0, cap:0,
    prodFW:0, prodSG:0, bandit:0, mercy:0,
    gatherAmber:0,   // скорость сбора янтаря (см. eco_amber0/1) — сам ресурс/сбор на карте ещё не заведён,
                      // поле уже считается наравне с остальными, чтобы не переделывать bonuses() задним числом

    prodAll:0, prodFood:0, prodWood:0, prodStone:0, prodGold:0,
    trainSpeed:0, buildCostCut:0, wallBonus:0, counter:0, firstStrike:0,
    researchSpeed:0, scoutBonus:0,
    atkInf:0, atkArc:0, atkCav:0, atkSie:0, defInf:0, defArc:0, defCav:0, defSie:0,
    matkInf:0, matkArc:0, matkCav:0, matkSie:0, mdefInf:0, mdefArc:0, mdefCav:0, mdefSie:0,
    matk:0, mdef:0,
    genAtkMod:0, genDefMod:0, genHpMod:0};
  const race=RACES[p.race], mn=race.minus;
  if(mn.kind==="mult") b[mn.field]*=mn.value; else b[mn.field]=(b[mn.field]||0)+mn.value;
  const epoch=epochOf(p.b.hall), track=RACE_EPOCHS[p.race];
  for(let i=0;i<epoch;i++){
    (track[i].mods||[]).forEach(m=>{
      if(m.kind==="mult") b[m.field]*=m.value; else b[m.field]=m.value;
    });
  }
  if(defending && epoch>=5 && track[4].defMods){
    track[4].defMods.forEach(m=>{
      if(m.kind==="abs") b[m.field]=m.value; else b[m.field]=(b[m.field]||0)+m.value;
    });
  }
  genOf(p).apply(b);
  b.march*=1+portalMarchBonus(p.b.portal);
  const T=p.gen.tal||{};
  const g=id=>T[id]||0;
  b.atk+=g("w1")*.02; b.def+=g("w2")*.02; b.hp+=g("w3")*.02;
  b.bandit+=g("w4")*.05; b.mercy+=g("w5")*.03;
  b.build*=1+g("d1")*.03; b.prodFW+=g("d2")*.04; b.prodSG+=g("d3")*.04;
  b.hosp+=g("d4")*.05; b.cap+=g("d5")*.04;
  b.load+=g("g1")*.04; b.gather+=g("g2")*.04; b.march*=1+g("g3")*.03;
  b.gatherFW=g("g4")*.05; b.gatherSG=g("g5")*.05;
  const tech=p.tech||{};
  const multAcc={};
  [ACADEMY_TREE.eco,ACADEMY_TREE.mil].forEach(arr=>arr.forEach(n=>{
    const lv=tech[n.id]||0; if(!lv||n.unlock) return;
    const list=n.effects||[{field:n.field,total:n.total,kind:n.kind}];
    list.forEach(e=>{
      const inc=e.total*(lv/n.max);
      if(e.kind==="mult") multAcc[e.field]=(multAcc[e.field]||0)+inc;
      else b[e.field]=(b[e.field]||0)+inc;
    });
  }));
  Object.keys(multAcc).forEach(f=>b[f]*=(1+multAcc[f]));
  const multAcc2={};
  [GENERAL_TREE.city.nodes,GENERAL_TREE.army.nodes].forEach(arr=>arr.forEach(n=>{
    const lv=T[n.id]||0; if(!lv) return;
    const inc=n.per*lv;
    if(n.kind==="mult") multAcc2[n.field]=(multAcc2[n.field]||0)+inc;
    else b[n.field]=(b[n.field]||0)+inc;
  }));
  Object.keys(multAcc2).forEach(f=>b[f]*=(1+multAcc2[f]));
  return b;
}
function production(p){ // единиц в час
  const B=bonuses(p), out={};
  const map={food:"farm",wood:"lumber",stone:"quarry",gold:"mine"};
  const handicap = p.isBot ? CFG.BOT_HANDICAP : 1;
  // PROD_TABLE — точная кривая Фермы. Каменоломня/Золотая шахта в источнике
  // держат РОВНО постоянное отношение к Ферме на каждом из 25 уровней
  // (0.75 и 0.5 — не оценка, проверено по всей табличке), поэтому им не
  // нужна отдельная кривая — та же PROD_TABLE с фиксированным множителем.
  for(const r of RES){
    let base=0; p.b[map[r]].forEach(lv=>{ if(lv>0) base+=prodRate(lv); });
    let v=base * ({food:1,wood:1,stone:0.75,gold:0.5}[r]) * handicap;
    v*=1+B.prodAll;
    v*=1+(r==="food"?B.prodFood:r==="wood"?B.prodWood:r==="stone"?B.prodStone:B.prodGold);
    v*=1+((r==="food"||r==="wood")?B.prodFW:B.prodSG);
    out[r]=v;
  }
  return out;   // Содержания армии нет: войска едят только при обучении и лечении.
}
// Сумма "Ёмкости" участков (Ферма/Лесопилка/Каменоломня/Шахта) по ресурсу —
// в RoK это ДВЕ разные вещи с одним числом в источнике: (1) сколько защищено
// при разграблении города и (2) сколько может скопиться на самом участке,
// прежде чем его нужно забрать (тапнуть), иначе добыча дальше не копится.
// Здесь она используется для обоих механик — см. capacity()/syncRes() ниже.
function plotFillCap(p){
  const map={food:"farm",wood:"lumber",stone:"quarry",gold:"mine"};
  const mult={food:1,wood:1,stone:0.75,gold:0.5};   // тот же множитель ресурса, что и в production()
  const out={};
  RES.forEach(r=>{ let extra=0; p.b[map[r]].forEach(lv=>extra+=plotCap(lv)*mult[r]); out[r]=Math.round(extra); });
  return out;
}
function capacity(p){    // своя вместимость на каждый ресурс — склад + защита самих участков (при набеге)
  const B=bonuses(p), base=Math.round(storeCap(p.b.store)*(1+B.cap));
  const extra=plotFillCap(p);
  const out={};
  RES.forEach(r=>out[r]=base+extra[r]);
  return out;
}
// lazy=true — «посчитай, если накопилось хотя бы на секунду мира». Так зовёт
// только ход времени (advanceTo), где точность до кадра не нужна: экономика тут
// ленивая, ресурс всё равно досчитается перед первым же чтением. Все места, где
// цифру реально читают или тратят (canPay/pay/gain/рендер), зовут без флага и
// получают точное значение на текущий момент.
// Зачем: advanceTo синкал ВСЕХ игроков каждый кадр, а каждый синк тянет за собой
// production()->bonuses() — 11 мкс на перебор 63 узлов академии, 15 талантов и
// эпох расы, с аллокацией объекта на полсотни полей. 13 игроков x 60 fps = 780
// вызовов в секунду (~9 мс/с на десктопе, на телефоне в 5-10 раз больше) ради
// приращения за 1/60 секунды. Порог в секунду срезает это в ~60 раз, ничего не
// меняя в самих числах.
function syncRes(p, lazy){
  if(lazy && W.t-p.resAt < 1) return;
  const dt=(W.t-p.resAt)/3600; if(dt<=0){p.resAt=W.t;return}
  const pr=production(p);
  // В RoK участок копит добычу до своей "Ёмкости" и дальше не растёт, пока
  // игрок его не заберёт тапом. Роль "тапа" здесь играет присутствие в игре:
  // пока вы в игре, синк идёт часто и лимит просто не успевает набраться —
  // всё уходит в общий запас, как будто собираете постоянно. А пока вас нет
  // (вкладка закрыта/свёрнута надолго), следующий синк случится только когда
  // вы вернётесь — и тогда всё, что участок произвёл бы сверх своей "Ёмкости"
  // за это время, пропадает (как несобранное в RoK), а накопление участка
  // начинается заново с момента возвращения.
  // Ботов лимит не касается СОЗНАТЕЛЬНО: они не «заходят в игру», они в ней
  // всегда, тапать им нечего. Заодно это развязывает их экономику с частотой
  // синка — иначе доход ботов молча зависел бы от того, как часто крутится
  // цикл, то есть от fps на устройстве игрока.
  const cap=p.isBot?null:plotFillCap(p);
  for(const r of RES){
    const add=cap?Math.min(pr[r]*dt, cap[r]):pr[r]*dt;
    p.res[r]=Math.max(0, p.res[r]+add);
  }
  p.resAt=W.t;
}
function canPay(p,c){ syncRes(p); return RES.every(r=>!c[r]||p.res[r]>=c[r]) }
function pay(p,c){ syncRes(p); RES.forEach(r=>{if(c[r])p.res[r]-=c[r]}) }
function gain(p,c){ syncRes(p);
  // склад не ограничивает накопление — он только защищает часть ресурсов при разграблении (см. battleCity)
  RES.forEach(r=>{if(c[r])p.res[r]=Math.max(0,p.res[r]+c[r])}) }

// ИСТОРИЯ БАГА (см. подробный комментарий у BUILDING_TABLE выше): эта формула
// раньше считала мощь ВСЕХ зданий и на низких уровнях завышала её в сотни раз
// (Ратуша 4 ур. давала ~49 тыс. вместо настоящих 154). Теперь у каждого
// здания с прообразом в RoK есть точная табличная мощь по уровню (см.
// BUILDING_TABLE) — формула ниже осталась только как заглушка для Горна
// (нет прообраза в RoK) и Портала (свой, см. его правки раньше). Вес и база
// подобраны на глазок под общий масштаб остальных построек — не бюджет,
// который к чему-то обязан сходиться, просто чтобы не торчать нулём.
const POWER_WEIGHT = { portal:0.5 };   // forge теперь тоже в BUILDING_TABLE, formula-заглушка нужна только Порталу
const BUILDING_POWER_BASE=11240, BUILDING_POWER_K=0.00876;
const buildingPower = (bk,lv) => {
  if(lv<=0) return 0;
  const tbl = BUILDING_TABLE[bk];
  if(tbl) return tblRow(tbl,lv).power;
  return BUILDING_POWER_BASE*(POWER_WEIGHT[bk]||1)*Math.exp(BUILDING_POWER_K*(lv-1)*(lv-1));
};
function power(p){
  let v=0; BKEYS.forEach(k=>{
    const lv=p.b[k];
    if(Array.isArray(lv)) lv.forEach(l=>v+=buildingPower(k,l)); else v+=buildingPower(k,lv);
  });
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++) v+=p.troops[t][i]*unitPower(i)});
  W.marches.forEach(m=>{if(m.pid===p.id)TKEYS.forEach(t=>{for(let i=1;i<=5;i++)v+=(m.units[t][i]||0)*unitPower(i)})});
  [...ACADEMY_TREE.eco,...ACADEMY_TREE.mil].forEach(n=>{
    const lv=p.tech[n.id]||0; if(lv) v+=researchPower(n,lv);
  });
  v+=genPowerOf(p);
  v+=gearPowerOf(p);
  return Math.round(v);
}
function genTalentSpent(p){ let s=0; for(const k in p.gen.tal) s+=p.gen.tal[k]||0; return s; }
// База: 2000 + 318.5*ур^1.5 — ~150 тыс. на 60 ур. Плюс 1000 мощи за каждое вложенное очко
// таланта (максимум 60 очков за всю жизнь — 1/ур., GENERAL_TREE и TALENTS делят один пул),
// то есть на полном максимуме генерал даёт 150к+60к=210к мощи (заданный игроком бюджет).
function genPowerOf(p){ return 2000+Math.pow(p.gen.lv,1.5)*318.5 + genTalentSpent(p)*1000; }
function armyPower(units,B,race){
  const TYPE_ATK={inf:"atkInf",arc:"atkArc",cav:"atkCav",sie:"atkSie"};
  const TYPE_DEF={inf:"defInf",arc:"defArc",cav:"defCav",sie:"defSie"};
  const TYPE_MATK={inf:"matkInf",arc:"matkArc",cav:"matkCav",sie:"matkSie"};
  const TYPE_MDEF={inf:"mdefInf",arc:"mdefArc",cav:"mdefCav",sie:"mdefSie"};
  let v=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++){
    const n=units[t]&&units[t][i]||0; if(!n)continue;
    let a=troopStat(t,i,"atk")*troopMod(race,t,"atk")*(1+(B&&B[TYPE_ATK[t]]||0));
    if(t==="arc") a*=1+(B&&B.archer||0);
    const d=troopStat(t,i,"def")*troopMod(race,t,"def")*(1+(B&&B[TYPE_DEF[t]]||0));
    const ma=troopStat(t,i,"magicAtk")*troopMod(race,t,"magicAtk")*(1+(B&&B[TYPE_MATK[t]]||0));
    const md=troopStat(t,i,"magicDef")*troopMod(race,t,"magicDef")*(1+(B&&B[TYPE_MDEF[t]]||0));
    const hp=troopStat(t,i,"hp")*troopMod(race,t,"hp");
    v+=n*(a*(1+(B?B.atk:0))+d*(1+(B?B.def:0))+ma*(1+(B?B.matk:0))+md*(1+(B?B.mdef:0))+hp*(1+(B?B.hp:0)));
  }});
  return Math.round(v/150);   // T1 пехота без бонусов = 150 суммарных статов -> ~1 сила за юнита T1
}
function countUnits(u){let n=0;TKEYS.forEach(t=>{for(let i=1;i<=5;i++)n+=(u[t]&&u[t][i])||0});return n}
function emptyUnits(){const u={};TKEYS.forEach(t=>{u[t]={};for(let i=1;i<=5;i++)u[t][i]=0});return u}
// Складывает src в dst на месте (dst[t][i]+=src[t][i]) — нужна splitLosses,
// чтобы вернуть легкораненых (см. SLIGHT_WOUND_FRAC) обратно в строй ровно
// в ту сторону, которая переживает бой (m.units у похода/D.units у
// обороны), а не в p.troops напрямую — иначе более поздняя перезапись
// p.troops «после боя» стёрла бы их (см. battleCity/arriveMarch).
function addUnitsInto(dst,src){ TKEYS.forEach(t=>{for(let i=1;i<=5;i++) dst[t][i]=(dst[t][i]||0)+(src[t][i]||0)}); }
// Кривая — регрессия по табличке "Ратуша" из оригинала (Troop Capacity, ур.17-25):
// cap = 145.98 * ур^2.1443 (степенной закон, лог-лог МНК), ошибка ~0.1-3%.
const marchCapacityBase = hall => 145.98*Math.pow(hall,2.1443);
function marchCapacity(p){
  const B=bonuses(p);
  const genCap=p.gen.lv/60*100000;   // вклад полководца — 100 тыс. на максимуме (60 ур.)
  return Math.round((marchCapacityBase(p.b.hall)+genCap)*(1+B.load));
}

/* =========================================================================
   БОЙ. Автобой раундами, как в RoK: считаем, показываем лог.
   Треугольник: пехота бьёт лучников, лучники — конницу, конница — пехоту.
   Осадные слабы в поле, но везут груз и ломают стены.
   ========================================================================= */
// Подпись НАПАДАЮЩЕЙ стороны для хроники боя (resolveBattle читает f.name
// напрямую в каждой строке рассказа — "Схватка N: X теряет...", "X дрогнули"
// и т.п.). p.name — это имя ГОРОДА игрока, годится как подпись, когда p
// обороняется (это буквально его город и держит стену). Но когда p —
// нападающий, в бою участвует отряд, ушедший ИЗ города, а не сам город: у
// живого игрока p.name — буквально строка "Ваш город" (см. genWorld), и
// "Ваш город теряет 882" в отчёте о ШТУРМЕ читается так, будто под ударом
// сам город, хотя дома он цел, воюет отправленное войско. У ботов p.name —
// собственное имя города (не служебная фраза "ваш"), там та же метонимия
// не режет слух ("Тангрим теряет" — нормально), так что не трогаем.
function atkName(p){ return p.isBot ? p.name : "Ваши войска"; }
function makeForce(units,p,opts){
  const defending=!!(opts&&opts.defending);
  const B=p?bonuses(p,defending):{atk:0,def:0,hp:0,matk:0,mdef:0,archer:0,raise:0,bandit:0,mercy:0,counter:0,firstStrike:0};
  // withGen — сторона решает САМА, была ли эта конкретная сила с генералом
  // (см. вызовы makeForce): поход — если игрок явно взял его в этот поход
  // (m.hasGen), город — если генерал сейчас дома, а не уехал с другим
  // походом (p.gen.away==null). Раньше genStats(p) цеплялся молча за один
  // только факт "генерал вообще выбран", то есть участвовал сразу везде
  // одновременно — и в марше, и дома — что и было жалобой пользователя.
  const withGen=!!(opts&&opts.withGen);
  const f={units:JSON.parse(JSON.stringify(units)),B,p,risen:emptyUnits(),
           start:JSON.parse(JSON.stringify(units)), broken:emptyUnits(),
           gen: (withGen&&p&&p.gen&&p.gen.id!=null) ? genStats(p) : null,
           wallDef:(opts&&opts.wall)||0, bandit:(opts&&opts.bandit)||false,
           // mode — тот же режим, что потом пойдёт в splitLosses() для ЭТОЙ
           // стороны после боя ("siege-attack"/"hospital"): raiseSkeletons()
           // должен считать "настоящих" мертвецов той же меркой, что и
           // итоговый разбор потерь, иначе они разойдутся (см. raiseSkeletons).
           mode:(opts&&opts.mode)||"hospital",
           name:(opts&&opts.name)||(p?p.name:"Разбойники")};
  return f;
}
function sideStats(f){
  const s={};
  const race=f.p&&f.p.race, B=f.B;
  const TYPE_ATK={inf:"atkInf",arc:"atkArc",cav:"atkCav",sie:"atkSie"};
  const TYPE_DEF={inf:"defInf",arc:"defArc",cav:"defCav",sie:"defSie"};
  const TYPE_MATK={inf:"matkInf",arc:"matkArc",cav:"matkCav",sie:"matkSie"};
  const TYPE_MDEF={inf:"mdefInf",arc:"mdefArc",cav:"mdefCav",sie:"mdefSie"};
  TKEYS.forEach(t=>{
    let atk=0,def=0,matk=0,mdef=0,hp=0,n=0;
    const atkMod=1+(B[TYPE_ATK[t]]||0), defMod=1+(B[TYPE_DEF[t]]||0);
    const matkMod=1+(B[TYPE_MATK[t]]||0), mdefMod=1+(B[TYPE_MDEF[t]]||0);
    for(let i=1;i<=5;i++){
      const c=f.units[t][i]||0;
      const brk=f.broken&&f.broken[t][i]?0.70:1;
      if(c){
        let a=troopStat(t,i,"atk")*troopMod(race,t,"atk")*atkMod;
        if(t==="arc") a*=1+(f.B.archer||0);
        let d=troopStat(t,i,"def")*troopMod(race,t,"def")*defMod;
        let ma=troopStat(t,i,"magicAtk")*troopMod(race,t,"magicAtk")*matkMod;
        let md=troopStat(t,i,"magicDef")*troopMod(race,t,"magicDef")*mdefMod;
        atk+=c*a*brk*(1+f.B.atk); def+=c*d*brk*(1+f.B.def);
        matk+=c*ma*brk*(1+f.B.matk); mdef+=c*md*brk*(1+f.B.mdef);
        hp +=c*troopStat(t,i,"hp")*troopMod(race,t,"hp")*(1+f.B.hp); n+=c;
      }
      // мертвецы нежити: половина характеристик того тира и рода войск, что погиб
      const rc=f.risen&&f.risen[t][i]||0;
      if(rc){
        let ra=troopStat(t,i,"atk")*troopMod(race,t,"atk")*atkMod*0.5;
        if(t==="arc") ra*=1+(f.B.archer||0);
        atk+=rc*ra*(1+f.B.atk); def+=rc*troopStat(t,i,"def")*troopMod(race,t,"def")*defMod*0.5*(1+f.B.def);
        matk+=rc*troopStat(t,i,"magicAtk")*troopMod(race,t,"magicAtk")*matkMod*0.5*(1+f.B.matk);
        mdef+=rc*troopStat(t,i,"magicDef")*troopMod(race,t,"magicDef")*mdefMod*0.5*(1+f.B.mdef);
        hp +=rc*troopStat(t,i,"hp")*troopMod(race,t,"hp")*0.5*(1+f.B.hp); n+=rc;
      }
    }
    s[t]={atk,def,matk,mdef,hp,n};
  });
  s.totalHp=TKEYS.reduce((a,t)=>a+s[t].hp,0);
  s.totalN =TKEYS.reduce((a,t)=>a+s[t].n,0);
  return s;
}
// Итоговые проценты бонусов по роду войск на секунду боя — та же пара
// модификаторов (TYPE_ATK/TYPE_DEF + archer), что sideStats() выше уже
// сворачивает в абсолютную силу юнитов, только НЕ свёрнутая, а как
// проценты сверху расовой базы — то, что в отчёте о бое реально хочется
// прочитать ("почему я продул размен"), а не абсолютная мощь стороны.
// Здоровье в нашей модели не завязано на род войск (нет defInf/hpArc и
// т.п.), поэтому одно общее число на всю армию, не по каждому роду.
function battleBuffSnapshot(f){
  const B=f.B||{};
  const TYPE_ATK={inf:"atkInf",arc:"atkArc",cav:"atkCav",sie:"atkSie"};
  const TYPE_DEF={inf:"defInf",arc:"defArc",cav:"defCav",sie:"defSie"};
  const out={hp:B.hp||0};
  TKEYS.forEach(t=>{
    let atk=(1+(B.atk||0))*(1+(B[TYPE_ATK[t]]||0))-1;
    if(t==="arc") atk=(1+atk)*(1+(B.archer||0))-1;
    const def=(1+(B.def||0))*(1+(B[TYPE_DEF[t]]||0))-1;
    out[t]={atk,def};
  });
  return out;
}
function counterMult(from,to){
  const T=TROOP_TYPES[from];
  if(T.beats===to) return COUNTER_UP;
  if(T.losesTo===to) return COUNTER_DOWN;
  return 1;
}
function volleyDamage(att,defS,defWall){
  // венец эльфов: один досрочный залп лучников до начала общей схватки, без ответа
  if(!att.B.firstStrike) return null;
  const c=att.units.arc; let atk=0,n=0;
  for(let i=1;i<=5;i++){ const cnt=c[i]||0; if(!cnt)continue;
    atk+=cnt*troopStat("arc",i,"atk")*(1+(att.B.archer||0))*(1+att.B.atk); n+=cnt; }
  if(n<=0) return null;
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(defS[dt].n<=0) return;
    const d=atk*counterMult("arc",dt)*(defS[dt].hp/Math.max(1,defS.totalHp));
    const mitig=1+(defS[dt].def/Math.max(1,defS[dt].n))/70*defWall;
    out[dt]=d*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function garrisonVolley(D,attS){
  // гарнизон — не разведка, а сторожевая башня: сама бьёт атакующих до общей схватки
  const lv = D.p && D.p.b.garrison || 0; if(lv<=0) return null;
  const dmg = tblRow(WATCH_TABLE,lv).atk;   // была придуманная lv*900 (макс. 22500) — теперь настоящая атака Сторожевой башни RoK (макс. 500000)
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(attS[dt].n<=0) return;
    const share = dmg*(attS[dt].hp/Math.max(1,attS.totalHp));
    const mitig = 1+(attS[dt].def/Math.max(1,attS[dt].n))/70;
    out[dt]=share*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function generalDamage(f,defS){
  // полководец — отдельный боец вне треугольника контр: бьёт по всем родам сразу
  if(!f.gen||f.gen.hp<=0) return null;
  const out={inf:0,arc:0,cav:0,sie:0};
  TKEYS.forEach(dt=>{
    if(defS[dt].n<=0) return;
    const share=f.gen.atk*(defS[dt].hp/Math.max(1,defS.totalHp));
    const mitig=1+(defS[dt].def/Math.max(1,defS[dt].n))/70;
    out[dt]=share*CFG.BATTLE_PACE/mitig;
  });
  return out;
}
function damageToGeneral(f,enemyS){
  // получает от всех родов войск противника, но как один боец под сильным прикрытием — не тонет в общем уроне армии
  if(!f.gen||f.gen.hp<=0||enemyS.totalN<=0) return 0;
  const avgAtk=TKEYS.reduce((s,t)=>s+enemyS[t].atk,0)/enemyS.totalN;
  const mitig=1+f.gen.def/70;
  return avgAtk*CFG.BATTLE_PACE*0.4/mitig;
}
/* ---- Погода над полем боя ------------------------------------------------
   До этого бой был выверенной арифметикой без единой случайности: одни и те же
   армии всегда давали побайтово один и тот же результат. Считать это можно было
   на калькуляторе, и неожиданностей не случалось никогда.
   Погода — общая для ОБЕИХ сторон и бьёт по роду войск, а не по стороне: дождь
   мочит тетивы у всех лучников на поле, распутица вязнет под всей конницей. Из-за
   этого она не "везение одного из бойцов", а смена условий, при которой выигрывает
   другой состав армии — то есть работает вместе с треугольником контр, а не
   поверх него.
   Ясная погода намеренно вдвое вероятнее всего остального вместе взятого: буря
   должна быть событием, а не фоном. */
const BATTLE_WEATHER=[
  {id:"clear", w:50, name:"Ясно",            desc:"Погода не мешает ни одной стороне.", mod:{}},
  {id:"rain",  w:11, name:"Проливной дождь", desc:"Тетивы намокли — лучники бьют слабее.",           mod:{arc:0.82}},
  {id:"mud",   w:11, name:"Распутица",       desc:"Конница вязнет в грязи и теряет разгон.",         mod:{cav:0.82}},
  {id:"fog",   w:9,  name:"Густой туман",    desc:"Дальний бой почти вслепую: лучники и осадные бьют неточно.", mod:{arc:0.85,sie:0.80}},
  {id:"wind",  w:8,  name:"Порывистый ветер",desc:"Ветер сносит стрелы и мешает наводить орудия.",   mod:{arc:0.88,sie:0.88}},
  {id:"heat",  w:7,  name:"Палящий зной",    desc:"Люди и кони изнурены — все бьют вполсилы.",       mod:{inf:0.92,arc:0.92,cav:0.92,sie:0.92}},
  {id:"storm", w:4,  name:"Гроза",           desc:"В такой свалке исход куда меньше зависит от расчёта.", mod:{arc:0.85}, jitter:0.14},
];
// Своя, отдельная от общей RNG случайность: заводится от момента боя и его
// участников, а не от того, сколько раз кто-то дёргал RNG до этого. Иначе один
// и тот же бой в один и тот же миг мира давал бы разный исход в зависимости от
// того, перезагружали страницу перед ним или нет (глобальная RNG пересевается
// при загрузке) — а движок обещает "то же зерно и то же время = тот же мир".
// Числа в хронике боя. Своё, а не RU из интерфейса: хроника собирается в
// движке, и тянуть ради разделителя разрядов функцию из UI-половины — ровно
// та связь, которую недавно распутывали.
const RUn = n => Math.round(n).toLocaleString("ru-RU");
function battleRng(A,D){
  const ai=(A.p&&A.p.id)||0, di=(D.p&&D.p.id)||0;
  const s=(W.seed ^ Math.imul(Math.floor(W.t),2654435761) ^ Math.imul(ai,40503) ^ Math.imul(di,2246822519))|0;
  return mulberry(s);
}
function pickWeather(rnd){
  const total=BATTLE_WEATHER.reduce((s,x)=>s+x.w,0);
  let r=rnd()*total;
  for(const x of BATTLE_WEATHER){ r-=x.w; if(r<=0) return x }
  return BATTLE_WEATHER[0];
}
function resolveBattle(A,D,ctx){
  ctx=ctx||{};
  const lossA=emptyUnits(), lossD=emptyUnits();
  // Хроника боя. Раньше здесь копился массив lines, который НИГДЕ не читался —
  // весь рассказ о сражении собирался и молча выбрасывался. Теперь это записи
  // вида {r, kind, side, text}: r — номер раунда (0 — до сшибки), kind нужен
  // интерфейсу для значка и цвета, side — чья это удача ("A"/"D"/null).
  // Пишем не каждый раунд подряд, а переломы: залпы, паника, падение
  // полководца, рубежи потерь, бегство. Ровный поток "раунд 7, раунд 8..."
  // читать невозможно, а вот "на пятом лучники дрогнули" — это уже история.
  const log=[];
  const note=(kind,text,side,r)=>log.push({r:(r===undefined?round:r),kind,text,side:side||null});
  let round=0;
  const wallMul = 1 + wallDefBonus(D.wallDef||0)*(1+(D.B.wallBonus||0));
  const startNA=countUnits(A.units), startND=countUnits(D.units);
  // рубежи, о которых сообщаем по одному разу
  const marks={A:{50:false,25:false},D:{50:false,25:false}};
  const checkMarks=()=>{
    [["A",A,startNA],["D",D,startND]].forEach(([k,f,st])=>{
      if(st<=0) return;
      const left=countUnits(f.units)/st;
      [50,25].forEach(pc=>{
        if(!marks[k][pc] && left<=pc/100){
          marks[k][pc]=true;
          note("mark", f.name+": в строю осталась "+(pc===50?"половина":"четверть")+" войска.", k==="A"?"D":"A");
        }
      });
    });
  };

  const rnd=battleRng(A,D);
  const weather=pickWeather(rnd);
  const wMod=t=>(weather.mod&&weather.mod[t])||1;
  if(weather.id!=="clear") note("weather", weather.name+". "+weather.desc, null, 0);
  // Разброс на раунд: своим числом для каждой стороны, вокруг единицы. Мелкий —
  // он не должен решать бой за явно более слабого, только делать одинаковые
  // схватки неодинаковыми. В грозу разброс шире (см. jitter выше).
  const jit=weather.jitter||0.05;
  const roll=()=>1+(rnd()*2-1)*jit;

  // Первый залп лучников (венец эльфов): без ответа, до первого раунда боя.
  // Погоду он ловит наравне с обычными раундами — залп ведут те же лучники под
  // тем же дождём, странно было бы мочить тетивы только начиная со второй минуты.
  const scale=(o,k)=>{ if(o) TKEYS.forEach(t=>o[t]*=k); return o };
  // fell — сколько бойцов реально выбыло за один приём: считаем до и после,
  // потому что урон в единицах здоровья, а рассказывать надо в людях.
  const fell=(f,fn)=>{ const b=countUnits(f.units); fn(); return b-countUnits(f.units) };
  const openA=scale(volleyDamage(A,sideStats(D),wallMul), wMod("arc")*roll());
  if(openA){ const n=fell(D,()=>{ applyDamage(D,openA,lossD); raiseSkeletons(D,lossD) });
    note("volley", A.name+": лучники дали залп ещё до сшибки — пало "+RUn(n)+".", "A", 0); }
  const openD=scale(volleyDamage(D,sideStats(A),1), wMod("arc")*roll());
  if(openD){ const n=fell(A,()=>{ applyDamage(A,openD,lossA); raiseSkeletons(A,lossA) });
    note("volley", D.name+": встречный залп лучников — пало "+RUn(n)+".", "D", 0); }
  // Залп гарнизона защитника — тоже до общей схватки
  const openG=garrisonVolley(D,sideStats(A));
  if(openG){ const n=fell(A,()=>{ applyDamage(A,openG,lossA); raiseSkeletons(A,lossA) });
    if(n>0) note("tower", "Сторожевая башня встретила подходящих — пало "+RUn(n)+".", "D", 0); }
  const brk0A=checkDiscipline(A,lossA), brk0D=checkDiscipline(D,lossD);
  if(brk0A&&brk0A.length) note("panic", A.name+": "+brk0A.join(", ")+" дрогнули ещё на подходе.", "D", 0);
  if(brk0D&&brk0D.length) note("panic", D.name+": "+brk0D.join(", ")+" дрогнули ещё на подходе.", "A", 0);

  while(round<60){
    const sa=sideStats(A), sd=sideStats(D);
    if(sa.totalN<=0||sd.totalN<=0) break;
    round++;
    const dmgTo=(att,attS,defS,defWall,shake)=>{
      const out={inf:0,arc:0,cav:0,sie:0};
      TKEYS.forEach(dt=>{
        if(defS[dt].n<=0) return;
        let d=0,dm=0;
        TKEYS.forEach(at=>{ if(attS[at].n<=0)return;
          const share=defS[dt].hp/Math.max(1,defS.totalHp);
          // wMod(at) — погода бьёт по роду войск БЬЮЩЕГО (мокрая тетива у
          // лучника, вязнущий конь у кавалериста), поэтому множитель берётся
          // по at, а не по dt, и одинаково применяется к обеим сторонам.
          const w=wMod(at);
          d += attS[at].atk * counterMult(at,dt) * share * w;
          dm += attS[at].matk * counterMult(at,dt) * share * w;
        });
        const mitig = 1 + (defS[dt].def/Math.max(1,defS[dt].n))/70 * defWall;
        const mitigM = 1 + (defS[dt].mdef/Math.max(1,defS[dt].n))/70 * defWall;
        out[dt]=(d/mitig+dm/mitigM)*CFG.BATTLE_PACE*shake;
      });
      return out;
    };
    const beforeA=countUnits(A.units), beforeD=countUnits(D.units);
    const genAliveA=!!(A.gen&&A.gen.hp>0), genAliveD=!!(D.gen&&D.gen.hp>0);
    const risenA0=A._raisedCum?countUnits(A._raisedCum):0, risenD0=D._raisedCum?countUnits(D._raisedCum):0;

    const dA = dmgTo(A,sa,sd,wallMul,roll());   // урон, наносимый атакующим
    const dD = dmgTo(D,sd,sa,1,roll());
    applyDamage(D,dA,lossD);
    applyDamage(A,dD,lossA);
    // Полководцы — отдельные бойцы вне треугольника: бьют всех, получают ото всех, но смягчённо
    const genDmgA=generalDamage(A,sd); if(genDmgA) applyDamage(D,genDmgA,lossD);
    const genDmgD=generalDamage(D,sa); if(genDmgD) applyDamage(A,genDmgD,lossA);
    if(A.gen) A.gen.hp=Math.max(0,A.gen.hp-damageToGeneral(A,sd));
    if(D.gen) D.gen.hp=Math.max(0,D.gen.hp-damageToGeneral(D,sa));
    if(genAliveA && A.gen.hp<=0) note("general", A.name+": полководец пал и больше не ведёт войско.", "D");
    if(genAliveD && D.gen.hp<=0) note("general", D.name+": полководец пал и больше не ведёт войско.", "A");
    // Венец гномов: часть урона атакующего отражается контрударом гарнизона
    if(D.B.counter){
      const totalDA=TKEYS.reduce((s2,t)=>s2+dA[t],0), extra=totalDA*D.B.counter;
      if(extra>0){
        const reflect={inf:0,arc:0,cav:0,sie:0};
        TKEYS.forEach(t=>{ if(sa[t].n>0) reflect[t]=extra*(sa[t].hp/Math.max(1,sa.totalHp)); });
        const n=fell(A,()=>applyDamage(A,reflect,lossA));
        if(n>0) note("counter", D.name+": гарнизон отвечает контрударом — пало "+RUn(n)+".", "D");
      }
    }
    const brokeA=checkDiscipline(A,lossA), brokeD=checkDiscipline(D,lossD);
    if(brokeA.length) note("panic", A.name+": "+brokeA.join(", ")+" дрогнули — бьются и держатся хуже до конца боя.", "D");
    if(brokeD.length) note("panic", D.name+": "+brokeD.join(", ")+" дрогнули — бьются и держатся хуже до конца боя.", "A");
    // Нежить поднимает павших прямо в бою
    raiseSkeletons(A,lossA); raiseSkeletons(D,lossD);
    const risenA=(A._raisedCum?countUnits(A._raisedCum):0)-risenA0;
    const risenD=(D._raisedCum?countUnits(D._raisedCum):0)-risenD0;
    if(risenA>0) note("raise", A.name+": павшие поднимаются и встают обратно в строй — "+RUn(risenA)+".", "A");
    if(risenD>0) note("raise", D.name+": павшие поднимаются и встают обратно в строй — "+RUn(risenD)+".", "D");

    // Сводка по раунду — не каждый, иначе хроника превращается в столбец цифр.
    // Первые два (завязка), затем каждый пятый, и обязательно тот, где полегло
    // особенно много: именно такие раунды и решают бой.
    const lostA=beforeA-countUnits(A.units), lostD=beforeD-countUnits(D.units);
    const heavy=(beforeA>0&&lostA/beforeA>=0.2)||(beforeD>0&&lostD/beforeD>=0.2);
    if(round<=2||round%5===0||heavy){
      note("round","Схватка "+round+": "+A.name+" теряет "+RUn(lostA)+" (в строю "+RUn(countUnits(A.units))+"), "+
                   D.name+" теряет "+RUn(lostD)+" (в строю "+RUn(countUnits(D.units))+").", null);
    }
    checkMarks();

    if(countUnits(A.units)<=0||countUnits(D.units)<=0) break;
    const ra=countUnits(A.units)/Math.max(1,ctx.startA||1);
    if(ra<0.28 && !ctx.toDeath){          // атакующий отступает, потеряв 72%
      note("rout", A.name+": потеряно больше двух третей войска — уцелевшие отходят.", "D");
      break;
    }
  }
  const aliveA=countUnits(A.units), aliveD=countUnits(D.units);
  // Если обе стороны выстояли (упёрлись в 60 раундов или атакующий отступил),
  // победу считаем по ОСТАВШЕЙСЯ СИЛЕ, а не по числу голов. Раньше стояло
  // aliveA>aliveD — то есть 250 уцелевших крестьян T1 объявлялись сильнее 249
  // уцелевших рыцарей T5, хотя те на порядок дороже и вдесятеро мощнее.
  // Ничью силой (в т.ч. 0:0 — обе армии полегли) отдаём защитнику: он на своей
  // земле, штурм не удался.
  const powA=armyPower(A.units,A.B,A.p&&A.p.race), powD=armyPower(D.units,D.B,D.p&&D.p.race);
  const win = aliveA>0 && aliveD<=0 ? "A" : aliveD>0&&aliveA<=0 ? "D" : (powA>powD?"A":"D");
  // Итоговая строка называет ПРИЧИНУ исхода, а не только победителя: полёг ли
  // противник целиком, отбит ли штурм, или бой выдохся и решался по тому, у
  // кого осталось больше силы. Ради этого хроника и затевалась — чтобы было
  // видно не только "поражение", но и почему.
  // Без имён: имена сторон — это названия городов и отрядов ("Ваш город",
  // "Разбойники ур. 5"), и в любую падежную форму они встают криво
  // ("у Ваш город осталось", "Разбойники ур. 5 перебит"). Роли — нападавшие
  // и оборонявшиеся — склоняются правильно всегда.
  note("end",
    aliveD<=0 && aliveA>0 ? "Оборонявшиеся перебиты целиком. Поле осталось за нападавшими." :
    aliveA<=0 && aliveD>0 ? "Нападавшие перебиты целиком. Штурм отбит." :
    aliveA<=0 && aliveD<=0 ? "Обе стороны полегли до последнего. Поле осталось за оборонявшимися." :
    win==="A" ? "Бой выдохся. Нападавшие сохранили больше сил — поле за ними." :
                "Бой выдохся. Оборонявшиеся сохранили больше сил — штурм не удался.",
    win);
  return {win, rounds:round, lossA, lossD, log, aliveA, aliveD, weather};
}
function applyDamage(f,dmg,loss){
  const race=f.p&&f.p.race;
  TKEYS.forEach(t=>{
    let d=dmg[t]; if(d<=0)return;
    // сначала гибнут живые бойцы, младшие тиры первыми
    for(let i=1;i<=5&&d>0;i++){
      const c=f.units[t][i]||0; if(!c)continue;
      const ehp=troopStat(t,i,"hp")*troopMod(race,t,"hp")*(1+f.B.hp);
      let kill=Math.min(c, Math.floor(d/ehp));
      if(kill<=0 && d>ehp*0.5 && c>0) kill=1;
      if(kill<=0) break;
      f.units[t][i]-=kill; loss[t][i]+=kill; d-=kill*ehp;
    }
    // затем — поднятые мертвецы этого рода войск (хрупче: половина хп своего тира)
    for(let i=1;i<=5&&d>0;i++){
      const rc=f.risen&&f.risen[t][i]||0; if(!rc)continue;
      const ehp=troopStat(t,i,"hp")*troopMod(race,t,"hp")*0.5*(1+f.B.hp);
      let kill=Math.min(rc, Math.floor(d/ehp));
      if(kill<=0 && d>ehp*0.5 && rc>0) kill=1;
      if(kill<=0) break;
      f.risen[t][i]-=kill; d-=kill*ehp;
    }
  });
}
function checkDiscipline(f,loss){
  const race=f.p&&f.p.race, broke=[];
  TKEYS.forEach(t=>{
    for(let i=1;i<=5;i++){
      if(f.broken[t][i]) continue;
      const start=f.start&&f.start[t][i]||0; if(!start) continue;
      const thr=disciplineThreshold(t,i,race); if(thr===Infinity) continue;
      if((loss[t][i]||0)/start>thr){ f.broken[t][i]=1; broke.push(unitName(t,i,race)); }
    }
  });
  return broke;
}
// Раненые вместо убитых — механика RoK: гибель насмерть только у атакующего при штурме
// чужого города (mode="siege-attack"), без формул и госпиталя. Во всех прочих случаях
// (оборона города, полевые стычки с разбойниками) потери сперва целиком идут в госпиталь
// и гибнут только сверх его вместимости.
// Доля потерь, что отделывается лёгким испугом и сама возвращается в
// строй тут же, лазарет им не нужен вовсе — третья корзина отчёта о бое
// (RoK: Remaining/Slightly Wounded/Severely Wounded/Dead, у нас раньше
// было только hurt+dead, т.е. "тяжелораненые"+"убитые" без "легкораненых").
// Точной цифры разброса из источника нет (пользователь дал только СПИСОК
// категорий, не проценты) — 12% подобрано на глаз как заметная, но не
// доминирующая доля: не обесценивает лазарет как механику, но и не ноль.
const SLIGHT_WOUND_FRAC = 0.12;
// Чистое ядро госпитального разбора — БЕЗ побочных эффектов (не пишет в
// p.wounded). Раньше эта арифметика жила только внутри splitLosses() и
// вызывалась ОДИН раз, целиком, уже после конца боя — а raiseSkeletons()
// поднимала скелетов от СЫРОГО loss (кто просто выбыл из боя), а не от
// того, кто по итогу окажется настоящим трупом: при обороне города/стычке
// в поле бо́льшая часть выбывших едет в лазарет и остаётся жива, значит
// скелет вставал из тела бойца, который "на самом деле" не умирал —
// найдено в разборе с пользователем боевого отчёта. Теперь и итоговый
// splitLosses(), и raiseSkeletons() зовут ЭТУ функцию — гарантированно
// одна и та же арифметика, посчитанная дважды не разойдётся.
function hospitalSplit(p,loss,mode){
  if(mode==="siege-attack"){
    // Штурм чужого города/лагеря/крепости — потери насмерть без исключений,
    // ни лазарета, ни "легкого испуга": в RoK это тоже единственный случай
    // безвозвратной гибели войск (см. комментарий выше у mode).
    const deadUnits=emptyUnits(); let dead=0;
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++){ const n=loss[t][i]||0; deadUnits[t][i]=n; dead+=n; }});
    return {dead,hurt:0,slight:0,slightUnits:emptyUnits(),deadUnits,hurtUnits:emptyUnits()};
  }
  const B=bonuses(p);
  const cap=Math.round(totalHospitalCap(p)*(1+B.hosp+B.mercy));
  let inHosp=0; TKEYS.forEach(t=>{for(let i=1;i<=5;i++) inHosp+=p.wounded[t][i]});
  let dead=0, hurt=0, slight=0;
  const slightUnits=emptyUnits(), deadUnits=emptyUnits(), hurtUnits=emptyUnits();
  TKEYS.forEach(t=>{for(let i=1;i<=5;i++){
    let n=loss[t][i]; if(!n)continue;
    const sl=Math.round(n*SLIGHT_WOUND_FRAC);
    if(sl>0){ slightUnits[t][i]=sl; slight+=sl; n-=sl; }
    const room=Math.max(0,cap-inHosp);
    const w=Math.min(n,room); inHosp+=w;
    hurtUnits[t][i]=w; hurt+=w;
    const d=n-w; deadUnits[t][i]=d; dead+=d;
  }});
  return {dead,hurt,slight,slightUnits,deadUnits,hurtUnits};
}
// Настоящий, безвозвратный подъём скелетов: цепляется не за "кто вообще
// выбыл из боя в этом раунде", а за hospitalSplit(...).deadUnits — то, что
// НА ЭТОТ МОМЕНТ боя уже не влезло бы в госпиталь и умерло по-настоящему.
// loss, который сюда приходит (см. вызовы в resolveBattle), — накопленный
// с начала боя итог, не дельта за раунд: hospitalSplit каждый раз пересчитывает
// его заново от реальной (фиксированной на начало боя) занятости лазарета —
// значит по ходу боя, по мере роста накопленных потерь, доля "настоящих"
// мертвецов в них растёт сама, без отдельного счётчика заполнения госпиталя.
// При штурме (mode="siege-attack") deadUnits==loss целиком — там для
// атакующего ничего не меняется, поднимает как и раньше, от каждого павшего.
// f.p может быть пуст (разбойничий гарнизон) — тогда госпиталю просто
// неоткуда взяться, считаем всех выбывших мёртвыми (как и раньше; на деле
// не важно — у разбойников raise всегда 0).
//
// raiseHurt (венец нежити «Пробуждение кургана», см. RACE_EPOCHS.undead) —
// ОТДЕЛЬНЫЙ, параллельный источник: часть тяжелораненых (hurtUnits, те, кто
// и так едет в лазарет как обычно, никуда не девается) тоже встаёт скелетами
// на время боя. Копится в ТОТ ЖЕ f.risen/_raisedCum, что и raise — should
// считается суммой обоих источников разом, поэтому не поднимает дважды одних
// и тех же, даже если raise и raiseHurt активны одновременно.
function raiseSkeletons(f,loss){
  const rate=f.B.raise||0, rateHurt=f.B.raiseHurt||0;
  if(rate<=0 && rateHurt<=0) return;
  if(!f._raisedCum) f._raisedCum=emptyUnits();
  let dead=loss, hurt=null;
  if(f.p){ const hs=hospitalSplit(f.p,loss,f.mode); dead=hs.deadUnits; hurt=hs.hurtUnits; }
  TKEYS.forEach(t=>{
    for(let i=1;i<=5;i++){
      const shouldDead=Math.floor((dead[t][i]||0)*rate);
      const shouldHurt=(rateHurt>0 && hurt) ? Math.floor((hurt[t][i]||0)*rateHurt) : 0;
      const should=shouldDead+shouldHurt, already=f._raisedCum[t][i]||0;
      if(should>already){ f.risen[t][i]=(f.risen[t][i]||0)+(should-already); f._raisedCum[t][i]=should; }
    }
  });
}
function splitLosses(p,loss,mode){
  const r=hospitalSplit(p,loss,mode);
  if(mode!=="siege-attack"){
    // slightUnits/deadUnits НЕ добавлены в p.troops здесь — вызывающий код
    // сам решает, куда именно вернуть легкораненых (в живой поход, что ещё
    // идёт домой, или в гарнизон, который вот-вот перезапишется post-боем),
    // см. battleCity/arriveMarch и addUnitsInto выше. А вот в госпиталь
    // тяжелораненые едут отсюда же — конкурирующей перезаписи p.wounded
    // нигде нет, в отличие от p.troops.
    TKEYS.forEach(t=>{for(let i=1;i<=5;i++){ const w=r.hurtUnits[t][i]||0; if(w) p.wounded[t][i]+=w; }});
  }
  return {dead:r.dead,hurt:r.hurt,slight:r.slight,slightUnits:r.slightUnits};
}

/* =========================================================================
   МАРШИ — маршрут в обход воды. Раньше поход двигался по прямой между
   точкой отправления и целью: пока воды на карте не было, это было не
   заметно, но с настоящим рельефом прямая нередко режет через озеро — отряд
   визуально шёл прямо по воде. Города/лагеря/точки сами уже никогда не
   стоят в воде (см. isRealWater ниже), но путь МЕЖДУ ними может её
   пересекать. Решение — A* по клеточной сетке карты (вода = стена), с
   упрощением пути (string pulling: выпрямляем везде, где прямая между двумя
   узлами не задевает воду) — иначе путь дёргался бы по клеткам сетки
   зигзагом. Больщинство маршей вообще не встречают воду по пути — для них
   есть быстрый выход без A*.
   ========================================================================= */
function segmentCrossesWater(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0);
  const steps=Math.max(1,Math.ceil(d*2));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    if(isRealWater(x0+(x1-x0)*t, y0+(y1-y0)*t)) return true;
  }
  return false;
}
function simplifyWaterPath(path){
  if(path.length<=2) return path;
  const out=[path[0]];
  let i=0;
  while(i<path.length-1){
    let j=path.length-1;
    while(j>i+1 && segmentCrossesWater(path[i].x,path[i].y,path[j].x,path[j].y)) j--;
    out.push(path[j]);
    i=j;
  }
  return out;
}
function miniHeap(){
  const arr=[];
  function up(i){ while(i>0){ const p=(i-1)>>1; if(arr[p].f<=arr[i].f) break; [arr[p],arr[i]]=[arr[i],arr[p]]; i=p; } }
  function down(i){
    for(;;){ let s=i,l=2*i+1,r=2*i+2;
      if(l<arr.length && arr[l].f<arr[s].f) s=l;
      if(r<arr.length && arr[r].f<arr[s].f) s=r;
      if(s===i) break; [arr[s],arr[i]]=[arr[i],arr[s]]; i=s; }
  }

// мире держать такую сетку негде — да и незачем: подавляющее большинство
// походов огибает воду в маленькой области у собственного маршрута.

// САМ водный участок вдоль прямой (первая/последняя точка, где вода) и
// строим локальную сетку только вокруг НЕГО — её размер зависит от ширины

function waterCrossingSpan(x0,y0,x1,y1){

  // шаг назад мог всё ещё округляться в соседнюю водную клетку, из-за чего
  // tryWaterPath(entry,exit,...) отбраковывал саму отправную/финишную точку
  // детура как воду и возвращал null на ЛЮБОМ margin (нашли живьём: марш на
  // 150 клеток с озером всего в 7 клеток шириной всё равно резал по воде).
  let ei=entryI-1;

  let xi=exitI+1;

  const busy=W.marches.filter(m=>m.pid===p.id&&!isScoutMarch(m)).length;

  const tgt=W.map[key(tx,ty)];

  const travel=Math.max(15, d/(marchSpeed(p,emptyUnits())*speedMult)*60);
  const m={id:W.nextId++,pid:p.id,mode:"scoutmarch",x0:p.x,y0:p.y,tx,ty,units:emptyUnits(),
    targetMarchId:marchId, t0:W.t,t1:W.t+travel,state:"go",carry:null,gatherEnd:0};
  setMarchPath(m,path);
  W.marches.push(m);
  schedule(travel,"scoutedMarch",{mid:m.id});
  return {ok:true,eta:travel};
}
function recallMarch(m){
  if(m.state==="back") return;
  const p=W.players.find(q=>q.id===m.pid);
  const cur=marchPos(m);   // текущее положение на маршруте — новый путь домой считаем от него, не от цели
  const path=waterPath(cur.x,cur.y,p.x,p.y);
  const back=Math.max(15,pathLength(path)*(1-portalShortcut(p))/marchSpeed(p,m.units)*60);
  m.state="back"; m.t0=W.t; m.t1=W.t+back;
  setMarchPath(m,path);
  unschedule(e=>e.data&&e.data.mid===m.id);
  schedule(back,"home",{mid:m.id});
}
function marchPos(m){
  const f=clamp((W.t-m.t0)/Math.max(1,m.t1-m.t0),0,1);
  if(m.state==="gather"||m.state==="siege") return {x:m.tx,y:m.ty};
  return pathPointAt(m,f);
}
/* Сторож зависших отрядов.
   Каждый поход живёт ровно одним событием в очереди: "arrive" в пути, "gathered"
   на добыче, "home" на обратной дороге. Если событие исчезло, а поход остался —
   он мёртв: время идёт, а с ним уже никогда ничего не случится, и отряд навсегда
   замирает на карте (marchPos зажимает долю пути в 1, поэтому он рисуется прямо
   у цели). Ровно так вышло из-за падения на дробном уровне стены: обработчик
   "arrive" бросил исключение, но событие к тому моменту уже было снято с очереди,
   и починка самого падения задним числом такие отряды не воскрешает — их надо
   вытащить отдельно.
   Не одноразовая миграция под флагом, а постоянная проверка: событие может
   потеряться и по другой причине (сбой в обработчике, оборванный догон времени),
   и тогда отряд должен вернуться домой сам, без правки кода под каждый случай.
   Возвращаем домой, а не доигрываем прибытие: пока отряд стоял, цель могла
   исчезнуть, обзавестись щитом или сменить хозяина — воевать по устаревшему
   намерению хуже, чем просто вернуть войска игроку. */
function rescueStuckMarches(){
  if(!W||!W.marches||!W.marches.length) return 0;
  const alive={};
  W.events.forEach(e=>{ if(e.data&&e.data.mid!=null) alive[e.data.mid]=1; });
  let n=0;
  W.marches.slice().forEach(m=>{
    if(alive[m.id]) return;
    const p=W.players.find(q=>q.id===m.pid);
    if(!p){   // владельца нет вовсе — походу неоткуда взяться и некуда идти
      W.marches=W.marches.filter(x=>x.id!==m.id); n++; return;
    }
    n++;
    if(m.state==="back"){
      // уже шёл домой — просто доводим: если срок вышел, прибывает сейчас
      schedule(Math.max(0,m.t1-W.t),"home",{mid:m.id});
    } else {
      recallMarch(m);   // тот же путь домой, что и при обычном отзыве
    }
  });
  return n;
}
